我國對電子支付業務採「許可制」：依電子支付機構管理條例，經營電子支付業務須經主管機關金管會許可並取得營業執照，非電子支付機構不得經營，故選(1)。報備制、註冊制、申報制都只需事前或事後告知主管機關，管制強度低於許可制。"],"pos":0.65,"w":1,"sw":0.01201,"id":"6科技力-39"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"6-40","stem":"有關監理沙盒(regulatory sandbox)，下列敘述何者錯誤？","opts":["英國已實施監理沙盒","在監理沙盒架構下，金融業者可以大範圍不受任何控管，實驗任何業務模式","監理沙盒目的為在不影響創新的情況下，確保風險控管","臺灣已經立法通過金融科技發展與創新實驗條例第二部分：第41~60 題(每題2 分)"],"ans":2,"exp":["📝 解析：選項(2)錯：監理沙盒是在「有限範圍、有限期間、有風險控管與消費者保護措施」下，暫時豁免部分法規進行實驗，並非大範圍不受任何控管。英國 FCA 於 2016 年率先實施監理沙盒(1)；其目的是兼顧創新與風險控管(3)；我國「金融科技發展與創新實驗條例」已於 2018 年 1 月公布、4 月 30 日施行(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6667,"w":1,"sw":0.01201,"id":"6科技力-40"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"6-59","stem":"有關因應金融數位化創新所帶來的監理挑戰，下列何者錯誤？","opts":["跨業監理議題","跨境監理議題","新興金融科技的監理","業者的權益與資料保護"],"ans":4,"exp":["📝 解析：因應金融數位化創新的監理挑戰包括：跨業監理、跨境監理、新興金融科技的監理，以及「消費者」的權益與資料保護。選項(4)寫成「業者」的權益與資料保護，保護對象錯誤，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9833,"w":1,"sw":0.01201,"id":"6科技力-59"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"6-60","stem":"下列敘述何者錯誤？","opts":["數位金融之商業模式中多數的客戶進線與交易都須業者人工介入","虛擬貨幣之高度流通的本質會導致在地監理的難度","我國央行目前將虛擬貨幣視為不具法償效力","為落實消費者保障，電子支付機構管理條例特別在客訴及紛爭解決、業務定型化以及使用者交易資料及其他相關資料之保密義務訂定了相關規範"],"ans":1,"exp":["📝 解析：選項(1)錯：數位金融的商業模式中，多數客戶進線與交易由系統自動處理，不需業者人工介入，也因此監理上要重視系統控制。(2)虛擬貨幣高度跨境流通，使在地監理困難；(3)央行認為虛擬貨幣不是貨幣、不具法償效力；(4)電子支付機構管理條例對客訴與紛爭處理、定型化契約、使用者資料保密都有規範，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":1.0,"w":1,"sw":0.01201,"id":"6科技力-60"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"5-40","stem":"下列何者非英國政府因應金融創新的監管方向？","opts":["責成FCA 與PRA 合作推動金融監管科技 (RegTech)","金融監理的發展目標是採取損害處理的監理方式，而不是預防性的監理手段","責成FCA 與PRA 聯手發展監管沙盒(regulatory sandbox)","英國政府自2008 年即著手發展金融科技並推動相關監管第二部分：第41~60 題(每題2 分)"],"ans":2,"exp":["📝 解析：選項(2)錯：英國因應金融創新的監管方向，是採取主動、預防性的監理手段，而不是事後的損害處理。英國由 FCA（金融行為監理總署）與 PRA（審慎監理總署）合作推動監理科技 RegTech(1)、聯手發展監理沙盒(3)，且自 2008 年金融海嘯後即著手發展金融科技並推動相關監管(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6667,"w":1,"sw":0.01201,"id":"5科技力-40"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"5-41","stem":"有關金管會就數位金融政策的敘述，下列何者正確？","opts":["2015 年推動「打造數位化金融環境2.0」計畫","禁止金融機構投資科技產業","2015 年提出加速提升國內電子支付普及率計畫，設定目標在3 年內，自電子支付佔臺灣個人消費支出比率由目前的26%，增加為52%","開放設立電子支付機構"],"ans":4,"exp":["📝 解析：電子支付機構管理條例於 2015 年 5 月施行，金管會開放設立專營電子支付機構，(4)正確。(1)錯：2015 年 1 月推動的是「打造數位化金融環境 3.0」計畫；(2)錯：金管會 2015 年反而開放金融機構投資金融科技產業；(3)錯：該計畫目標是「5 年內」把電子支付佔個人消費支出比率由 26% 倍增為 52%，不是 3 年。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.6833,"w":1,"sw":0.01201,"id":"5科技力-41"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"5-59","stem":"有關數位金融監理未來發展的敘述，下列何者正確？","opts":["洗錢防制僅是內政部與財政部關注的重點","傳統金融業在防制洗錢遵循國際的標準，加強「客戶風險評估」、「客戶盡職調查」及「匯款交易申報」三個管控方式","數位金融模式下，交易通路變得更為多元，客戶交易維度因數位化而變得更為單純，交易模式更容易定義","未來金融監理應該在商業模式多元且虛擬環境下，達到主動式追蹤與預防性的風險監管"],"ans":4,"exp":["📝 解析：未來金融監理應在商業模式多元與虛擬環境下，達到主動式追蹤與預防性的風險監管，故(4)正確。(1)錯：洗錢防制是金管會、法務部等跨部會與金融業共同的重點，不只內政部與財政部；(2)錯：三個管控方式是客戶風險評估、客戶盡職調查與「可疑交易申報」，不是匯款交易申報；(3)錯：數位化使交易維度更複雜、更難定義。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.9833,"w":1,"sw":0.01201,"id":"5科技力-59"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"5-60","stem":"下列何者不是金融監理的發展思維或現況？","opts":["我國於2018 年公布施行的「金融科技發展與創新實驗條例」，成為以成文法推動監理沙盒之國家","過嚴的金融監理法規將影響金融創新，但如果不進行適當監理，可能會影響金融穩定","配合數位金融的發展，未來金融監管必定朝向科技監管 (RegTech)應用發展的方向","金融監理單位對於業者，永遠只是單純的監理機構，無法同時承擔引領、輔導與監理的角色"],"ans":4,"exp":["📝 解析：選項(4)錯：監理機關不只是單純的監理者，也可承擔引領、輔導與監理的角色（例如金管會設金融科技創新園區、輔導沙盒申請）。(1)我國「金融科技發展與創新實驗條例」2018 年 1 月公布、4 月施行，是以成文法推動監理沙盒的國家；(2)監理過嚴會抑制創新、過鬆影響金融穩定；(3)監理會朝 RegTech 發展，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":1.0,"w":1,"sw":0.01201,"id":"5科技力-60"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"4-39","stem":"支付業務延伸到其他國家，主要直接涉及哪一項數位化金融創新可能帶來的挑戰？","opts":["跨業監理議題","跨境監理議題","傳統監理議題","臨櫃監理議題"],"ans":2,"exp":["📝 解析：支付業務延伸到其他國家，資金跨國流動，涉及各國不同的監理法規、洗錢防制與消費者保護，直接帶來的是「跨境監理」議題，故選(2)。跨業監理是指不同產業（如電信、電商跨入金融）之間的監理分工問題；傳統監理、臨櫃監理則與跨國無直接關係。"],"pos":0.65,"w":1,"sw":0.01201,"id":"4科技力-39"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"4-40","stem":"以電子支付機構管理條例為例，關於未來對數位金融業務的管理機制，下列何者正確？","opts":["為鼓勵金融創新，未來管制將逐漸鬆綁，相關業務經營將從許可制趨向報備制","為提升金流效率，得以虛擬帳戶進行交易，無須確認使用者身份","為保障消費者權益，針對金融創新設立專責消保機構","除了交易業務與組織營運的制度規範之外，也須在立法時將有關資訊系統及安全控管事項加以明確規範第二部分：第41~60 題(每題2 分)"],"ans":4,"exp":["📝 解析：電子支付機構管理條例除規範交易業務與組織營運外，也在立法時明定資訊系統標準及安全控管作業（由主管機關訂定相關作業基準），故(4)正確（選項末尾「第二部分…」是原卷排版殘留文字）。(1)錯：電子支付業務仍採許可制，並未改報備制；(2)錯：須確認使用者身分（實名制），不得以匿名或虛擬帳戶規避；(3)錯：並未另設專責消保機構，金融消費爭議仍由金融消費評議中心處理。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.6667,"w":1,"sw":0.01201,"id":"4科技力-40"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"4-41","stem":"銀行與金融控股公司申請轉投資「資訊服務業」時，金管會對於轉投資公司之主要業務的規範，下列何者錯誤？","opts":["研發設計支援金融機構業務發展之金融資訊系統者","涉及金融機構帳務處理之電子商務交易資訊之處理","主要業務為銀行使用之硬體設備製造、銷售或租賃者","主要從事與金融機構資訊處理作業密切相關之電子資料處理"],"ans":3,"exp":["📝 解析：依金管會對銀行與金控轉投資「資訊服務業」的規範，主要業務須為研發設計支援金融機構業務的金融資訊系統、與金融機構資訊處理密切相關的電子資料處理、或涉及金融機構帳務處理的電子商務交易資訊處理等；若主要業務只是銀行使用之硬體設備製造、銷售或租賃，屬一般製造或租賃業，不在可轉投資範圍，故(3)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6833,"w":1,"sw":0.01201,"id":"4科技力-41"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"4-59","stem":"臺灣對電子支付法令的遵循，不包括下列哪一個面向？","opts":["保護消費者權益","安全控管機制","用戶管理及洗錢防制","消費者資格的審查"],"ans":4,"exp":["📝 解析：我國電子支付機構管理條例的法遵面向包括：保護消費者權益（如儲值款項交付信託或取得銀行履約保證）、資訊安全控管機制、用戶身分確認管理及洗錢防制。法令並未要求審查「消費者資格」（如收入、信用條件），一般民眾完成身分驗證即可使用，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9833,"w":1,"sw":0.01201,"id":"4科技力-59"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"4-60","stem":"有關金融監管沙盒(regulatory sandbox)的敘述，下列何者正確？","opts":["目的是讓業者在大範圍內，實驗新的業務模式","目的為不影響創新的情況下，確保風險控管","不適用在金融創新","英國沒有實施監管沙盒"],"ans":2,"exp":["📝 解析：監理沙盒的目的是在不阻礙創新的前提下，讓業者於受控環境中測試新金融服務，同時確保風險受到控管，故(2)正確。(1)錯：是在「有限範圍」（限定期間、客戶數、金額）內實驗；(3)錯：本來就是為金融創新設計；(4)錯：英國金融行為監理總署（FCA）2016 年率先實施監管沙盒，我國亦於 2018 年施行金融科技發展與創新實驗條例。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":1.0,"w":1,"sw":0.01201,"id":"4科技力-60"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"2-59","stem":"下列哪些是洗錢防制的主要管控方式？","opts":["客戶風險評估","客戶資料保護","客戶盡職調查","可疑交易申報 (5)客戶實地查核 (1)僅(1)(2)(3) (2)僅(1)(3)(5) (3)僅(1)(2)(5) (4)僅(1)(3)(4)"],"ans":4,"exp":["📝 解析：（本題選項排版錯置，實際選項為(1)僅123、(2)僅135、(3)僅125、(4)僅134。）洗錢防制的主要管控方式為客戶風險評估（風險基礎方法）、客戶盡職調查(CDD，確認客戶身分)、可疑交易申報(STR，向法務部調查局申報)，即(1)(3)(4)，故選(4)。客戶資料保護屬個資法範疇；客戶實地查核並非一般性的主要管控手段。"],"pos":0.9833,"w":1,"sw":0.01201,"id":"2科技力-59"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"2-60","stem":"儘管數位金融的法令法規仍持續在發展中，但參考電子支付管理條例的內容，仍可探知我國數位金融法令所規範遵循的重點可能有：","opts":["我國對於金融業務是採用許可制的方式進行資格審查，針對經營業務範圍、低資本額限制、境外機構來台等資格進行明確定義","為避免因資訊系統運作、傳輸或處理錯誤，並衍生相關糾紛，主管機構將檢核業者的資訊安全人員是否達一定人數","業者應留存使用者電子支付帳戶之帳號、交易項目、日期、金額及幣別等必要交易紀錄，自終止或結束後至少七年，並加強去識別化的處理","未來交易環境的複雜(如跨境跨業與科技應用)，將帶來金融檢查的難度，因此驗證使用者體驗是否提昇、金流的效率等，將是主管機關的監管重點"],"ans":1,"exp":["📝 解析：教材以電子支付機構管理條例歸納數位金融法令重點之一：金融業務採許可制，對經營業務範圍、最低資本額、境外機構來台等資格明確規範，故選(1)。(3)錯：依同條例（現行 §26），必要交易紀錄於停止或完成交易後「至少保存五年」，不是七年；(2)主管機關重點在資訊安全控管機制，而非資安人員人數；(4)監管重點是交易安全、消費者保護與洗錢防制，而非驗證使用者體驗。"],"pos":1.0,"w":1,"sw":0.01201,"id":"2科技力-60"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"21-30","stem":"在數位轉型的浪潮下，有關金融從業人員為保持競爭力，下列敘述何者正確？","opts":["僅依賴外部顧問執行數位轉型專案","專注單一傳統技能，降低數位工具依賴","以終身學習與跨域能力發展應對科技變革","避免參與數位化流程，以防業務流程被自動化取代"],"ans":3,"exp":["📝 解析：面對數位轉型，金融從業人員應以終身學習與跨域能力（金融＋科技＋數據）應對科技變革，故(3)正確。完全依賴外部顧問、只守單一傳統技能、逃避數位化流程，都會降低競爭力。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.5,"w":1,"sw":0.00276,"id":"21科技力-30"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"20-30","stem":"國外的大型科技公司掌握客戶的線上銷售，社群活動等等網路活動，並逐步擴展至金融服務，下列何者科技公司尚未推出金融服務？","opts":["美國亞馬遜公司Amazon","中國阿里巴巴公司","美國谷歌公司Google","AMD 公司"],"ans":4,"exp":["📝 解析：大型科技公司跨足金融：Amazon 有 Amazon Pay 與賣家貸款（Amazon Lending），阿里巴巴有支付寶與螞蟻集團，Google 有 Google Pay。AMD 是半導體（處理器）公司，並未推出金融服務，故選(4)。"],"pos":0.5,"w":1,"sw":0.00307,"id":"20科技力-30"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"20-31","stem":"根據Chris Skinner 所著《數位真轉型》之敘述，金融機構進行『數位轉型』會碰到各種挑戰，不包括下列何者？","opts":["領導者的挑戰","客戶的挑戰","員工的挑戰","成本的挑戰"],"ans":4,"exp":["📝 解析：依 Chris Skinner《數位真轉型》（Doing Digital），金融機構數位轉型的挑戰主要來自人與組織：領導者的挑戰（高層願景與決心）、員工的挑戰（文化與技能）、客戶的挑戰（期待改變）。書中未將「成本」列為獨立挑戰，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5167,"w":1,"sw":0.00307,"id":"20科技力-31"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"20-56","stem":"銀行進行數位轉型，將會碰到各種挑戰，下列敘述何者錯誤？","opts":["銀行的領導階層需要以身作則，參與數位轉型的先導專案，並且帶領全公司轉型","銀行轉型過程中，將會引進各種數位科技，現有同仁的專業知識將無法產生效益，應該告知同仁放棄所有經驗，從頭學起","數位轉型的核心在於客戶，銀行需要克服與不同產業夥伴的合作障礙，共同規劃客戶所需的服務","數位轉型最重要的是運用數位科技，從不同的面向去改變組織、文化、工作方式、業務模式"],"ans":2,"exp":["📝 解析：數位轉型應善用既有同仁的金融專業，搭配數位工具再培訓（Reskilling），而非要求「放棄所有經驗、從頭學起」，故(2)錯誤。(1)領導階層以身作則、(3)以客戶為核心並跨產業合作、(4)從組織、文化、工作方式與業務模式全面改變，均為正確的轉型觀念。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9333,"w":1,"sw":0.00307,"id":"20科技力-56"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"19-30","stem":"銀行「延伸」金融價值鏈可採取許多方式，下列敘述何者非本題所指的延伸概念？","opts":["以「應用程式介面(API)」與「金融科技公司」互相合作","以「銀行金融服務」為基礎拓展與「合作夥伴」的結合、共同創造服務","銀行也可以與「外部軟體公司」合作，把進銷存管理與銀行資金管理服務做結合","避免將金融服務嵌入客戶的生活場景中"],"ans":4,"exp":["📝 解析：銀行「延伸」金融價值鏈，是透過API與金融科技公司合作、與合作夥伴共創服務、與外部軟體公司結合進銷存與資金管理，把金融服務「嵌入」客戶生活場景（嵌入式金融）。(4)「避免嵌入生活場景」與延伸概念相反，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5,"w":1,"sw":0.02901,"id":"19科技力-30"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"19-31","stem":"下列何種金融服務較不會被金融科技公司取代？","opts":["支付","存貸","保險","保管"],"ans":4,"exp":["📝 解析：支付、存貸、保險等業務已有大量金融科技業者（第三方支付、P2P借貸、保險科技）切入。保管業務涉及資產安全保管、信託與高度監理要求，需要信任與資本實力，較不易被金融科技公司取代，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5167,"w":1,"sw":0.02901,"id":"19科技力-31"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"19-32","stem":"美國富國銀行執行長於2017 年1 月演講中表示「金融科技機構運用科技的基本原則」，下列何者非其本意？","opts":["協助客戶做最好的財務決策","提供客戶最好的資訊做財務決策","科技創新的重點在科技不在客戶","當客戶有需要的時候滿足其需要"],"ans":3,"exp":["📝 解析：富國銀行執行長於2017年1月表示，運用科技的基本原則是以客戶為中心：協助客戶做最好的財務決策、提供最好的資訊、在客戶需要時滿足其需要。(3)「重點在科技不在客戶」與其本意相反，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5333,"w":1,"sw":0.02901,"id":"19科技力-32"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"19-56","stem":"傳統銀行在應對挑戰時的數位化策略，可採取的策略不包括下列何項？","opts":["引進不成熟的人工智慧應用","建立數位化流程以精簡成本","持續優化服務方式，整合實體與數位通路，建立無縫客戶體驗","延伸金融價值鏈，與異業結盟將金融服務「嵌入」客戶的生活場景"],"ans":1,"exp":["📝 解析：傳統銀行的數位化策略包括：建立數位化流程精簡成本、整合實體與數位通路打造無縫體驗、延伸價值鏈與異業結盟嵌入生活場景。引進「不成熟」的AI應用可能帶來作業與聲譽風險，不屬於建議策略，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9333,"w":1,"sw":0.02901,"id":"19科技力-56"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"17-5","stem":"下列何者屬於新市場平台與共享經濟彼此相同的特點？","opts":["閒置資源再運用","資源所有權與使用權分離","資源使用效率提高","資源的專屬使用"],"ans":3,"exp":["📝 解析：新市場平台（如電商、媒合平台）與共享經濟（如Uber、Airbnb）共同的特點，是透過平台媒合提高資源使用效率，故選(3)。閒置資源再運用、所有權與使用權分離是共享經濟的專屬特點，新市場平台不一定具備；(4)「專屬使用」與兩者精神相反。"],"pos":0.0833,"w":1,"sw":0.01201,"id":"17科技力-05"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"17-30","stem":"數位轉型所面臨的領導者的挑戰，領導者因應的方式為下列何者？","opts":["聘請外部顧問進行帶領數位轉型","領導者需要在長、短期利益之間取得平衡","成立數位轉型部門，由該部門主管帶領全公司轉型","領導者須以股東的利益為主，其他利益攸關方都不重要"],"ans":2,"exp":["📝 解析：數位轉型初期投入大、回收慢，領導者必須在短期財務績效與長期轉型投資之間取得平衡，並親自帶頭建立願景與文化，故選(2)。(1)(3)把轉型責任外包給顧問或單一部門，缺乏高層全面領導易失敗；(4)只重股東而忽略員工、客戶等利害關係人，亦不正確。"],"pos":0.5,"w":1,"sw":0.01201,"id":"17科技力-30"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"15-1","stem":"下列敘述何者是企業利用網際網路將工作分配出去、發現創意，藉由客戶參與凝聚忠誠度？","opts":["社群參與","群眾外包","新興平台","人力派遣"],"ans":2,"exp":["📝 解析：群眾外包（Crowdsourcing）是企業透過網際網路把原本由內部員工執行的工作或創意徵求公開給大眾，從中發現好點子，並藉由客戶參與提升忠誠度，選(2)。人力派遣是勞務派遣契約；社群參與、新興平台是較廣泛的概念，不專指此種工作外包模式。"],"pos":0.0167,"w":1,"sw":0.01201,"id":"15科技力-01"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"14-53","stem":"金融科技興起後，對現有業者或從業人員形成挑戰，下列敘述何者錯誤？","opts":["理專甲：年輕族群對金融科技接受度高，是理財機器人的主要目標客戶","理專乙：金融科技得花時間學習，說服客戶接受新模式，未來將不可行","理專丙：機器人理財手續費收得低，但成本也低，可用來開拓新客源","理專丁：人類理專的價值，在於個人化、客製化，以及關係維繫"],"ans":2,"exp":["📝 解析：理專乙認為金融科技要花時間學習、說服客戶，所以未來不可行，此說法錯誤：金融科技是不可逆的趨勢，從業人員應主動學習、轉型。其餘正確：年輕族群接受度高是理財機器人主要客群；機器人理財費率低但成本也低，可開拓新客源；人類理專的價值在個人化、客製化與關係維繫。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8833,"w":1,"sw":0.01201,"id":"14科技力-53"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"12-1","stem":"能維持客戶在不同通路得到一致的體驗，以客戶體驗為中心分析客戶需求並適時提供產品，這種整合方式稱之為下列何者？","opts":["全通路整合","多通路整合","複通路整合","多元通路整合"],"ans":1,"exp":["📝 解析：「全通路整合」（Omni-channel）以客戶體驗為中心，打通實體分行、網銀、App、客服等各通路的資料與流程，讓客戶在任何通路都獲得一致體驗並適時推薦產品。多通路整合（Multi-channel）只是多開通路，各通路仍各自獨立運作，不保證體驗一致。"],"pos":0.0167,"w":1,"sw":0.01201,"id":"12科技力-01"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"12-58","stem":"數位轉型與員工的關係，下列何者正確？","opts":["數位轉型是運用數位科技，因此只與資訊單位同仁有關","非負責數位金融相關的單位，無需參與數位轉型","數位轉型需要全公司參與，才能真正達到轉型的目的","員工只要會使用數位科技，企業的數位轉型即已完成"],"ans":3,"exp":["📝 解析：數位轉型涉及策略、組織、流程與文化的全面變革，需要全公司參與才能真正達成，故(3)正確。(1)(2)錯在把數位轉型侷限於資訊或數位金融單位；(4)錯在只會用數位工具不等於完成轉型，還須改變商業模式與思維。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.9667,"w":1,"sw":0.01201,"id":"12科技力-58"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"11-38","stem":"傳統銀行在應對挑戰時的「數位化策略」，下列何者是比較好的作法？","opts":["增加實體分行","建立無縫客戶體驗","破壞式分拆收益模式","切割實體與數位通路"],"ans":2,"exp":["📝 解析：傳統銀行的數位化策略重點是整合實體與數位通路，提供「無縫客戶體驗」，讓客戶在任一通路都能順暢接續服務。增加實體分行與數位化方向相反、切割實體與數位通路會破壞一致體驗、破壞式分拆收益模式是新進者攻擊銀行的手法，不是銀行的因應作法。"],"pos":0.6333,"w":1,"sw":0.01201,"id":"11科技力-38"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"11-41","stem":"維持客戶在不同通路都能夠得到一致的體驗，這種作法稱之為何？","opts":["全通路整合","多通路整合","智能通路整合","單一通路整合"],"ans":1,"exp":["📝 解析：讓客戶在不同通路都得到一致體驗的作法稱為「全通路整合」（Omni-channel），各通路共享客戶資料與流程。多通路整合只是提供多個獨立通路、單一通路整合僅限一個通路、智能通路整合非標準用語。"],"pos":0.6833,"w":1,"sw":0.01201,"id":"11科技力-41"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"10-30","stem":"有關金融科技「流程外部化」(Process Externalization)的敘述，下列何者錯誤？","opts":["流程外部化讓金融業者更有營運效率","例如可將投資管理的專業技術交由專業供應商處理","外部化後，金融機構即可完全免除基礎建設投資負擔","業者聯合建構一致性的技術環境標準，有利於外部化"],"ans":3,"exp":["📝 解析：答案(3)錯誤：流程外部化（Process Externalization）是把投資管理、作業處理等專業流程交給外部專業供應商，可提升效率（1）、取得專業技術（2），業者共同建立一致的技術標準也有利外部化（4）。但外部化只能「降低」基礎建設投資負擔，金融機構仍需保留介接系統、資安與委外監督等投資，不可能「完全免除」。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5,"w":1,"sw":0.01201,"id":"10科技力-30"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"10-40","stem":"有關機器人流程自動化工具(RPA)導入原則，下列何者正確？","opts":["應尋求一步到位，快速解決問題","應使用新進應用的人工智慧能力","優先選擇低導入成本並能創造高效益的流程","應先將作業流程自動化再進行流程改善第二部分：第41~60 題(每題2 分)"],"ans":3,"exp":["📝 解析：答案(3)：RPA（機器人流程自動化）導入原則是優先挑選規則明確、重複性高、導入成本低且能創造高效益的流程，先求小規模見效再擴大。(1) 應分階段導入而非一步到位；(2) RPA 本身是規則式自動化，不必追求新進 AI 能力；(4) 應先檢討、改善流程再自動化，避免把沒效率的流程直接自動化。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.6667,"w":1,"sw":0.01201,"id":"10科技力-40"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"9-1","stem":"以客戶體驗為中心，除整合運用各種數位技術外，更記錄客戶在不同通路的反應，分析客戶的需求，並據以規劃客戶所需的產品並適時提供，稱為下列何者？","opts":["單一通路","多通路整合(Multi-Channel)","全通路整合(Omni-Channel)","雙通路整合"],"ans":3,"exp":["📝 解析：答案(3)：全通路整合（Omni-Channel）以客戶體驗為中心，打通各通路的資料，記錄客戶在網路、App、分行、客服等不同通路的行為，分析需求後適時提供合適產品，客戶在各通路間轉換能無縫接續。多通路（Multi-Channel）只是同時提供多種通路，各通路資料彼此獨立、未以客戶為中心整合。"],"pos":0.0167,"w":1,"sw":0.01201,"id":"9科技力-01"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"9-29","stem":"有關金融科技採行「流程外部化」之敘述，下列何者錯誤？","opts":["依靠人工智慧與大數據分析技術，可提供進階分析投資決策","金融機構可經由外部專業供應商提供投資管理專業技術","金融機構亦需投入大量基礎設施","可將現有人工流程自動化"],"ans":3,"exp":["📝 解析：答案(3)錯誤：流程外部化是將投資管理等專業技術交由外部專業供應商提供（2），運用 AI 與大數據提供進階投資分析（1），並把人工流程自動化（4），好處是金融機構「不必」再投入大量基礎設施。說金融機構仍需投入大量基礎設施，與流程外部化的目的相反。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.01201,"id":"9科技力-29"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"7-3","stem":"有關眾包和一般人力銀行網站上常見的外包，下列敘述何者錯誤？","opts":["眾包取得滿意結果才需付費，甚至可能不用付費","眾包的需求是把任務和問題指派給確定的群體","外包的需求可能會因為技術挑選確定的個人或團隊","外包的需求可能會因為預算或時間條件不同挑選確定個人或團隊"],"ans":2,"exp":["📝 解析：答案(2)錯誤：眾包（Crowdsourcing）是把任務公開發布給「不特定」的網路大眾，由眾人自由參與提案，通常只對滿意結果付費甚至不付費（1）；把任務指派給「確定的群體」是外包的特色。外包會依技術（3）、預算或時間（4）挑選特定個人或團隊，正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.05,"w":1,"sw":0.01201,"id":"7科技力-03"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"7-9","stem":"跨通路提供個人化的行銷應用，其主要的框架為：","opts":["常在公眾媒體曝光，如電視廣告、公車車體廣告，即可達到效果","運用新聞置入報導本公司的品牌，即可達到效果","建立與客戶的對話機會，強化客戶關係與客戶忠誠度及建立客戶終身價值","產品設計的好，客戶就會上門，應強化商品的研發與分支機構的門面，就會有足夠的行銷效果"],"ans":3,"exp":["📝 解析：答案(3)：跨通路個人化行銷的框架是以客戶為中心，在各通路建立與客戶的「對話」機會，依客戶行為提供個人化訊息，藉此強化客戶關係與忠誠度，並創造客戶終身價值（CLV）。(1)(2) 公眾媒體曝光、新聞置入是大眾傳播式單向行銷；(4) 只靠產品與門面是產品導向思維。"],"pos":0.15,"w":1,"sw":0.01201,"id":"7科技力-09"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"7-15","stem":"下列何者是建立「場景金融」的首要目標？","opts":["跨業合作","滿足使用者需求","提高獲利","創造趨勢"],"ans":2,"exp":["📝 解析：答案(2)：場景金融是把金融服務嵌入消費者日常生活場景（購物、交通、旅遊等），其首要目標是「滿足使用者需求」，在使用者需要的當下無縫提供金融服務。跨業合作是達成手段，提高獲利是結果，創造趨勢並非首要目標。"],"pos":0.25,"w":1,"sw":0.01201,"id":"7科技力-15"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"7-23","stem":"有關銀行全通路之敘述，下列何者錯誤？","opts":["全通路以客戶為中心","多通路為全通路的重要基礎","全通路著重客戶的互動與超越期待","全通路所建立的互動系統，應求資料100%完整準確"],"ans":4,"exp":["📝 解析：答案(4)錯誤：全通路以客戶為中心（1）、以多通路為基礎（2）、著重與客戶互動並超越期待（3）；但互動系統的資料來源多元且持續變動，追求 100% 完整準確既不實際也會拖慢建置，應以可用、持續修正為原則。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3833,"w":1,"sw":0.01201,"id":"7科技力-23"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"7-35","stem":"將風險轉移給其他獨立機構是屬於下列何者？","opts":["規避風險","降低風險","接受風險","分擔風險"],"ans":4,"exp":["📝 解析：答案(4)：風險管理四種對策：規避（不從事該活動）、降低（以控制措施減少發生機率或損失）、接受（自行承擔）、分擔／移轉（透過保險、委外、避險合約把風險轉給其他獨立機構）。將風險轉移給其他機構即屬「分擔風險」。"],"pos":0.5833,"w":1,"sw":0.01201,"id":"7科技力-35"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"7-42","stem":"下列何者指的是「一種透過了解搜尋引擎的運作規則來調整網站，以及提高目的網站在有關搜尋引擎內排名的方式」？","opts":["SEO","SER","SRR","SRO"],"ans":1,"exp":["📝 解析：答案(1)：SEO（Search Engine Optimization，搜尋引擎最佳化）是了解搜尋引擎的排名規則後，調整網站結構、關鍵字與內容，提高網站在自然搜尋結果中的排名。SER、SRR、SRO 都不是此概念的通用名稱。"],"pos":0.7,"w":1,"sw":0.01201,"id":"7科技力-42"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"7-51","stem":"下列哪一項客戶體驗之技術，可依據螢幕大小不同、橫向或直向使用，由系統自行裁剪好為不同裝置提供最適合的瀏覽格式？","opts":["雲端運算","回應式設計","服務導向架構(SOA)","AI 人工智慧"],"ans":2,"exp":["📝 解析：答案(2)：回應式設計（RWD，Responsive Web Design）讓同一網頁依螢幕大小、橫向或直向自動調整版面，為手機、平板、電腦提供最適合的瀏覽格式，改善客戶體驗。雲端運算是資源服務模式，SOA 是系統架構，AI 是智慧分析技術，均非版面自適應技術。"],"pos":0.85,"w":1,"sw":0.01201,"id":"7科技力-51"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"6-1","stem":"數位科技對金融業的發展至為重要，數位時代金融業商業模式上的未來趨勢有哪些？ A.網路行銷變成主要行銷策略 B.數位能力是金融業的核心競爭能力 C.分行將更為普及 D.線上與客戶即時互動 E.電子商務侵蝕金融業務","opts":["ABCD","ACDE","ABDE","BCDE"],"ans":3,"exp":["📝 解析：數位時代金融業的趨勢為：網路行銷成為主要行銷策略(A)、數位能力成為核心競爭力(B)、線上與客戶即時互動(D)、電子商務業者侵蝕金融業務(E)，故選ABDE。C 錯：客戶交易大量移往數位通路，實體分行數量趨於減少並轉型（如智慧分行、旗艦／衛星分行），而不是更普及。"],"pos":0.0167,"w":1,"sw":0.01201,"id":"6科技力-01"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"6-2","stem":"透過瞭解搜尋引擎的運作規則來調整網站，以提高網頁排名、流量及增加網頁的曝光度，稱為下列何者？","opts":["SMS(Short Message Service)","O2O(Online to Offline)","TSM(Trusted Service Manager)","SEO(Search Engine Optimization)"],"ans":4,"exp":["📝 解析：SEO（Search Engine Optimization，搜尋引擎最佳化）是依搜尋引擎的排名規則調整網站內容與結構，以提高自然搜尋排名、流量與曝光。SMS 是手機簡訊；O2O 是線上導流到線下；TSM（信任服務管理平台）是 NFC 行動支付中管理安全元件的第三方平台。"],"pos":0.0333,"w":1,"sw":0.01201,"id":"6科技力-02"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"6-3","stem":"日本電通公司針對網路時代消費者生活型態的變化，提出一個全新的消費者行為分析模型AISAS，其中兩個S 指的是下列何者？","opts":["Search, Spend","Search, Share","Screen, Sell","Show, Spend"],"ans":2,"exp":["📝 解析：日本電通（Dentsu）提出的 AISAS 模型為 Attention（注意）→ Interest（興趣）→ Search（搜尋）→ Action（行動）→ Share（分享），兩個 S 是 Search 與 Share，故選(2)。它是把傳統 AIDMA 模型中的 Desire、Memory 換成網路時代特有的主動搜尋與社群分享。"],"pos":0.05,"w":1,"sw":0.01201,"id":"6科技力-03"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"6-4","stem":"日本服飾品牌UNIQLO 曾推出線上的 UT CAMERA app，結合實體試穿、上傳、評選及線上展示等步驟，成功與社群互動並吸引更多消費者到實體門市試穿，這是運用下列何項商業模式？","opts":["B2B","C2C","P2P","O2O"],"ans":4,"exp":["📝 解析：UT CAMERA 用線上 App 讓消費者試穿上傳、評選與展示，再把人潮帶回實體門市，屬於 O2O（Online to Offline，線上到線下）模式。B2B 是企業對企業；C2C 是消費者對消費者（如拍賣）；P2P 是個人對個人（如 P2P 借貸）。"],"pos":0.0667,"w":1,"sw":0.01201,"id":"6科技力-04"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"6-19","stem":"銀行業之數位行銷的相關敘述，下列何者錯誤？","opts":["根據統計，沒有銀行業者利用雲端數位行銷而成長擴增消金業務量","數位行銷是針對使用個人電腦、智慧型手機、平板電腦等電子裝置的使用者所操作的行銷","數位行銷讓我們設計及提供給顧客量身訂做的體驗式行銷變得可行","數位行銷之所以深受銀行業重視，是因為它比實體通路更容易追蹤與分析顧客的活動軌跡"],"ans":1,"exp":["📝 解析：選項(1)錯：已有不少銀行運用雲端數位行銷（顧客側寫、精準行銷）成功擴增消金業務，並非「沒有銀行業者」。數位行銷是針對電腦、手機、平板等裝置使用者的行銷(2)，可設計量身訂做的體驗式行銷(3)，且比實體通路更容易追蹤分析顧客的活動軌跡(4)，三者皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3167,"w":1,"sw":0.01201,"id":"6科技力-19"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"6-42","stem":"內容行銷的一種形式，透過提供網友實用有價值的內容，包含圖文報導的訊息或文章，讓消費者願意閱讀及接收訊息，指的是下列何者？","opts":["小眾廣告","原生廣告","行動廣告","店頭廣告"],"ans":2,"exp":["📝 解析：原生廣告（Native Advertising）是內容行銷的一種，把廣告訊息融入有價值的圖文報導或文章中，形式與平台原本內容一致，讓消費者願意閱讀與接收，故選(2)。小眾廣告針對特定小族群；行動廣告是投放在行動裝置的廣告；店頭廣告（POP）是在賣場陳列處的廣告。"],"pos":0.7,"w":1,"sw":0.01201,"id":"6科技力-42"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"5-2","stem":"企業思考如何引導社群從網路至實體通路互動，這是指哪一種活動？","opts":["B2C","B2B","C2O","O2O"],"ans":4,"exp":["📝 解析：引導社群從網路（線上）到實體通路（線下）互動，就是 O2O（Online to Offline）。B2C 是企業對消費者；B2B 是企業對企業；C2O 不是常見的商業模式名稱。"],"pos":0.0333,"w":1,"sw":0.01201,"id":"5科技力-02"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"5-3","stem":"企業進行社群行銷規劃時，最根本態度是要能懂得換位思考，其主要原因為何？","opts":["企業若只是在乎自己，可能會看不見自己的盲點，無法發揮行銷效果","廣告預算與廣告效果是高度相關的，多一些廣告預算，就能達到廣告效果","平面廣告預算較多，網路廣告預算有限，因此必須謹慎","社群是很容易欺騙與操弄的，要努力思考如何控制社群"],"ans":1,"exp":["📝 解析：社群行銷要站在消費者／社群的角度換位思考，因為企業若只在乎自己想說的，會看不見自己的盲點，內容無法引起共鳴，行銷就沒有效果，故選(1)。(2)預算多不代表效果好；(3)與換位思考無關；(4)把社群當成可欺騙操弄的對象，恰與社群經營的態度相反。"],"pos":0.05,"w":1,"sw":0.01201,"id":"5科技力-03"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"5-8","stem":"結合粉絲頁上的文章發佈與新產品的發表，讓有興趣的客群可以至企業能掌握的數位通路中，再透過情境式行銷手法，讓客戶表達其具體需求，這種做法稱之為：","opts":["數位導流","客戶分群","客戶價值分析","關聯分析"],"ans":1,"exp":["📝 解析：把粉絲頁上有興趣的客群，引導到企業能掌握的數位通路（如官網、App），再用情境式行銷讓客戶表達具體需求，稱為「數位導流」，故選(1)。客戶分群是依特徵把客戶分組；客戶價值分析是評估客戶貢獻與潛力；關聯分析是找出同時發生的項目關係。"],"pos":0.1333,"w":1,"sw":0.01201,"id":"5科技力-08"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"5-42","stem":"5W1H 分析法也稱六何分析法，此思考方法有助於企業評估行銷事件內容的各個面向完整度外，對目標社群而言事件規劃的價值為何？","opts":["行銷事件內容對社群本身是不是真正有意義","行銷事件內容給予的折扣是不是最便宜","行銷事件內容呈現的設計創意是不是有意願分享轉發","行銷事件內容給予的誘因是不是最多"],"ans":1,"exp":["📝 解析：5W1H（Who、What、When、Where、Why、How）有助企業檢查行銷事件內容是否完整；對目標社群而言，事件規劃的價值在於「內容對社群本身是否真正有意義」，故選(1)。折扣最便宜、誘因最多、設計是否吸引轉發，只是手段，並非對社群的根本價值。"],"pos":0.7,"w":1,"sw":0.01201,"id":"5科技力-42"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"5-43","stem":"數位通路行為蒐集經營的目的是強化兩大主題，下列何者完全正確？","opts":["理解訪客特質、建構風險管理","理解訪客特質、管理網站內容與功能分析","建構風險管理、自然語言處理分析","自然語言分析、管理網站內容與功能分析"],"ans":2,"exp":["📝 解析：數位通路行為蒐集經營的兩大主題是：理解訪客特質（誰來、偏好什麼），以及管理網站內容與功能分析（哪些內容與功能有效），故選(2)。風險管理、自然語言處理分析不是數位通路行為蒐集的兩大主題。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.7167,"w":1,"sw":0.01201,"id":"5科技力-43"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"5-44","stem":"下列何者為數位通路行為分析與互動行銷的概念？","opts":["一般行銷行為是採取分群分銷的概念，只要把金融機構中的客戶分為數群，在數位通路中替每一分群設計不同的行銷文案內容即可","透過資料分析來介定客戶的往來屬性，透過數位行為分析來預測客戶意圖，透過線上線下通路互動整合行銷來影響客戶，才是完整的互動行銷的概念","有許多第三方行銷分析公司進行社群媒體行為分析，也有許多應用選項可供選取，應用這些選項，在客戶應用社群媒體時即進行行銷，即為互動行銷的概念","把客戶從線上通路導流到線下實體通路，便可稱為互動行銷"],"ans":2,"exp":["📝 解析：完整的互動行銷是：透過資料分析界定客戶往來屬性、透過數位行為分析預測客戶意圖、再透過線上線下通路整合互動來影響客戶，故選(2)。(1)只分群配文案是傳統分眾行銷；(3)只套第三方社群工具、(4)只把客戶導到線下，都只是互動行銷的片段。"],"pos":0.7333,"w":1,"sw":0.01201,"id":"5科技力-44"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"4-1","stem":"在「新數位力」一書中提及數位科技會驅動五種業務模式再造，其中，\"運用新的數位能力來迎合既有或新客群未獲滿足的需求\"是屬於哪一種業務模式再造？","opts":["產品或是服務的替換","催生新數位業務","重設價值主張","重整價值供應模式"],"ans":3,"exp":["📝 解析：《新數位力》（Leading Digital）提出數位科技驅動的五種業務模式再造：產業重塑、產品或服務的替換、催生新數位業務、重整價值供應模式、重設價值主張。其中「運用新數位能力迎合既有或新客群未獲滿足的需求」是「重設價值主張」，故選(3)。產品或服務的替換是以數位產品取代實體產品；催生新數位業務是開創新的營收來源；重整價值供應模式是重新串連產品、服務與資訊的交付方式。"],"pos":0.0167,"w":1,"sw":0.01201,"id":"4科技力-01"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"4-2","stem":"透過能產生群聚效應的網路服務媒體，來與目標顧客群建立長期溝通管道的社會化過程，稱之為何？","opts":["社群行銷","電子商務","飢餓行銷","廣告溝通"],"ans":1,"exp":["📝 解析：社群行銷是透過能產生群聚效應的網路服務媒體（如 Facebook、Instagram、LINE），與目標顧客建立長期溝通管道的社會化過程，故選(1)。電子商務是線上交易；飢餓行銷是刻意限量製造稀缺感；廣告溝通是單向傳播訊息，不強調長期雙向的社群關係。"],"pos":0.0333,"w":1,"sw":0.01201,"id":"4科技力-02"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"4-3","stem":"觀念類似於廣編廣告，編輯一份含有圖文的訊息或文章，創造讓消費者覺得有價值的內容，讓消費者願意進一步的閱讀或接受訊息，這是指下列何者？","opts":["網路廣告","行動廣告","垃圾廣告","原生廣告"],"ans":4,"exp":["📝 解析：原生廣告的概念類似「廣編稿」：把廣告做成含圖文、有價值的內容，與平台原本內容風格一致，讓消費者願意閱讀與接受訊息，故選(4)。網路廣告、行動廣告是以投放媒介區分的廣告類型；垃圾廣告是未經同意大量發送的廣告。"],"pos":0.05,"w":1,"sw":0.01201,"id":"4科技力-03"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"4-57","stem":"哈佛教授克里斯汀生 (Clayton Christensen)認為大企業在創新上失敗，多是在舊的軌道上太努力，不斷改進產品、提升產品功能，卻忽略了市場冒出改變遊戲規則的挑戰者，請問大企業忽略下列何種創新？","opts":["品牌創新","產品系統創新","破壞式創新","服務創新"],"ans":3,"exp":["📝 解析：克里斯汀生在《創新的兩難》提出「破壞式創新」：大企業專注在既有軌道上做持續性改良、服務高端客戶，卻忽略從低階或新市場切入、以簡單便宜方式改變遊戲規則的挑戰者，最終被取代，故選(3)。"],"pos":0.95,"w":1,"sw":0.01201,"id":"4科技力-57"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"3-2","stem":"有關網路廣告的敘述，下列何者錯誤？","opts":["社群體驗對社群行銷的口碑效應有極大的影響力","不被點閱的關鍵字廣告代表沒有任何廣告效果","與自己所需無關的廣告內容，會讓消費者覺得干擾","廣告曝光時機不佳會有反效果"],"ans":2,"exp":["📝 解析：(2)錯：關鍵字廣告即使沒被點閱，只要被看到仍有「曝光」效果，可提升品牌知名度與印象，不能說沒有任何廣告效果。(1)社群體驗影響口碑效應；(3)不相關的廣告會造成干擾；(4)曝光時機不佳會引起反感，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0333,"w":1,"sw":0.01201,"id":"3科技力-02"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"3-3","stem":"有關程序化購買，下列敘述何者錯誤？","opts":["利用數位自動化的方式去撮合賣方的供給及買方的需求","以競價的方式採買廣告板位與時段","在龐大碎裂的網海中利用科技力，依照廣告主的期望完成每一播廣告的跨優質媒體購買及投放","將廣告錢花在刀口上"],"ans":2,"exp":["📝 解析：程序化購買是以數位自動化方式撮合廣告供需，核心是依廣告主設定的目標「受眾」（人）去購買每一次曝光，而不是傳統那樣採買固定的廣告版位與時段，故(2)錯誤。(1)自動化撮合供需、(3)以科技在破碎的網路媒體中跨媒體精準投放、(4)把預算花在目標對象身上（花在刀口上），皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.05,"w":1,"sw":0.01201,"id":"3科技力-03"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"3-25","stem":"日本主要銀行依據其總務省統計局2014 年家計調查年報，開始重視下列何種新藍海市場？","opts":["孩童金融","少年金融","青年金融","銀髮金融"],"ans":4,"exp":["📝 解析：日本 2014 年家計調查顯示，60 歲以上高齡家庭持有的金融資產佔比最高，且人口高齡化持續，日本主要銀行因此開始重視財富管理、信託、繼承與照護相關的「銀髮金融」新藍海市場，故選(4)。"],"pos":0.4167,"w":1,"sw":0.01201,"id":"3科技力-25"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"3-39","stem":"新興數位金融服務下，競爭對手多元，金融業須積極跨業合作，以整合電子商務之下列哪幾部分？","opts":["人才流、服務流、設計流","金流、物流、資訊流","人才流、服務流、金流","設計流、物流、資訊流"],"ans":2,"exp":["📝 解析：電子商務的運作由四流構成：商流、金流、物流、資訊流。金融業跨業合作要整合的是金流（支付）、物流（商品配送）、資訊流（交易與客戶資料），故選(2)。人才流、服務流、設計流並非電子商務的基本構成。"],"pos":0.65,"w":1,"sw":0.01201,"id":"3科技力-39"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"2-2","stem":"為什麼在有行動載具之後，在消費者心理過程的影響，會多增加了「評估」的步驟？","opts":["社群帶來的分群效應，透過朋友與專家寫手的分享，讓商品的資訊來源變多了","從報紙或是雜誌的訊息可以引起消費者的慾望","當消費者接收到訊息的時候，他會由慾望轉化成記憶，放在腦海裡","消費者會習慣從記憶中去找出想要買的東西"],"ans":1,"exp":["📝 解析：有了行動載具後，消費者可隨時透過社群看到朋友與專家寫手的分享、比價與評論，商品資訊來源變多，購買前因此多了「評估」比較的步驟，故選(1)。(2)(3)(4)描述的是傳統媒體時代「注意、興趣、慾望、記憶、行動」的心理流程，並未說明為何新增評估步驟。"],"pos":0.0333,"w":1,"sw":0.01201,"id":"2科技力-02"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"2-3","stem":"何謂「展廳現象(Show Rooming)」？","opts":["消費者在實體商店試用商品後，到網上購買的現象","企業在特定地點展示自家商品供社群進行體驗的現象","不同品牌齊聚在共同展覽地點的現象","社群透過網聚，展示自己作品的現象"],"ans":1,"exp":["📝 解析：展廳現象（Showrooming）是指消費者把實體商店當成展示廳，到店試用、試穿商品後，再到網路上以較低價格購買，故選(1)。反向的「先上網研究、再到實體店購買」則稱為 Webrooming。"],"pos":0.05,"w":1,"sw":0.01201,"id":"2科技力-03"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"2-24","stem":"下列何者非屬全通路與多通路的異同？","opts":["以銀行為中心VS.以產品為中心","互動VS.交易","預測需要與喜好VS.滿足需求","建立互動系統VS.交易紀錄"],"ans":1,"exp":["📝 解析：全通路(Omni-channel)與多通路(Multi-channel)的對比是：以「客戶」為中心 vs 以產品／通路為中心、重互動 vs 重交易、預測需要與喜好 vs 滿足既有需求、建立互動系統 vs 留存交易紀錄。(1)寫成「以銀行為中心」錯誤，全通路應是以客戶為中心，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4,"w":1,"sw":0.01201,"id":"2科技力-24"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"2-39","stem":"下列何者是整合性服務與線上線下服務的最大賣點？","opts":["提供客戶搜尋服務","提供有價值且可黏著客戶的服務","將服務由線下搬到線上","提供客戶優惠服務"],"ans":2,"exp":["📝 解析：整合性服務與 O2O（線上線下）服務的最大賣點，在於提供有價值、能黏著客戶的服務，讓客戶持續回流使用，故選(2)。單純提供搜尋、把服務搬上網或給優惠，都容易被模仿，無法形成長期黏著度。"],"pos":0.65,"w":1,"sw":0.01201,"id":"2科技力-39"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"2-42","stem":"企業進行程序化購買(Programmatic Buy)的目的，下列敘述何者錯誤？","opts":["利用數位自動化的方式去撮合賣方的供給及買方的需求","在龐大碎裂的網海中利用科技力，依照廣告主的期望完成每一播廣告的跨優質媒體購買及投放","把錢花在刀口上","每個環節都有專業的人員提供媒體策略建議"],"ans":4,"exp":["📝 解析：程序化購買(Programmatic Buy)是用演算法與自動化平台即時競價、撮合廣告供需，依廣告主目標跨優質媒體投放，把預算花在刀口上。其重點在「數位自動化」，而不是「每個環節都由專人提供媒體策略建議」，故(4)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7,"w":1,"sw":0.01201,"id":"2科技力-42"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"2-58","stem":"下列何者不是生態圈治理重點？","opts":["掌握數據支持決策","靈活的治理模式","提升聯合績效","人員必須在生態圈中進行輪調，確保人員治理能力"],"ans":4,"exp":["📝 解析：生態圈治理重點包括：掌握數據支持決策、採用靈活的治理模式、提升生態圈夥伴的聯合績效。生態圈由不同企業組成，人員不可能也不需要在各成員間「必須輪調」，故(4)不是治理重點。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9667,"w":1,"sw":0.01201,"id":"2科技力-58"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"1-2","stem":"進行社群行銷時，使用效益分析工具的目的，下列敘述何者錯誤？","opts":["協助企業獲取網站的各項關鍵績效指標 (Key Performance Indicators, KPI)","探索訪客的偏好習性，且有助於企業了解網站營運及行銷活動的表現","對企業而言是很重要的優化工具與持續改善的行銷利器","評估員工績效表現"],"ans":4,"exp":["📝 解析：社群行銷效益分析工具（如 Google Analytics）用來取得網站關鍵績效指標(KPI)、了解訪客偏好與行銷活動表現，作為持續優化的工具；它分析的是網站與行銷成效，不是用來評估員工績效，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0333,"w":1,"sw":0.01201,"id":"1科技力-02"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"1-8","stem":"我們使用線上／線下整合分析及建立數位互動行銷的最主要目的為何？","opts":["虛實(線上／線下)通路整合，是數位化時代的潮流，而且線上通路是新的通路型態，為趕上潮流，所以我們要進行線上／線下整合分析","只要在線上通路，建立智能互動系統，例如：智能客服，讓客戶的問題得到適合的答案，即是完成線上／線下整合分析","在數位時代，客戶自我主張比較強烈，尤其在數位通路上，客戶只要看到是他所喜愛的商品，就會進行購買。所以我們只要使用線下的交易資料進行分析，並將客戶的偏好部署於線上通路，即可有完整的線上／線下整合分析，加大金融機構的營運績效","在現今數位化盛行的社會中，客戶的購買旅程橫亙數位通路及實體通路。為充分瞭解客戶整體往來狀況，提供客戶一致性體驗，需要將線上／線下各項客戶行為整合分析，才能充分預測客戶的意圖"],"ans":4,"exp":["📝 解析：客戶的購買旅程橫跨數位與實體通路，線上線下整合分析的目的在於全面瞭解客戶往來狀況、提供一致體驗並預測客戶意圖，故選(4)。(1)只為追趕潮流、(2)只建智能客服、(3)只用線下交易資料部署到線上，都不是完整的整合分析目的。"],"pos":0.1333,"w":1,"sw":0.01201,"id":"1科技力-08"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"1-26","stem":"下列何者是全通路與多通路金融服務的最主要差別？","opts":["通路數的多與寡","執行速度的快與慢","著重交易的執行與著重客戶互動找出潛在喜好","通路分佈區域的廣闊與狹隘"],"ans":3,"exp":["📝 解析：多通路是各通路各自完成交易、著重交易執行；全通路則以客戶為中心整合各通路資料，著重與客戶互動並找出潛在需求與喜好，提供一致體驗，故選(3)。兩者的差別不在通路數量、執行速度或通路分布區域。"],"pos":0.4333,"w":1,"sw":0.01201,"id":"1科技力-26"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":0,"n":1,"refs":"1-37","stem":"數位金融相關投資創新需掌握風險，關鍵在於各里程碑應設定衡量方式及目標值，以避免創新失敗及負投資回報率。下列何者非屬上述須訂定的方法與目標值？","opts":["關連度敏感性分析(Sensitivity Analysis)","去偏見訓練(De-biasing training)","關鍵驅動因子(Key Business Drivers)","彙整成果(Summarize the results)"],"ans":2,"exp":["📝 解析：數位金融投資創新要控管風險，各里程碑可用敏感性分析(Sensitivity Analysis)找出影響最大的變數、設定關鍵驅動因子(Key Business Drivers)的衡量指標、彙整成果(Summarize the results)檢視達成度。去偏見訓練是改善人員決策偏誤的訓練方法，不是設定衡量方式與目標值的方法，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6167,"w":1,"sw":0.01201,"id":"1科技力-37"},{"s":"all","ch":"科技力 11｜其他","star":0,"n":1,"refs":"20-57","stem":"有關「實境體感場域業者自律規範」之敘述，下列何者錯誤？","opts":["為發展實境體感技術，健全場域應用環境保障消費者權益，特訂定自律規範作為實境體感場域業者運營相關服務遵循事項","實境體感應用服務：指運用實境體感技術提供使用者透過實境體感設備進行實境體感體驗之服務，其應用範圍包括遊戲、教育及娛樂等領域","實境體感場域業者：從事提供實境體感設備，於特定場域內以網路連線方式或非連線方式供不特定人進行育樂、商業應用或展示等實境體驗活動之營利事業","實境體感設備：結合光影、投影、攝影技術與電子裝置，產生人體感官認知上之立體環繞聲光、影像等三維虛擬感受，並進行互動體驗機具，包含附載前述功能之電子遊戲場業管理條例所稱電子遊戲機"],"ans":4,"exp":["📝 解析：「實境體感場域業者自律規範」第2條定義實境體感設備為結合光影、投影、攝影技術與電子裝置產生三維虛擬感受的互動體驗機具，但「不包含」附載前述功能之電子遊戲場業管理條例所稱電子遊戲機。(4)寫成「包含」，故錯誤。(1)立法目的、(2)應用服務、(3)場域業者定義均與條文相符。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.95,"w":1,"sw":0.00307,"id":"20科技力-57"},{"s":"all","ch":"科技力 11｜其他","star":0,"n":1,"refs":"19-39","stem":"AR(擴增實境)的英文全名為下列何者？","opts":["Artificial Real","Augmented Reach","Artificial Reality","Augmented Reality"],"ans":4,"exp":["📝 解析：AR擴增實境的英文全名為Augmented Reality，是在真實環境上疊加虛擬影像資訊（如Pokémon GO），故選(4)。VR虛擬實境則為Virtual Reality，完全以虛擬環境取代真實世界。"],"pos":0.65,"w":1,"sw":0.02901,"id":"19科技力-39"},{"s":"all","ch":"科技力 11｜其他","star":0,"n":1,"refs":"19-59","stem":"有關「實境體感場域業者自律規範」之敘述，下列何者錯誤？","opts":["實境體感場域業者所使用之內容，應遵循中央目的事業主管機關之遊戲軟體分級管理辦法規定，完成登錄作業並負標示分級標識、情節及警語等義務","所列分級級別有疑義時，得自行送請銀行公會認定之","依規定標示之分級標識、情節及警語，應以中文明顯標示於主要入口處或售票處","實境體感場域業者為廣告文宣者，該廣告除須遵守相關法律及主管機關之規定外，並應於廣告明顯處分別揭露所對應內容之分級級別"],"ans":2,"exp":["📝 解析：依「實境體感場域業者自律規範」第3條，業者對分級級別有疑義時，得自行送請台北市電腦商業同業公會成立之「數位遊戲產業自律推動委員會」認定，並非銀行公會，故(2)錯誤。(1)內容須依遊戲軟體分級管理辦法登錄並標示、(3)以中文標示於主要入口或售票處、(4)廣告須揭露分級級別，均與條文相符。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9833,"w":1,"sw":0.02901,"id":"19科技力-59"},{"s":"all","ch":"科技力 11｜其他","star":0,"n":1,"refs":"17-38","stem":"利用電腦產生一個三維空間的虛擬世界，提供使用者關於視覺等感官的類比，是使用下列何項技術？","opts":["虛擬實境(VR)","擴增實境(AR)","混和實境(MR)","替代實境(SR)"],"ans":1,"exp":["📝 解析：虛擬實境（VR）是由電腦產生一個完全虛擬的三維空間，透過頭戴裝置提供視覺、聽覺等感官模擬，讓使用者沉浸其中，選(1)。擴增實境（AR）是在真實環境上疊加虛擬資訊；混合實境（MR）讓虛擬物件與真實環境即時互動；替代實境（SR）是把過去錄製的影像與現實畫面混合替換。"],"pos":0.6333,"w":1,"sw":0.01201,"id":"17科技力-38"},{"s":"all","ch":"科技力 11｜其他","star":0,"n":1,"refs":"17-57","stem":"在物聯網的網路層級三層架構中除了應用層、網路層外，還有哪一層？","opts":["表面層","接觸層","感知層","引用層"],"ans":3,"exp":["📝 解析：物聯網常見的三層架構由下而上為：感知層（感測器、RFID等蒐集環境資料）、網路層（透過Wi-Fi、行動網路等傳輸資料）、應用層（分析資料並提供各種服務），故缺少的是(3)感知層。表面層、接觸層、引用層皆非物聯網架構用語。"],"pos":0.95,"w":1,"sw":0.01201,"id":"17科技力-57"},{"s":"all","ch":"科技力 11｜其他","star":0,"n":1,"refs":"1-42","stem":"有關自適應RWD (Responsive Web Design) 的敘述，下列何者錯誤？","opts":["是一項網頁設計開發技術的趨勢","以百分比方式及彈性畫面設計，在不同解析度下改變網頁頁面佈局排版","讓不同的設備都可正常瀏覽同一網站，提供最佳的視覺體驗","由企業自行開發的網頁格式，符合企業自我需求"],"ans":4,"exp":["📝 解析：自適應網頁設計(RWD)以 HTML5／CSS3 媒體查詢(media queries)、百分比與彈性版面，讓網頁在不同解析度裝置上自動調整排版、提供一致的瀏覽體驗，是業界通用的開放標準技術，並非企業自行開發的專屬網頁格式，故(4)錯誤。(1)(2)(3)均正確描述 RWD。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7,"w":1,"sw":0.01201,"id":"1科技力-42"}],"old":[],"mock":[{"id":"21科技力","name":"第 21 屆 科技力","s":"all","min":90,"items":["21科技力-01","21科技力-02","21科技力-03","21科技力-04","21科技力-05","21科技力-06","21科技力-07","21科技力-08",{"id":"21科技力-09","s":"all","stem":"比特幣區塊鏈的公鑰密碼術所選取的「單向函數」，是由下列何者產生？","opts":["RSA 演算法","凱薩演算法","橢圓曲線密碼術","雜湊演算法"],"ans":3,"ref":"科技力-A0006"},{"id":"21科技力-10","s":"all","stem":"下列何者並非區塊鏈的種類？","opts":["公有鏈","私有鏈","自由鏈","聯盟鏈"],"ans":3,"ref":"科技力-A0030"},{"id":"21科技力-11","s":"all","stem":"在評估生物辨識系統的安全性時，「冒用被接受率(False Acceptance Rate)」若為五萬分之一，則表示下列何者？","opts":["冒用者被拒絕的機率有五萬分之一","冒用者成功的機率有五萬分之一","本人使用被拒絕的機率有五萬分之一","本人使用成功的機率有五萬分之一"],"ans":2,"ref":"科技力-A0031"},{"id":"21科技力-12","s":"all","stem":"下列何者非屬生物辨識技術的類別？","opts":["晶片","簽名","指紋","聲音"],"ans":1,"ref":"科技力-A0034"},"21科技力-13","21科技力-14","21科技力-15","21科技力-16","21科技力-17",{"id":"21科技力-18","s":"all","stem":"P2P 借貸分類模式中，下列平台何者屬於資產負債表模式？","opts":["Zopa","Lending Club","陸金服","SoFi"],"ans":4,"ref":"科技力-A0002"},{"id":"21科技力-19","s":"all","stem":"有關P2P 借貸保證收益模式之敘述，下列何者正確？","opts":["僅協助資訊中介","銀行參與合作撥貸","向出借人承諾一定收益","以自有資金撥貸"],"ans":3,"ref":"科技力-A0001"},"21科技力-20","21科技力-21","21科技力-22","21科技力-23","21科技力-24","21科技力-25","21科技力-26","21科技力-27","21科技力-28","21科技力-29","21科技力-30","21科技力-31",{"id function genSim(s) {
  const blocks = DATA.blocks[s], u = SIMU(s);
  const want = blocks.map(b => b[1] * u), slots = want.map(Math.floor);
  const left = Math.round(NQ(s) * u) - slots.reduce((a, b) => a + b, 0);
  want.map((w, i) => [w - slots[i], i]).sort((a, b) => b[0] - a[0]).slice(0, Math.max(0, left)).forEach(([, i]) => slots[i]++);
  const picks = [], used = new Set(), CP = DATA.cpair || {};
  const ok = q => !used.has(q.id) && !(CP[q.id] || []).some(k => used.has(k));
  blocks.forEach(([ch, k], i) => {
    const cand = POOL[s].filter(q => q.ch === ch).map(q => ({q, key: Math.pow(Math.random(), 1 / (q.sw || 0.005))})).sort((a, b) => b.key - a.key);
    let n = 0;
    const take = q => { picks.push(q); used.add(q.id); n++; };
    for (const x of cand) if (n < slots[i] && !S.rec[x.q.id] && ok(x.q)) take(x.q);
    for (const x of cand) if (n < k && ok(x.q)) take(x.q);
  });
  return {ids: picks.map(q => ({q, k: q.pos + Math.random() * 1e-6})).sort((a, b) => a.k - b.k).map(x => x.q.id),

}

  ['10/13', '二', [Sm('prac', 120), C('看完 🔢 數字速記（法規、實務都要）', 45, 'numbers.html'), W('all', 30), M('predBprac', 120, 1), M('predClaw', 80, 1), M('predCprac', 120, 1)]],
  ['10/14', '三・考試', [C('出門前看 🔢 數字速記的法規部分', 15, 'numbers.html'), C('准考證、身分證、文具帶齊', 5), C('兩節中間休息時看 🔢 數字速記的實務部分', 15, 'numbers.html')]]
];
function setPlanDay(k) { S.plan.day = {d: k, t: Date.now()}; save(); }
const chName = (s, c) => DATA.blocks[s][c][0];
const hiSet = (s, ch, star) => DATA.hot.concat(DATA.old).filter(q => q.s === s && (!ch || q.ch === ch) && q.star >= star && q.ans != null);
const oneSet = (s, ch) => DATA.hot.concat(DATA.single, DATA.old).filter(q => q.s === s && q.ch === ch && !q.star && q.ans != null);
const qMin = n => Math.max(5, Math.round(n * 60 / RATE));
const dayTime = di => { const [m, d] = PLAN[di][0].split('/'); return new Date(YEAR, m - 1, d).getTime(); };
const dayOpen = di => di <= todayIdx() || !!(S.plan.open || {})[di];
const dayStart = di => Math.min(dayTime(di), (S.plan.open || {})[di] || Infinity);
function noteHref(prefix) {
  if (typeof prefix === 'string' && prefix.endsWith('.html')) return `${prefix}?v=1792103995`;
  const ids = [].concat(prefix).map(p => Object.keys(NOTE).find(t => t.startsWith(p))).filter(Boolean).map(k => NOTE[k]);
  return `note.html?v=1792103995${ids.length ? '&only=' + encodeURIComponent(ids.join(',')) : ''}`;
}
function todayIdx() { const t = Date.now(); let i = -1; PLAN.forEach((p, k) => { if (t >= dayTime(k)) i = k; }); return i; }
const taskSet = t => t.k === 'hi' ? hiSet(t.s, chName(t.s, t.c), 1) : t.k === 'one' ? oneSet(t.s, chName(t.s, t.c)) : hiSet(t.s, '', 2);

function fixMoved() {
  const M = DATA.moved || {}, now = Date.now(), to = id => M[id] && ITEMS[M[id]] ? M[id] : null;
  let n = 0;
  Object.keys(M).forEach(id => {
    const k = to(id);
    [['wrong', 'gone'], ['fav', 'favGone']].forEach(([a, g]) => {
      if (!S[a][id]) return;
      if (k && !S[a][k]) S[a][k] = S[a][id];
      delete S[a][id]; (S[g] = S[g] || {})[id] = now; n++;
    });
    if (S.rec[id] && k && !S.rec[k]) { S.rec[k] = Object.assign({}, S.rec[id]); n++; }
  });
  const fix = a => {
    const o = [];
    a.forEach(id => { const k = id in M ? to(id) : id; if (k && !o.includes(k)) o.push(k); });
    return o.length === a.length && o.every((x, i) => x === a[i]) ? a : o;
  };
  const sn = S.plan.snap || {};
  Object.keys(sn).forEach(sk => { const b = fix(sn[sk]); if (b !== sn[sk]) { sn[sk] = b; n++; } });
  const p = S.psess;
  if (p && p.ids) {
    const b = fix(p.ids);
    if (b !== p.ids) { n++; if (b.length) { p.ids = b; p.i = Math.min(p.i || 0, b.length - 1); } else S.psess = {t: now}; }
  }
  if (n) save();
}

function taskList(t, di) {
  if (t.k === 'wrong') { const base = S.plan.snap[`${di}-${t.s}`] || []; return base.filter(id => S.wrong[id] && ITEMS[id]).map(id => ITEMS[id]); }
  const L = taskSet(t);
  const t0 = dayStart(di), fresh = q => S.rec[q.id] && (t.k !== 'rev' || (S.rec[q.id].t || 0) >= t0);
  return L.filter(q => !fresh(q)).concat(L.filter(fresh));
}

function taskInfo(t, di, ti) {
  if (t.k === 'read' || t.k === 'chk') {
    const on = S.plan.chk[`${di}-${ti}`] > 0;
    return {min: t.min, pct: on ? 1 : 0, manual: 1, sub: `約 ${t.min} 分鐘`,
      title: t.k === 'read' ? `📖 讀筆記「${chName(t.s, t.c)}」` : t.text,
      href: t.k === 'read' ? noteHref(chName(t.s, t.c)) : t.note ? noteHref(t.note) : ''};
  }
  if (t.k === 'hi' || t.k === 'one' || t.k === 'rev') {
    const L = taskSet(t);
    const t0 = dayStart(di), done = L.filter(q => S.rec[q.id] && (t.k !== 'rev' || (S.rec[q.id].t || 0) >= t0));
    const right = done.filter(q => S.rec[q.id].last).length, min = qMin(L.length);
    const name = chName(t.s, t.c || 0);
    return {min, pct: done.length / L.length, n: done.length, right, start: 1,
      title: t.k === 'hi' ? `📝 高頻題「${name}」全部做一遍` : t.k === 'one' ? `📝 只考過 1 屆的題目「${name}」做一遍` : `🔁 ${SHORT[t.s]} ⭐⭐ 以上重做一遍（這天做的才算）`,
      sub: `${L.length} 題 · 做過 ${done.length} · 上次答對 ${right} · 約 ${min} 分鐘`};
  }
  if (t.k === 'sim') {
    const t0 = dayStart(di), sc = S.hist.filter(x => x.pid === `sim-${t.s}` && (x.ts || 0) >= t0).map(x => x.score).reverse();
    return {min: t.min, pct: sc.length ? 1 : 0, sim: t.s, opt: t.opt, title: `🎯 仿真模擬考：${SUBJ[t.s]}（這天做的才算）${t.opt ? '（選做）' : ''}`,
      sub: `限時 ${subjMin(t.s)} 分鐘＋檢討錯題 · 約 ${t.min} 分鐘${sc.length ? ` · 這天做了 ${sc.length} 份：${sc.join('、')} 分` : ' · 每次都是新考卷，最像真考'}`};
  }
  if (t.k === 'mock') {
    const p = paperOf(t.id), m = S.mock[t.id];
    return {min: t.min, pct: m ? 1 : 0, mock: t.id, opt: t.opt, title: `⏱ 限時模擬考：${p.name}${t.opt ? '（選做，不算進完成度）' : ''}`,
      sub: `限時 ${p.min} 分鐘＋檢討錯題 · 約 ${t.min} 分鐘${m ? ` · 最高 ${m.best} 分` : ''}`};
  }
  const sk = `${di}-${t.s}`, name = t.s === 'all' ? '全部' : SHORT[t.s];
  if (!S.plan.snap[sk] && dayOpen(di)) {
    S.plan.snap[sk] = wrongIds(t.s).filter(id => ITEMS[id].ans != null);
    (S.plan.snapT = S.plan.snapT || {})[sk] = Date.now(); save();
  }
  const base = S.plan.snap[sk] && S.plan.snap[sk].filter(id => ITEMS[id]);
  if (!base) return {min: t.min, pct: 0, title: `❌ 錯題本（${name}）清掉這天以前的錯題`, sub: `當天第一次打開時記下要清哪些 · 約 ${t.min} 分鐘`};
  const cleared = base.filter(id => !S.wrong[id]).length;
  return {min: t.min, pct: base.length ? cleared / base.length : 1, start: base.length > cleared,
    title: `❌ 錯題本（${name}）清掉這天以前的錯題`,
    sub: base.length ? `這天開始時 ${base.length} 題 · 已答對移出 ${cleared} · 約 ${t.min} 分鐘` : `這天開始時錯題本是空的 · 約 ${t.min} 分鐘`};
}

function dayInfo(di) {
  const locked = !dayOpen(di);
  const T = PLAN[di][2].map((t, ti) => {
    const x = taskInfo(t, di, ti);
    if (locked && (t.k === 'wrong' || t.k === 'rev')) Object.assign(x, {later: 1, start: 0, pct: 0, sub: `前面的日子都 100% 後開放（最晚 ${PLAN[di][0]}）· 約 ${x.min} 分鐘`});
    return x;
  }), req = T.filter(x => !x.opt);
  const min = req.reduce((a, x) => a + x.min, 0), tot = T.filter(x => !x.opt).reduce((a, x) => a + x.min, 0);
  return {T, min, tot, pct: min ? req.reduce((a, x) => a + x.min * x.pct, 0) / min : 1,
    n: T.reduce((a, x) => a + (x.n || 0), 0), right: T.reduce((a, x) => a + (x.right || 0), 0)};
}

function composite(ti) {
  let pm = 0, pd = 0;
  for (let k = 0; k <= ti; k++) { const d = dayInfo(k); pm += d.min; pd += d.min * d.pct; }
  const HQ = [].concat(...SUBS.map(s => hiSet(s, '', 1)));
  const got = HQ.filter(q => S.rec[q.id] && S.rec[q.id].last).length;
  const mk = {};
  S.hist.forEach(x => { const p = paperOf(x.pid), s = p ? p.s : x.pid.split('-')[1]; mk[s] = mk[s] || []; if (mk[s].length < 2) mk[s].push(x.score); });
  const avg = s => mk[s] ? mk[s].reduce((a, b) => a + b, 0) / mk[s].length : null;
  const ms = SUBS.map(avg).filter(v => v != null);
  const parts = [['到今天為止的作業完成度', ti >= 0 ? pd / pm : null, 0.3, ti >= 0 ? `${PLAN[0][0]}～${PLAN[ti][0]} 的作業` : '10/1 才開始算'],
    ['高頻題熟練度', got / HQ.length, 0.4, `${HQ.length} 題高頻題中，上次答對 ${got} 題`],
    ['模擬考', ms.length ? Math.min(...ms) / 100 : null, 0.3, ms.length ? `各科最近 2 次平均：${SUBS.map(s => `${SHORT[s]} ${avg(s) == null ? '—' : Math.round(avg(s))}`).join('、')}（取較低的一科）` : '還沒考過']];
  const use = parts.filter(p => p[1] != null), w = use.reduce((a, p) => a + p[2], 0);
  return {score: Math.round(use.reduce((a, p) => a + p[1] * p[2], 0) / w * 100), parts};
}

      ${x.mock ? `<button class="primary" data-act="mstart" data-arg="${x.mock}">開始模擬考</button>` : ''}
      ${x.sim ? `<button class="primary" data-act="sstart" data-arg="${x.sim}">開始仿真模擬考</button>` : ''}
      ${x.href ? `<a class="btnlink" href="${x.href}">${x.href.startsWith('numbers') ? '🔢 打開數字速記' : '📖 打開筆記'}</a>` : ''}

      `<tr><td>${n}</td><td>${v == null ? '—' : Math.round(v * 100)}</td><td>${Math.round(w * 100)}%</td><td>${esc(d)}</td></tr>`).join('')}</table>
    <div class="mut">還沒有分數的項目不算，權重按比例分給其他項。兩科都要 70 分才過，所以模擬考取較低的一科。</div></div>`;

      <span>${Math.round(d.pct * 100)}% · ${(d.tot / 60).toFixed(1)} 小時</span></div><div class="pbar"><i style="width:${d.pct * 100}%"></i></div></button>`;
  });
  return h + '</div>';
}

/* ---------- 分析 ---------- */
const KIND = pid => /^pred/.test(pid) ? '預測卷' : /^sim-/.test(pid) ? '仿真模擬考' : /^rand-/.test(pid) ? '隨機模擬考' : '歷屆原卷';
const chOf = q => q && (q.ch || (q.ref && ITEMS[q.ref] ? ITEMS[q.ref].ch : null));
const histItems = x => x.ids ? x.ids.map(id => ITEMS[id]) : (paperOf(x.pid) || {items: []}).items;
const histSubj = x => x.s || (x.pid.match(/^(?:rand|sim)-(\w+)$/) || [])[1] || (histItems(x).find(q => q && q.s) || {}).s;
const pct = (c, t) => t ? Math.round(c / t * 100) + '%' : '—';
const phi = z => 1 / (1 + Math.exp(-1.702 * z));
const isCalc = q => q.exp.some(e => /^[①②③④]/.test(e));

function anaData(s) {
  const N = NQ(s), u = SIMU(s), L = POOL[s], comp = ((DATA.sim || {})[s] || {}).comp || {};
  const src = {}, chm = {}, tq = {calc: {s: 0, n: 0}, idea: {s: 0, n: 0}}, cal = [];
  S.hist.forEach(x => {
    if (histSubj(x) !== s) return;
    const g = src[KIND(x.pid)] = src[KIND(x.pid)] || {c: 0, t: 0, sc: []};
    g.sc.push(x.score);
    if (x.est != null && x.ev === 3 && KIND(x.pid) === '仿真模擬考') cal.push((x.adj != null ? x.adj : x.score) - x.est);
    if (!x.r) return;
    histItems(x).forEach((q, i) => {
      if (!q || i >= x.r.length) return;
      const ok = x.r[i] === '1', ch = chOf(q);
      g.t++; if (ok) g.c++;
      if (ch) { const m = chm[ch] = chm[ch] || {c: 0, t: 0, s: 0, ns: 0}; m.t++; if (ok) m.c++; if (x.tm && x.tm[i]) { m.s += x.tm[i]; m.ns++; } }
      if (x.tm && x.tm[i] && q.exp) { const z = tq[isCalc(q) ? 'calc' : 'idea']; z.s += x.tm[i]; z.n++; }
    });
  });
  let pc = 0, pt = 0, n1 = 0, k1 = 0, nRec = 0;
  L.forEach(q => {
    const r = S.rec[q.id];
    if (!r) return;
    nRec++;
    const p = r.p || (r.m ? null : [r.c, r.w]);
    if (p) { pc += p[0]; pt += p[0] + p[1]; }
    if (r.c + r.w === 1) { k1++; if (r.c) n1++; }
  });
  if (pt) src['練習'] = {c: pc, t: pt, sc: []};
  let nf = 0, cf = 0, nw = 0;
  L.forEach(q => { const r = S.rec[q.id]; if (!r) return; if (r.f != null) { nf++; cf += r.f; } if (!r.w) nw++; });
  const ft = nf >= 20 ? (cf + 6) / (nf + 10) : (nw + 6) / (nRec + 10), nwr = (nw + 6) / (nRec + 10), an = 0.25 + 0.5 * (nwr - 0.25);
  let Wall = 0, Wdone = 0;
  const chs = DATA.blocks[s].map(([ch, k], idx) => {
    const Lc = L.filter(q => q.ch === ch);
    let W = 0, Wd = 0, Wr = 0, Wq = 0, undone = 0;
    Lc.forEach(q => {
      const w = q.sw || 0.005, r = S.rec[q.id];
      W += w;
      if (r) { Wd += w; if (r.last) Wr += w; Wq += w * ((r.c + 1) / (r.c + r.w + 2) + (r.last ? 1 : 0)) / 2; } else undone++;
    });
    Wall += W; Wdone += Wd;
    const m0 = Lc.length ? 2 * W / Lc.length : 0, cov = W ? Wd / W : 0;
    const acc0 = Wd + m0 ? (Wq + ft * m0) / (Wd + m0) : ft, mm = chm[ch], wm = 0;
    const acc = mm ? (acc0 + wm * mm.c / mm.t) / (1 + wm) : acc0;
    const p = (1 - u) * (cov * acc + (1 - cov) * an) + u * an;
    return {sec: chm[ch] && chm[ch].ns ? chm[ch].s / chm[ch].ns : null, ns: chm[ch] ? chm[ch].ns : 0, ch, k, idx, n: Lc.length, done: Lc.length - undone, acc: Wd ? Wr / Wd : null, p, loss: k * (1 - p) * 100 / N, m: chm[ch], po: (1 - u) * (cov * acc + (1 - cov) * an)};
  });
  const Eo = chs.reduce((a, c) => a + c.k * c.po, 0), E = chs.reduce((a, c) => a + c.k * c.p, 0), V = chs.reduce((a, c) => a + c.k * c.p * (1 - c.p), 0), need = Math.ceil(N * 0.7);
  const cat = (name, share, f) => {
    const Lq = L.filter(f), d = Lq.filter(q => S.rec[q.id]);
    return {name, share, n: Lq.length, done: d.length, right: d.filter(q => S.rec[q.id].last).length};
  };
  const cats = [cat('⭐ 高頻（考過 2 屆以上）', comp.hi, q => !q.old && q.n >= 2), cat('只考過 1 屆', comp.one, q => !q.old && q.n < 2),
                cat('📜 舊屆題', comp.old, q => q.old)];
  const calc = L.some(isCalc) ? [cat('計算題', null, isCalc), cat('觀念題', null, q => !isCalc(q))] : [];
  const rep = L.filter(q => { const r = S.rec[q.id]; return r && r.w >= 2 && !r.last; }).length;
  return {Eo, nf, an, nwr, tq, cal, pace: subjMin(s) * 60 / N, V, N, u, E, need, pass: nRec >= 60 ? phi((E - need + 0.5) / Math.sqrt(V || 1)) : null, ft, k1, n1, nRec, chs, cats, calc, src, rep,
          cov: Wall ? Wdone / Wall : 0, comp};
}

function anaList(s, k) {
  const L = POOL[s], sw = q => q.sw || 0, by = (a, b) => sw(b) - sw(a);
  if (k === 'w') return {list: L.filter(q => { const r = S.rec[q.id]; return r && r.w >= 2 && !r.last; }).sort(by), title: `${SHORT[s]}｜常錯題`};
  if (k === 'new') return {list: L.filter(q => !S.rec[q.id]).sort(by).slice(0, 40), title: `${SHORT[s]}｜最可能考、還沒做過`};
  const ch = DATA.blocks[s][+k][0], Lc = L.filter(q => q.ch === ch);
  const wrong = Lc.filter(q => S.rec[q.id] && !S.rec[q.id].last).sort(by), fresh = Lc.filter(q => !S.rec[q.id]).sort(by);
  return {list: wrong.concat(fresh).slice(0, 40), title: `${SHORT[s]}｜${ch} 弱點`};
}

function boostPw(q, ft) {
  const r = S.rec[q.id];
  if (!r) return 1 - ft;
  let pw = (r.w + 2 * (1 - ft)) / (r.c + r.w + 2);
  if (!r.last) pw = Math.max(pw, r.w >= 2 ? 0.75 : 0.6);
  else if (!r.w && r.c === 1) pw += 0.1 * Math.min(1, (Date.now() - (r.t || 0)) / 6048e5);
  return pw;
}
function boostList(s, n = 30) {
  const ft = anaData(s).ft, now = Date.now();
  const L = POOL[s].filter(q => q.ans != null).map(q => {
    const r = S.rec[q.id], v = (q.sw || 0.005) * boostPw(q, ft) * (r && now - (r.t || 0) < 72e5 ? 0.3 : 1);
    return {q, v, key: Math.pow(Math.random(), 1 / v)};
  }).sort((a, b) => b.v - a.v).slice(0, n * 3).sort((a, b) => b.key - a.key).slice(0, n);
  return {list: L.map(x => x.q), gain: L.reduce((a, x) => a + x.v, 0) * 100 / NQ(s)};
}

/* ---------- 題目卡 ---------- */
function qCard(q, a, reveal, label) {
  const meta = label || (q.old ? `${q.id}　${q.star ? '⭐'.repeat(q.star) + '　' : ''}📜 舊題 出現 ${q.n} 屆　${esc(q.ch)}` : q.ch ? `${q.id}　${q.star ? '⭐'.repeat(q.star) + '　' : ''}出現 ${q.n} 屆　${esc(q.ch)}` : q.id);
  let h = `<div class="card"><div class="meta">${meta}</div><div class="stem">${esc(q.stem)}</div><div class="opts">`;
  const shown = reveal && a !== undefined;
  q.opts.forEach((o, k) => {
    const n = k + 1;
    let c = '';
    if (shown) { if (isOk(q, n)) c = 'ok'; else if (n === a) c = 'bad'; }
    else if (a === n) c = 'sel';
    h += `<button class="opt ${c}" data-act="pick" data-arg="${n}" ${shown ? 'disabled' : ''}><b>(${n})</b> ${esc(o)}</button>`;
  });
  h += '</div>';
  if (shown) {
    const ok = a !== 0 && isOk(q, a);
    const tag = a === 0 ? '— 未作答' : ok ? '✔ 答對' : '✘ 答錯';
    h += `<div class="exp ${ok ? 'ok' : 'bad'}" id="exp"><div class="res">${tag}　正解 ${q.ans ? [].concat(q.ans).map(k => `(${k}) ${esc(q.opts[k - 1])}`).join('　') : '送分題（任何答案都算對）'}</div>
      ${q.exp.map(e => `<p${e.startsWith('✔') ? ' class="fix"' : ''}>${esc(e)}</p>`).join('')}${q.refs ? `<p class="refs">歷屆出處：${esc(q.refs)}</p>` : ''}</div>`;
  }
  return h + '</div>';
}

/* ---------- 練習 ---------- */
function startSession(list, title, kind) {
  list = list.filter(Boolean);
  if (!list.length) { alert('這個條件下沒有題目'); return; }
  if (S.prefs.shuf) list = shuffle([...list]);
  sess = {list, i: 0, ans: {}, mk: {}, title, kind};
  saveSess();
  view = 'sess'; showQ(true);
}

function saveSess() {
  if (!sess) return;
  sess.t = Date.now();
  S.psess = {ids: sess.list.map(q => q.id), i: sess.i, ans: sess.ans, mk: sess.mk, title: sess.title, kind: sess.kind, t: sess.t};
  save();
}
function resumeSess() {
  const p = S.psess, list = p.ids.map(id => ITEMS[id]).filter(Boolean);
  if (!list.length) { S.psess = {t: Date.now()}; save(); home(); return; }
  sess = {list, i: Math.min(p.i, list.length - 1), ans: Object.assign({}, p.ans), mk: Object.assign({}, p.mk), title: p.title, kind: p.kind, t: p.t};
  view = 'sess'; showQ(true);
}
function sessCard() {
  const p = S.psess;

/* ---------- 模擬考 ---------- */
function mockClock(id) {
  const c = S.cur;
  if (!c) return;
  const now = Date.now();
  c.tm = c.tm || {};
  if (c.tOn && c.tAt) c.tm[c.tOn] = (c.tm[c.tOn] || 0) + Math.min(now - c.tAt, 300000);
  c.tOn = id || null; c.tAt = now;
}
function showMock() {
  view = 'mock';
  mockClock(paperFromCur(S.cur).items[S.cur.i].id);
  const c = S.cur, p = paperFromCur(c), q = p.items[c.i];
  const n = Object.keys(c.ans).length;
  app.innerHTML = `<header class="bar"><button data-act="home">← 暫離</button><span>⏱ <b id="timer"></b><br>${c.i + 1} / ${p.items.length}（已答 ${n}）</span>
    <button class="primary" data-act="submit">交卷</button></header><main>${qCard(q, c.ans[q.id], false, `${p.name}　第 ${c.i + 1} 題`)}${mkBar((c.mk || {})[q.id])}
    <div class="nav"><button data-act="prev" ${c.i === 0 ? 'disabled' : ''}>上一題</button><button data-act="next" ${c.i === p.items.length - 1 ? 'disabled' : ''}>下一題</button></div>
    <div class="card"><div class="mut">題目總覽（藍色＝已作答；題號下面是你的標記 😊 確定　😐 不確定　😣 不會）</div><div class="grid">${p.items.map((x, k) =>
      `<button class="${c.ans[x.id] ? 'done' : ''} ${k === c.i ? 'cur' : ''}" data-act="mgo" data-arg="${k}">${k + 1}${mkTag((c.mk || {})[x.id])}</button>`).join('')}</div></div></main>`;
  tick();
  if (!timerId) timerId = setInterval(tick, 1000);
}

function tick() {
  if (!S.cur) return stopTimer();
  const left = S.cur.end - Date.now();
  if (left <= 0) { stopTimer(); alert('時間到，自動交卷'); submitMock(); return; }
  const el = document.getElementById('timer');
  if (el) el.textContent = fmt(left);
}

function submitMock() {
  stopTimer();
  const c = S.cur, p = paperFromCur(c);
  mockClock(null);
  const pre = /^sim-/.test(c.pid) ? anaData(c.pid.slice(4)) : null;
  let right = 0, pw = 0, pt = 0;
  const seen = [0, 0];
  p.items.forEach((q, i) => {
    const w = PT(i); pt += w;
    const a = c.ans[q.id], was = c.fresh != null && !!S.rec[q.id];
    if (a != null) record(q, a, false, 'm');
    else if (q.ans != null) S.wrong[q.id] = Date.now();
    const ok = a != null ? isOk(q, a) : q.ans == null;
    if (ok) { right++; pw += w; }
    if (was) { seen[1]++; if (ok) seen[0]++; }
  });
  const score = CFG.pts ? Math.round(pw * 10000 / pt) / 100 : score100(right, p.items.length);
  const m = S.mock[p.id] || {best: 0, times: 0};
  m.best = Math.max(m.best, score); m.times++; m.t = Date.now();
  S.mock[p.id] = m;
  const used = Math.round((Math.min(Date.now(), c.end) - c.start) / 60000);
  const rs = p.items.map(q => { const a = c.ans[q.id]; return a == null ? (q.ans == null ? '1' : '-') : isOk(q, a) ? '1' : '0'; }).join('');
  S.hist.unshift(Object.assign({pid: p.id, name: p.name, score, used, ts: Date.now(), date: new Date().toLocaleString('zh-TW', {hour12: false}),
    s: (p.items.find(q => q && q.s) || {}).s, r: rs, k: p.items.map(q => (c.mk || {})[q.id] || 0).join(''), tm: p.items.map(q => Math.round(((c.tm || {})[q.id] || 0) / 1000)), est: pre && pre.pass != null ? Math.round(pre.E / pre.N * 100) : null, ev: 3}, paperOf(p.id) ? {} : {ids: c.ids}, c.fresh != null ? {fresh: c.fresh} : {}));
  result = {p, ans: {...c.ans}, mk: {...(c.mk || {})}, score, right, used, i: 0, fresh: c.fresh, adj: simAdj(p, c.fresh, right, seen)};
  if (result.adj) S.hist[0].adj = result.adj.score;
  S.cur = null; save();
  showResult();
}

function simAdj(p, fresh, right, seen) {
  if (fresh == null || !seen[1]) return null;
  const s = (p.items.find(q => q && q.s) || {}).s, N = p.items.length;
  if (!s) return null;
  const want = Math.round(N * SIMU(s)), miss = want - fresh, ft = anaData(s).ft, acc = seen[0] / seen[1];
  if (miss <= 0 || acc <= ft) return null;
  return {want, miss, ft, score: Math.round((right - miss * (acc - ft)) / N * 100)};
}
function showResult() {
  view = 'result';
  const r = result;
  app.innerHTML = `<header class="bar"><button data-act="home">← 首頁</button><span>${r.p.name}</span><span></span></header><main>
    <div class="card center"><div class="big">${r.score} 分</div>
    <p class="${r.score >= 70 ? 'pass' : 'fail'}">${r.score >= 70 ? '及格 🎉' : '未達 70 分'}　答對 ${r.right} / ${r.p.items.length}　用時 ${r.used} 分鐘</p>${r.fresh != null ? `<p class="mut">本卷有 ${r.fresh} 題是你第一次做（模擬真考沒看過的題）</p>` : ''}${r.adj ? `<p class="mut">真考約 ${r.adj.want} 題是從沒出過的新題，這份只有 ${r.fresh} 題是你第一次做；差的 ${r.adj.miss} 題改用你第一次作答的答對率（${Math.round(r.adj.ft * 100)}%）估，換成真考約 <b>${r.adj.score} 分</b></p>` : ''}</div>
    <div class="card"><div class="mut">點題號看解析（綠＝對、紅＝錯或未答；題號下面是你的標記）</div>${mkLine(r.p.items, r.ans, r.mk)}<div class="grid">${r.p.items.map((q, k) => {
      const a = r.ans[q.id]; const ok = a != null ? isOk(q, a) : q.ans == null;
      return `<button class="${ok ? 'ok' : 'bad'}" data-act="rgo" data-arg="${k}">${k + 1}${mkTag((r.mk || {})[q.id])}</button>`; }).join('')}</div>
    <button class="primary" data-act="rwrong" style="margin-top:10px">只看錯題解析</button></div></main>`;
  window.scrollTo(0, 0);
}

/* ---------- 事件 ---------- */
function curQ() {
  if (view === 'sess') return sess.list[sess.i];
  if (view === 'review') return result.list[result.i];
  if (view === 'mock') return paperFromCur(S.cur).items[S.cur.i];

function act(a, arg) {
  switch (a) {
    case 'tab': tab = arg; home(); break;
    case 'home': if (view === 'mock') { mockClock(null); save(); } home(); break;
    case 'subj': S.prefs.s = arg; save(); home(); break;
    case 'pday': setPlanDay(+arg); home(); window.scrollTo(0, 0); break;
    case 'pchk': S.plan.chk[arg] = S.plan.chk[arg] > 0 ? -Date.now() : Date.now(); save(); home(); break;
    case 'pstart': {
      const [di, ti] = arg.split('-').map(Number), t = PLAN[di][2][ti];
      const title = t.k === 'hi' || t.k === 'one' ? chName(t.s, t.c) : t.k === 'rev' ? `${SHORT[t.s]}｜⭐⭐ 以上` : '錯題本';
      startSession(taskList(t, di), `${PLAN[di][0]}｜${title}`, t.k === 'wrong' ? 'wrong' : 'hot'); break; }
    case 'start': startSession(hotList(S.prefs.s, arg).filter(q => S.prefs.mode === 'all' ? true :
        S.prefs.mode === 'new' ? !S.rec[q.id] : !S.rec[q.id] || !S.rec[q.id].last), arg || `${SHORT[S.prefs.s]}｜全部章節`, 'hot'); break;
    case 'wstart': startSession(wrongIds(arg).map(id => ITEMS[id]), arg === 'fav' ? '收藏題' : '錯題本', arg === 'fav' ? 'fav' : 'wrong'); break;
    case 'redo': startSession(sess.wrongs, '重做錯題', sess.kind); break;
    case 'fav': { const q = curQ(); if (S.fav[q.id]) { delete S.fav[q.id]; (S.favGone = S.favGone || {})[q.id] = Date.now(); } else S.fav[q.id] = Date.now(); save();
      view === 'review' ? showReview() : showQ(false); break; }
    case 'pick': {
      const n = +arg;
      if (view === 'sess') { const q = sess.list[sess.i]; if (sess.ans[q.id] != null) return;
        sess.ans[q.id] = n; record(q, n, sess.kind === 'wrong', 'p'); saveSess(); showQ(false); }
      else if (view === 'mock') { const q = curQ(); S.cur.ans[q.id] = n; save(); showMock(); }
      break; }
    case 'prev':
      if (view === 'sess' && sess.i > 0) { sess.i--; saveSess(); showQ(true); }
      else if (view === 'mock' && S.cur.i > 0) { S.cur.i--; save(); showMock(); }
      else if (view === 'review' && result.i > 0) { result.i--; showReview(); }
      break;
    case 'next':
      if (view === 'sess') { if (sess.i < sess.list.length - 1) { sess.i++; saveSess(); showQ(true); } else summary(); }
      else if (view === 'mock' && S.cur.i < paperFromCur(S.cur).items.length - 1) { S.cur.i++; save(); showMock(); }
      else if (view === 'review' && result.i < result.list.length - 1) { result.i++; showReview(); }
      break;
    case 'mstart': {
      if (S.cur && !confirm('會放棄目前未完成的模擬考，確定開始新的一份？')) return;
      const p = paperOf(arg);
      if (!confirm(`${p.name}\n限時 ${p.min} 分鐘，按確定開始計時。`)) return;
      S.cur = {pid: p.id, ids: p.items.map(q => q.id), name: p.name, min: p.min, ans: {}, i: 0, start: Date.now(), end: Date.now() + p.min * 60000}; save(); showMock(); break; }
    case 'sstart': {
      if (S.cur && !confirm('會放棄目前未完成的模擬考，確定開始新的一份？')) return;
      const min = subjMin(arg), name = `仿真模擬考 ${SHORT[arg]}`, g = genSim(arg);
      if (!confirm(`${name}\n限時 ${min} 分鐘，按確定開始計時。\n（其中 ${g.fresh} 題是你還沒做過的）`)) return;
      S.cur = {pid: `sim-${arg}`, ids: g.ids, name, min, fresh: g.fresh, ans: {}, i: 0, start: Date.now(), end: Date.now() + min * 60000};
      save(); showMock(); break; }
    case 'bstart': { const B = boostList(arg);
      startSession(B.list, `${SHORT[arg]}｜提分衝刺（這份粗估值 ${B.gain.toFixed(1)} 分）`, 'hot'); break; }
    case 'astart': { const [s, k] = arg.split('|'), L = anaList(s, k);
      if (!L.list.length) { alert('這裡沒有需要加強的題目了 👍'); return; }
      startSession(L.list, L.title, 'hot'); break; }
    case 'resume': if (S.cur.end <= Date.now()) { alert('時間已到，自動交卷'); submitMock(); } else showMock(); break;
    case 'abandon': if (confirm('確定放棄這份模擬考？作答不會計分。')) { S.cur = null; save(); home(); } break;
    case 'mgo': S.cur.i = +arg; save(); showMock(); break;
    case 'submit': {
      const left = paperFromCur(S.cur).items.length - Object.keys(S.cur.ans).length;
      if (confirm(left ? `還有 ${left} 題沒作答，確定交卷？` : '確定交卷？')) submitMock(); break; }
    case 'result': showResult(); break;
    case 'rgo': result.list = result.p.items; result.i = +arg; showReview(); break;
    case 'rwrong': {
      result.list = result.p.items.filter(q => { const a = result.ans[q.id]; return !(a != null ? isOk(q, a) : q.ans == null); });
      if (!result.list.length) { alert('全對，沒有錯題！'); return; }
      result.i = 0; showReview(); break; }
    case 'reset': if (confirm('確定清除所有作答紀錄、錯題本、收藏與模擬考成績？')) {
      S = {rec: {}, wrong: {}, fav: {}, mock: {}, hist: [], cur: null, prefs: S.prefs, plan: {chk: {}, snap: {}}, resetAt: Date.now()}; save(); home(); } break;
    case 'syncset': { const t = (document.getElementById('synctoken') || {}).value; if (!t || !t.trim()) return;
      setSyncCfg({token: t.trim()}); syncErr = ''; try { localStorage.setItem(DIRTY_KEY, '1'); } catch (e) {}
      home(); syncNow(true, 0).then(() => { if (syncErrKind === 'auth') { setSyncCfg({}); home(); } }); break; }
    case 'syncnow': syncNow(true, 0); home(); break;
    case 'synccopy': { const t = syncCfg().token;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert('已複製金鑰，到另一台打開「紀錄」分頁貼上'), () => prompt('複製這組金鑰，貼到另一台', t)); break; }
    case 'mark': { const q = curQ(), m = view === 'mock' ? (S.cur.mk = S.cur.mk || {}) : sess.mk;
      if (m[q.id] === +arg) delete m[q.id]; else m[q.id] = +arg;
      if (view === 'mock') { save(); showMock(); } else { saveSess(); showQ(false); } break; }
    case 'sgrid': showSGrid(); break;
    case 'sback': view = 'sess'; showQ(true); break;
    case 'sgo': view = 'sess'; sess.i = +arg; saveSess(); showQ(true); break;
    case 'smkredo': startSession(sess.list.filter(q => sess.mk[q.id] >= 2), '重做標不確定／不會的題', sess.kind); break;
    case 'sresume': resumeSess(); break;
    case 'sdrop': if (confirm('不做這份練習了？（已作答的紀錄會保留）')) { S.psess = {t: Date.now()}; save(); home(); } break;
    case 'syncoff': if (confirm('這台裝置停止同步？（雲端和這台的進度都會保留）')) { setSyncCfg({}); home(); } break;
  }
}

/* ---------- 手機電腦同步（GitHub Gist） ---------- */
const SYNC_KEY = 'quizsync_v1', GIST_DESC = 'asd-quiz-sync', SYNC_FILE = KEY + '.json', DIRTY_KEY = 'quizsync_dirty_' + KEY;
// GitHub 每帳號每小時只能改 gist 100 次，兩個網站共用；上傳時間與暫停時間存在共用的 localStorage
const PUT_KEY = 'quizsync_lastput', HOLD_KEY = 'quizsync_hold', PUT_GAP = 90 * 1000, FLUSH_GAP = 15 * 1000, PULL_GAP = 60 * 1000;
let syncBusy = false, syncLast = 0, syncErr = '', syncErrKind = '', syncTimer = null, editVer = 0;
let gistChecked = 0, gistExtra = [], gistOwner = '';
function syncCfg() { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } }
function setSyncCfg(c) { try { localStorage.setItem(SYNC_KEY, JSON.stringify(c)); } catch (e) {} }
const lsNum = k => { try { return +localStorage.getItem(k) || 0; } catch (e) { return 0; } };
const holdLeft = () => Math.max(0, lsNum(HOLD_KEY) - Date.now());
const putWait = gap => Math.max(holdLeft(), lsNum(PUT_KEY) + gap - Date.now());
function syncLater(ms) {
  clearTimeout(syncTimer);
  if (syncCfg().token) syncTimer = setTimeout(() => syncNow(false), Math.max(4000, ms));
}
function markDirty() {
  editVer++;
  try { localStorage.setItem(DIRTY_KEY, '1'); } catch (e) {}
  syncLater(putWait(PUT_GAP));
}
function syncFail(kind, msg) { const e = new Error(msg); e.kind = kind; return e; }
async function gh(path, opt) {
  const r = await fetch('https://api.github.com' + path, Object.assign({cache: 'no-store'}, opt,
    {headers: {Authorization: 'Bearer ' + syncCfg().token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'}}));
  if (r.ok) return r.json();
  const h = k => r.headers.get(k), wait = +h('retry-after') || 0, msg = await r.text().catch(() => '');
  if ((r.status === 403 || r.status === 429) && (h('x-ratelimit-remaining') === '0' || wait || /rate limit/i.test(msg))) {
    const until = wait ? Date.now() + wait * 1000 : h('x-ratelimit-remaining') === '0' && +h('x-ratelimit-reset') ? +h('x-ratelimit-reset') * 1000 : Date.now() + 10 * 60 * 1000;
    try { localStorage.setItem(HOLD_KEY, String(until + 5000)); } catch (e) {}
    throw syncFail('hold', 'GitHub 暫停寫入');
  }
  if (r.status === 404 && /^\/gists\/\w+$/.test(path) && syncCfg().gist) throw syncFail('gone', '雲端同步檔不見了');
  if (r.status === 401) throw syncFail('auth', '金鑰無效或已過期，請重新產生');
  if (r.status === 403 || r.status === 404) throw syncFail('auth', '金鑰沒有 gist 權限：請用下面連結產生 ghp_ 開頭、有勾 gist 的金鑰');
  throw syncFail('net', `GitHub 回應錯誤 ${r.status}`);
}
// 同帳號若有多份同步檔（兩台同時第一次設定），一律用最早建立的那份，其他份的進度併進來
async function gistId() {
  const c = syncCfg();
  if (c.gist && Date.now() - gistChecked < 10 * 60 * 1000) return c.gist;
  const list = (await gh('/gists?per_page=100')).filter(x => x.description === GIST_DESC)
    .sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
  let g = list[0];
  if (!g) g = await gh('/gists', {method: 'POST', body: JSON.stringify({description: GIST_DESC, public: false,
    files: {'README.md': {content: '手機、電腦題庫進度同步用，請勿刪除'}}})});
  gistExtra = list.slice(1).map(x => x.id);
  if (c.gist && c.gist !== g.id && !gistExtra.includes(c.gist)) gistExtra.push(c.gist);
  gistChecked = Date.now();
  setSyncCfg(Object.assign(syncCfg(), {gist: g.id}));
  return g.id;
}
async function gistFile(g) {
  const f = g.files[SYNC_FILE];
  return f ? (f.truncated ? await (await fetch(f.raw_url, {cache: 'no-store'})).text() : f.content) : null;
}
function shareState(x) {
  return {rec: x.rec, wrong: x.wrong, gone: x.gone || {}, fav: x.fav, favGone: x.favGone || {}, mock: x.mock, hist: x.hist,
          plan: x.plan || {chk: {}, snap: {}}, psess: x.psess || null, resetAt: x.resetAt || 0};
}
function mergeState(L, R) {
  const cut = Math.max(L.resetAt || 0, R.resetAt || 0), ok = t => (t || 0) >= cut, each = (m, f) => Object.entries(m || {}).forEach(f);
  const rec = {};
  [L.rec, R.rec].forEach(m => each(m, ([id, r]) => { if (ok(r.t) && (!rec[id] || (r.t || 0) > (rec[id].t || 0))) rec[id] = r; }));
  const set = (a1, g1, a2, g2) => {
    const add = {}, gone = {};
    [a1, a2].forEach(m => each(m, ([k, t]) => { if (ok(t)) add[k] = Math.max(add[k] || 0, t); }));
    [g1, g2].forEach(m => each(m, ([k, t]) => { if (ok(t)) gone[k] = Math.max(gone[k] || 0, t); }));
    Object.keys(add).forEach(k => { if ((gone[k] || 0) >= add[k]) delete add[k]; });
    return [add, gone];
  };
  [L.wrong, L.gone] = set(L.wrong, L.gone, R.wrong, R.gone);
  [L.fav, L.favGone] = set(L.fav, L.favGone, R.fav, R.favGone);
  const mock = {};
  [L.mock, R.mock].forEach(m => each(m, ([id, x]) => {
    if (!ok(x.t)) return;
    const o = mock[id] || {best: 0, times: 0, t: 0};
    mock[id] = {best: Math.max(o.best, x.best), times: Math.max(o.times, x.times), t: Math.max(o.t || 0, x.t || 0)};
  }));
  const seen = new Set(), hist = [];
  (L.hist || []).concat(R.hist || []).forEach(x => {
    const k = `${x.pid}|${x.ts || x.date}|${x.score}`;
    if (ok(x.ts) && !seen.has(k)) { seen.add(k); hist.push(x); }
  });
  hist.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const lp = L.plan || {}, rp = R.plan || {}, chk = {}, snap = {}, snapT = {};
  [lp.chk, rp.chk].forEach(m => each(m, ([k, v]) => { if (ok(Math.abs(v)) && Math.abs(v) > Math.abs(chk[k] || 0)) chk[k] = v; }));
  new Set(Object.keys(lp.snap || {}).concat(Object.keys(rp.snap || {}))).forEach(k => {
    const a = (lp.snap || {})[k], b = (rp.snap || {})[k], ta = (lp.snapT || {})[k], tb = (rp.snapT || {})[k];
    const useB = b && (!a || (tb || Infinity) < (ta || Infinity)), t = useB ? tb : ta;
    if (t && t < cut) return;
    snap[k] = useB ? b : a;
    if (t) snapT[k] = t;
  });
  const open = {};
  [lp.open, rp.open].forEach(m => each(m, ([k, t]) => { if (ok(t)) open[k] = Math.min(open[k] || Infinity, t); }));
  const psess = [L.psess, R.psess].filter(p => p && ok(p.t)).sort((a, b) => b.t - a.t)[0] || null;
  const day = [lp.day, rp.day].filter(d => d && ok(d.t)).sort((a, b) => b.t - a.t)[0];
  Object.assign(L, {rec, mock, hist: hist.slice(0, 300), plan: Object.assign({chk, snap, snapT, open}, day ? {day} : {}), psess, resetAt: cut});
}
async function syncNow(rerender, gap = PUT_GAP) {
  if (!syncCfg().token || syncBusy) return;
  syncBusy = true;
  const v = editVer, before = JSON.stringify(shareState(S)), owner0 = gistOwner;
  let next = 0;
  try {
    let id = await gistId(), g;
    try { g = await gh('/gists/' + id); } catch (e) {
      if (e.kind !== 'gone') throw e;
      setSyncCfg(Object.assign(syncCfg(), {gist: ''})); gistChecked = 0;
      id = await gistId(); g = await gh('/gists/' + id);
    }
    gistOwner = (g.owner && g.owner.login) || gistOwner;
    for (const xid of gistExtra.splice(0)) {
      try {
        const xraw = await gistFile(await gh('/gists/' + xid));
        if (xraw) { mergeState(S, JSON.parse(xraw)); localStorage.setItem(DIRTY_KEY, '1'); }
      } catch (e) { if (e.kind !== 'gone') throw e; }
    }
    const raw = await gistFile(g);
    const R = raw ? JSON.parse(raw) : null;
    if (R) mergeState(S, R);
    fixMoved();
    save(true);
    if (view === 'sess' && sess && S.psess && S.psess.ids && S.psess.t > (sess.t || 0)) resumeSess();
    const body = JSON.stringify(shareState(S));
    if (R && body === raw) { if (editVer === v) localStorage.removeItem(DIRTY_KEY); }
    else if (!R || localStorage.getItem(DIRTY_KEY)) {
      next = putWait(gap);
      if (!next) {
        try { localStorage.setItem(PUT_KEY, String(Date.now())); } catch (e) {}
        await gh('/gists/' + id, {method: 'PATCH', body: JSON.stringify({files: {[SYNC_FILE]: {content: body}}})});
        if (editVer === v) localStorage.removeItem(DIRTY_KEY);
      }
    }
    syncLast = Date.now(); syncErr = ''; syncErrKind = '';
  } catch (e) {
    if (e.kind === 'hold') { syncErr = ''; syncErrKind = ''; next = holdLeft(); }
    else { syncErr = e.message || String(e); syncErrKind = e.kind || 'net'; }
  }
  syncBusy = false;
  if (view === 'home' && (gistOwner !== owner0 || JSON.stringify(shareState(S)) !== before)) home();
  else document.querySelectorAll('.syncbadge').forEach(el => { el.outerHTML = syncBadge(); });
  if (next) syncLater(next);
  else if (editVer !== v) syncLater(putWait(PUT_GAP));
}
const hhmm = t => new Date(t).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute: '2-digit'});
const syncTime = () => hhmm(syncLast);
function syncBadge() {
  if (!syncCfg().token) return '<div class="mut syncbadge">☁️ 手機、電腦進度同步：到「紀錄」分頁設定一次即可</div>';
  const pend = localStorage.getItem(DIRTY_KEY), hold = holdLeft();
  const s = syncBusy ? '同步中…' : syncErr ? `<span class="fail">同步失敗：${esc(syncErr)}</span>`
    : hold ? `⏳ GitHub 每小時寫入次數已滿，${hhmm(Date.now() + hold)} 後自動上傳（進度已存在這台，不會消失）`
    : !syncLast ? '等待同步' : pend ? `已同步（${syncTime()}），這台的新作答 2 分鐘內自動上傳；要換裝置請先按「立即同步」` : `已同步（${syncTime()}）`;
  return `<div class="mut syncbadge">☁️ ${s}</div>`;
}
function syncCard() {
  if (!syncCfg().token) return `<div class="card"><b>☁️ 手機、電腦進度同步</b>
    <div class="mut">設定一次後，網頁開著時每分鐘下載另一台的進度、做題時約每 1.5 分鐘自動上傳。理財規劃和內控兩個網站共用同一組金鑰，進度分開存。<br>
    ① 電腦登入 GitHub 後打開 <a href="https://github.com/settings/tokens/new?scopes=gist&description=quiz-sync" target="_blank" rel="noopener">這個連結</a>（已自動勾好 gist），「Expiration」選 90 days，拉到最下面按「Generate token」。<br>
    ② 複製 ghp_ 開頭的金鑰，貼到下面，按「開始同步」。<br>
    ③ 手機打開這一頁，貼上同一組金鑰（可以用 LINE 傳給自己）。</div>
    <input id="synctoken" type="password" autocomplete="off" placeholder="貼上 ghp_ 開頭的金鑰" style="width:100%;font:inherit;padding:8px;margin:8px 0;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)">
    <button class="primary" data-act="syncset">開始同步</button>${syncErr ? `<div class="fail">${esc(syncErr)}</div>` : ''}</div>`;
  const who = gistOwner ? `<div class="mut">🔑 雲端帳號 <b>${esc(gistOwner)}</b>・同步檔 <b>${esc((syncCfg().gist || '').slice(0, 6))}</b>（手機和電腦這行要一模一樣，進度才會互通）</div>` : '';
  return `<div class="card"><b>☁️ 手機、電腦進度同步：已開啟</b>${syncBadge()}${who}
    <div class="mut">網頁開著時每分鐘下載另一台的進度；做題時約每 1.5 分鐘自動上傳，切到別的 App／分頁時也會上傳。<b>手機鎖螢幕後網頁會被暫停，換裝置前按「立即同步」最保險。</b></div>
    <button data-act="syncnow">立即同步</button><button data-act="synccopy">📋 複製金鑰（貼到另一台）</button><button data-act="syncoff">這台停止同步</button></div>`;
}
setInterval(() => { if (document.visibilityState === 'visible') syncNow(true); }, PULL_GAP);

const PAGE_VER = '1792103995';
function checkUpdate() {
  if (document.getElementById('newver')) return;
  fetch('index.html?x=' + Date.now(), {cache: 'no-store'}).then(r => r.text()).then(t => {
    const m = t.match(/const PAGE_VER = '([^']+)'/);
    if (!m || m[1] === PAGE_VER) return;
    const b = document.createElement('button');
    b.id = 'newver'; b.className = 'primary';
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:14px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.35)';
    b.textContent = '📢 網站有更新，點這裡重新整理（進度不會消失）';
    b.onclick = () => location.reload();
    document.body.appendChild(b);
  }).catch(() => {});
}

fixMoved();
home();
if (syncCfg().token) syncNow(true);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { syncNow(true); checkUpdate(); }
  else if (localStorage.getItem(DIRTY_KEY)) syncNow(false, FLUSH_GAP);
});
setInterval(checkUpdate, 30 * 60 * 1000);
</script>
