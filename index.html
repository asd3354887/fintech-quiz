技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"17-19","stem":"根據中央銀行(2019)之報告，平台以自有資金直接撥貸，而後透過轉讓債權予投資人或機構投資人的方式，獲取所需資金。此為何種P2P 借貸平台營運模式？","opts":["傳統模式","公證模式","保證收益模式","資產負債表模式"],"ans":4,"exp":["📝 解析：依央行(2019)報告的P2P營運模式分類，「資產負債表模式」是平台以自有資金先直接撥貸給借款人（債權列在平台資產負債表上），再將債權轉讓給投資人或機構投資人取得資金，故選(4)。傳統模式是平台只撮合、不承擔風險；公證模式是由合作銀行撥貸後再轉讓債權；保證收益模式是平台保證投資人本金或收益。"],"pos":0.3167,"w":1,"sw":0.01201,"id":"17科技力-19"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"17-20","stem":"下列哪一個敘述非屬群眾募資的風險？","opts":["較高的投資損失","較少的法律保障","股權型群眾募資具有較高的資訊不對稱性","較低的稀釋風險"],"ans":4,"exp":["📝 解析：群眾募資投資對象多為新創，失敗率高（投資損失大）、法律保障較少，股權型更因新創資訊揭露不足而資訊不對稱嚴重，(1)(2)(3)都是風險。(4)錯誤：新創後續常再增資，早期股權型投資人反而面臨「較高」的股權稀釋風險，「較低的稀釋風險」不是風險，選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3333,"w":1,"sw":0.01201,"id":"17科技力-20"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"17-21","stem":"群眾募資主要適合協助處於何種生命週期階段的企業籌資？","opts":["種子期","成長期","成熟期","衰退期"],"ans":1,"exp":["📝 解析：群眾募資金額通常較小，適合產品剛成形、尚無營收與擔保品、難以向銀行或創投取得資金的種子期（初創期）企業，同時還能測試市場反應與累積早期客群，故選(1)。成長期、成熟期企業多可透過創投、銀行融資或資本市場籌資；衰退期則不具募資吸引力。"],"pos":0.35,"w":1,"sw":0.01201,"id":"17科技力-21"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"17-22","stem":"理財機器人之服務流程中，不包括下列何者？","opts":["瞭解客戶","提供投資組合建議","建立投資組合","租稅規劃處理"],"ans":4,"exp":["📝 解析：理財機器人（Robo-advisor）的服務流程一般為：瞭解客戶（線上問卷評估風險屬性與目標）→提供投資組合建議（演算法產出資產配置）→建立投資組合（下單執行）→定期檢視與再平衡。租稅規劃屬綜合理財規劃中的專業諮詢，並非理財機器人的標準流程，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3667,"w":1,"sw":0.01201,"id":"17科技力-22"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"17-50","stem":"根據中央銀行(2019)之報告，平台業者提供應收帳款承購服務，屬於P2P 借貸的何種模式？","opts":["發票交易／應收帳款承購","公證","保證收益","資產負債表"],"ans":1,"exp":["📝 解析：依央行(2019)報告，平台業者提供應收帳款承購服務，讓企業把發票或應收帳款賣給平台上的投資人以提前取得資金，屬「發票交易／應收帳款承購」模式，選(1)。公證模式是銀行撥貸再轉讓債權；保證收益模式是平台保證投資人收益；資產負債表模式是平台以自有資金撥貸再轉讓債權。"],"pos":0.8333,"w":1,"sw":0.01201,"id":"17科技力-50"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"16-22","stem":"根據中央銀行(2018)之報告，銀行參與合作撥貸，而後將債權轉讓其他投資人，屬於P2P 借貸的何種模式？","opts":["傳統","公證","保證收益","資產負債表"],"ans":2,"exp":["📝 解析：依央行(2018)報告，「公證模式」是由平台合作的銀行參與撥貸給借款人，之後再將債權轉讓給平台上的投資人（例如美國LendingClub透過WebBank撥款），故選(2)。若改由平台以自有資金撥貸再轉讓，則是資產負債表模式；平台只撮合為傳統模式；平台保證收益為保證收益模式。"],"pos":0.3667,"w":1,"sw":0.01201,"id":"16科技力-22"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"16-23","stem":"P2P 借貸可以滿足何種資金提供者或借款人？","opts":["風險偏好低的資金提供者","有抵押品且低度風險的借款者","希望有存款保障的資金提供者","高度風險的借款者"],"ans":4,"exp":["📝 解析：P2P借貸主要服務被傳統銀行排除的族群：無擔保品、信用紀錄不足或風險較高的借款人，以及願意承擔較高風險以換取較高報酬的資金提供者，故選(4)高度風險的借款者。(1)(3)風險偏好低或需要存款保障的人應選銀行存款（P2P無存款保險）；(2)有擔保品、低風險的借款者向銀行借款成本更低。"],"pos":0.3833,"w":1,"sw":0.01201,"id":"16科技力-23"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"16-24","stem":"美國對P2P 借貸平台之監理，下列敘述何者錯誤？","opts":["平台業者須向SEC 及各州證券監管機構註冊","確保公平借貸及加強資訊揭露","保護金融消費者權益","對P2P 借貸訂定新專法"],"ans":4,"exp":["📝 解析：美國未為P2P借貸訂定新的專法，而是沿用既有法規：自2008年起SEC認定平台發行的收益權憑證屬證券，平台須向SEC及各州證券監管機關註冊並揭露資訊，另依公平借貸、消費者保護等既有法令監理，故(4)錯誤；(1)(2)(3)均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4,"w":1,"sw":0.01201,"id":"16科技力-24"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"16-27","stem":"依據世界經濟論壇(WEF)對金融科技應用於投資管理的分析，下列何者非屬常見的投資管理業務？","opts":["群眾募資(Crowdfunding)","自動化投資理財顧問(Automated Management and Advice)","社群投資(Social Trading)","演算法交易(Algorithmic Trading)"],"ans":1,"exp":["📝 解析：WEF(2015)「金融服務的未來」報告中，投資管理功能的創新包括「投資賦權」（自動化投資理財顧問、社群投資、零售演算法交易）與「流程外部化」。群眾募資屬於「籌資」功能的創新項目，不屬投資管理業務，選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.45,"w":1,"sw":0.01201,"id":"16科技力-27"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"16-28","stem":"根據WEF(2015)，有關「金融科技投資管理」之敘述，下列何者錯誤？","opts":["標榜客製化量身定作之產品","提供標準化程度高、交易成本低的金融商品為主","強調投資賦權，個人投資者可直接參與投資","提供隨時隨地，24 小時不間斷的服務"],"ans":1,"exp":["📝 解析：WEF(2015)指出金融科技投資管理的特色是：以標準化程度高、交易成本低的商品（如ETF）為主，強調投資賦權讓個人投資者直接參與，並提供隨時隨地24小時服務，(2)(3)(4)正確。標榜「客製化量身訂作」是傳統私人銀行／理財顧問的高成本服務模式，與其低成本標準化定位相反，故(1)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4667,"w":1,"sw":0.01201,"id":"16科技力-28"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"16-29","stem":"參與者可以查看任何社群平台內交易員的歷史交易與即時交易的過程，並可採取手動控制跟單交易，這是屬於金融科技投資管理中的何項業務？","opts":["自動化投資理財顧問","演算法交易","B2B 投資顧問平台","社群投資"],"ans":4,"exp":["📝 解析：社群投資（Social Trading，如eToro、ZuluTrade）讓參與者在平台上查看其他交易員的歷史績效與即時交易，並可手動或自動跟單複製其交易，選(4)。自動化投資理財顧問是演算法配置資產；演算法交易是程式自動下單；B2B投顧平台是提供機構業者使用的工具。"],"pos":0.4833,"w":1,"sw":0.01201,"id":"16科技力-29"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"16-41","stem":"2015 年6 月的世界經濟論壇所提出的「金融服務的未來報告」中，根據6 項金融服務功能，提出11 種金融科技創新項目，其中「通路偏好移轉」是屬於何種金融服務功能的創新項目？","opts":["支付","存貸","籌資","投資管理"],"ans":2,"exp":["📝 解析：WEF(2015)依6項金融服務功能提出11種創新：支付（無現金化、新興支付）、保險（價值鏈分解、連結式保險）、存貸（替代性借貸、通路偏好移轉）、籌資（群眾募資）、投資管理（投資賦權、流程外部化）、市場資訊供應（機器革命、新興平台）。「通路偏好移轉」屬存貸功能，選(2)。"],"pos":0.6833,"w":1,"sw":0.01201,"id":"16科技力-41"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"16-51","stem":"依據WEF(2015)報告，P2P 借貸能增加核貸量的主要原因為何？","opts":["消費型態的改變","政府的介入","資金的氾濫","借貸成交機會與額度增加"],"ans":4,"exp":["📝 解析：WEF(2015)指出P2P借貸透過網路平台直接媒合大量借貸雙方，並以大數據降低徵信成本，使原本無法向銀行借款者也能找到資金，借貸成交機會與額度因而增加，帶動核貸量成長，選(4)。消費型態改變、政府介入、資金氾濫都不是報告所提的主因。"],"pos":0.85,"w":1,"sw":0.01201,"id":"16科技力-51"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"16-52","stem":"新創企業主要資金來源大多來自何種管道的提供？","opts":["內部人與天使投資人","銀行借貸","群眾募資","地下錢莊"],"ans":1,"exp":["📝 解析：新創企業初期缺乏營收、擔保品與信用紀錄，很難取得銀行貸款，主要資金來自創辦人等內部人自有資金及親友，以及天使投資人，選(1)。銀行借貸需擔保與還款能力；群眾募資雖可補充但非主要來源；地下錢莊屬非法高利貸。"],"pos":0.8667,"w":1,"sw":0.01201,"id":"16科技力-52"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"16-53","stem":"有關AUM(Assets Under Management)的投資顧問收費方式之敘述，下列何者錯誤？","opts":["多以ETF 為投資標的","吸引客戶越多，資產規模越大，投資顧問收入越高","採AUM 收費的投資顧問機構，營業收入相較按銷售額收費不穩定","目的在降低現行以銷售額計算收費之缺陷"],"ans":3,"exp":["📝 解析：AUM收費是依客戶委託管理的資產規模按年費率收取，多以低成本ETF為投資標的，客戶越多、規模越大收入越高，目的在改善以銷售額（交易佣金）計費誘發頻繁交易的缺陷，(1)(2)(4)正確。(3)錯誤：AUM收費只要資產留存就持續收費，收入比依銷售額收費「更穩定」。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8833,"w":1,"sw":0.01201,"id":"16科技力-53"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"15-5","stem":"根據WEF(2015)傳統店頭市場與新市場平台的比較，下列敘述何者正確？","opts":["傳統店頭市場買賣交易資訊完全透明，對於買賣雙方相當有保障","新市場平台透過自動化的工具統一蒐集與分析市場資訊，可以更準確地反映市場價格","新市場平台的交易是高度依賴人際關係所媒合的交易","傳統店頭市場因經紀商的規模及效率，非常能掌握市場最佳的報價資訊"],"ans":2,"exp":["📝 解析：WEF(2015)比較指出，新市場平台以自動化工具統一蒐集與分析市場資訊，價格發現更有效率、更能準確反映市場價格，故(2)正確。(1)傳統店頭市場資訊不透明；(3)高度依賴人際關係媒合的是傳統店頭市場而非新平台；(4)傳統店頭市場受經紀商規模與效率限制，不易掌握最佳報價。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.0833,"w":1,"sw":0.01201,"id":"15科技力-05"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"15-22","stem":"下列何者是金融服務業核心功能存款及放款業務在金融科技的主要創新變革？","opts":["區塊鏈","行動支付","P2P 借貸","網路銀行"],"ans":3,"exp":["📝 解析：金融服務業核心的存款與放款業務，在金融科技下的主要創新是P2P借貸：資金提供者與借款人透過網路平台直接媒合，繞過銀行吸收存款再放款的中介角色，選(3)。行動支付屬支付功能；區塊鏈是底層技術；網路銀行只是傳統銀行的通路延伸。"],"pos":0.3667,"w":1,"sw":0.01201,"id":"15科技力-22"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"15-23","stem":"依據WEF(2015)的報告，下列何者非P2P 借貸平台之優點？","opts":["借貸雙方貸款流程與事前風險是透明的","協助無法取得金融機構的借款人取得資金","滿足不同放款人的多樣風險偏好","貸方的資金受到中介機構及存款保險保障"],"ans":4,"exp":["📝 解析：WEF(2015)所列P2P借貸優點包括：貸款流程與事前風險透明、協助無法向金融機構借款者取得資金、滿足不同放款人多樣的風險偏好，(1)(2)(3)正確。(4)錯誤：P2P放款人直接承擔借款人違約風險，資金不受中介機構保證，也沒有存款保險保障，這正是P2P的主要缺點之一。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3833,"w":1,"sw":0.01201,"id":"15科技力-23"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"15-24","stem":"若P2P 借貸平台無相關交易確認與可疑交易分析，容易發生竊盜、洗錢、資助恐怖分子、侵害消費者隱私的風險，屬於何種借貸風險？","opts":["投資人保護風險","詐欺風險","流動性風險","網路攻擊風險"],"ans":2,"exp":["📝 解析：P2P平台若缺乏交易確認與可疑交易分析機制，容易被利用於冒名借貸、竊盜、洗錢、資助恐怖分子並侵害消費者隱私，教材將此歸為「詐欺風險」，選(2)。投資人保護風險著重資訊揭露與求償；流動性風險是債權難以變現；網路攻擊風險是系統遭駭。"],"pos":0.4,"w":1,"sw":0.01201,"id":"15科技力-24"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"15-26","stem":"下列何項敘述非屬WEF(2015)歸納出的群眾募資的特色？","opts":["群體基礎-管道增加且準確度提升","客製化-多樣化及參與感","時尚化-擺脫銀行放款條件的規定與作業時間","顧客權益增加-成本降低"],"ans":3,"exp":["📝 解析：WEF(2015)歸納群眾募資的特色包括：群體基礎（籌資管道增加、以群眾智慧判斷提升準確度）、客製化（多樣化募資方式與參與感）、顧客權益增加（成本降低）等。「擺脫銀行放款條件與作業時間」是群眾募資的效果，但「時尚化」並非報告所列特色名稱，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4333,"w":1,"sw":0.01201,"id":"15科技力-26"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"15-29","stem":"所謂再平衡交易功能係指下列何者？","opts":["透過大數據分析與演算法，產出平衡性之投資策略","客戶選定投資策略後，協助建構平衡型投資組合","檢視評估投資組合之績效，建議客戶動態調整","動態選擇投資報酬最高之標的，並採取完全避險操作"],"ans":3,"exp":["📝 解析：再平衡（Rebalancing）交易是指投資組合建立後，系統定期檢視評估績效與資產配置，當市場波動使各資產比例偏離原設定目標時，建議或自動調整回原配置，選(3)。(1)(2)是投資策略產出與組合建構階段；(4)追逐最高報酬並完全避險並非再平衡的定義。"],"pos":0.4833,"w":1,"sw":0.01201,"id":"15科技力-29"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"15-40","stem":"根據《2021 台灣金融科技趨勢展望》報告，下列何項非屬該報告所提出的全球資產管理發展趨勢？","opts":["不同年齡層投資人出現相同投資偏好","透過理財機器人與演算法提升投資效能","透過科技降低交易成本提升營運效率","AI 風險控管有助於資產管理公司聚焦核心事業第二部分：第41~60 題(每題2 分)"],"ans":1,"exp":["📝 解析：《2021台灣金融科技趨勢展望》指出全球資產管理趨勢包括：理財機器人與演算法提升投資效能、以科技降低交易成本提升營運效率、AI風控協助資產管理公司聚焦核心事業等。報告認為不同年齡層（如千禧世代與嬰兒潮世代）投資偏好差異明顯，業者需分眾服務，因此「出現相同投資偏好」不正確，選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6667,"w":1,"sw":0.01201,"id":"15科技力-40"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"15-52","stem":"有關AngelList 股權眾籌平台的「基金模式」之敘述，下列何者錯誤？","opts":["類似於投資一個指數型基金","主要用於投資大量的早期科技公司","投資這些基金的投資人可以單獨退出其中的某筆投資","主要會投資有經驗的天使投資人或是有VC 談判與領導投資的項目"],"ans":3,"exp":["📝 解析：AngelList的基金模式類似投資一檔指數型基金，由投資人一次投入一籃子大量早期科技公司，主要跟投有經驗的天使投資人或由創投談判領投的項目，(1)(2)(4)正確。(3)錯誤：投資人買的是整個基金，無法單獨退出其中某一筆投資，只能隨基金整體運作。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8667,"w":1,"sw":0.01201,"id":"15科技力-52"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"15-53","stem":"依據客戶需求提供理財規劃與投資組合建議，後續導引客戶至推薦的商品交易平台做交易，這是屬於機器人理財的何項服務功能？","opts":["資產管理型","諮詢建議型","一站式服務型","整合服務型"],"ans":2,"exp":["📝 解析：機器人理財依服務深度可分：諮詢建議型＝依客戶需求提供理財規劃與投資組合建議，再導引客戶到推薦的商品交易平台自行下單；資產管理型（全委型）＝直接代客戶執行交易與再平衡。題目描述只提供建議、交易在他處完成，屬(2)諮詢建議型。"],"pos":0.8833,"w":1,"sw":0.01201,"id":"15科技力-53"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"14-22","stem":"根據WEF(2015)之報告，下列何者是P2P 借貸的缺點？","opts":["小額的存款戶容易受到個別違約風險衝擊","貸款人沒有機會選擇風險與報酬","主要集中於低風險貸款，排除中高風險的借款人","潛在投資收益較低"],"ans":1,"exp":["📝 解析：WEF(2015)指出P2P借貸的缺點是：放款人（小額資金提供者）直接承擔借款人違約，資金又缺乏分散與保障，容易受個別違約衝擊，選(1)。(2)P2P反而讓放款人可自行選擇風險與報酬；(3)P2P主要服務中高風險借款人；(4)P2P潛在收益通常高於存款。"],"pos":0.3667,"w":1,"sw":0.01201,"id":"14科技力-22"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"14-27","stem":"有關機器人理財服務的流程內容，下列敘述何者正確？ A.可經由線上問卷的方式了解客戶的理財規劃與投資需求 B.透過大數據分析與演算法，產出適合客戶的投資策略與資產分配比例建議 C.當投資組合配置完成後，會定期協助客戶檢視投資績效 D.通常會有再平衡(Rebalancing)交易的功能","opts":["ABCD","僅ABD","僅ABC","僅BCD"],"ans":1,"exp":["📝 解析：機器人理財服務流程：A以線上問卷瞭解客戶需求與風險屬性；B以大數據與演算法產出投資策略與資產配置建議；C配置完成後定期協助檢視績效；D通常具備再平衡交易功能。四項敘述都正確，選(1)ABCD。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.45,"w":1,"sw":0.01201,"id":"14科技力-27"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"14-28","stem":"下列何者非屬「機器人理財」的特性？","opts":["強調理性的投資策略","強調大數據資料分析","不分析投資人的風險屬性和需求","強調人工智慧演算法"],"ans":3,"exp":["📝 解析：機器人理財的特性是強調理性（排除情緒）的投資策略、大數據分析與AI演算法，並且一定會透過線上問卷分析投資人的風險屬性與需求，再產出合適的資產配置；我國投信投顧公會「證券投資顧問事業以自動化工具提供證券投資顧問服務（Robo-Advisor）作業要點」也要求須瞭解客戶。(3)「不分析投資人風險屬性和需求」錯誤，選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4667,"w":1,"sw":0.01201,"id":"14科技力-28"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"14-29","stem":"有關社群投資交易平台的敘述，下列何者錯誤？","opts":["個別的投資者可以分享交易資訊、策略、相互觀摩","最大特色在於跟單交易","最早在中國大陸興起","也提供跨市場、跨產品業種的數據資料查詢"],"ans":3,"exp":["📝 解析：社群投資交易平台讓投資者分享交易資訊與策略、相互觀摩，最大特色是跟單交易，並提供跨市場、跨商品的數據查詢，(1)(2)(4)正確。(3)錯誤：社群交易興起於歐美與以色列，例如ZuluTrade 2007年創立（美國起家、總部在希臘）、eToro 2007年於以色列創立並於2010年推出社群跟單平台OpenBook，並非源自中國大陸。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.01201,"id":"14科技力-29"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"14-51","stem":"根據中央銀行(2018)之報告，有關英國P2P 借貸平台監管的敘述，下列何者錯誤？","opts":["設立需申請核准","最低資本要求為十萬英鎊","資金需存放第三方專戶","資訊必須充分揭露"],"ans":2,"exp":["📝 解析：英國金融行為監理總署（FCA）對 P2P 借貸平台的最低資本要求是 5 萬英鎊（PS14/4：2017 年 4 月起固定最低額 £50,000，過渡期 £20,000，並與依放款餘額比例計算者取高），不是 10 萬英鎊，故(2)錯。其餘：須經 FCA 核准、客戶資金須存放於分離的第三方專戶、須充分揭露資訊，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.85,"w":1,"sw":0.01201,"id":"14科技力-51"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"13-22","stem":"根據中央銀行(2019)之報告，僅協助資訊中介的P2P 借貸平台營運模式，係指下列何者？","opts":["傳統模式","公證模式","保證收益模式","發票交易／應收帳款承購"],"ans":1,"exp":["📝 解析：依央行報告（引 CGFS／FSB 2017 分類），P2P 借貸分為傳統、公證、保證收益、資產負債表、發票交易／應收帳款承購五類。「傳統模式」以處理資訊為主：平台只做資訊中介、媒合借貸雙方，不涉入撥貸、不承擔信用風險，故選(1)。公證模式是平台與銀行合作，由銀行撥貸後再把債權轉讓給投資人（如美國 Lending Club 與 WebBank）；保證收益模式由平台向出借人承諾本金或收益；發票交易／應收帳款承購以商業交易融通為主，三者都超出單純資訊中介。"],"pos":0.3667,"w":1,"sw":0.01201,"id":"13科技力-22"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"13-23","stem":"根據中央銀行(2018)之報告，有關P2P 借貸平台的敘述，下列何者正確？","opts":["透過存款戶取得資金，並提供利息回報","主要的利潤來源是存款者與借貸者的利差","通常不直接承擔風險，只進行資訊中介","貸方的資金受到中介機構及存款保險保障"],"ans":3,"exp":["📝 解析：P2P 借貸平台通常不直接承擔信用風險，只扮演資訊中介，媒合資金供需並收取服務費，故(3)正確。(1)(2)描述的是銀行：吸收存款並賺取存放款利差；(4)錯在 P2P 出借人的資金沒有存款保險保障，違約損失由出借人自行承擔。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.3833,"w":1,"sw":0.01201,"id":"13科技力-23"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"13-27","stem":"根據世界經濟論壇(WEF)對金融科技應用於投資管理創新的見解，其主要強調哪兩個維度？","opts":["報酬(Return)與風險(Risk)","報酬(Return)與投資者賦權(Empowered Investors)","投資者賦權(Empowered Investors)與流程外部化(Process Externalization)","報酬(Return)與流程外部化(Process Externalization)"],"ans":3,"exp":["📝 解析：世界經濟論壇（WEF）2015 年報告指出，金融科技對投資管理的創新集中在兩大維度：投資者賦權（Empowered Investors，透過理財機器人、社群交易等讓投資人自主決策）與流程外部化（Process Externalization，把投資管理流程交給外部專業科技供應商）。報酬與風險是傳統投資評估指標，不是 WEF 所指的創新維度。"],"pos":0.45,"w":1,"sw":0.01201,"id":"13科技力-27"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"13-28","stem":"有關理財機器人業務之敘述，下列何者錯誤？","opts":["可建議客戶動態調整投資組合","協助客戶定期檢視投資績效","提供客戶投資組合建議，讓客戶自主進行投資決策","由系統計算客戶風險屬性，提供標準化的理財計畫"],"ans":4,"exp":["📝 解析：理財機器人是依客戶輸入的財務狀況、目標與風險屬性，以演算法提供「個人化」的投資組合建議，說提供「標準化」理財計畫錯誤。其餘正確：可建議並動態調整（再平衡）投資組合、協助定期檢視績效、提供建議由客戶自主決策（諮詢建議型）。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4667,"w":1,"sw":0.01201,"id":"13科技力-28"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"13-29","stem":"當我們在敘述金融科技投資管理的特性時，下列何者最正確？","opts":["注重整合性、一站式服務","強調人跟人直接接觸的服務價值","實體通路結合網路服務","適合對價格敏感的族群"],"ans":4,"exp":["📝 解析：金融科技投資管理（如理財機器人）以自動化降低人力成本，費率與投資門檻低，最適合對價格（手續費）敏感的族群。整合性一站式服務、強調人與人接觸、實體通路結合網路，屬於傳統財富管理或混合模式的特色，不是金融科技投資管理的主要特性。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.4833,"w":1,"sw":0.01201,"id":"13科技力-29"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"13-52","stem":"最早提出「領投+跟投」的聯合投資模式(Syndicate)，而國內外有許多股權群眾募資(Crowdinvesting)平台先後陸續仿效的，是哪一家群眾募資平台？","opts":["ArtistShare","IndieGoGo","Kickstarter","AngelList"],"ans":4,"exp":["📝 解析：美國股權群眾募資平台 AngelList 於 2013 年首創「領投＋跟投」的聯合投資模式（Syndicates）：由有經驗的天使投資人領投並負責盡職調查，其他投資人跟投，之後各國平台紛紛仿效。ArtistShare、Kickstarter、IndieGoGo 都是回饋型（獎勵型）群眾募資平台。"],"pos":0.8667,"w":1,"sw":0.01201,"id":"13科技力-52"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"12-22","stem":"有關P2P 借貸管理不當會造成各類風險，不包括下列何者？","opts":["平台會有倒閉風險","不會有流動性風險產生","會有資訊不對稱風險產生","會有詐欺風險產生"],"ans":2,"exp":["📝 解析：P2P 借貸管理不當會產生平台倒閉風險、資訊不對稱風險、詐欺風險，也會有流動性風險：出借人的債權不易提前變現，平台若有期限錯配或擠兌也會出現資金缺口。說「不會有流動性風險」錯誤，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3667,"w":1,"sw":0.01201,"id":"12科技力-22"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"12-25","stem":"金融科技投資管理強調流程外部化(Process Externalization)，下列敘述何者正確？","opts":["服務具排他性，同一時間只能為少數客戶服務","金融機構本身需要投入較多的基礎設施","實體通路結合網路服務","由外部的專業供應商來提供投資管理者的專業技術，並提供財富管理業務流程的整體性功能"],"ans":4,"exp":["📝 解析：流程外部化是指金融機構把投資管理所需的專業技術與流程，交給外部專業科技供應商提供（例如 B2B 理財機器人、雲端投資平台），由其提供財富管理流程的整體功能，故(4)正確。外部化後服務可同時大量提供、不具排他性，金融機構也不必自行投入大量基礎設施；「實體通路結合網路」與外部化無關。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.4167,"w":1,"sw":0.01201,"id":"12科技力-25"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"12-27","stem":"機器人理財平台由投資人自行操作，投資人提供之資訊，一般不包括下列何者？","opts":["個人綜合所得稅","風險承受度","年齡","投資目標"],"ans":1,"exp":["📝 解析：機器人理財平台的 KYC 問卷通常詢問年齡、投資目標、投資期間、風險承受度、收入與資產等資訊，用來計算風險屬性並配置投資組合。個人綜合所得稅（報稅資料）一般不需提供，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.45,"w":1,"sw":0.01201,"id":"12科技力-27"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"12-52","stem":"針對「捐贈型與回饋型」之群眾募資，下列敘述何者錯誤？","opts":["相較於其他群眾募資型態門檻較低且取得資金較快速","出資者在募資完成後會參與發起人企業之營運","某些國家對於此兩類型的群眾募資規範較為寬鬆","群眾募資最早起源於美國，早期多以此兩類型的群眾募資為主"],"ans":2,"exp":["📝 解析：捐贈型出資者不求回報、回饋型出資者換取產品或服務，兩者都不取得股權，因此不會參與發起人企業的營運，故(2)錯；參與營運或享有股東權利的是股權型群眾募資。其餘正確：門檻低、取得資金快，許多國家規範寬鬆，群眾募資起源於美國且早期以這兩類為主。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8667,"w":1,"sw":0.01201,"id":"12科技力-52"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"12-53","stem":"國際上發展機器人理財常見連結投資商品是ETF，其主要原因是ETF 具有何優點？","opts":["交易量大","交易成本低","流動性佳","投資報酬率相對較高"],"ans":2,"exp":["📝 解析：理財機器人多以 ETF 為投資標的，主因是 ETF 管理費與交易成本低（被動追蹤指數），符合理財機器人低費率、長期資產配置的定位，故選(2)。流動性與交易量因個別 ETF 而異，ETF 也不保證報酬率較高。"],"pos":0.8833,"w":1,"sw":0.01201,"id":"12科技力-53"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"11-23","stem":"下列何者非屬P2P 借貸的敘述？","opts":["改變現行徵信與核貸","通常不直接承擔風險，進行資訊中介","資金供給者可以自行挑選符合其風險偏好的放貸對象","借款人違約風險相對較低"],"ans":4,"exp":["📝 解析：P2P 借貸的借款人多為銀行不易服務的族群，且缺乏擔保與完整徵信，平台又不承擔風險，借款人違約風險相對「較高」，故(4)非屬正確敘述。其餘正確：改變傳統徵信與核貸方式、平台通常只做資訊中介、出借人可自選符合風險偏好的借款對象。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3833,"w":1,"sw":0.01201,"id":"11科技力-23"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"11-25","stem":"全球首家P2P 借貸平台為何？","opts":["英國-Zopa","美國-Prosper","美國-Lending Club","中國-陸金所"],"ans":1,"exp":["📝 解析：全球第一家 P2P 借貸平台是英國的 Zopa，於 2005 年成立。美國 Prosper（2006 年）、Lending Club（2007 年）及中國陸金所（2011 年）都較晚成立。"],"pos":0.4167,"w":1,"sw":0.01201,"id":"11科技力-25"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"11-26","stem":"下列何種群眾募資類似於「團購+預購」的模式？","opts":["捐贈型","回饋型","股權型","債權型"],"ans":2,"exp":["📝 解析：回饋型（獎勵型）群眾募資是出資者先付款支持專案，待產品完成後取得產品或服務作為回饋，性質類似「團購＋預購」，代表平台如 Kickstarter、嘖嘖。捐贈型無回報；股權型取得公司股份；債權型取得本息債權。"],"pos":0.4333,"w":1,"sw":0.01201,"id":"11科技力-26"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"11-27","stem":"在群眾募資各類型中，在線統計數據門戶Statista 資料庫所定義的替代性募資包括下列何者？","opts":["捐贈型與回饋型","股權型與回饋型","捐贈型與股權型","股權型與債權型"],"ans":2,"exp":["📝 解析：依教材所引 Statista 資料庫分類，替代性募資（Alternative Financing）中的群眾募資類型包括回饋型（Crowdfunding，以產品回饋）與股權型（Crowdinvesting），故選(2)。捐贈型不具金融報酬性質，未列入；債權型則另列入借貸（Crowdlending／Marketplace Lending）類別。"],"pos":0.45,"w":1,"sw":0.01201,"id":"11科技力-27"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"11-28","stem":"有關「自動化投資顧問(Robo-Advisor)」的特色，下列何者錯誤？","opts":["個人化","低門檻，實現普惠金融","理財服務的內容及運作方式不公開","高效率與即時性"],"ans":3,"exp":["📝 解析：理財機器人的特色是個人化配置、低門檻實現普惠金融、高效率與即時性，並強調演算法邏輯、費用與投資組合「公開透明」。說服務內容及運作方式不公開錯誤，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4667,"w":1,"sw":0.01201,"id":"11科技力-28"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"11-29","stem":"機器人理財，以服務功能可區分為諮詢建議型及資產管理型，下列敘述何者錯誤？","opts":["諮詢建議型主要係依客戶需求提供理財規劃與投資組合建議","諮詢建議型後續會引導客戶至推薦的商品交易平台做交易","資產管理型即全權委託投資操作","資產管理型會幫客戶安排資產配置，將獲利再投資，同時採取風險管理措施，即為避險交易(hedge trading)"],"ans":4,"exp":["📝 解析：資產管理型（全權委託）機器人會為客戶安排資產配置、自動再平衡（rebalancing）、將配息獲利再投資並控管風險，但這些稱為再平衡與再投資，不是「避險交易（hedge trading）」，避險交易是用衍生性商品對沖價格風險的操作，故(4)錯。其餘正確：諮詢建議型提供規劃與組合建議，並引導至推薦的交易平台下單；資產管理型即全權委託投資。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.01201,"id":"11科技力-29"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"11-30","stem":"由機器和顧問共同提供的資產配置組合，係屬於機器人理財運作模式中的何項？","opts":["機器人理財","純諮詢建議","B2B 投資顧問平台","人機結合理財"],"ans":4,"exp":["📝 解析：由演算法與真人理財顧問共同提供資產配置建議的模式，稱為「人機結合理財」（Hybrid Robo-Advisor，例如 Vanguard Personal Advisor Services）。純機器人理財無真人介入；純諮詢建議只給建議不代操；B2B 投資顧問平台是提供技術給金融機構使用。"],"pos":0.5,"w":1,"sw":0.01201,"id":"11科技力-30"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"10-23","stem":"下列何種借款人較不易從傳統存貸中介機構取得融資？","opts":["上市公司","公務機關","弱勢族群","公教人員"],"ans":3,"exp":["📝 解析：答案(3)：傳統銀行授信重視擔保品、穩定收入與完整信用紀錄，弱勢族群（低收入、無信用紀錄、小微業者）較難通過徵信，因此成為 P2P 借貸與普惠金融主要想服務的對象。上市公司、公務機關、公教人員信用良好、收入穩定，較易取得銀行融資。"],"pos":0.3833,"w":1,"sw":0.01201,"id":"10科技力-23"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"10-24","stem":"根據WEF(2015)，P2P 借貸為何會能更精確的核貸？","opts":["線下調查","政府的介入","違約資訊將立即回饋模型","借款人較誠實"],"ans":3,"exp":["📝 解析：答案(3)：WEF（2015）《金融服務的未來》指出，P2P 借貸平台運用替代性資料與自動化模型評估風險，且借款人的違約資訊會即時回饋到信用評分模型持續修正，因此核貸能更精確。線下調查是傳統銀行的做法；政府介入、借款人較誠實都不是 WEF 所列的原因。"],"pos":0.4,"w":1,"sw":0.01201,"id":"10科技力-24"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"10-25","stem":"P2P 借貸管理不當會造成的風險，下列何者錯誤？","opts":["違約風險","通貨膨脹風險","詐欺風險","資訊不對稱風險"],"ans":2,"exp":["📝 解析：答案(2)：P2P 借貸若管理不當，主要風險是借款人違約風險（1）、假借款或平台詐騙等詐欺風險（3）、平台與投資人對借款人資訊掌握不足的資訊不對稱風險（4）。通貨膨脹風險屬總體經濟風險，並非 P2P 平台管理不當所造成的風險。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4167,"w":1,"sw":0.01201,"id":"10科技力-25"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"10-27","stem":"下列何者不屬於臺灣的群眾募資平台？","opts":["嘖嘖","FlyingV","群募貝果","Kickstarter"],"ans":4,"exp":["📝 解析：答案(4)：Kickstarter 是 2009 年在美國上線的群眾募資平台，不屬於臺灣平台。嘖嘖（zeczec）、FlyingV，以及遊戲橘子於 2014 年成立的群募貝果（WeBackers），都是臺灣本土的回饋型群眾募資平台。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.45,"w":1,"sw":0.01201,"id":"10科技力-27"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"10-28","stem":"依照WEF 對於金融科技應用於投資管理的分析，下列何項業務目前發展較迅速？","opts":["機器人理財","演算法交易","社群投資","高頻交易"],"ans":1,"exp":["📝 解析：答案(1)：WEF（2015）分析金融科技在投資管理的應用時，指出機器人理財（Robo-advisor）以低門檻、低費用、自動化資產配置服務大眾市場，是目前發展最迅速的業務。演算法交易、高頻交易早已存在且以機構為主，社群投資規模相對較小。"],"pos":0.4667,"w":1,"sw":0.01201,"id":"10科技力-28"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"10-53","stem":"下列何者非屬WEF(2015)報告中對P2P 借貸特色的敘述？","opts":["更精確的核貸","核貸量增加","快速且友善","增加借款者成本"],"ans":4,"exp":["📝 解析：答案(4)：WEF（2015）指出 P2P 借貸的特色是透過替代資料與即時回饋模型「更精確核貸」（1）、自動化流程讓「核貸量增加」（2）、線上申請「快速且友善」（3）。P2P 平台省去分行與中介成本，是「降低」借款者成本，而非增加，故(4)非屬其特色。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8833,"w":1,"sw":0.01201,"id":"10科技力-53"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"10-54","stem":"下列何項業務的出現對於新創企業來說擺脫了銀行放款條件的規定與作業時間，有機會直接與社會大眾互動，直接由社會大眾取得成本較低且較快速的資金？","opts":["電子支付","創業投資","群眾募資","網商交易"],"ans":3,"exp":["📝 解析：答案(3)：群眾募資讓新創企業或創作者透過網路平台直接向社會大眾募集資金，不必受銀行放款的擔保、徵信條件與審核時間限制，資金成本較低、取得較快，也能同時測試市場與累積支持者。電子支付是支付工具，創業投資由專業創投機構出資，網商交易是電子商務，都不符題意。"],"pos":0.9,"w":1,"sw":0.01201,"id":"10科技力-54"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"10-55","stem":"下列何者非金融科技運用在投資管理上的風險？","opts":["流動性風險","通貨膨脹風險","道德風險","資安風險"],"ans":2,"exp":["📝 解析：答案(2)：金融科技運用在投資管理（如機器人理財、演算法交易、社群投資）時，教材列出的風險包括流動性風險（市場急殺時演算法同時賣出）、道德風險（平台或跟單高手利益衝突）、資安風險（系統被入侵）。通貨膨脹風險屬一般總體經濟風險，並非金融科技應用本身帶來的風險。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9167,"w":1,"sw":0.01201,"id":"10科技力-55"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"9-11","stem":"若廠商發行的代幣是作為使用該廠商產品的權利，這是屬於下列何種的群眾募資型式？","opts":["報償／回饋型","股權型","債券型","貨幣型"],"ans":1,"exp":["📝 解析：答案(1)：廠商發行的代幣若是作為使用其產品或服務的權利（類似 utility token、預購券），出資者取得的是產品或服務回饋，屬「報償／回饋型」群眾募資。股權型取得公司股份，債券型（債權型）取得還本付息的債權，都與使用權不同。"],"pos":0.1833,"w":1,"sw":0.01201,"id":"9科技力-11"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"9-23","stem":"依據中央銀行2018 年第3 季理監事會後資料，全球首家P2P 借貸平台是屬於何種營運模式？","opts":["傳統模式","公證模式","保證收益模式","資產負債表模式"],"ans":1,"exp":["📝 解析：答案(1)：全球首家 P2P 借貸平台是 2005 年成立於英國的 Zopa，依中央銀行 2018 年第3季理監事會後參考資料，屬「傳統模式」：平台只負責資訊媒合與撮合，借貸雙方直接成立債權債務關係，平台不承擔信用風險。保證收益、資產負債表模式則由平台承擔部分風險或自有資金放款。"],"pos":0.3833,"w":1,"sw":0.01201,"id":"9科技力-23"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"9-24","stem":"有關P2P 借貸平台之敘述，下列何者錯誤？","opts":["增進資金使用效率","網路交易無地域性","人事及設備成本降低","潛在投資收益較低"],"ans":4,"exp":["📝 解析：答案(4)錯誤：P2P 借貸省去銀行中介成本，出借人可獲得比銀行存款更高的潛在收益（同時承擔較高違約風險），因此「潛在投資收益較低」不正確。增進資金使用效率（1）、網路交易無地域限制（2）、免設分行使人事設備成本降低（3），都是 P2P 平台的特色。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4,"w":1,"sw":0.01201,"id":"9科技力-24"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"9-28","stem":"理財機器人服務流程之第一步驟為何？","opts":["提供投資組合建議","執行交易","瞭解客戶","風險監控"],"ans":3,"exp":["📝 解析：答案(3)：理財機器人服務流程依序為：瞭解客戶（線上問卷評估風險屬性、投資目標，即 KYC）→ 提供投資組合建議 → 執行交易 → 風險監控與自動再平衡。必須先瞭解客戶，才能進行後續配置與適合度判斷。"],"pos":0.4667,"w":1,"sw":0.01201,"id":"9科技力-28"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"9-54","stem":"下列何者是群眾募資的五項主要風險之一？","opts":["較低的投資損失","較多的法律保障","稀釋風險","資訊對稱"],"ans":3,"exp":["📝 解析：答案(3)：股權型群眾募資的主要風險包括欠缺流動性、投資損失、稀釋風險（後續增資使原投資人持股比例下降）、詐欺風險及資訊不對稱等。(1) 應是「較高」的投資損失風險；(2) 投資人法律保障相對較少；(4) 應是資訊「不對稱」，故只有(3)正確。"],"pos":0.9,"w":1,"sw":0.01201,"id":"9科技力-54"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"9-55","stem":"比較傳統投資(財富)管理與金融科技管理的不同時，我們會發現：","opts":["金融科技投資管理主要參與者為機構投資者","金融科技投資管理強調投資者賦權","金融科技投資管理的客戶較注重整合性與一站式服務","金融科技投資管理的優點在於可以更多中介機構專家建議"],"ans":2,"exp":["📝 解析：答案(2)：金融科技投資管理（如機器人理財、社群投資）強調「投資者賦權」，讓一般投資人以低門檻自行取得工具與資訊做決策。(1) 主要參與者擴大到大眾散戶，不再以機構為主；(3) 重視整合性、一站式服務是傳統財富管理的特色；(4) 金融科技是「去中介化」，減少中介專家。"],"pos":0.9167,"w":1,"sw":0.01201,"id":"9科技力-55"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"8-25","stem":"下列何者非屬中央銀行(2018)對P2P 借貸創造社會價值的敘述？","opts":["提高傳統金融的競爭力","增進資金使用效率","發展新的商業信用模式","促進普惠金融"],"ans":1,"exp":["📝 解析：答案(1)：中央銀行（2018）指出 P2P 借貸創造的社會價值包括增進資金使用效率（2）、發展新的商業信用模式（3）、促進普惠金融（4，服務傳統金融難觸及的族群）。P2P 是與傳統金融競爭或互補的新模式，「提高傳統金融的競爭力」並非其所列的社會價值。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4167,"w":1,"sw":0.01201,"id":"8科技力-25"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"8-26","stem":"下列何種股權型群眾募資模式也稱為「領投+跟投」的模式？","opts":["聯合投資模式","自發合投模式","基金模式","銀行模式"],"ans":1,"exp":["📝 解析：答案(1)：股權型群眾募資的「聯合投資模式」又稱「領投＋跟投」：由具專業與經驗的領投人負責盡職調查、議定條件並帶頭出資，其他跟投人依其判斷跟隨投資，可降低一般投資人的資訊不對稱。自發合投是投資人各自決定，基金模式由基金統一出資。"],"pos":0.4333,"w":1,"sw":0.01201,"id":"8科技力-26"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"8-28","stem":"小明看到網路廣告推廣社群投資，請問哪一個廣告宣傳說明錯誤？","opts":["社群投資的特色就是跟單交易","社群中的投資高手又稱為影子交易員","用戶可採自動或手動複製其他交易者的決策","社群投資的經營者有證券商及科技公司"],"ans":2,"exp":["📝 解析：答案(2)錯誤：社群投資平台中被跟單的投資高手稱為「明星交易員」或「信號提供者」（signal provider），不是「影子交易員」。社群投資的特色是跟單交易（1），用戶可自動或手動複製他人決策（3），經營者包括券商與科技公司（4），皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4667,"w":1,"sw":0.01201,"id":"8科技力-28"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"8-54","stem":"群眾募資類型中較類似於「團購+預購」模式的，為下列何種類型？","opts":["捐贈","回饋","股權","債權"],"ans":2,"exp":["📝 解析：答案(2)：回饋型（報酬型）群眾募資是出資者支持專案後，獲得產品或服務作為回饋，等於先付款集資（團購）、待產品完成後再出貨（預購），因此被形容為「團購＋預購」。捐贈型不求回報，股權型取得股份，債權型取得還本付息。"],"pos":0.9,"w":1,"sw":0.01201,"id":"8科技力-54"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"7-31","stem":"利用網路平台快速散播計畫內容或創意作品訊息，獲得眾多支持者的資金，最後得以實踐計畫或完成作品。此屬下列何種業務？","opts":["共享經濟","P2P 匯兌","群眾募資","網路微貸"],"ans":3,"exp":["📝 解析：答案(3)：透過網路平台向大眾宣傳計畫或創意作品，募集眾多小額支持者的資金以實現計畫，即群眾募資（Crowdfunding）。共享經濟是閒置資源共享使用，P2P 匯兌是個人間跨境換匯，網路微貸是線上小額放款，皆不符。"],"pos":0.5167,"w":1,"sw":0.01201,"id":"7科技力-31"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"7-33","stem":"有關金融科技投資管理業務之類型及特性，下列敘述何者錯誤？","opts":["Darwinex 是成立於英國的社群投資平台(Social Trading)","Wealthfront 是成立於美國的機器人理財平台(Robo-advisors)","Betterment 是在美國專門從事演算法交易(Algorithmic Trading)的公司","顧客不侷限於富裕階層，大眾市場顧客亦可輕易獲得低成本之財富管理服務"],"ans":3,"exp":["📝 解析：答案(3)錯誤：Betterment（2008 年成立於美國）是知名的機器人理財（Robo-advisor）平台，以 ETF 自動配置與再平衡提供低費用理財，並非演算法交易公司。Darwinex 是英國社群投資平台（1）、Wealthfront 是美國機器人理財平台（2），以及大眾市場也能低成本取得財富管理（4），均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.55,"w":1,"sw":0.01201,"id":"7科技力-33"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"6-32","stem":"有關P2P 借貸的敘述，下列何者正確？","opts":["貸款人沒有機會選擇風險與報酬","主要集中於低風險貸款，排除中高風險的借款人","對資金供給者保障有限","可有效降低個別違約風險"],"ans":3,"exp":["📝 解析：P2P 借貸平台只做媒合，沒有存款保險，借款人違約時由出借人自行承擔損失，對資金供給者保障有限，故(3)正確。(1)錯：出借人可依借款人信用等級自行選擇風險與報酬；(2)錯：P2P 反而能服務銀行排除的中高風險借款人；(4)錯：出借人直接承擔個別借款人的違約風險，並不能有效降低。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.5333,"w":1,"sw":0.01201,"id":"6科技力-32"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"6-37","stem":"有關P2P 借貸的敘述，下列何者錯誤？","opts":["P2P 借貸是透過線上借貸平台提供金融服務","中國大陸是目前P2P 借貸規模較大的國家","P2P 借貸屬於信用中介，故應可吸收公眾存款","有助於促進普惠金融，增進資金使用效率"],"ans":3,"exp":["📝 解析：選項(3)錯：P2P 借貸平台只是媒合資金供需的資訊中介，不得吸收公眾存款；在我國，非銀行收受存款違反銀行法 §29、§29-1（違反者依 §125 處罰）。(1)透過線上平台提供服務、(4)有助普惠金融與資金效率皆正確；(2)在出題當時中國大陸確為 P2P 規模最大的國家。⚠ 現行狀況：中國大陸 P2P 平台經整頓後已於 2020 年底全面清零，選項(2)現已不成立；考試若再出，仍以官方答案(3)為準。","⚠ 現行狀況：中國大陸 P2P 網貸平台經整頓，銀保監會 2020 年 11 月宣布實際運營機構已全部歸零，選項(2)「中國大陸是 P2P 規模較大的國家」已不成立；考試以官方答案(3)為準。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6167,"w":1,"sw":0.01201,"id":"6科技力-37"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"6-56","stem":"下列何者是一個線上社群投資平台？","opts":["Darwinex","Kickstarter","Amazon","Transferwise"],"ans":1,"exp":["📝 解析：Darwinex 是英國的線上社群投資平台，投資人可參考並跟隨平台上交易者的策略進行投資（社群交易），故選(1)。Kickstarter 是群眾募資平台；Amazon 是電子商務平台；Transferwise（現名 Wise）是跨境 P2P 匯兌平台。"],"pos":0.9333,"w":1,"sw":0.01201,"id":"6科技力-56"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"5-32","stem":"2015 年世界經濟論壇(WEF)所提出之金融科技創新項目中「群眾募資」的功能為何？","opts":["存貸","支付","籌資","市場資訊供應"],"ans":3,"exp":["📝 解析：WEF 2015 年報告的六大金融功能中，「群眾募資」屬於「籌資」（Capital Raising）功能：讓個人或新創透過網路平台向大眾募集資金，故選(3)。存貸功能的創新是替代性借貸、通路偏好移轉；支付功能是無現金世界、新興支付軌道。"],"pos":0.5333,"w":1,"sw":0.01201,"id":"5科技力-32"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"5-55","stem":"根據2015 年世界經濟論壇「金融服務的未來」研究報告，下列何項是傳統金融存貸的缺點？ A.貸款人沒有機會選擇風險與報酬 B.主要集中於低風險貸款，排除中高風險的借款人 C.小額的存款戶容易受到個別違約風險衝擊 D.對資金供給者保障有限","opts":["僅AB","僅CD","僅ABC","僅BCD"],"ans":1,"exp":["📝 解析：WEF 報告指出傳統存貸的缺點：存款人（資金提供者）沒有機會自行選擇風險與報酬(A)、銀行放款集中於低風險客戶並排除中高風險借款人(B)，故選(1)僅AB。C、D「小額出資者易受個別違約衝擊、對資金供給者保障有限」是 P2P 借貸的缺點；傳統存款有存款保險保障。"],"pos":0.9167,"w":1,"sw":0.01201,"id":"5科技力-55"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"5-56","stem":"根據2015 年世界經濟論壇「金融服務的未來」研究報告，下列何項是常見的金融科技投資管理業務？ A.機器人理財 B.演算法交易 C.社群投資 D.個人理專","opts":["僅ABD","僅ACD","僅ABC","僅BCD"],"ans":3,"exp":["📝 解析：WEF 報告中常見的金融科技投資管理業務包括：機器人理財（Robo-advisor）(A)、演算法交易(B)、社群投資（Social Trading）(C)，故選(3)僅ABC。個人理專(D)是傳統由真人提供的理財顧問服務，不屬於金融科技投資管理業務。"],"pos":0.9333,"w":1,"sw":0.01201,"id":"5科技力-56"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"4-31","stem":"全球首個上市P2P 網路貸款平台Lending Club 的特色有：","opts":["採團體放款、小額借款方式分散風險","該平台從自身獲利抽取呆帳準備金，也從放款人利息中抽取管理費","銀行把債權轉給該平台，該平台再把債權以收益憑證賣給放款人","該平台為第三方擔保公司，借款人未還款，該平台會履約保證"],"ans":3,"exp":["📝 解析：Lending Club 的模式是：借款由合作銀行（WebBank）先撥貸，再把債權轉給 Lending Club，平台再以與該筆借款還款連動的收益憑證（票據）賣給放款投資人，故選(3)。(1)團體放款不是其特色；(2)平台收取服務費，不從自身獲利提列呆帳準備；(4)平台不保證履約，借款違約風險由投資人承擔。補充：Lending Club 已於 2020 年後收購銀行、停止這種散戶 P2P 票據業務，本題描述的是當時的模式。"],"pos":0.5167,"w":1,"sw":0.01201,"id":"4科技力-31"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"4-33","stem":"根據2015 年6 月世界經濟論壇(WEF)「金融服務的未來」報告，下列何者是P2P 貸款的特色？","opts":["提高傳統金融機構的獲利","提高傳統金融機構的資產規模","降低借款者成本","可以擴大存貸的利差"],"ans":3,"exp":["📝 解析：WEF 2015 年「金融服務的未來」報告指出，P2P 貸款讓借貸雙方直接在平台媒合、省去銀行中介與部分作業成本，可降低借款者成本（利率較低、取得資金較方便），故選(3)。P2P 是去中介化，會侵蝕而非提高傳統金融機構的獲利、資產規模與存放利差，(1)(2)(4)錯。"],"pos":0.55,"w":1,"sw":0.01201,"id":"4科技力-33"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"4-34","stem":"有關群眾募資的特色，下列何者正確？","opts":["群眾募資透明度低，專案支持者不能夠親身經歷專案的所有流程","個別投資人直接參與投資，投資成本將降低","群眾募資沒有道德風險，不會發生支持者收到的回報與事前不同","群眾募資將避免協助處於高風險種子階段的新創公司取得資金"],"ans":2,"exp":["📝 解析：群眾募資讓個別投資人直接參與投資，省去中介機構的費用，投資成本可降低，故(2)正確。(1)錯：群眾募資透明度高，支持者可全程參與、追蹤專案進度；(3)錯：仍有道德風險，可能發生回報與事前承諾不同；(4)錯：群眾募資正是協助高風險種子階段新創取得資金的管道。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.5667,"w":1,"sw":0.01201,"id":"4科技力-34"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"4-56","stem":"下列何者是群眾募資的挑戰？","opts":["提供投資人發現並直接投資的機會","募資前公佈的專案細節與募資後實際執行情況不符","相對於傳統金融，群眾募資的透明度高","不必透過中介機構進行投資"],"ans":2,"exp":["📝 解析：群眾募資的挑戰（風險）之一是資訊不對稱與道德風險：募資前公布的專案細節，募資後實際執行或交付的回報可能不符甚至跳票，故選(2)。(1)提供投資人直接投資機會、(3)透明度相對高、(4)不必透過中介機構，都是群眾募資的優點而非挑戰。"],"pos":0.9333,"w":1,"sw":0.01201,"id":"4科技力-56"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"3-32","stem":"P2P 貸款平台有何特性？","opts":["不直接承擔借款違約風險","業務會多集中於低風險借款人","僅限金融機構業者才能建構此平台，並收取仲介服務費用","平台上，貸方可獲取較傳統金融更高收益，且不必承擔呆帳風險"],"ans":1,"exp":["📝 解析：P2P 貸款平台只負責媒合借貸雙方、收取服務費，不以自有資金放款，因此不直接承擔借款違約風險，故(1)正確。(2)錯：P2P 多服務銀行不願承作的較高風險、小額借款人；(3)錯：非金融業者（科技公司）也能建構平台；(4)錯：貸方可能獲得較高收益，但須自行承擔呆帳風險。"],"pos":0.5333,"w":1,"sw":0.01201,"id":"3科技力-32"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"3-33","stem":"有關傳統金融存貸與 P2P(peer-to-peer)借貸優缺點分析，下列何者正確？","opts":["皆有存款保險保障","傳統金融的存戶較易蒙受個別違約風險，而P2P 借貸能有效降低該風險","傳統金融貸款人無法選擇風險與報酬，而P2P 借貸可滿足不同放款人風險偏好","因為具第三方角色，因此不論是傳統金融機構或P2P 借貸平台都會直接涉入借貸契約"],"ans":3,"exp":["📝 解析：P2P 借貸讓放款人自行挑選不同風險等級與利率的借款案，可滿足不同風險偏好；傳統銀行存戶只能拿固定存款利率，無法選擇放款對象的風險與報酬，故(3)正確。(1)錯：P2P 投資沒有存款保險；(2)錯：相反，銀行存戶由銀行承擔個別借款人違約，P2P 投資人才直接承擔個別違約；(4)錯：傳統銀行是借貸契約當事人，P2P 平台只是媒合者、不直接涉入借貸契約。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.55,"w":1,"sw":0.01201,"id":"3科技力-33"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"3-58","stem":"有關交易風險管理的敘述，下列何者錯誤？","opts":["傳統授信業務的逾放比率，通常低於「純線上網路信貸或授信」","「純線上網路信貸」通常屬於純信用、無擔保的授信業務","借款人透過網路平台爭取借款標的次數越多，借款違約機率通常越高，利率也越高","隱瞞產品信息、銷售誤導、個人金融資訊洩漏、歧視以及不當的債務催收，均屬於銀行零售業務的行為風險"],"ans":3,"exp":["📝 解析：(3)錯：借款人在網路平台成功借款並按期還款的次數越多，累積的信用紀錄越完整，違約機率通常越低、可取得的利率也越低，而非越高。(1)傳統授信有徵信與擔保，逾放比通常低於純線上信貸；(2)純線上網路信貸多為純信用、無擔保；(4)隱瞞產品資訊、誤導銷售、洩漏個資、歧視與不當催收，均屬零售業務行為風險，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9667,"w":1,"sw":0.01201,"id":"3科技力-58"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"2-32","stem":"有關目前群眾募資的回饋方式，下列敘述何者錯誤？","opts":["支持者可以透過群眾募資的平台，提供勞務給支持的創業團隊或企業，以換取股權","回饋型群眾募資類似於團購＋預定商品的模式，待實際專案商品生產或創意落實後，直接回報給資金提供者","股權群眾募資則是支持者可透過對創業團隊或企業的資金贊助，取得一定數額的股權","捐贈型群眾募資是支持者以捐贈的方式向一個公司或組織投資，但不求回報"],"ans":1,"exp":["📝 解析：群眾募資的回饋方式分為捐贈型（不求回報）、回饋型（類似團購＋預購，專案完成後給予商品或服務）、股權型（以資金換取股權）及債權型。支持者是以「資金」而非「勞務」換取股權，故(1)錯誤。台灣股權群募依「證券商經營股權性質群眾募資管理辦法」及櫃買中心創櫃板辦理。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5333,"w":1,"sw":0.01201,"id":"2科技力-32"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"2-34","stem":"有關金融科技投資管理的特色，下列敘述何者錯誤？","opts":["不再侷限富裕階層，大眾客戶也能獲得財富管理服務","可隨時提供客戶財務狀況分析，更容易掌握投資損益","獲取金融資訊管道增加，更容易創造及執行投資策略","比較不擅長客製化的服務，無法滿足不同族群的需求"],"ans":4,"exp":["📝 解析：金融科技投資管理（如機器人理財）的特色之一，正是運用演算法與大數據依客戶風險屬性與目標提供個人化、客製化配置，且門檻低能服務大眾客戶，故(4)「不擅長客製化」錯誤。(1)普及大眾、(2)隨時提供財務分析、(3)資訊管道增加，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5667,"w":1,"sw":0.01201,"id":"2科技力-34"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"1-3","stem":"眾包(Crowdsourcing)和募資平台的共同特色為何？","opts":["都是藉由社群群力達成社群行銷的目標","都只要群眾的錢","只對確定對象提供平台服務","都需要花費極高的成本建置"],"ans":1,"exp":["📝 解析：眾包(Crowdsourcing)是向群眾徵求點子、勞務或解決方案，群眾募資是向群眾募集資金，兩者共同點是都藉由社群群眾的力量達成目標，故選(1)。(2)眾包要的是群眾的智慧與勞力，不只是錢；(3)兩者都是對不特定大眾開放；(4)透過既有平台即可進行，不需極高建置成本。"],"pos":0.05,"w":1,"sw":0.01201,"id":"1科技力-03"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"1-33","stem":"有關金融科技投資管理創新對傳統財富管理的衝擊，下列敘述何者錯誤？","opts":["由於流程簡便及成本較低，顧客逐漸使用金融科技投資管理","未來金融機構的財富管理服務可透過金融科技創新，擴大服務的對象","傳統一站式購足的財富管理產品模式，會更加穩固成為未來的服務主流","專業投資人透過社群投資平台分享投資建議，會降低傳統財富管理人員的價值"],"ans":3,"exp":["📝 解析：金融科技投資管理以低成本、簡便流程擴大服務對象，社群投資平台也讓專業投資人分享建議，衝擊傳統財富管理；傳統「一站式購足」模式將面臨分拆(unbundling)與專業化平台的挑戰，而不是更加穩固成為主流，故(3)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.55,"w":1,"sw":0.01201,"id":"1科技力-33"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"21-16","stem":"下列何者非屬保險科技監理推動之重點目標？","opts":["強化金融創新","確保金融永續","強化金融韌性","增加保險業的利潤"],"ans":4,"exp":["📝 解析：保險科技監理的重點目標在於鼓勵金融創新、強化金融韌性（資安、營運持續）、確保金融永續與保護消費者。增加保險業者利潤不是監理機關的目標，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2667,"w":1,"sw":0.00276,"id":"21科技力-16"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"21-17","stem":"有關保險科技應用的敘述，下列何者錯誤？","opts":["保險業需要重視客戶的接受度","保險業整體而言會需要更多的人力","作業流程會更加優化","智慧客服的使用會更普遍"],"ans":2,"exp":["📝 解析：保險科技以 AI 核保理賠、智慧客服、自動化流程取代大量人工作業，整體需求的人力會「減少」並轉向數據、資訊等專業，故(2)錯。其他敘述：須重視客戶接受度、流程更優化、智慧客服更普遍，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2833,"w":1,"sw":0.00276,"id":"21科技力-17"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"21-26","stem":"監理科技(RegTech)的核心思想是利用新技術來更有效和高效地解決哪兩方面的問題？","opts":["業務拓展與市場行銷","產品創新與成本控制","法遵與監理","風險套利與系統維護"],"ans":3,"exp":["📝 解析：監理科技（RegTech）的核心是用新技術（大數據、AI、雲端）更有效率地處理法令遵循與監理問題：協助金融機構降低法遵成本、協助監理機關提高監理效率。業務行銷、產品創新、風險套利都不是其核心目的。"],"pos":0.4333,"w":1,"sw":0.00276,"id":"21科技力-26"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"21-49","stem":"請問UBI(Usage Based Insurance)保險主要是如何進行創新？","opts":["透過去中心化降低成本","對客戶管理系統即時監控","利用數據分析客戶資訊與風險因子","辨理電子商務降低銷售成本"],"ans":3,"exp":["📝 解析：UBI（以使用量為基礎的保險）透過車載裝置或 App 蒐集里程、駕駛行為等數據，分析客戶風險因子後依實際使用情形訂價，例如開得少、駕駛安全者保費較低。其創新核心是數據分析訂價，不是去中心化或電子商務。"],"pos":0.8167,"w":1,"sw":0.00276,"id":"21科技力-49"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"21-54","stem":"PwC(2016a)將金融科技分為四大類型，下列何者非屬「效率與合作」類型？","opts":["雲端計算","內建合規","風險評估統一化","監理報告呈現方式"],"ans":2,"exp":["📝 解析：教材引用 PwC（2016a）把「監理科技」分為四大類型：(1)效率與合作：監理報告呈現方式、風險評估統一化、雲端計算；(2)整合、標準、理解：語意技術與數據點模式、應用程序介面、共享數據；(3)預測、學習、簡化：風險與合規監控、機器學習、大數據分析與建模；(4)新方向：區塊鏈／分散式分類帳、生物識別技術、內建合規。「內建合規」屬「新方向」，不是「效率與合作」，故選(2)。（題幹寫「金融科技」，教材原文為監理科技分類。）","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9,"w":1,"sw":0.00276,"id":"21科技力-54"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"20-26","stem":"根據德勤(RegTech is the new FinTech)的報告中，下列何者非監理科技之特性？","opts":["敏捷性","速度","整合","無效率"],"ans":4,"exp":["📝 解析：Deloitte〈RegTech is the new FinTech〉提出監理科技四大特性：敏捷性、速度、整合、分析，目的就是提升法遵效率。「無效率」與監理科技的目的相反，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4333,"w":1,"sw":0.00307,"id":"20科技力-26"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"20-34","stem":"有關「金融科技發展路徑圖(2.0)」中，針對監理科技之敘述，下列何者錯誤？","opts":["於2021 年2 月間完成監理科技應用人工智慧之規劃","以協助人民陳情案件處理及董監事會議紀錄核閱等二項業務為優先導入人工智慧應用標的","人工智慧監理科技應用部分，已導入「人民陳情案件－模擬應答」","人工智慧監理科技應用部分，已導入「董監事會議紀錄之審查」"],"ans":4,"exp":["📝 解析：依路徑圖2.0，金管會於2021年2月完成監理科技應用人工智慧之規劃，以協助人民陳情案件處理及董監事會議紀錄核閱二項業務為優先；其中已導入「人民陳情案件－模擬應答」，「董監事會議紀錄之審查」則仍在試驗中。故說已導入董監事會議紀錄審查，(4)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5667,"w":1,"sw":0.00307,"id":"20科技力-34"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"20-35","stem":"依保險業設立許可及管理辦法規定，我國數位人身保險公司，其最低實收資本額為新臺幣多少金額？","opts":["5 億元","10 億元","15 億元","20 億元"],"ans":2,"exp":["📝 解析：依保險業設立許可及管理辦法第29條之3（2025年7月30日修正），數位財產保險公司最低實收資本額為新臺幣5億元、數位人身保險公司為10億元，出資以現金為限，且主管機關得視營業計畫要求增資。修正前稱「純網路保險公司」，門檻為產險10億元、人身20億元；現行答案為10億元。"],"pos":0.5833,"w":1,"sw":0.00307,"id":"20科技力-35"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"20-36","stem":"下列何者非屬保險業得辦理網路投保之人身保險商品？","opts":["定期人壽保險","保險年期不超過二十年及歲滿期不超過八十歲之生死合險","實支實付型健康保險","小額終老保險"],"ans":2,"exp":["📝 解析：依「保險業辦理電子商務應注意事項」第7點，得網路投保的人身保險包括定期壽險、實支實付型健康保險、小額終老保險等，生死合險則限「保險年期不超過20年且歲滿期不超過75歲」。選項(2)寫歲滿期80歲，超過75歲上限，故非屬得網路投保商品。(1)(3)(4)皆在第7點列舉範圍內。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6,"w":1,"sw":0.00307,"id":"20科技力-36"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"20-54","stem":"下列何者非PwC(2016a)報告中「新方向」之監理科技類型內涵？","opts":["區塊鏈","生物識別技術","合規監控","內建合規"],"ans":3,"exp":["📝 解析：PwC（2016a）將監理科技分類，「新方向」類型指新興技術應用，如區塊鏈、生物識別技術、內建合規（Compliance by Design）等。「合規監控」屬另一類（監控／報告型）的監理科技內涵，非「新方向」，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9,"w":1,"sw":0.00307,"id":"20科技力-54"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"19-16","stem":"下列何項通常不屬於保險科技可能帶給保險業的效益？","opts":["降低資訊不對稱","降低人力成本","精準行銷","強化保險公司資本結構"],"ans":4,"exp":["📝 解析：保險科技可透過大數據、物聯網降低保險人與被保險人的資訊不對稱，以自動化降低人力成本，並依客戶資料精準行銷。強化資本結構屬財務面（增資、再保等）的議題，並非科技應用通常帶來的效益，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2667,"w":1,"sw":0.02901,"id":"19科技力-16"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"19-17","stem":"下列何者非屬保險科技面臨的挑戰？","opts":["保險公司市佔率可能會有大幅度變動","保險業從業人員之工作權利的保障","資安風險發生的可能性降低","保險業需要增加資訊人才"],"ans":3,"exp":["📝 解析：保險科技的挑戰包括：市場版圖重分配使市佔率大幅變動、從業人員工作權受衝擊、需增聘資訊人才，以及數位化帶來的資安風險「升高」。(3)「資安風險發生的可能性降低」與事實相反，故非屬挑戰。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2833,"w":1,"sw":0.02901,"id":"19科技力-17"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"19-25","stem":"有關設純網路投保業務目的之敘述，下列何者錯誤？","opts":["因應金融服務數位發展趨勢","推動創新保險商品研發","滿足消費者多元需求","與現有產險市場為商品競爭"],"ans":4,"exp":["📝 解析：金管會開放設立純網路保險公司的目的，是因應金融數位發展趨勢、推動創新保險商品研發、滿足消費者多元需求，並與現有產險市場形成互補、差異化，而非以相同商品直接競爭，故(4)錯誤。補充：2025年7月30日修正「保險業設立許可及管理辦法」，「純網路保險公司」已更名為「數位保險公司」，不再限定全程網路經營、可設實體據點，但須以創新型保險商品或服務達一定比例為核心，與既有業者區隔的精神不變。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4167,"w":1,"sw":0.02901,"id":"19科技力-25"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"19-54","stem":"下列何者非PwC(2016a)報告中「整合、標準、理解」類型之監理科技內涵？","opts":["機器學習","語意技術","數據點模式","共享數據"],"ans":1,"exp":["📝 解析：PwC（2016a）中「整合、標準、理解」類型的監理科技，著重資料整合與共同理解，如語意技術、數據點模式（Data Point Model）、共享數據（共享平台）。機器學習屬於數據分析／新方向類型，非此類內涵，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9,"w":1,"sw":0.02901,"id":"19科技力-54"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"18-27","stem":"下列何者非屬2017 年6 月IMF Staff Discussion Note 上提出的監理科技領域？","opts":["區塊鏈","應用程序編程接口(API)","身分驗證技術(不包括生物識別技術)","數據分析工具"],"ans":3,"exp":["📝 解析：IMF 2017年6月Staff Discussion Note（Fintech and Financial Services）列舉的監理科技領域包括：區塊鏈（分散式帳本）、API、身分驗證技術（「包括」生物識別技術）、數據分析工具等。(3)寫「不包括生物識別技術」與原文不符，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.45,"w":1,"sw":0.02901,"id":"18科技力-27"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"17-16","stem":"未來保險公司24 小時都能由行動裝置提供保險諮詢，就是運用了保險科技的何種技術？","opts":["區塊鏈","大數據","人工智慧","雲端計算"],"ans":3,"exp":["📝 解析：24小時透過行動裝置提供保險諮詢，是以人工智慧的自然語言處理打造智能客服／聊天機器人（Chatbot），可隨時回答保戶問題，故選(3)人工智慧。區塊鏈著重分散式記帳與智能合約；大數據著重資料分析；雲端計算提供運算資源，皆非「自動對話諮詢」的核心技術。"],"pos":0.2667,"w":1,"sw":0.01201,"id":"17科技力-16"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"17-17","stem":"保險科技應用在商品創新方面，透過哪些技術使保險的重心由損失補償轉移到損失預防，下列何者錯誤？","opts":["物聯網","智慧感應器","基因檢測","區塊鏈"],"ans":4,"exp":["📝 解析：保險從「事後損失補償」轉向「事前損失預防」，靠的是能即時監測風險的技術：物聯網與智慧感應器（如穿戴裝置、車聯網、居家煙霧／漏水感測）可提醒保戶改善行為，基因檢測可及早發現疾病風險。區塊鏈主要用於理賠自動化、資料共享與防詐，並不直接促成損失預防，故(4)不屬之。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2833,"w":1,"sw":0.01201,"id":"17科技力-17"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"16-19","stem":"下列何項通常不屬於保險科技創新應用需要考慮的議題？","opts":["新的行銷模式如何監理","如何確保用戶資料的安全性","傳統業務員技能再訓練","風險分類會變得更加困難"],"ans":4,"exp":["📝 解析：保險科技創新需考慮：新行銷通路（網路投保、平台比價）如何監理、保戶資料安全與個資保護、傳統業務員技能轉型再訓練等。科技（大數據、物聯網）讓風險分類「更細緻、更容易」，衍生的問題反而是分類過細導致高風險者被排除，而不是「分類更加困難」，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3167,"w":1,"sw":0.01201,"id":"16科技力-19"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"16-20","stem":"區塊鏈何種特性可以使保險對仲介的依賴度降低，強化了P2P 保險的發展？","opts":["去中心化","開放性","透明性","匿名性"],"ans":1,"exp":["📝 解析：區塊鏈的去中心化特性讓參與者直接在分散式帳本上記錄保費與理賠，並以智能合約自動執行，不必依賴保險經紀人、代理人等中介機構，因而助長P2P保險（保戶互助分擔風險）的發展，選(1)。開放性、透明性、匿名性雖也是區塊鏈特性，但降低對仲介依賴的核心是去中心化。"],"pos":0.3333,"w":1,"sw":0.01201,"id":"16科技力-20"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"16-21","stem":"全球保險科技的投資數據顯示，其運用較成功之領域，下列敘述何者錯誤？","opts":["保險比價平台","車險及健康保險","保險精算系統","P2P 保險"],"ans":3,"exp":["📝 解析：全球保險科技投資數據顯示，較成功的應用集中在面對消費者的通路與商品創新：保險比價平台、車險（UBI）及健康保險（穿戴裝置）、P2P保險等。保險精算系統屬保險公司內部既有核心作業，並非保險科技投資運用較成功的代表領域，故(3)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.35,"w":1,"sw":0.01201,"id":"16科技力-21"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"16-40","stem":"根據英國劍橋大學新興金融研究中心2019 年的調查報告，下列何項是該報告所提法遵科技應用的優先領域？","opts":["風險控制","業務行為的監控","身分識別","監理資料呈報第二部分：第41~60 題(每題2 分)"],"ans":3,"exp":["📝 解析：英國劍橋大學新興金融研究中心（CCAF）2019年法遵科技調查報告指出，業者導入法遵科技的優先領域是身分識別（KYC／客戶盡職調查、數位開戶與防制洗錢身分驗證），選(3)。風險控制、業務行為監控與監理資料申報也是應用領域，但非該報告所列的首要優先項目。"],"pos":0.6667,"w":1,"sw":0.01201,"id":"16科技力-40"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"16-50","stem":"最早將車聯網技術發展出UBI 汽車保險並導入產險市場是哪一個國家？","opts":["美國","德國","英國","澳洲"],"ans":1,"exp":["📝 解析：UBI（Usage-Based Insurance，依使用量計價）汽車保險最早由美國Progressive保險公司於1998年推出試辦（後發展為Snapshot），利用車載裝置蒐集里程與駕駛行為訂價，故教材答案為(1)美國。英國等歐洲國家約在2000年代中期才陸續跟進。"],"pos":0.8333,"w":1,"sw":0.01201,"id":"16科技力-50"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"15-13","stem":"Know-your-customer(KYC)最基本且最重要的步驟為下列何者？","opts":["客戶的信用紀錄查核","客戶的身分核對","客戶的投資需求","客戶的消費習慣"],"ans":2,"exp":["📝 解析：認識客戶（KYC）是防制洗錢與客戶盡職調查的基礎，第一步也是最重要的一步是確認客戶身分（以可靠、獨立來源文件核對身分，並辨識實質受益人），選(2)。信用紀錄、投資需求、消費習慣是身分確認後才進一步瞭解的資訊。"],"pos":0.2167,"w":1,"sw":0.01201,"id":"15科技力-13"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"15-20","stem":"下列何種保險結合物聯網技術蒐集駕駛者習慣及風險類型，以作為保險訂價參考？","opts":["BBI 保險","UBI 保險","PIC 保險","KYC 保險"],"ans":2,"exp":["📝 解析：UBI（Usage-Based Insurance）保險結合物聯網車載裝置（OBD、行車記錄）或手機App蒐集里程、駕駛時段、急煞急加速等習慣，依風險類型訂定保費，選(2)。常見類型有PAYD（依里程計費）與PHYD（依駕駛行為計費）。KYC是認識客戶，BBI、PIC非此類保險名稱。"],"pos":0.3333,"w":1,"sw":0.01201,"id":"15科技力-20"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"15-21","stem":"台灣產險業利用區塊鏈技術中以「分散式帳簿」概念使用智能合約以執行保險運作理賠方式，所發展出的保險為何？","opts":["航班延誤保險","郵輪旅行平安險","汽車超額責任險","交通工具乘客險"],"ans":1,"exp":["📝 解析：國內產險業將區塊鏈分散式帳簿與智能合約用於旅遊不便險的「航班延誤」理賠：國泰產險2017年與KPMG合作宣布導入，明台產險2018年2月上線，富邦產險亦跟進。保戶投保時登錄航班，智能合約自動比對實際抵達時間，達約定延誤時數即主動通知並啟動快速理賠，選(1)。航班資訊客觀、可由外部資料自動驗證，最適合智能合約；其他選項未見此類應用。"],"pos":0.35,"w":1,"sw":0.01201,"id":"15科技力-21"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"15-34","stem":"下列何者非IMF(2017)提出之監理科技領域？","opts":["數據分析工具","電腦稽核","雲應用程序","人工智慧技術"],"ans":2,"exp":["📝 解析：國際貨幣基金（IMF）2017年報告列出的監理科技領域包括：數據分析工具（含大數據）、雲端應用程式、人工智慧與機器學習、API、生物辨識、分散式帳本等。「電腦稽核」是傳統資訊稽核技術，不在報告所列的監理科技領域內，選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5667,"w":1,"sw":0.01201,"id":"15科技力-34"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"15-50","stem":"下列何者非屬保險科技監理推動之原則？","opts":["科技中立","友善創新","機構管理導向","功能及行為監理"],"ans":3,"exp":["📝 解析：保險科技的監理原則包括：科技中立（不偏好特定技術）、友善創新（鼓勵創新並兼顧風險）、功能及行為監理（依業務功能與行為而非機構別監理，相同業務相同監理）。「機構管理導向」與功能性監理的趨勢相反，不屬推動原則，選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8333,"w":1,"sw":0.01201,"id":"15科技力-50"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"14-19","stem":"物聯網之穿戴式裝置技術結合了下列何種保險商品，鼓勵保戶主動管理自身健康狀況？","opts":["汽車保險","旅行平安險","健康保險","儲蓄保險"],"ans":3,"exp":["📝 解析：穿戴式裝置（智慧手錶、手環）可記錄步數、心率、睡眠等健康數據，保險公司以「健康保險／外溢保單」結合，保戶達成運動目標即可享保費折減或回饋，鼓勵主動管理健康，選(3)。車聯網則是結合汽車保險（UBI）。"],"pos":0.3167,"w":1,"sw":0.01201,"id":"14科技力-19"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"14-20","stem":"保險科技主要可以降低下列何種資訊的不對稱？","opts":["保險人與投資人","保險人與被保險人","保險人與再保險人","被保險人與投資人"],"ans":2,"exp":["📝 解析：保險的核心問題是保險人（保險公司）與被保險人之間的資訊不對稱，導致逆選擇與道德風險。保險科技透過物聯網、穿戴裝置、大數據即時取得被保險人的實際風險與行為資料，可有效降低兩者間的資訊不對稱，選(2)。"],"pos":0.3333,"w":1,"sw":0.01201,"id":"14科技力-20"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"14-33","stem":"相較於過去金融行為，監理科技發展下有三個主要的參與者，下列何者非為主要參與者？","opts":["金融消費者","監理機關","金融業者","科技業者"],"ans":1,"exp":["📝 解析：監理科技（RegTech／SupTech）發展下的三個主要參與者是：監理機關（運用科技監理）、金融業者（運用科技遵法）、科技業者（提供解決方案）。金融消費者是受保護的對象，不是監理科技的主要參與者，選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.55,"w":1,"sw":0.01201,"id":"14科技力-33"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"14-35","stem":"有關香港金融管理局(HKMA)所提出的Cyber Security Risk Management 之敘述，下列何者錯誤？","opts":["內容包含資安風險管理權責的描述","強調不定期評估網路安全的控制","提供資訊安全評估的準則","內容包含網路威脅情資管理"],"ans":2,"exp":["📝 解析：香港金融管理局（HKMA）的網路安全風險管理規範（Cyber Security Risk Management，後續發展為「網絡防衛計劃」CFI）內容包括資安風險管理權責劃分、資訊安全評估準則、網路威脅情資管理等，並要求「定期」評估網路安全控制的有效性。(2)「不定期評估」錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5833,"w":1,"sw":0.01201,"id":"14科技力-35"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"14-36","stem":"下列何組織負責管理美國銀行的網路安全，並為改善資訊環境網路威脅不斷增加的風險，發展出一套網路安全評估工具？","opts":["美國聯邦金融機構檢查委員會","美國聯邦準備理事會","美國通貨監理局","美國消費者金融保護局"],"ans":1,"exp":["📝 解析：美國聯邦金融機構檢查委員會（FFIEC）於2015年發布網路安全評估工具（Cybersecurity Assessment Tool, CAT），協助銀行辨識網路風險並評估資安成熟度，選(1)。補充：FFIEC已於2025年8月31日停用CAT，改建議參考NIST網路安全框架2.0、CISA跨部門網路安全績效目標等資源，但題目問的是開發者，答案不變。"],"pos":0.6,"w":1,"sw":0.01201,"id":"14科技力-36"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"13-19","stem":"下列何者非屬現階段保險科技運用人工智慧的主要項目？","opts":["商品行銷","核保理賠","客戶服務","商品設計"],"ans":4,"exp":["📝 解析：現階段保險業運用 AI 主要在商品行銷（精準推薦）、核保理賠（自動核保、影像定損、理賠詐欺偵測）、客戶服務（聊天機器人）。保險商品設計仍以精算人員與法規審查為主，AI 尚非主要應用項目，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3167,"w":1,"sw":0.01201,"id":"13科技力-19"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"13-20","stem":"保險科技的崛起對保險生態造成很大衝擊，下列敘述何者錯誤？","opts":["迫使保險業的經營策略發生轉變","使保險商品及服務以客戶為中心","重塑了保險商業模式與業務型態","提高了面對面行銷的比率"],"ans":4,"exp":["📝 解析：保險科技讓投保、理賠、客服可透過網路與行動裝置完成，會「降低」面對面行銷的比率，說提高面對面行銷錯誤。其餘正確：迫使保險業調整經營策略、服務轉向以客戶為中心、重塑保險商業模式與業務型態。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3333,"w":1,"sw":0.01201,"id":"13科技力-20"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"13-21","stem":"區塊鏈的開放性，可以解決不少傳統保險所遭遇的難題，下列何者錯誤？","opts":["保險供給端與需求端資訊不對稱問題","保險市場存在的道德風險與逆選擇問題","過去保險商品難訂價及難分析的問題","保護保戶隱私和安全問題"],"ans":4,"exp":["📝 解析：區塊鏈的「開放性」（資料公開透明、可共享）可改善保險供需雙方資訊不對稱、降低道德風險與逆選擇、累積資料協助商品訂價與分析。但開放性本身無法保護隱私，保戶隱私與安全是靠區塊鏈的「匿名性」與加密技術解決（見同類題：匿名性對應隱私保護），故(4)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.35,"w":1,"sw":0.01201,"id":"13科技力-21"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"13-44","stem":"有關人工智慧於監理與法遵的應用，下列何者錯誤？","opts":["靜態即時法遵","異常行為辨識","即時監理報告","交易追蹤"],"ans":1,"exp":["📝 解析：AI 在監理與法遵的應用包括異常行為辨識（詐欺、洗錢偵測）、即時監理報告、交易追蹤，強調的是「動態」、即時的法遵監控。「靜態即時法遵」字面自相矛盾，靜態檢查無法即時，正確應為動態即時法遵，故(1)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7333,"w":1,"sw":0.01201,"id":"13科技力-44"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"13-55","stem":"對主管機關來說，可以要求業者透過網路申報必要資料，透過監理科技達到即時監控，係指下列何種監理方式？","opts":["現場監理","遠距監理","綜合監理","傘狀監理"],"ans":2,"exp":["📝 解析：主管機關要求業者透過網路申報資料，再以監理科技即時監控、分析，不必派員到場，屬於「遠距監理」（非現場監理，off-site supervision）。現場監理是派員實地檢查；綜合監理、傘狀監理指的是監理架構（如金控由單一機關統合監理），不是資料申報方式。"],"pos":0.9167,"w":1,"sw":0.01201,"id":"13科技力-55"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"12-19","stem":"保險科技應用區塊鏈技術的何種特性可以有效解決保護保戶隱私和安全問題？","opts":["去中心化","開放性","透明性","匿名性"],"ans":4,"exp":["📝 解析：區塊鏈以公私鑰加密與地址化表示參與者，交易可驗證但不直接揭露真實身分，此「匿名性」可保護保戶隱私與資料安全。去中心化解決單點失效與信任問題、開放性與透明性則用來降低資訊不對稱，反而與隱私保護相衝突。"],"pos":0.3167,"w":1,"sw":0.01201,"id":"12科技力-19"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"12-21","stem":"保險科技對保險業帶來之影響，下列何者錯誤？","opts":["未來將增加大量的數位消費者","保險公司在經營策略上發生改變","改變了核心金融業務之風險屬性","客戶服務不再受時間空間的限制"],"ans":3,"exp":["📝 解析：保險科技改變的是銷售通路、作業流程與服務方式，並不改變保險核心業務（承擔風險、損失補償）的本質與風險屬性，主管機關亦強調金融科技不改變金融業務本質，故(3)錯。其餘正確：數位消費者大增、保險公司經營策略改變、客服不再受時間空間限制。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.35,"w":1,"sw":0.01201,"id":"12科技力-21"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"12-34","stem":"下列敘述何者錯誤？","opts":["監理科技無助於高級管理者運用現存系統與數據","監理科技帶來對規範更明確的解讀","認知技術與人工智慧更能帶來對法規深層含義的理解","自動化與系統化的法規集合，有助於減少整體合規成本"],"ans":1,"exp":["📝 解析：監理科技（RegTech）可整合既有系統與數據，協助高階管理者即時掌握合規狀況，說「無助於」高級管理者運用現存系統與數據錯誤。其餘正確：監理科技帶來對規範更明確的解讀；認知技術與 AI 可理解法規深層含義；自動化、系統化的法規集合有助降低整體合規成本。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5667,"w":1,"sw":0.01201,"id":"12科技力-34"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"12-50","stem":"保險公司運用保險科技技術建立保險商品比價平台，這是經營策略上何種方面的改變？","opts":["銷售通路方面","核保方面","理賠方面","客服方面"],"ans":1,"exp":["📝 解析：建立保險商品比價平台，讓消費者在網路上比較、選購保單，改變的是保險商品的「銷售通路」（由業務員、經代轉向網路通路）。核保、理賠、客服是商品售出後的作業流程，與比價平台無直接關係。"],"pos":0.8333,"w":1,"sw":0.01201,"id":"12科技力-50"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"11-15","stem":"有關KYC 的敘述，下列何者正確？","opts":["了解個人帳戶免費轉帳次數","取得個人在聯合信用卡中心的信用紀錄查核","了解客戶投資風險的承擔能力","取得客戶在衛福部的醫療理賠紀錄"],"ans":3,"exp":["📝 解析：KYC（Know Your Customer，認識客戶）是金融機構建立業務關係時確認客戶身分，並了解其財務狀況、投資經驗、投資目的與風險承擔能力，以提供適合的商品並防制洗錢，故(3)正確。(1)免費轉帳次數是帳戶優惠，與 KYC 無關；(2)聯合信用卡中心是信用卡收單與交易處理機構，不是查核個人信用紀錄的單位（個人信用紀錄在聯徵中心，且須經當事人同意才能查詢）；(4)醫療紀錄屬個資法的特種個資，也不是 KYC 的內容。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.25,"w":1,"sw":0.01201,"id":"11科技力-15"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"11-20","stem":"保險科技對傳統保險業可能會產生的直接影響，通常不包括下列何者？","opts":["核保","理賠","再保","產品設計"],"ans":3,"exp":["📝 解析：保險科技直接影響保險公司面對保戶的價值鏈環節：產品設計（如 UBI 車險）、核保（大數據自動核保）、理賠（影像定損、自動理賠）。再保險是保險公司之間的風險分散安排，與消費端科技應用距離較遠，通常不屬直接影響，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3333,"w":1,"sw":0.01201,"id":"11科技力-20"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"11-21","stem":"下列何項並非保險科技的發展可能帶來的挑戰？","opts":["資安風險提高","如何確認保戶的真正保險需求，難度將大為提高","可能造成保險業務人員與客服人員的失業問題","使用eKYC 方式確認客戶身分，其生物辨識技術有可能面臨辨識錯誤的問題"],"ans":2,"exp":["📝 解析：保險科技透過大數據、物聯網與數位互動，能更精準掌握保戶需求，確認保險需求的難度是「降低」而非大幅提高，故(2)不是挑戰。其餘皆為實際挑戰：資安風險提高、業務與客服人員可能被取代、eKYC 生物辨識可能誤判。"],"pos":0.35,"w":1,"sw":0.01201,"id":"11科技力-21"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"11-22","stem":"保險科技可能會帶來的影響，不包括下列何項？","opts":["保險服務不受時間與空間的限制","促使更多的創新保單被開發出來","保險業保費收入必然增加","保險公司可以透過各式媒體行銷保單"],"ans":3,"exp":["📝 解析：保險科技可讓服務不受時空限制、促進創新保單開發（如 UBI、微型保險）、透過多元媒體行銷保單。但保費收入是否增加取決於市場、商品與競爭，科技也可能因比價與精準定價使保費下降，說「必然增加」錯誤，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3667,"w":1,"sw":0.01201,"id":"11科技力-22"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"11-35","stem":"允許不同軟體程序連接，軟體可以交互操作和流通訊息，是IMF(2017)提出之何類監理科技領域？","opts":["應用程序編程接口","認知計算","人工智慧技術","數據分析工具"],"ans":1,"exp":["📝 解析：應用程式介面（API，Application Programming Interface）允許不同軟體程序連接、互相操作並交換訊息，是國際貨幣基金（IMF）2017 年列舉的監理科技領域之一，可讓業者與監理機關系統直接交換申報資料。認知計算、AI、數據分析工具處理的是分析與推理，不是系統串接。"],"pos":0.5833,"w":1,"sw":0.01201,"id":"11科技力-35"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"11-36","stem":"目前國內金融業在落實洗錢防治與打擊資助恐怖主義，採取三管齊下策略，相互搭配，但不包括下列何項？","opts":["從道德面","從人員面","從流程面","從技術面"],"ans":1,"exp":["📝 解析：國內金融業落實洗錢防制與打擊資恐（AML/CFT），採取「人員、流程、技術」三管齊下：人員面強化教育訓練與專責人力、流程面建立風險評估與客戶審查程序、技術面導入監控與篩檢系統。「道德面」不在這三面向內，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6,"w":1,"sw":0.01201,"id":"11科技力-36"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"11-52","stem":"保險科技對保險業的效益有很多，但通常不包括下列何者？","opts":["減少資訊不對稱","增加投資效益","增加行銷的機會","降低營業成本"],"ans":2,"exp":["📝 解析：保險科技對保險業的效益包括：透過數據減少資訊不對稱、以數位通路增加行銷機會、自動化降低營業成本。「增加投資效益」屬保險公司資金運用與資產管理範疇，並非保險科技的典型效益，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8667,"w":1,"sw":0.01201,"id":"11科技力-52"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"10-21","stem":"目前常見的保險科技的應用，通常不包括下列何者？","opts":["量子運算","區塊鏈","人工智慧","物聯網"],"ans":1,"exp":["📝 解析：答案(1)：保險科技（InsurTech）目前常見的應用是區塊鏈（如航班延誤險自動理賠）、人工智慧（智能核保、理賠、客服機器人）、物聯網（車載裝置 UBI 車險、穿戴裝置健康險）等。量子運算仍處於研發階段，尚未成為保險業常見的實務應用，故通常不包括。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.35,"w":1,"sw":0.01201,"id":"10科技力-21"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"10-22","stem":"下列何項並非發展保險科技的目標？","opts":["讓客戶更倚賴實體通路","提供客戶更便利的服務","提高保險的可近性","讓保險經營變得更有效率"],"ans":1,"exp":["📝 解析：答案(1)：發展保險科技的目標是透過數位化讓客戶更便利（2）、提高保險可近性與普及度（3）、讓核保理賠等經營流程更有效率（4）。保險科技的方向是讓客戶能透過網路、行動裝置自助投保與理賠，降低對實體通路的依賴，而不是讓客戶更倚賴實體通路。"],"pos":0.3667,"w":1,"sw":0.01201,"id":"10科技力-22"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"10-35","stem":"提供有效且安全之方法來確認聲稱的發件人身分，是IMF(2017)提出之何種監理科技領域？","opts":["雲應用程序","人工智慧技術","認知計算","身分驗證技術"],"ans":4,"exp":["📝 解析：答案(4)：IMF（2017）將監理科技相關技術分為數個領域，其中「身分驗證技術」是指提供有效且安全的方法，確認聲稱的發件人（交易者）身分是否真實，例如生物辨識、數位憑證。雲應用程序著重運算與儲存資源，人工智慧與認知計算著重資料分析與判斷，均非身分確認。"],"pos":0.5833,"w":1,"sw":0.01201,"id":"10科技力-35"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"9-20","stem":"有關保險科技(InsurTech)的敘述，下列何者錯誤？","opts":["保險科技是金融科技的一環","保險科技是科技業者針對保險價值鏈中不效率的地方，使之變得更有效率","保險科技的崛起，促使保險業者開始要考慮經營策略的轉變","保險科技的發展，通常會促使保險業者開發出成本較高，附加價值也高的產品"],"ans":4,"exp":["📝 解析：答案(4)錯誤：保險科技利用數據與自動化改善保險價值鏈中無效率之處，通常促使保險業開發「成本較低」、更客製化的產品（如 UBI 車險、小額短期保險），而非成本較高的產品。保險科技是金融科技的一環（1）、針對價值鏈無效率處改善（2）、促使業者調整經營策略（3），皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3333,"w":1,"sw":0.01201,"id":"9科技力-20"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"9-21","stem":"下列何種保單在目前有應用到比較高程度的保險科技？","opts":["Usage-based Insurance (UBI)保單","長期照顧保單","實物給付保單","傷害險保單"],"ans":1,"exp":["📝 解析：答案(1)：UBI（Usage-based Insurance，依使用量計費保險）透過車載裝置、OBD 或手機 App 等物聯網技術蒐集里程與駕駛行為數據，再以大數據分析定價，是目前應用保險科技程度最高的保單類型。長期照顧、實物給付、傷害險多仍採傳統精算與核保。"],"pos":0.35,"w":1,"sw":0.01201,"id":"9科技力-21"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"9-22","stem":"有關保險科技在行銷方面的應用，下列何者錯誤？","opts":["保險科技可以提升客戶的體驗","保險科技可以協助釐清客戶對保險真正需求","應用保險科技可以讓客戶更能感受有溫度的保險服務","保險科技可以協助業務員在適當的時機行銷保險業務"],"ans":3,"exp":["📝 解析：答案(3)錯誤：保險科技擅長的是提升客戶體驗與效率（1）、分析數據釐清客戶真正需求（2）、在適當時機提示業務員行銷（4）；但「有溫度」的服務來自業務員的人際關懷與陪伴，科技本身難以取代，因此說應用保險科技能讓客戶更感受有溫度的服務並不正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3667,"w":1,"sw":0.01201,"id":"9科技力-22"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"9-35","stem":"下列何者非PwC(2016a)報告區分之監理科技類型？","opts":["效率和合作","整合、標準、理解","預測、學習、簡化","舊方向"],"ans":4,"exp":["📝 解析：答案(4)：PwC（2016a）將監理科技分為「效率和合作」、「整合、標準、理解」、「預測、學習、簡化」以及「新方向」四類。題目的「舊方向」是將「新方向」改寫的錯誤選項，故非屬其分類。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5833,"w":1,"sw":0.01201,"id":"9科技力-35"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"9-52","stem":"區塊鏈技術目前最常見應用在我國何種保險商品上？","opts":["旅遊不便險中的航班延誤險","年金保險中生存給付","定期壽險的死亡給付","癌症保險的癌症死亡給付"],"ans":1,"exp":["📝 解析：答案(1)：國內產險業（如富邦產險）以區塊鏈結合航班資料庫推出「航班延誤險」自動理賠：航班延誤達約定時間時由智能合約自動觸發理賠，不需保戶申請與檢附證明。年金生存給付、壽險死亡給付、癌症險死亡給付需人工確認身分與事故，尚非區塊鏈主要應用。"],"pos":0.8667,"w":1,"sw":0.01201,"id":"9科技力-52"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"9-57","stem":"分享監理數據常規與結構，促進效率，是PwC(2016a)報告中何類監理科技內涵？","opts":["共享數據","區塊鏈","雲端計算","風險評估統一化"],"ans":1,"exp":["📝 解析：答案(1)：PwC（2016a）所列監理科技內涵中，「共享數據」是指分享監理數據的常規與結構，讓金融機構與監理機關使用一致的資料格式，減少重複申報、提升效率。區塊鏈、雲端計算是技術工具，風險評估統一化著重評估方法一致，都不是此定義。"],"pos":0.95,"w":1,"sw":0.01201,"id":"9科技力-57"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"8-20","stem":"保險商品結合物聯網技術，最早在何類險種被實踐？","opts":["車險","火險","健康險","海上保險"],"ans":1,"exp":["📝 解析：答案(1)：保險結合物聯網最早實踐於車險，即 UBI（Usage-based Insurance）：透過車載裝置或 OBD 蒐集里程、急煞、超速等駕駛行為，作為保費計算依據（如 Pay As You Drive、Pay How You Drive）。健康險結合穿戴裝置較晚，火險與海上保險的物聯網應用也是後續才發展。"],"pos":0.3333,"w":1,"sw":0.01201,"id":"8科技力-20"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"8-21","stem":"有關保險科技的敘述，下列何者錯誤？","opts":["保險科技可以降低人力成本","保險科技可以降低保戶資料被竄改的風險","保險科技可以提供客製化的服務","保險科技無法減輕資訊不對稱的問題"],"ans":4,"exp":["📝 解析：答案(4)錯誤：保險科技透過大數據、物聯網蒐集保戶實際行為數據（如駕駛行為、運動步數），可「減輕」保險人與保戶間的資訊不對稱（逆選擇與道德風險）。降低人力成本（1）、以區塊鏈降低資料竄改風險（2）、提供客製化服務（3），皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.35,"w":1,"sw":0.01201,"id":"8科技力-21"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"8-22","stem":"有關保險科技之敘述，下列何者錯誤？","opts":["隨著保險科技的發展，保險公司將來可以提升經營效率","消費者與保險公司均可由保險科技創新中受益","在政策上，主管機關應該多多鼓勵保險公司發展以提升保戶的權益為中心的保險科技","保險科技不會影響未來保險通路的發展"],"ans":4,"exp":["📝 解析：答案(4)錯誤：保險科技讓網路投保、異業平台（電商、旅遊網站）嵌入式銷售成為可能，已明顯改變保險通路結構，說「不會影響通路發展」不正確。提升經營效率（1）、消費者與保險公司皆受益（2）、主管機關鼓勵以保戶權益為中心的保險科技（3），皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3667,"w":1,"sw":0.01201,"id":"8科技力-22"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"8-52","stem":"下列何項技術最有助於識別客戶的發病風險，推進更加精準高效的產品定價與核保？","opts":["雲端計算","基因檢測","區塊鏈","智能合約"],"ans":2,"exp":["📝 解析：答案(2)：基因檢測可直接分析個人的遺傳疾病易感性，最有助於識別客戶的發病風險，進而精準定價與核保（但實務上須注意個資法第6條基因屬特種個資，以及基因歧視等倫理問題）。雲端計算、區塊鏈、智能合約是運算與流程工具，無法直接評估發病風險。"],"pos":0.8667,"w":1,"sw":0.01201,"id":"8科技力-52"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"7-54","stem":"根據2015 年6 月世界經濟論壇(WEF)「金融服務的未來」報告，隨著科技新產品與共享經濟的商業模式出現，現行保險價值鏈面臨重組的情況，下列何者不是其對保險業的影響？","opts":["超大型保險業者併購市場","客戶導向轉變為產品導向","焦點轉移到利基市場與商業保險","顧客忠誠度下降"],"ans":2,"exp":["📝 解析：答案(2)：WEF（2015）指出保險價值鏈重組的影響包括：超大型業者併購整合（1）、焦點轉向利基市場與商業保險（3）、比價容易使顧客忠誠度下降（4）。趨勢是由「產品導向轉變為客戶導向」，選項(2)方向寫反了，故不是其影響。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9,"w":1,"sw":0.01201,"id":"7科技力-54"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"7-58","stem":"根據 Deloitte 的風險智能地圖(Risk Intelligent Map)，下列何者不是屬於基礎架構類別的風險？","opts":["企業資產","公司治理","財務","人力資源"],"ans":2,"exp":["📝 解析：Deloitte 風險智能地圖把企業風險分成三大類：治理（Governance）、策略（Strategy）、營運與基礎架構（Operations & Infrastructure）。「公司治理」本身就是獨立的治理類別，不屬於基礎架構類，故選(2)。企業資產、財務、人力資源（以及資訊科技、法遵等）都列在基礎架構類。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9667,"w":1,"sw":0.01201,"id":"7科技力-58"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"7-60","stem":"因應數位金融監理，應思考科技監理的實施考量重點，不包含下列何者？","opts":["高度發揮數據利用與分析能量","多元整合與快速實施的能力","應用人工智慧達到智慧監控的目的","採用固定式擴充以因應固定的法規"],"ans":4,"exp":["📝 解析：科技監理（RegTech／SupTech）的實施重點包括：高度發揮數據利用與分析能量、具備多元整合與快速實施的能力、應用人工智慧達到智慧監控。數位金融法規變動快，系統應採「彈性擴充」以因應快速變動的法規；選項(4)「固定式擴充以因應固定的法規」與此相反，故不包含。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":1.0,"w":1,"sw":0.01201,"id":"7科技力-60"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"6-34","stem":"有關一般採用的應對風險措施，下列何者非屬之？","opts":["規避風險，減少發生機率","追逐風險，創造利潤","接受現有風險","分擔風險，將風險移轉出去"],"ans":2,"exp":["📝 解析：常見的風險回應措施有四種：規避（避免或降低發生機率）、降低／控制、分擔／移轉（如保險、外包）、接受（承擔現有風險）。「追逐風險以創造利潤」不是風險回應措施，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5667,"w":1,"sw":0.01201,"id":"6科技力-34"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"6-35","stem":"下列敘述何者正確？","opts":["CEO 關心的是策略風險、客戶風險、人才風險與聲譽風險","CFO 關注財務達標後的管控架構變化及持續日常監控營運風險","COO 關注於資本、資金管理風險及資產的使用效率","CIO 重視市場推廣成本效益及通路風險"],"ans":1,"exp":["📝 解析：CEO 關心策略風險、客戶風險、人才風險與聲譽風險，(1)正確。(2)錯：關注財務達標背後的管控架構變化與日常營運風險監控是 COO；(3)錯：資本、資金管理風險與資產使用效率是 CFO 的關注；(4)錯：市場推廣成本效益與通路風險屬行銷主管（CMO），CIO 關注的是資訊科技與資安風險。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.5833,"w":1,"sw":0.01201,"id":"6科技力-35"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"6-36","stem":"為了客戶風險管理，一般銀行會採行KYC(Know your customer)，KYC 內容通常不包含下列何者？","opts":["客戶身分","信用紀錄","過去病史","投資風險態度"],"ans":3,"exp":["📝 解析：KYC（認識你的客戶）通常包括客戶身分、信用紀錄、財務狀況、投資經驗與風險承受態度等，用於洗錢防制與適合度評估。過去病史與金融交易風險無關，且屬個人資料保護法 §6 所列的特種個資（病歷、醫療等），原則上不得蒐集，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6,"w":1,"sw":0.01201,"id":"6科技力-36"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"6-38","stem":"下列何者非為洗錢防制之主要管控方式？","opts":["客戶風險評估","客戶盡職調查","可疑交易申報","客戶資料保護"],"ans":4,"exp":["📝 解析：洗錢防制的三大主要管控方式為：客戶風險評估、客戶盡職調查（CDD）、可疑交易申報（STR）。「客戶資料保護」屬於個人資料保護法規範的範疇，不是洗錢防制的主要管控方式，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6333,"w":1,"sw":0.01201,"id":"6科技力-38"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"6-55","stem":"收集顧客使用與行為資料，以作為調整保險費率的基礎，改變了下列何種「保險價值鏈」的環節？","opts":["保單設計","通路","核保","理賠"],"ans":1,"exp":["📝 解析：蒐集顧客使用與行為資料（如車載裝置記錄的里程、駕駛習慣）作為調整保費的依據，就是使用基礎保險（UBI），依教材屬於改變保險價值鏈中的「保單設計」環節（依使用行為設計差異化費率的商品），故選(1)。通路是銷售管道；核保是承保前的風險審查；理賠是事故後的給付。"],"pos":0.9167,"w":1,"sw":0.01201,"id":"6科技力-55"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"6-57","stem":"一般而言，建立企業風險管理架構，主要做法及考量重點不包括下列何者？","opts":["鑑別企業營運的主要目標","企業風險文化的建立","評估企業現行存在的弱點","將風險管理職能外包，交付組織外風險管理專家負責"],"ans":4,"exp":["📝 解析：建立企業風險管理架構的重點包括：鑑別企業營運的主要目標、建立企業風險文化、評估企業現行存在的弱點等。風險管理是董事會與管理階層應負的責任，須內化於組織，不能整個外包給組織外的專家負責，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.95,"w":1,"sw":0.01201,"id":"6科技力-57"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"6-58","stem":"有關一般企業風險管理程序，下列何者為正確步驟？","opts":["風險辨識／風險評估／風險回應／控制與測試","風險評估／風險辨識／風險回應／控制與測試","風險評估／風險辨識／控制與測試／風險回應","風險辨識／控制與測試／風險評估／風險回應"],"ans":1,"exp":["📝 解析：一般企業風險管理程序為：先「風險辨識」找出有哪些風險 →「風險評估」衡量發生機率與影響 →「風險回應」決定規避、降低、移轉或接受 → 最後「控制與測試」確認控制措施有效，故選(1)。其他選項把辨識與評估、回應與控制的順序顛倒。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.9667,"w":1,"sw":0.01201,"id":"6科技力-58"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"5-35","stem":"金融機構零售業務行為造成消費者不良後果的風險，如隱瞞產品信息，銷售誤導，欺詐等風險，是屬於零售業務的何種風險？","opts":["市場風險","行為風險","法律風險","流動性風險"],"ans":2,"exp":["📝 解析：金融機構在零售業務中因不當行為造成消費者不良後果，例如隱瞞產品資訊、銷售誤導、欺詐，屬於「行為風險」（Conduct Risk），故選(2)。市場風險是價格變動造成的損失；法律風險是契約無效或違法導致的損失；流動性風險是無法及時取得資金。"],"pos":0.5833,"w":1,"sw":0.01201,"id":"5科技力-35"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"5-37","stem":"關注財務達標背後的管控架構變化是屬於下列何者角色？","opts":["CEO","CFO","COO","CIO"],"ans":3,"exp":["📝 解析：依教材，COO（營運長）關注財務達標背後的管控架構變化，並持續監控日常營運風險，故選(3)。CEO 關注策略、客戶、人才與聲譽風險；CFO 關注資本、資金管理風險與資產使用效率；CIO 關注資訊科技與資安風險。"],"pos":0.6167,"w":1,"sw":0.01201,"id":"5科技力-37"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"5-57","stem":"下列何者不屬於交易風險管理？","opts":["信貸管理","防制洗錢管理","身分認證管理","詐欺管理"],"ans":3,"exp":["📝 解析：交易風險管理針對交易本身的風險，包括信貸管理、防制洗錢管理、詐欺管理。身分認證管理是在客戶登入／開戶時確認「是不是本人」，屬於客戶身分或存取安全管理，不屬交易風險管理，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.95,"w":1,"sw":0.01201,"id":"5科技力-57"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"5-58","stem":"風險管理流程之先後順序為何？ A.風險辨識 B.控制設計、測試及導入 C.風險評估 D.風險回應 E.監督及確認","opts":["ABCDE","ACDBE","ABECD","BADCE"],"ans":2,"exp":["📝 解析：風險管理流程：先風險辨識(A) → 風險評估(C) → 風險回應(D) → 控制設計、測試及導入(B) → 監督及確認(E)，故為 ACDBE，選(2)。順序邏輯是先知道有什麼風險、多嚴重，再決定怎麼處理，然後落實控制並持續監督。"],"pos":0.9667,"w":1,"sw":0.01201,"id":"5科技力-58"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"4-35","stem":"下列敘述哪個是合理的風險管理觀念？","opts":["「風險報告」會抹煞主管及員工的風險承擔意願，最好不要讓董事會、股東及投資大眾知道","風險工作像是「糾察隊」，越神秘越好，不宜群策群力完成","銀行的業務經營強調，尋找最適當的客戶，未必是最有錢的客戶。因為承擔合理風險，可提高獲利機會","基層單位的主管大體上皆年輕又有勇氣，所以資金管理的避險策略宜由這些主管負責推動"],"ans":3,"exp":["📝 解析：銀行經營本來就是承擔「合理」風險換取報酬，找風險與報酬相稱的最適客戶，比只追最有錢的客戶更重要，故(3)正確。(1)錯：風險報告應透明揭露給董事會、股東與投資大眾；(2)錯：風險管理需全員參與、群策群力，不應神秘化；(4)錯：避險策略屬全行層級決策，應由高階管理與風控單位推動，不宜交給基層主管。"],"pos":0.5833,"w":1,"sw":0.01201,"id":"4科技力-35"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"3-35","stem":"有效的風險管理流程強調，協助企業平衡風險與報酬間的目標，下列何者為其實質涵義？","opts":["只重視風險大小、不需考慮報酬高低","在特定報酬下，管理流程宜追求承擔最高風險的方案","在特定報酬下，管理流程宜追求承擔最低風險的方案","只重視報酬最高的方案，風險大小不需太在意"],"ans":3,"exp":["📝 解析：有效的風險管理要平衡風險與報酬：在達到特定報酬的前提下，選擇承擔最低風險的方案（或在特定風險下追求最高報酬），故選(3)。(1)只看風險、(4)只看報酬都忽略了另一面；(2)在相同報酬下承擔最高風險是無效率的選擇。"],"pos":0.5833,"w":1,"sw":0.01201,"id":"3科技力-35"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"3-36","stem":"下列哪種風險不直接屬於Basel III 國際風險管理準則，須計提資本需求額的項目？","opts":["市場風險","作業風險","信用風險","監理風險"],"ans":4,"exp":["📝 解析：Basel III 第一支柱（最低資本要求）規定銀行須就信用風險、市場風險、作業風險三類計提資本。「監理風險」不是 Basel 架構下直接計提資本的風險類別（監理機關的審查屬第二支柱），故選(4)。"],"pos":0.6,"w":1,"sw":0.01201,"id":"3科技力-36"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"3-38","stem":"有關反洗錢及詐欺管理的敘述，下列何者錯誤？","opts":["台灣為亞太防制洗錢組織的正式會員","台灣須在2017 年底接受國際評鑑","銀行可透過人員、流程、技術的相互搭配，有效管控疑似洗錢或資助恐怖主義的交易風險","逃漏稅負與盜卡、詐騙等舞弊行為，均可視為廣義的洗錢活動，宜密切監理"],"ans":2,"exp":["📝 解析：(2)錯：我國接受亞太防制洗錢組織（APG）第三輪相互評鑑的現地評鑑是在 2018 年 11 月，並非 2017 年底；2019 年公布結果獲「一般追蹤」等級。(1)我國為 APG 創始正式會員；(3)銀行可透過人員、流程、技術搭配管控洗錢與資恐風險；(4)逃漏稅、盜卡、詐騙等不法所得均可視為廣義洗錢的前置犯罪，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6333,"w":1,"sw":0.01201,"id":"3科技力-38"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"3-40","stem":"利用資訊科技，廣泛蒐集各國金融監理制度與法規要求，提供分析與管理的工具，自動協助金融機構遵守法規要求，即科技應用於金融監管，以降低作業風險，是指：","opts":["法規遵循","法令監管","科技監管","金融遵循第二部分：第41~60 題(每題2 分)"],"ans":3,"exp":["📝 解析：運用資訊科技蒐集各國監理制度與法規、提供分析與管理工具，自動協助金融機構遵循法規並降低作業風險，即「科技監管」（RegTech，監理科技／法遵科技），故選(3)（選項(4)末尾「第二部分…」為原卷排版殘留）。法規遵循是目標本身，不特指以科技達成。"],"pos":0.6667,"w":1,"sw":0.01201,"id":"3科技力-40"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"3-56","stem":"2017 年美聯社報導生命科學公司Lapetus 所提供的Chronos，可透過人臉分析、生物統計及動態問題來推測使用者壽命，以制定保險策略與價格，甚至不要求被保險人進行體檢就能承保壽險。若報導屬實，則：","opts":["有利於客製化保單推動","保險公司可完全委外管理客戶風險","跨業保險公司或自我保險模式將會減少","大型保險公司更專注特定利基市場，而小型保險公司則積極併購壯大"],"ans":1,"exp":["📝 解析：若能用人臉分析與生物統計推估壽命，保險公司可依個人風險精算保費、免體檢承保，有利於推動客製化保單，故選(1)。(2)錯：核保與風險管理仍是保險公司核心，不能完全委外；(3)錯：科技降低門檻，跨業保險與自我保險模式反而可能增加；(4)錯：與此項科技無直接因果關係。"],"pos":0.9333,"w":1,"sw":0.01201,"id":"3科技力-56"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"3-57","stem":"大數據分析資料時，使用錯誤的演算法，屬於下列哪種風險類型？","opts":["行為風險","模型風險","法律風險","蔓延性風險"],"ans":2,"exp":["📝 解析：模型風險是指因模型設計錯誤、使用不當的演算法、參數或資料錯誤，導致分析結果偏差而造成損失的風險，大數據分析使用錯誤演算法屬之，故選(2)。行為風險是指人員不當銷售、誤導等行為；法律風險是違法或契約無法執行；蔓延性風險是風險在機構間擴散。"],"pos":0.95,"w":1,"sw":0.01201,"id":"3科技力-57"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"3-59","stem":"科技監管(RegTech)的實施考量重點，包括下列何者？","opts":["須增加人工控制","須具備彈性與客製化擴充","須主動且具效率","須具多元整合與快速實施的能力 (5)須高度發揮數據利用與分析能量 (1)僅(1)(2)(3)(4) (2)僅(1)(2)(4)(5) (3)僅(1)(2)(3)(5) (4)僅(2)(3)(4)(5)"],"ans":4,"exp":["📝 解析：本題原卷排版錯亂，題意為：五項敘述（1）須增加人工控制（2）須具備彈性與客製化擴充（3）須主動且具效率（4）須具多元整合與快速實施能力（5）須高度發揮數據利用與分析能量，選出正確組合。RegTech 的目的就是以科技自動化「減少」人工控制，因此（1）不是考量重點，其餘（2）～（5）皆是，故選(4)「僅(2)(3)(4)(5)」。"],"pos":0.9833,"w":1,"sw":0.01201,"id":"3科技力-59"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"3-60","stem":"在由傳統金融邁向數位金融下，對於監理之轉變，不包含下列哪一項？","opts":["交易方式由臨櫃轉變為非臨櫃，金融機構逐漸無法透過傳統的開戶機制執行 KYC","非臨櫃的客戶身份識別，更降低匿名帳戶的使用風險","客戶由虛擬通路進線並進行線上交易","客戶的交易維度較複雜，使客戶的交易模式更不易定義"],"ans":2,"exp":["📝 解析：(2)錯：非臨櫃開戶與交易無法當面核對證件與本人，客戶身分識別難度提高，反而「增加」匿名或冒名帳戶被利用的風險，而非降低。(1)交易轉為非臨櫃、難用傳統開戶機制做 KYC；(3)客戶由虛擬通路進線並線上交易；(4)交易維度複雜、模式更難定義，皆是監理面臨的轉變。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":1.0,"w":1,"sw":0.01201,"id":"3科技力-60"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"2-33","stem":"下列何項技術的發展促使保險業者能即時蒐集顧客使用與行為資訊？","opts":["風險管理","生物辨識技術","遠程資訊處理 (telematics)","無人駕駛科技"],"ans":3,"exp":["📝 解析：遠程資訊處理(Telematics)結合通訊與感測技術，例如車載裝置即時回傳里程、速度、急煞等駕駛行為，讓保險公司發展 UBI（依使用量計費）車險，故選(3)。風險管理是管理流程不是技術；生物辨識用於身分驗證；無人駕駛是保險要承保的新風險，不是蒐集資料的工具。"],"pos":0.55,"w":1,"sw":0.01201,"id":"2科技力-33"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"2-37","stem":"列何者非消除主觀意識所產生的偏見決策之方法？","opts":["機器學習","定性信用評估","議事規則","去偏見訓練"],"ans":1,"exp":["📝 解析：依教材（麥肯錫銀行風險管理報告），消除主觀偏見決策的方法包括：結構化的定性信用評估、議事規則（決策討論機制）、去偏見訓練(De-biasing training)，都是針對人的決策流程所設計的管理方法；機器學習屬於數據分析技術，不在其所列的去偏見方法中，故選(1)。補充：機器學習若訓練資料本身有偏差，反而可能複製偏見。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6167,"w":1,"sw":0.01201,"id":"2科技力-37"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"1-35","stem":"麥肯錫2015 年底所發表的The Future of Bank Risk Management(銀行業未來的風險管理)白皮書，提到幾項重要的風險管理趨勢，下列何者非屬之？","opts":["防範金融犯罪如洗錢、詐欺等","道德風險逐漸失去重要性","科技與分析將成為重要基石","降低風險管理成本將是發展重點需求"],"ans":2,"exp":["📝 解析：麥肯錫 2015《銀行業未來的風險管理》指出的趨勢包括：防範洗錢、詐欺等金融犯罪；科技與分析成為風險管理基石；降低風險管理成本；行為（道德）風險管理更受重視等。道德風險是「愈來愈重要」而非逐漸失去重要性，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5833,"w":1,"sw":0.01201,"id":"1科技力-35"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"1-38","stem":"拍翻自真實故事的電影「A 錢大玩家」中，知名英國霸菱銀行的魔鬼交易員，在日經指數不斷狂跌的情況下，透過「88888」虛設帳戶進行虛構交際，最後造成虧空及銀行倒閉，說明了金融機構零售業務暴露了下列何種風險？","opts":["信貸風險","洗錢風險","行為風險","資恐風險"],"ans":3,"exp":["📝 解析：電影《A錢大玩家》(Rogue Trader) 描述 1995 年霸菱銀行交易員李森(Nick Leeson)以 88888 錯誤帳戶隱藏日經指數期貨虧損，最終拖垮銀行，屬員工不當行為造成的「行為風險」(conduct risk)，也凸顯內控失靈，故選(3)。此事件不涉及借款人違約（信貸風險）或洗錢、資恐。"],"pos":0.6333,"w":1,"sw":0.01201,"id":"1科技力-38"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"1-39","stem":"為了因應數位金融監理，下列何者比較不是目前台灣被認為應該重新思考科技監理的實施考量重點？","opts":["具備彈性與客製化擴充","多元整合與快速實施的能力","高度發揮數據利用與分析能量","設自由金融區進行實驗"],"ans":4,"exp":["📝 解析：教材所列台灣重新思考科技監理(RegTech)的實施考量重點為：具備彈性與客製化擴充、多元整合與快速實施能力、高度發揮數據利用與分析能量。「設自由金融區進行實驗」不屬於監理科技的實施考量（台灣後來是以 2018 年施行的「金融科技發展與創新實驗條例」推動監理沙盒，而非劃設自由金融區），故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.65,"w":1,"sw":0.01201,"id":"1科技力-39"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"1-55","stem":"金融科技保險業透過感測器、穿戴裝置等工具蒐集顧客的使用及行為資料，有關上述所蒐集資料之運用，下列敘述何者錯誤？","opts":["可用於保費價格訂定及保單風險管理","可用於設計個人化、客製化保險產品","無需透過全球定位系統(GPS)及無線通訊之輔助","屬於保險串接裝置(Connected Insurance)之運用"],"ans":3,"exp":["📝 解析：保險串接裝置(Connected Insurance)透過感測器、穿戴裝置蒐集資料，需搭配 GPS 定位與無線通訊才能即時回傳位置、行車路徑等資料，故(3)「無需 GPS 與無線通訊輔助」錯誤。(1)用於保費訂價與風險管理、(2)設計個人化保險商品、(4)屬保險串接裝置運用，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9167,"w":1,"sw":0.01201,"id":"1科技力-55"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"1-56","stem":"新科技對於保險業務的影響，下列敘述何者錯誤？","opts":["物聯網的技術可以讓保險業者更即時地蒐集客戶使用和行為資料","由於客戶的使用及行為資料利用，保險業者可將保險產品高度個人化","消費者更容易進行保險產品間的比價及購買","新科技對保險業的風險定價影響較小，仍以保險公司過往掌握的歷史數據進行，透過損失機率預測最大可能損失來決定"],"ans":4,"exp":["📝 解析：物聯網等新科技讓保險公司取得即時行為資料，風險定價可從依歷史統計的損失機率，轉為依個人實際行為動態定價（如 UBI 車險），影響很大，故(4)「影響較小、仍以歷史數據定價」錯誤。(1)即時蒐集資料、(2)產品高度個人化、(3)消費者更易比價購買，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9333,"w":1,"sw":0.01201,"id":"1科技力-56"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":0,"n":1,"refs":"1-60","stem":"RegTech (科技監管)的發展主要是希望利用科技強化監理與風險控管的能量，根據此特性與RegTech 實施考量重點，下列哪些可以算是RegTech 的實施情境？","opts":["智慧法規分析平台","P2P 壽險平台","機器人理財","自動化製作法遵合規報告 (5)掃描交易，交易流程自動監控與告警工具 (1) (1)(2)(3) (2) (1)(4)(5) (3) (1)(2)(5) (4) (1)(3)(4)"],"ans":2,"exp":["📝 解析：（本題選項排版錯置，實際選項為(1)僅123、(2)僅145、(3)僅125、(4)僅134。）RegTech 是用科技協助法遵與監理：智慧法規分析平台(1)、自動化製作法遵合規報告(4)、交易流程自動監控與告警工具(5)都屬其實施情境，故選(2)。P2P 壽險平台屬保險科技(InsurTech)、機器人理財屬財富科技(WealthTech)，不是監理科技。"],"pos":1.0,"w":1,"sw":0.01201,"id":"1科技力-60"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"21-1","stem":"監理沙盒的主要目的為何？","opts":["金融業的創新","取代正式監管","僅限銀行使用","無監管自由試驗"],"ans":1,"exp":["📝 解析：監理沙盒讓創新業者在主管機關核准的範圍、期間與規模內進行實驗，並暫時豁免部分法規責任，主要目的在鼓勵金融創新（我國依2018年施行的金融科技發展與創新實驗條例）。它不是取代正式監管，也不限銀行使用，實驗期間仍受監督，不是無監管自由試驗。"],"pos":0.0167,"w":1,"sw":0.00276,"id":"21科技力-01"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"21-27","stem":"在監理金融科技方面，下列哪一項因素使得不同業務之間相互關聯、滲透，金融風險更加錯綜複雜？","opts":["傳統業務的穩定","監理沙盒的推出","跨行業、跨市場的跨界金融服務","科技創新速度放緩"],"ans":3,"exp":["📝 解析：金融科技帶來跨行業、跨市場的跨界金融服務（如科技業經營支付、電商經營借貸），使不同業務相互關聯、滲透，風險更錯綜複雜，增加監理難度。傳統業務穩定、科技創新放緩不會增加複雜度；監理沙盒是因應工具而非風險來源。"],"pos":0.45,"w":1,"sw":0.00276,"id":"21科技力-27"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"21-33","stem":"為兼顧創新與合規，國內外監理機關建立可控試驗場域，讓創新金融科技在限制條件下上路觀察。此制度的主要目標為何？","opts":["測試創新金融科技產品合規性","模擬客戶情緒","儲存模型","提高演算法效能"],"ans":1,"exp":["📝 解析：題述即監理沙盒：監理機關在有限範圍、期間與條件下讓創新金融科技試行，主要目標是測試其可行性與合規性，在創新與消費者保護間取得平衡（我國依金融科技發展與創新實驗條例辦理）。模擬客戶情緒、儲存模型、提高演算法效能與制度目的無關。"],"pos":0.55,"w":1,"sw":0.00276,"id":"21科技力-33"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"20-16","stem":"下列敘述，何者非屬金融科技發展路徑圖2.0「推動面向四、提升金融包容性及數位金融普及推廣金融科技技術與應用」之具體推動事項？","opts":["導入第二階段監理科技","推動「數位金融無障礙推展計畫」","補助及協助於亞灣設置高雄園區","擴大金融科技共創平台「監理科技組」為「監理科技及研究應用組」"],"ans":3,"exp":["📝 解析：金融科技發展路徑圖2.0「推動面向四、提升金融包容性及數位金融普及」的措施包括：導入第二階段監理科技、推動「數位金融無障礙推展計畫」，以及擴大共創平台監理科技組等。「補助及協助於亞灣設置高雄園區」屬「推動面向二、深化輔導資源及人才培育」的推動措施2-2（推動創新園區進階方案），故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2667,"w":1,"sw":0.00307,"id":"20科技力-16"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"20-17","stem":"下列敘述何者非屬「推動綠色(永續)金融科技」之具體推動事項內容？","opts":["蒐集業界運用科技推動綠色(永續)金融之需求","辦理綠色(永續)金融科技競賽","辦綠色(永續)金融科技競賽成果發表會","發布「金融機構防漂綠參考指引」"],"ans":4,"exp":["📝 解析：路徑圖2.0推動措施3-3「推動綠色（永續）金融科技」的具體推動事項共四項：蒐集業界運用科技推動綠色（永續）金融之需求、舉辦教育宣導活動、辦理綠色（永續）金融科技競賽、舉辦競賽成果發表會，(1)(2)(3)均屬之。「金融機構防漂綠參考指引」是金管會於2024年5月30日另行發布的行政指導，提醒金融機構避免誇大或選擇性揭露永續特徵，不是路徑圖2.0的推動事項，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2833,"w":1,"sw":0.00307,"id":"20科技力-17"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"20-49","stem":"新加坡政府為打造成為「智慧國家」，積極推動金融保險科技的發展。而下列敘述何者錯誤？","opts":["成立國際智慧金融中心，提升金融科技發展效率","成立金融科技辦公室，提供金融保險科技一站式支持","建置金融保險科技平台，加強監理機關與科技業者間之交流","設置金融創新網路(AFIN)實驗環境，降低金融科技實驗成本"],"ans":3,"exp":["📝 解析：依教材整理，新加坡推動智慧國家的金融科技措施包括：MAS設金融科技與創新小組、成立金融科技辦公室（FinTech Office）提供一站式支持、設置東協金融創新網路（AFIN）API實驗平台降低實驗成本等。官方答案認定(3)「建置金融保險科技平台加強監理機關與科技業者交流」非新加坡措施，故選(3)；其餘三項依教材為正確敘述。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8167,"w":1,"sw":0.00307,"id":"20科技力-49"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"19-27","stem":"下列敘述何者錯誤？","opts":["在發展金融科技的前提下建構金融穩定，首先須創造一個讓使用者得共同信賴且得以協作的環境","金融科技的發展則須仰賴公部門、私部門與金融使用者的三方協力","公部門、私部門與金融使用者的三方需先行累積足夠的信賴感，並且明確劃定個人資料與資訊安全維護的責任，建構合理的協作模式，如此方能創造金融穩定的環境","無論是金融科技、監理科技或法遵科技之發展，應由政府制定相關規範後，強制所有使用者遵循"],"ans":4,"exp":["📝 解析：金融科技、監理科技與法遵科技的發展，強調公部門、私部門與金融使用者三方協力、建立互信並劃定個資與資安責任，而非由政府單方制定規範「強制所有使用者遵循」，故(4)錯誤。(1)(2)(3)均為建構金融穩定的正確觀念。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.45,"w":1,"sw":0.02901,"id":"19科技力-27"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"19-41","stem":"在我國目前金融科技發展與創新實驗條例之規定中，有關有創新實驗之金融商品或服務的曝險金額限制，下列敘述何者正確？","opts":["消費信貸金額以新臺幣一百萬元為限","保險商品之保費以新臺幣五萬元為限","消費信貸與保險商品以外的金融商品以新臺幣五十萬元為限","總曝險金額以新臺幣二億元為限"],"ans":4,"exp":["📝 解析：依「金融科技創新實驗管理辦法」§5：實驗契約之資金、交易或暴險總額不得逾新臺幣1億元，經審查會議決議放寬後最高不得逾2億元，故(4)為正確答案。單一參與者（專業投資機構除外）限額：消費信貸50萬元（非100萬）、保險保費或服務費10萬元或保額100萬元（非5萬）、其餘商品或服務25萬元（非50萬）。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.6833,"w":1,"sw":0.02901,"id":"19科技力-41"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"19-49","stem":"有關各國為支持金融保險科技所設置單位之功能敘述，下列何者錯誤？","opts":["新加坡金融管理局(MAS)內部成立金融科技與創新小組，隨時檢討調整政策及檢視法規，因應創新需要","香港保險業聯合會(HKFI)在金融科技中心成立特別工作小組，與監理機關共同探討在促進保險科技創新下，如何重視消費者權益","英國政府為金融保險科技提供「監理實驗區」，希望有效解決金融科技發展之資金需求","德國財政部在2016 年推動FinCamp 活動，希望金融科技發展中透過交流在嚴格之監理與鼓勵創新中尋求一平衡點"],"ans":3,"exp":["📝 解析：英國FCA的「監理沙盒」是讓業者在有限範圍內測試創新商品，降低法規不確定性與上市時間，而非解決金融科技業者的「資金需求」，故(3)錯誤。(1)新加坡MAS成立金融科技與創新小組、(2)香港保險業聯會成立工作小組、(4)德國財政部2016年推動FinCamp，均為正確敘述。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8167,"w":1,"sw":0.02901,"id":"19科技力-49"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"18-16","stem":"我國金融科技／保險科技發展路徑圖中推動「科技中立」原則之內涵，下列何者錯誤？","opts":["鼓勵運用技術精進經營效率及效能","建立公平競爭環境","增加消費者福祉及提高產業競爭力","將金融監理思維轉化為功能及行為導向"],"ans":4,"exp":["📝 解析：我國金融科技發展路徑圖的「科技中立」原則，是指不限定特定技術，鼓勵業者運用技術提升效率、建立公平競爭環境、增進消費者福祉與產業競爭力。「金融監理思維轉化為功能及行為導向」屬「功能性監理」的另一原則，非科技中立內涵，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2667,"w":1,"sw":0.02901,"id":"18科技力-16"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"18-41","stem":"我國「金融科技發展與創新實驗條例」規定，全部創新實驗期間最長為多久？","opts":["5 年","3 年","2 年","1 年"],"ans":2,"exp":["📝 解析：依「金融科技發展與創新實驗條例」§9，創新實驗期間以1年為限，必要時可申請延長一次、不得超過6個月；但涉及應修正法律者，延長次數不受限，全部實驗期間最長不得超過3年，故選(2)。"],"pos":0.6833,"w":1,"sw":0.02901,"id":"18科技力-41"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"17-34","stem":"有關我國金融監理沙盒機制，下列敘述何者錯誤？","opts":["主管機關為金管會","僅限金融業者申請","廠商的實驗時間有限制","廠商需申請並獲通過後才可進入沙盒"],"ans":2,"exp":["📝 解析：依「金融科技發展與創新實驗條例」§4，自然人、獨資或合夥事業、法人皆可申請辦理創新實驗，不限金融業者（科技新創也可申請），故(2)錯誤。(1)主管機關為金管會（§2）；(3)依§9實驗期間以1年為限，可延長一次最長6個月，涉及應修正法律者延長不限次數但全部期間不得逾3年；(4)須經申請並核准後才可進入沙盒。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5667,"w":1,"sw":0.01201,"id":"17科技力-34"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"17-49","stem":"下列何者非金管會為提升監理沙盒之運作效率所積極辦理之事項？","opts":["提升創新團隊對監理沙盒之認識","研擬跨市場客戶資料共享機制","協助創新團隊溝通與實驗進行","持續完善監理沙盒之效益評估作業流程"],"ans":2,"exp":["📝 解析：金管會為提升監理沙盒運作效率所推動的事項，包括辦理說明會與輔導以提升創新團隊對沙盒的認識、透過金融科技創新園區與窗口協助團隊溝通及實驗進行、持續完善實驗結束後的效益評估流程，(1)(3)(4)皆屬之。「研擬跨市場客戶資料共享機制」屬開放銀行／資料共享政策範疇，不是提升沙盒效率的措施，選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8167,"w":1,"sw":0.01201,"id":"17科技力-49"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"17-60","stem":"根據我國金管會2020 年公布的《金融科技發展路徑圖》，下列何項非屬後新冠疫情時代，國際間金融服務與金融科技的監理挑戰？","opts":["支付與借貸服務大幅成長","監理過度導致過度借貸","金融排斥可能加劇","金融科技產業整併可能帶來風險"],"ans":2,"exp":["📝 解析：金管會2020年《金融科技發展路徑圖》引用國際觀察指出後疫情時代的監理挑戰，包括非接觸式支付與數位借貸服務大幅成長、可能導致消費者過度借貸、數位落差使金融排斥加劇、金融科技業者整併帶來集中風險等。(2)把因果寫成「監理過度導致過度借貸」並不正確——過度借貸的疑慮來自數位借貸快速擴張而非監理過度，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":1.0,"w":1,"sw":0.01201,"id":"17科技力-60"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"15-19","stem":"最早在2015 年推出「監理沙盒」制度，提供監理實驗區支持科技新創產業的是哪個國家？","opts":["美國","英國","日本","新加坡"],"ans":2,"exp":["📝 解析：英國金融行為監理總署（FCA）於2015年11月提出監理沙盒（Regulatory Sandbox）制度，2016年5月開始受理，是全球最早的監理沙盒，選(2)英國。新加坡於2016年跟進；我國則於2018年4月30日施行「金融科技發展與創新實驗條例」。"],"pos":0.3167,"w":1,"sw":0.01201,"id":"15科技力-19"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"14-50","stem":"下列何項非屬金融監督管理委員會引導金融業創新發展所採取的措施？","opts":["實施「金融科技發展與創新實驗條例」","成立金融科技發展與創新中心","設立金融科技創新園區","鼓勵雲端計算商業化"],"ans":4,"exp":["📝 解析：金管會引導金融創新的具體措施包括：施行《金融科技發展與創新實驗條例》（2018 年 4 月 30 日施行，即監理沙盒）、成立金融科技發展與創新中心（2015 年 9 月先設金融科技辦公室，2018 年 2 月 22 日擴編為該中心）、設立金融科技創新園區 FinTechSpace（2018 年）。「鼓勵雲端計算商業化」不是金管會引導金融創新的措施（雲端產業推動屬經濟部等範疇），故選(4)。","🏷 名稱更新：2025-01-01起該中心業務併入金管會「金融市場發展及創新處」，文件應改用新名稱；仍屬金管會創新措施，答案仍為(4)","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8333,"w":1,"sw":0.01201,"id":"14科技力-50"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"13-59","stem":"根據《2021 台灣金融科技趨勢展望》報告，請問下列敘述何者錯誤？","opts":["金融科技領域的標竿國家均尚未對於新興科技應用提出新規範","歐盟2019 年頒布「可信任的人工智慧倫理規範」","美國「演算法問責法案」擬要求特定的企業與機構，需針對其自動決策系統與數據保護機制，執行影響性評估","新加坡政府於2020 年1 月公布「人工智慧監管模式框架」更新版"],"ans":1,"exp":["📝 解析：《2021 台灣金融科技趨勢展望》指出，標竿國家已陸續針對新興科技（尤其 AI）提出規範，故說「均尚未提出新規範」錯誤。其餘皆為實例：歐盟 2019 年 4 月發布「可信任人工智慧倫理準則」、美國 2019 年提出「演算法問責法案」要求對自動決策系統做影響評估、新加坡 2020 年 1 月公布「人工智慧監管模式框架」第二版。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9833,"w":1,"sw":0.01201,"id":"13科技力-59"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"12-20","stem":"我國主管機關推動金融科技／保險科技發展路徑圖，依其四大目標及原則預計幾年內完成？","opts":["四年","三年","二年","一年"],"ans":2,"exp":["📝 解析：金管會 2020 年 8 月發布《金融科技發展路徑圖》，以三年（2020～2023 年）為期，依其目標與原則推動八大面向、60 項措施；保險科技發展路徑亦以三年為期。故選(2)。"],"pos":0.3333,"w":1,"sw":0.01201,"id":"12科技力-20"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"12-41","stem":"金管會2016 年發表的金融科技發展策略白皮書中，要完成的五大基礎建設不包括下列何項？","opts":["生物辨識","共享經濟","區塊鏈","雲端服務"],"ans":2,"exp":["📝 解析：金管會 2016 年 5 月發布的《金融科技發展策略白皮書》，所列五大基礎建設為：行動金融（行動通訊）、雲端服務、大數據、生物辨識、區塊鏈（口訣「行雲大生區」）。共享經濟不在其中，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6833,"w":1,"sw":0.01201,"id":"12科技力-41"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"7-38","stem":"金融數位化創新業務之跨產業商業模式，主要直接面對下列何者可能帶來的挑戰？","opts":["跨業監理議題","跨境監理議題","洗錢監理議題","傳統監理議題"],"ans":1,"exp":["📝 解析：答案(1)：金融數位化創新的跨產業商業模式（如電商、電信、科技業者提供支付、借貸服務）橫跨金融與非金融業，會落入不同主管機關的權責，直接面對「跨業監理」的挑戰，例如由誰監理、規範標準是否一致。跨境監理針對跨國服務，洗錢監理與傳統監理並非此模式最直接的挑戰。"],"pos":0.6333,"w":1,"sw":0.01201,"id":"7科技力-38"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"7-39","stem":"有關數位金融創新可能帶來的監理挑戰，下列敘述何者錯誤？","opts":["商業模式在不同監理機構或是監理情境的解讀下，不可能產生監理不一致","跨境提供服務具備相當大的監理挑戰","虛擬世界的身分識別對傳統金融監理中執行的KYC 作業程序造成巨大的影響","許多交易在線上完成，消費者的權益與資料保護面臨挑戰"],"ans":1,"exp":["📝 解析：答案(1)錯誤：同一個創新商業模式在不同監理機構、不同國家或情境下，可能被解讀為不同業務（如支付或存款），「很可能」產生監理不一致或監理套利。跨境服務監理挑戰大（2）、虛擬身分識別衝擊 KYC（3）、線上交易使消費者權益與資料保護面臨挑戰（4），皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.65,"w":1,"sw":0.01201,"id":"7科技力-39"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"7-59","stem":"因應金融數位化創新所帶來的監理挑戰，有關「消費者的權益與資料保護」之監理考量重點，下列敘述何者錯誤？","opts":["金融業者如何在適當的利用目的下取得客戶的資料以進行風險控管的工作","跨業的聯盟與整合下如何控管與保護資料的傳遞，特別是個人資料方面","如何透過數據分析，從使用者體驗的角度學習其消費經驗與行為動因，協助強化保障客戶權益的相關管理措施","如何在服務平台上有效實現系統控制機制，以彌補不再具備人工控制的金融服務上的控制強度"],"ans":4,"exp":["📝 解析：「消費者的權益與資料保護」的監理考量著重於：在適當目的下取得與利用客戶資料、跨業聯盟時個資傳遞的控管、透過數據分析強化客戶權益保障，即選項(1)(2)(3)。選項(4)「以系統控制機制彌補不再有人工控制的控制強度」屬於「業者內部控制／作業風險」的監理考量，不是消費者權益與資料保護，故為錯誤敘述。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9833,"w":1,"sw":0.01201,"id":"7科技力-59"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":0,"n":1,"refs":"6-39","stem":"我國金融管理機構對於電子支付業務採用何種制度進行資格審查？","opts":["許可制","報備制","註冊制","申報制"],"ans":1,"exp":["📝 解析：
