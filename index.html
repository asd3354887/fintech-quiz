月更新的人工智慧發展原則，下列敘述何者正確？","opts":["利害關係人應積極參與可信賴人工智慧之負責任管理","人工智慧因為其產生內容之不確定性以及不可解釋性並未特別進行規範","人工智慧參與者應根據角色和背景對系統正常運作負責，除此之外無特別約束","人工智慧系統生命週期內應保持穩健與安全，確保在特定使用情境下能穩定運行第二部分：第41~60 題(每題2 分)"],"ans":1,"exp":["📝 解析：OECD AI 原則（2024年5月更新）第1.1條：利害關係人應積極參與可信賴 AI 的負責任管理（responsible stewardship），故(1)正確。(2)OECD 原則正是針對 AI 的透明與可解釋性進行規範；(3)AI 參與者除負責系統正常運作外，還須進行系統性風險管理等義務；(4)原則1.4要求在正常使用、可預見誤用及不利情況下都要穩健安全，不只「特定使用情境」。（(4)句尾「第二部分…」為試卷排版殘字。）","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.6667,"w":1,"sw":0.00276,"id":"21科技力-40"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"21-43","stem":"下列哪一項不是大數據分析在風險管理中的應用？","opts":["衡量客戶信用風險評分","預測企業可能出現的風險，制定風險管理策略","分析市場波動與流動性以擬定財務風險策略","依據客戶網路互動行為全自動推送產品建議"],"ans":4,"exp":["📝 解析：大數據在風險管理的應用包括：衡量客戶信用風險評分、預測企業可能風險並制定策略、分析市場波動與流動性擬定財務風險策略。依網路互動行為自動推送產品建議屬精準行銷，不是風險管理，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7167,"w":1,"sw":0.00276,"id":"21科技力-43"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"20-4","stem":"一般認知的大數據四大特徵，不包括下列何者？","opts":["具時效性","具多樣性","具大量性","具低成本性"],"ans":4,"exp":["📝 解析：大數據四大特徵（4V）：大量性（Volume）、時效性／速度（Velocity）、多樣性（Variety）、真實性（Veracity）。處理大數據需投入大量儲存與運算資源，「低成本性」不是其特徵，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0667,"w":1,"sw":0.00307,"id":"20科技力-04"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"20-5","stem":"下列何者是大數據資料分析步驟中，使用來處理資料遺缺、重覆、不一致以及數值誤植與檢核錯誤等問題？","opts":["統計分析","數據清理","收集數據","採取行動"],"ans":2,"exp":["📝 解析：數據清理（Data Cleaning）是在分析前處理遺漏值、重複資料、不一致、數值誤植與檢核錯誤等問題，確保資料品質，是分析成敗的關鍵步驟。收集數據在其前、統計分析在其後，採取行動則是依分析結果做決策。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0833,"w":1,"sw":0.00307,"id":"20科技力-05"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"20-6","stem":"隨著自然語言處理的發展，為了進一步解讀人類的情感和思考，進而更有效率地處理問題，機器可以根據人類的什麼東西進行解讀？","opts":["臉型中的眼神、眨眼或說話","肢體中的扭腰、擺臀或跳躍","手語中的手勢、力度或動作","語言中的語音、語意或語法"],"ans":4,"exp":["📝 解析：自然語言處理以人類的「語言」為對象，透過分析語音（聲調、語氣）、語意（意義）與語法（結構）來解讀情感與意圖，例如情緒分析。眼神、肢體動作、手勢屬電腦視覺或動作辨識範疇。"],"pos":0.1,"w":1,"sw":0.00307,"id":"20科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"20-8","stem":"在證券業方面，台灣人工智慧的可能運用，下列何者較不具效益？","opts":["證券研究分析","買賣決策支援","市場風險管理","紙本證券真偽檢測"],"ans":4,"exp":["📝 解析：AI 在證券業可用於研究分析、買賣決策支援、市場風險管理等。我國上市櫃有價證券已全面無實體化，以集保帳簿劃撥交付，紙本證券真偽檢測的需求極低，運用 AI 效益最小，故選(4)。"],"pos":0.1333,"w":1,"sw":0.00307,"id":"20科技力-08"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"20-44","stem":"史蒂芬史匹柏的電影「A.I.」中，主角男孩屬於下列何種人工智慧？","opts":["應用型人工智慧","通用型人工智慧","普通型人工智慧","人類型人工智慧"],"ans":2,"exp":["📝 解析：電影「A.I.」中的機器人男孩大衛能像人一樣思考、學習並產生情感（愛），具備跨領域的通用智慧，屬於「通用型人工智慧」（強人工智慧），故選(2)。應用型（弱）AI只能處理特定任務；「普通型」「人類型」並非正式分類名稱。"],"pos":0.7333,"w":1,"sw":0.00307,"id":"20科技力-44"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"20-52","stem":"下列何者非屬業者對系統運用演算法的監控機制？","opts":["為尊重系統運作，不可對產出結果進行測試","應理解演算法所使用之方法論","進行輸出測試，以確定符合所預期之結果","指派人員監管該系統"],"ans":1,"exp":["📝 解析：業者使用演算法應建立監控機制：理解演算法所用的方法論、對輸出進行測試確認符合預期、指派人員監管系統。(1)「為尊重系統運作，不可對產出結果進行測試」違反監控原則——正是要持續測試產出結果才能發現偏誤與異常，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8667,"w":1,"sw":0.00307,"id":"20科技力-52"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"20-59","stem":"下列何者是執行機器學習的主要技術？","opts":["廣度學習","深度學習","資料蒐集","資料倉儲"],"ans":2,"exp":["📝 解析：深度學習是機器學習的一個分支，以多層（多隱藏層）類神經網路自動學習特徵，是目前實現機器學習最主要的技術，故選(2)。「廣度學習」非主流技術名稱；資料蒐集與資料倉儲是資料準備／儲存環節，不是學習技術本身。"],"pos":0.9833,"w":1,"sw":0.00307,"id":"20科技力-59"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"20-60","stem":"截至2023 年，下列何者不是應用在金融服務的主要AI 技術？","opts":["機器學習","量子計算","認知計算","機器人流程自動化"],"ans":2,"exp":["📝 解析：截至2023年，金融服務中主要應用的AI技術為機器學習、認知計算、機器人流程自動化（RPA）、自然語言處理等。量子計算仍在研發與早期實驗階段，尚未成為金融業主流應用的AI技術，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":1.0,"w":1,"sw":0.00307,"id":"20科技力-60"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"19-4","stem":"傳統資料庫是以下列何種方式來存儲資料？","opts":["結構化方式","非結構化方式","半結構化方式","連續方式"],"ans":1,"exp":["📝 解析：傳統（關聯式）資料庫以預先定義欄位與資料型態的表格儲存資料，即「結構化」方式，可用SQL查詢，故選(1)。非結構化資料（影音、文件）與半結構化資料（JSON、XML）通常需用NoSQL或其他方式處理。"],"pos":0.0667,"w":1,"sw":0.02901,"id":"19科技力-04"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"19-5","stem":"下列何種資料類型必須經過前置處理程序來進行格式標準化，以產生結構化描述資訊，作為未來更多的加值利用？","opts":["半結構化資料類型","非結構化資料類型","結構化資料類型","關聯性資料類型"],"ans":2,"exp":["📝 解析：非結構化資料（文字、影像、影音等）沒有固定格式，必須先經前置處理（如萃取特徵、標註、轉換格式）產生結構化的描述資訊（Metadata），才能進一步加值分析，故選(2)。結構化資料已有固定欄位，不需此類標準化處理。"],"pos":0.0833,"w":1,"sw":0.02901,"id":"19科技力-05"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"19-7","stem":"下列何種技術可以讓電腦模仿人類大腦的運算，讓電腦像人一樣思考？","opts":["認知計算","模糊計算","邊緣計算","雲端計算"],"ans":1,"exp":["📝 解析：認知計算（Cognitive Computing）結合機器學習、自然語言處理、推理等技術，模仿人腦的學習、理解與判斷方式（如IBM Watson），讓電腦像人一樣思考，故選(1)。邊緣計算是在資料源附近處理資料；雲端計算是透過網路提供運算資源；模糊計算非此意。"],"pos":0.1167,"w":1,"sw":0.02901,"id":"19科技力-07"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"19-8","stem":"有關機器學習訓練與預測的敘述，下列何者錯誤？","opts":["分析是指利用大量數據分析找出可能的規則","判斷電子郵件是否為垃圾郵件，就是一種機器預測","機器學習中，模型可說是不同變數間存在數學或機率上的規則","大部分機器學習不需收集數據也可以進行訓練"],"ans":4,"exp":["📝 解析：機器學習必須先收集大量數據，從中找出規則（建立模型）後才能預測，(4)「大部分不需收集數據也可訓練」錯誤。(1)分析是從大量數據找規則、(2)垃圾郵件判斷是典型預測（分類）應用、(3)模型即變數間的數學或機率規則，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1333,"w":1,"sw":0.02901,"id":"19科技力-08"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"19-34","stem":"適合運用於例行性、重複性高之作業，可以加速作業時間，提高客戶滿意度並降低成本，讓員工無需執行例行性的單純工作而能更專注在高價值的工作，指的是下列何種技術？","opts":["區塊鏈","認知計算","自然語言處理","機器人流程自動化"],"ans":4,"exp":["📝 解析：機器人流程自動化（RPA）以軟體機器人模擬人在電腦上的操作，適合規則明確、重複性高的例行作業（如資料輸入、對帳），可縮短作業時間、降低成本，讓員工專注高價值工作，故選(4)。區塊鏈是分散式帳本；認知計算與自然語言處理偏重理解與判斷。"],"pos":0.5667,"w":1,"sw":0.02901,"id":"19科技力-34"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"19-36","stem":"下列何種機器學習是所有資料都沒有標註，機器透過尋找資料的特徵，自己進行分類？","opts":["監督式學習","非監督式學習","半監督式學習","強化式學習"],"ans":2,"exp":["📝 解析：非監督式學習的訓練資料完全沒有標註答案，機器自行尋找資料特徵進行分群（如K-means），故選(2)。監督式學習資料全部有標註；半監督式為少量標註＋大量未標註；強化式學習透過與環境互動的獎懲回饋學習。"],"pos":0.6,"w":1,"sw":0.02901,"id":"19科技力-36"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"19-38","stem":"資料本身格式相對不固定，型態也較為多元，但表達及呈現卻也是最直覺清楚，如一支影片、一個網頁等，係指下列何種資料結構？","opts":["結構化資料","半結構化資料","非結構化資料","TXT 格式資料"],"ans":3,"exp":["📝 解析：非結構化資料沒有固定格式、型態多元，如影片、圖片、網頁、文件，對人而言表達最直覺，但電腦需先處理才能分析，故選(3)。結構化資料為表格欄位；半結構化資料（JSON、XML）帶有標籤但不固定。"],"pos":0.6333,"w":1,"sw":0.02901,"id":"19科技力-38"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"19-40","stem":"人工智慧使用運算晶片如GPU，未來運用在特定人工智慧特定應用領域的專用晶片，稱為下列何者？","opts":["ASIC","FPGA","CUDA","LOGIC 第二部分：第41~60 題(每題2 分)"],"ans":1,"exp":["📝 解析：ASIC（Application-Specific Integrated Circuit，特定應用積體電路）是為特定用途設計的專用晶片，如Google TPU，運算效率與功耗表現優於通用GPU，故選(1)。FPGA是可程式化邏輯閘陣列；CUDA是NVIDIA的GPU平行運算平台，非晶片。"],"pos":0.6667,"w":1,"sw":0.02901,"id":"19科技力-40"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"19-44","stem":"有關2023 年推出新一代的語言模型GPT-4 屬性之敘述，下列何者正確？","opts":["至今尚無法定論為弱人工智慧或強人工智慧","屬於弱人工智慧","屬於強人工智慧","GPT-4 與人工智慧一點關聯都沒有"],"ans":1,"exp":["📝 解析：官方答案為(1)：GPT-4能處理多種語言與推理任務，部分研究（如微軟2023年「AGI火花」論文）認為已顯露通用智慧跡象，但多數學者仍視為大型語言模型的特定能力，故教材認定究竟屬弱或強人工智慧「尚無定論」。(4)顯然錯誤；(2)(3)均為單方觀點，不選。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.7333,"w":1,"sw":0.02901,"id":"19科技力-44"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"19-57","stem":"有關網路爬蟲，下列敘述何者正確？","opts":["網路爬蟲是一種可傳播式病毒，網站經營者可透過防火牆設計予以阻擋","網路爬蟲是一種透過虛實整合概念來讓使用者在雲端上飼養昆蟲","網路爬蟲是一種自動化網路資料蒐集機制，可由程式設計師自行設計擷取的資料對象","網路爬蟲是一種受歡迎的流量擴增技術，可使網站經營者增加許多具收益價值的流量"],"ans":3,"exp":["📝 解析：網路爬蟲（Web Crawler）是自動化瀏覽網頁並擷取資料的程式，程式設計師可自訂擷取目標（如價格、新聞），常用於大數據蒐集，故(3)正確。(1)爬蟲不是病毒；(2)與飼養昆蟲無關；(4)大量爬蟲反而會增加網站負擔，不是增加有收益價值的流量。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.95,"w":1,"sw":0.02901,"id":"19科技力-57"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"19-60","stem":"有關深度學習演算法，下列敘述何者正確？","opts":["遞迴式類神經網絡是人工神經網路中最普遍的型態之一，在此架構下資料係從輸入層通過隱藏層後到輸出層進行單向傳導，其內部結構中不會出現迴路","卷積神經網路是由一個或多個卷基層，與一個或多個全連接層來形成一個標準多層神經網路，透過此結構可以在每一層萃取出越來越複雜的特徵以決定輸出值","前饋神經網路是神經網路的神經元包含迴圈的人工神經網路，適合處理有序列性的輸入值","長短期記憶神經網路是一種由兩套相互競爭的神經網路組成的非監督式深度學習系統"],"ans":2,"exp":["📝 解析：卷積神經網路（CNN）由一或多個卷積層（搭配池化層）與全連接層組成，逐層萃取越來越複雜的特徵，常用於影像辨識，故(2)正確。(1)描述的是前饋神經網路（單向、無迴路），不是遞迴式；(3)描述的是遞迴神經網路RNN（含迴圈、適合序列資料）；(4)描述的是生成對抗網路GAN，不是長短期記憶網路LSTM。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":1.0,"w":1,"sw":0.02901,"id":"19科技力-60"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"18-4","stem":"CSV、JSON 及XML 資料格式均是用來敘述下列何種資料類型？","opts":["結構化","非結構化","半結構化","關聯型式"],"ans":3,"exp":["📝 解析：依教材分類，CSV、JSON、XML等格式帶有分隔符號或標籤描述資料，但結構不像關聯式資料庫那樣嚴格固定，歸為「半結構化」資料，故選(3)。結構化資料指資料庫表格；非結構化資料指影音、圖片、自由文字。"],"pos":0.0667,"w":1,"sw":0.02901,"id":"18科技力-04"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"18-6","stem":"下列何項因素並非人工智慧第三次熱潮的發展基礎？","opts":["半導體技術的進步","電腦運算能力提昇","雲端儲存變得便宜","金融科技的發展"],"ans":4,"exp":["📝 解析：AI第三次熱潮（約2010年後）的發展基礎是：半導體進步（如GPU）、電腦運算能力提升、雲端儲存變便宜，以及大數據可得。金融科技是AI的「應用領域」之一，不是AI發展的基礎，故選(4)。"],"pos":0.1,"w":1,"sw":0.02901,"id":"18科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"18-7","stem":"下列何者非日本Socity 5.0 計畫建立以人為本之AI 社會原則？","opts":["尊重人類尊嚴","反數位性","多元與普惠性","永續性"],"ans":2,"exp":["📝 解析：日本Society 5.0「以人為本之AI社會原則」的基本理念為：尊重人類尊嚴、多元與包容（普惠）、永續性。「反數位性」與推動數位化社會的目標相反，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1167,"w":1,"sw":0.02901,"id":"18科技力-07"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"18-8","stem":"下列關於強人工智慧之敘述，何者錯誤？","opts":["強人工智慧也可稱為「通用人工智慧」","要求電腦的智慧需要有推理能力","截至目前為止，發展也成熟","等同於人類的機器智慧與學習系統"],"ans":3,"exp":["📝 解析：強人工智慧（通用人工智慧，AGI）要求機器具備推理、學習與等同人類的智慧，可處理各種領域問題。截至目前尚未發展成熟，仍屬研究目標，故(3)「發展已成熟」錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1333,"w":1,"sw":0.02901,"id":"18科技力-08"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"18-35","stem":"定期自動於公開網站擷取資料，以進行數據分析，通常會採用下列何種技術？","opts":["爬蟲","搜尋引擎","資料探勘","Kali"],"ans":1,"exp":["📝 解析：定期自動從公開網站擷取資料，使用的是網路爬蟲（Web Crawler）技術，故選(1)。搜尋引擎雖然內部使用爬蟲，但本身是檢索服務；資料探勘是分析已取得的資料；Kali是滲透測試用的Linux系統。"],"pos":0.5833,"w":1,"sw":0.02901,"id":"18科技力-35"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"18-36","stem":"深度學習中「深度」的意思是神經網路中包含許多下列何者？","opts":["輸入層","運算層","隱藏層","輸出層"],"ans":3,"exp":["📝 解析：深度學習的「深度」指類神經網路在輸入層與輸出層之間包含許多「隱藏層」，層數越多越能學習複雜特徵，故選(3)。"],"pos":0.6,"w":1,"sw":0.02901,"id":"18科技力-36"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"18-40","stem":"若人工智慧能達到模仿人類解決特定問題的功能，是屬於下列何種人工智慧？","opts":["弱人工智慧","中人工智慧","強人工智慧","混合式人工智慧第二部分：第41~60 題(每題2 分)"],"ans":1,"exp":["📝 解析：弱人工智慧（應用型AI）只能模仿人類解決「特定」問題，如下棋、語音辨識、影像判讀，故選(1)。強人工智慧則具備跨領域的通用智慧；「中人工智慧」「混合式人工智慧」不是正式分類。"],"pos":0.6667,"w":1,"sw":0.02901,"id":"18科技力-40"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"18-57","stem":"透過觀察環境而行動，並會隨時根據新進來的資料逐步修正，即會根據正負反饋自行修正達到正確結果，係指下列何種類之機器學習？","opts":["強化式學習","監督式學習","非監督式學習","半監督式學習"],"ans":1,"exp":["📝 解析：強化式學習透過代理人與環境互動，依行動結果得到正向或負向回饋（獎懲），逐步修正策略以達最佳結果（如AlphaGo自我對弈），故選(1)。監督式需有標註答案；非監督式自行分群；半監督式結合少量標註資料。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.95,"w":1,"sw":0.02901,"id":"18科技力-57"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"18-58","stem":"有關AI 人工智慧，下列敘述何者正確？","opts":["深度學習的一項分支是機器學習","聲音辨識(Siri)、Google AlphaGo，是強人工智慧的例子","目前發展成熟，且在許多領域已實現應用的是「通用人工智慧」","弱人工智慧是以「機器學習」或以演算法為基礎的認知能力，可以取代人類部分的思維、決策，針對特定功能做出與人類相同的決策，甚至表現得比人類更好"],"ans":4,"exp":["📝 解析：(4)正確：弱人工智慧以機器學習或演算法為基礎，可在特定功能上做出與人相同甚至更好的決策。(1)錯在顛倒：深度學習是機器學習的分支；(2)Siri、AlphaGo只處理特定任務，屬弱人工智慧；(3)目前發展成熟並廣泛應用的是弱人工智慧，通用人工智慧尚未實現。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.9667,"w":1,"sw":0.02901,"id":"18科技力-58"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"18-60","stem":"金管會「金融業運用人工智慧(AI)之核心原則與相關推動政策」之敘述中，「生成式 AI 產出之資訊，仍需由金融機構人員就其風險進行客觀且專業的管控」，屬於下列何者？","opts":["保護隱私及客戶權益","重視公平性及以人為本的價值觀","確保系統穩健性與安全性","落實透明性與可解釋性"],"ans":2,"exp":["📝 解析：金管會2023年「金融業運用AI之核心原則」共六項：建立治理及問責機制、重視公平性及以人為本的價值觀、保護隱私及客戶權益、確保系統穩健性與安全性、落實透明性與可解釋性、促進永續發展。其中「以人為本」強調人類監督（Human-in-the-loop），生成式AI產出仍須由人員客觀專業管控，屬第2項，故選(2)。"],"pos":1.0,"w":1,"sw":0.02901,"id":"18科技力-60"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"17-4","stem":"下列何者是利用樣本統計值來推測母體特徵的分析方法？","opts":["敘述統計","大數據分析","推論統計","人工智慧分析"],"ans":3,"exp":["📝 解析：推論統計是以樣本統計值（如樣本平均數）推估母體參數，並進行假設檢定與信賴區間估計，故選(3)。敘述統計只描述樣本本身的特徵（平均、標準差），不推論母體。"],"pos":0.0667,"w":1,"sw":0.01201,"id":"17科技力-04"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"17-6","stem":"下列關於弱人工智慧之敘述，何者錯誤？","opts":["弱人工智慧也可稱為「應用型人工智慧」","希望電腦能幫助解決某個需要高度智力才能解決的議題","它可以在單一領域達到媲美人類的成就，但不能解決其他對人類而言相對容易的問題","基本上要求它跟人類一樣有全面智慧"],"ans":4,"exp":["📝 解析：弱人工智慧（Weak/Narrow AI，又稱應用型AI）只在特定領域解決需要高度智力的問題，例如下棋、影像辨識，可在單一領域媲美甚至超越人類，但無法處理其他對人類很容易的事。要求電腦「跟人類一樣具備全面智慧」是強人工智慧（通用AI）的定義，故(4)錯誤；(1)(2)(3)皆為弱AI的正確描述。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1,"w":1,"sw":0.01201,"id":"17科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"17-33","stem":"有關機器學習(Machine Learning, ML)和深度學習(Deep Learning, DL)，下列敘述何者錯誤？","opts":["機器學習是深度學習的子類","CNN、RNN 是深度學習的技術","機器學習還有其他非深度學習的技術","深度學習是利用神經網路提取特徵進行學習"],"ans":1,"exp":["📝 解析：三者關係是：人工智慧 ⊃ 機器學習 ⊃ 深度學習，深度學習是機器學習的一個子類（分支），故(1)「機器學習是深度學習的子類」說反了。(2)CNN、RNN是深度學習技術；(3)機器學習另有決策樹、SVM、KNN等非深度學習方法；(4)深度學習以多層類神經網路自動提取特徵，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.55,"w":1,"sw":0.01201,"id":"17科技力-33"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"17-35","stem":"依據民國112 年12 月28 日公布「金融業運用人工智慧(AI)指引」草案內容，「人類主動參與監督，並保留完全的控制權，AI 系統僅係提供建議或資訊。除非人類下達命令要求AI 系統決策，否則AI 系統不能進行決策」之敘述，是屬於人類在AI 系統決策過程中之哪種監督機制？","opts":["人在指揮(Human-in-command)","人在迴圈內(Human-in-the-loop)","人在迴圈上(Human-over-the-loop)","無法指揮階段"],"ans":2,"exp":["📝 解析：金融業運用AI指引（112年12月草案、113年6月正式發布）將人類監督分為：人在迴圈內（Human-in-the-loop）＝人類主動參與並保留完全控制權，AI只提供建議，除非人類下令否則AI不能自行決策；人在迴圈上（Human-over-the-loop）＝AI可自行決策，人類在旁監督並可隨時介入調整；人在迴圈外（Human-out-of-the-loop）＝AI自主決策、無人介入。題目敘述符合「人在迴圈內」，選(2)。"],"pos":0.5833,"w":1,"sw":0.01201,"id":"17科技力-35"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"17-39","stem":"下列何者不屬於人工智慧演算法中的盲目搜尋範疇？","opts":["循序搜尋","深度優先搜尋","廣度優先搜尋","一致代價搜尋"],"ans":1,"exp":["📝 解析：AI中的盲目搜尋（無資訊搜尋，Uninformed Search）是在狀態空間中不使用啟發資訊的搜尋策略，包括廣度優先搜尋、深度優先搜尋、一致代價搜尋（Uniform-cost）、深度限制與反覆加深搜尋等。循序搜尋（Sequential Search）是在資料串列中逐筆比對的基本查找演算法，不屬AI盲目搜尋範疇，選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.65,"w":1,"sw":0.01201,"id":"17科技力-39"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"17-40","stem":"下列何者不屬於大數據分析的資料清理對象？","opts":["處理遺漏值","處理偏離值","處理重複值","處理交換值第二部分：第41~60 題(每題2 分)"],"ans":4,"exp":["📝 解析：大數據分析的資料清理（Data Cleaning）主要處理：遺漏值（刪除或補值）、偏離值／離群值（檢查是否異常並處理）、重複值（去除重複紀錄），以及格式不一致、錯誤值等。並沒有所謂「交換值」這種清理對象，故選(4)。（選項後段「第二部分：第41~60題」為原試卷排版殘字，可忽略。）","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6667,"w":1,"sw":0.01201,"id":"17科技力-40"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"17-43","stem":"下列何者非屬大數據資料分析的五個主要步驟之一？","opts":["結構化數據","數據清理","收集數據","定義問題"],"ans":1,"exp":["📝 解析：大數據資料分析的五個主要步驟一般為：定義問題→收集數據→數據清理（整理）→數據分析（建模）→結果呈現與解讀（視覺化、行動）。「結構化數據」是一種資料型態（如資料庫表格），不是分析步驟，故選(1)；(2)(3)(4)都是五步驟之一。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7167,"w":1,"sw":0.01201,"id":"17科技力-43"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"16-59","stem":"有關深度學習敘述，下列何者正確？","opts":["多數常見的深度學習，目前已不需要人類事先決定","目前最常採用的「資料學習」方法稱為「梯度上升法」","深層網路可以用比淺層網路少的訓練資料，就達成同樣的任務","遞迴式類神經網路(RNN)是無記憶力的演算法"],"ans":3,"exp":["📝 解析：深層網路以多層結構重複利用中間特徵，參數使用較有效率，相較淺層網路可用較少的訓練資料達成同樣任務，故(3)正確。(1)網路架構（層數、神經元數）目前仍多需人類事先設計；(2)最常用的學習方法是「梯度下降法」，不是梯度上升；(4)RNN透過循環連結保留前一步資訊，具有記憶力（LSTM更強化長期記憶）。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.9833,"w":1,"sw":0.01201,"id":"16科技力-59"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"16-60","stem":"下列何者演算法非屬深度學習演算法？","opts":["卷積神經網路(CNN)","遞歸神經網路(RNN)","長短期記憶神經網路(LSTM)","K-近鄰演算法(KNN)"],"ans":4,"exp":["📝 解析：卷積神經網路CNN、遞歸神經網路RNN、長短期記憶網路LSTM都是以多層類神經網路為基礎的深度學習演算法。K-近鄰演算法（KNN）是依距離找最相近的K筆資料來分類或預測的傳統機器學習方法，沒有神經網路，不屬深度學習，選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":1.0,"w":1,"sw":0.01201,"id":"16科技力-60"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"15-9","stem":"電腦擁有推理、學習、規劃、語言溝通、知覺等全面能力，可稱為下列何者？","opts":["弱人工智慧","高人工智慧","強人工智慧","類人工智慧"],"ans":3,"exp":["📝 解析：強人工智慧（Strong AI／通用人工智慧AGI）是指電腦具備如人類般的推理、學習、規劃、語言溝通、知覺等全面能力，選(3)。弱人工智慧只在單一特定領域表現出色；「高人工智慧」「類人工智慧」並非學術上的分類名稱。"],"pos":0.15,"w":1,"sw":0.01201,"id":"15科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"15-60","stem":"下列敘述何者正確？","opts":["人工智慧是深度學習之一種分類","機器學習是深度學習的一個分支","深度學習主要是從資料分類，進行預測","深度學習希望把資料透過多個處理層中的線性或非線性轉換，自動抽取出足以代表資料特性的特徵"],"ans":4,"exp":["📝 解析：深度學習是以多個處理層（類神經網路）對資料做線性或非線性轉換，自動抽取出足以代表資料特性的特徵，(4)正確。(1)關係反了，深度學習是AI的一種；(2)也反了，深度學習才是機器學習的分支；(3)深度學習可用於分類、迴歸、生成等多種任務，重點在自動特徵學習，不只是「從資料分類進行預測」。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":1.0,"w":1,"sw":0.01201,"id":"15科技力-60"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"14-5","stem":"在半結構化的資料格式中，何種格式已漸成為現今網際網路傳輸的主流格式？","opts":["jpg","mp4","JSON","PDF"],"ans":3,"exp":["📝 解析：半結構化資料具有標籤或鍵值結構但不像資料庫表格那樣固定，常見格式為JSON與XML；其中JSON（JavaScript Object Notation）輕量易讀，已成為網際網路與API傳輸的主流格式，選(3)。jpg、mp4屬非結構化的影像影音檔；PDF也多視為非結構化文件。"],"pos":0.0833,"w":1,"sw":0.01201,"id":"14科技力-05"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"14-7","stem":"下列何者非屬企業運用大數據分析主要可能面臨的困難？","opts":["數據分析人才不足","找不到合適的數據分析廠商或團隊","跨部門數據整合不足","未有清晰的數據分析目標"],"ans":2,"exp":["📝 解析：企業運用大數據分析的主要困難是內部問題：缺乏數據分析人才、跨部門資料各自為政難整合、沒有清晰的分析目標與商業問題。市場上數據分析廠商與顧問團隊眾多，「找不到合適廠商」並非主要困難，選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1167,"w":1,"sw":0.01201,"id":"14科技力-07"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"14-9","stem":"對圖像小修改動，使圖形識別演算發生錯誤，稱為下列何種攻擊？","opts":["洪水","山洪","颶風","對抗"],"ans":4,"exp":["📝 解析：對抗攻擊（Adversarial Attack）是在圖像中加入人眼難以察覺的微小擾動（對抗樣本），使深度學習影像辨識模型高信心地判斷錯誤，例如把貼了貼紙的停車標誌辨識成速限標誌，選(4)。洪水、山洪、颶風皆非AI攻擊的名稱。"],"pos":0.15,"w":1,"sw":0.01201,"id":"14科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"14-44","stem":"圍棋機器人依照人類對手的反饋修正自己棋路，這在機器學習裡，屬於下列何者？","opts":["監督式學習","半監督式學習","非監督式學習","強化式學習"],"ans":4,"exp":["📝 解析：強化式學習是讓模型與環境互動，依據得到的獎勵／懲罰（反饋）調整策略，圍棋機器人（如 AlphaGo）依對局勝負修正棋路即屬此類。監督式學習需事先標註答案的資料、非監督式學習從未標註資料找結構、半監督式則混用少量標註資料，皆不是靠互動反饋修正。"],"pos":0.7333,"w":1,"sw":0.01201,"id":"14科技力-44"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"13-6","stem":"大數據在金融業的應用已相當普遍，何者非其產生的效用及價值？","opts":["瞭解客戶的需求，精準行銷","客戶關係管理","風險管理應用","降低雲端運算的需求"],"ans":4,"exp":["📝 解析：大數據在金融業的價值包括精準行銷（了解客戶需求）、客戶關係管理、風險管理（信用評分、詐欺偵測）等。大數據需要大量儲存與運算資源，通常反而「增加」對雲端運算的需求，說能降低雲端需求錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1,"w":1,"sw":0.01201,"id":"13科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"13-9","stem":"金融業的開戶審核、授信與徵審流程與智慧化客戶服務等，可以藉用何項技術而達到自動化的效果？","opts":["機器人流程自動化","客戶行為模型","自然語言處理","認知計算"],"ans":1,"exp":["📝 解析：機器人流程自動化（RPA）是以軟體機器人模擬人員操作，處理規則明確、重複性高的作業，例如開戶審核、授信徵審資料彙整、客服流程，達到自動化效果。客戶行為模型屬分析工具、自然語言處理處理語言理解、認知計算模擬人腦推理，都不是直接的流程自動化技術。"],"pos":0.15,"w":1,"sw":0.01201,"id":"13科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"13-47","stem":"下列何者非屬臉部身分辨識的常見用途？","opts":["識別VIP 客戶","即時推播專屬客群化的廣告","預測用戶犯罪機率","紀錄觀賞者行為數據供大數據分析"],"ans":3,"exp":["📝 解析：臉部辨識的常見商業用途包括：識別 VIP 客戶以提供專屬服務、依辨識出的客群屬性即時推播廣告、記錄觀賞者行為數據供大數據分析。臉部辨識只能比對身分與外觀特徵，無法「預測犯罪機率」，這也涉及嚴重的倫理與歧視爭議，並非常見用途。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7833,"w":1,"sw":0.01201,"id":"13科技力-47"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"13-60","stem":"知名的《啤酒和尿布》數據分析案例，請問該案例最初使用何種機器學習演算法？","opts":["關聯","降維","分類","聚類"],"ans":1,"exp":["📝 解析：「啤酒與尿布」案例是零售業從交易紀錄發現兩者常被一起購買，使用的是關聯規則（Association Rule，如 Apriori 演算法，以支持度、信賴度衡量）分析購物籃。降維是壓縮變數、分類是預測已知類別、聚類是把相似資料分群，都不是找「一起出現」的規則。"],"pos":1.0,"w":1,"sw":0.01201,"id":"13科技力-60"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"12-7","stem":"下列何者非大數據發展的困難與挑戰？","opts":["師資不足","資料合法性","資料共享安全性","人才不足"],"ans":1,"exp":["📝 解析：大數據發展的主要挑戰是：資料蒐集與使用的合法性（個資保護）、資料共享的安全性、專業人才不足。「師資不足」並非一般所列的大數據發展困難，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1167,"w":1,"sw":0.01201,"id":"12科技力-07"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"12-9","stem":"有關機器學習訓練與預測步驟的順序，下列何者正確？","opts":["建模、分析、收集、預測","收集、分析、建模、預測","分析、建模、收集、預測","收集、建模、分析、預測"],"ans":2,"exp":["📝 解析：機器學習的流程為：先「收集」資料，再「分析」（清理、探索、特徵工程），接著「建模」（選演算法並訓練），最後用模型「預測」新資料，故(2)正確。其他選項順序顛倒，例如沒有資料就無法分析或建模。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.15,"w":1,"sw":0.01201,"id":"12科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"12-10","stem":"下列何者非推動西元2000 年以後人工智慧快速發展的因素？","opts":["超導體技術的進步","電腦運算能力提昇","雲端儲存成本下降","大數據的發展"],"ans":1,"exp":["📝 解析：2000 年後 AI 快速發展的三大推力是：電腦運算能力提升（GPU）、雲端儲存成本下降、大數據累積可供模型訓練。超導體技術與這波 AI 發展無直接關係，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1667,"w":1,"sw":0.01201,"id":"12科技力-10"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"12-43","stem":"大數據技術領域進入門檻高，下列何者非其所需具備的基礎或技能？","opts":["基礎統計學(Basic Statistics)","經濟學(Economics)","機器學習(Machine Learning)","深度學習(Deep Learning)"],"ans":2,"exp":["📝 解析：大數據技術領域需要的核心基礎是統計學、機器學習、深度學習，以及程式與資料處理能力。經濟學屬於應用領域知識，並非進入大數據技術所必備的技能，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7167,"w":1,"sw":0.01201,"id":"12科技力-43"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"12-49","stem":"美國亞馬遜公司的無人實體購物商店「Amazon-Go」，運用人工智慧攝錄系統與機器演算法，主要用以得知未購物者的何種資訊？","opts":["年齡性別","職業身分","商品偏好","會員等級"],"ans":3,"exp":["📝 解析：Amazon Go 以攝影機、感測器與 AI 演算法追蹤顧客在店內拿取、放回的商品，即使最後沒買，也能得知其「商品偏好」，用於商品陳列與推薦。系統主要記錄購物行為，不以辨識年齡性別、職業身分或會員等級為目的。"],"pos":0.8167,"w":1,"sw":0.01201,"id":"12科技力-49"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"12-60","stem":"根據KPMG 2020 年「生活在人工智慧的世界」的美國企業調查，下列何項活動未列入AI 最具影響力應用的前三位？","opts":["程式交易","流程自動化","風險管理評估","詐欺防制"],"ans":1,"exp":["📝 解析：依 KPMG 2020 年《生活在人工智慧的世界》美國企業調查，金融業認為 AI 最具影響力的前三大應用為流程自動化、風險管理評估、詐欺防制。程式交易未列入前三名，故選(1)。"],"pos":1.0,"w":1,"sw":0.01201,"id":"12科技力-60"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"11-1","stem":"根據聯合國UNSGSA 之報告，「信用風險評估」這項新的服務所需使用的技術種類不包括下列何者？","opts":["大數據","人工智慧","雲端計算","區塊鏈"],"ans":4,"exp":["📝 解析：依 UNSGSA 報告，「信用風險評估」新服務主要運用大數據（含替代性資料）、人工智慧（機器學習評分模型）與雲端計算（運算與儲存）。區塊鏈主要用於支付、身分與交易紀錄，不是信用風險評估所需的技術，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0167,"w":1,"sw":0.01201,"id":"11科技力-01"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"11-5","stem":"隨著大數據應用的爆發性增長，也衍生出不少問題需克服，下列何者非大數據存儲所主要面對的問題？","opts":["容量的問題","安全上的問題","流動性的問題","存儲系統的靈活性"],"ans":3,"exp":["📝 解析：大數據儲存面對的主要問題為：容量（資料量爆增）、安全（資料保護與存取控制）、存儲系統的靈活性（可擴充性），以及延遲、成本等。「流動性」是金融上的資金變現概念，不是資料存儲的問題，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0833,"w":1,"sw":0.01201,"id":"11科技力-05"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"11-8","stem":"模仿人類大腦的計算系統，讓電腦像人一樣思考。接受數據作為輸入時，它可以接受不精確或模糊的輸入，不需要組織化或格式化的數據，之後即可根據接收到的資訊提供正確的回答，為AI 的何種技術？","opts":["認知計算","雲端計算","自然語言處理","機器人流程自動化"],"ans":1,"exp":["📝 解析：認知計算（Cognitive Computing）模仿人腦運作，可接受不精確、模糊、非結構化的資料，經推理與學習後提供答案，代表例為 IBM Watson。雲端計算是資源提供模式、自然語言處理只處理語言理解、RPA 是依規則執行重複流程，皆不符題意。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.1333,"w":1,"sw":0.01201,"id":"11科技力-08"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"11-9","stem":"資料處理若存在偏差，例如貸款信用評分資訊可能會歧視貧窮人獲得貸款，這對下列何者將產生不良影響？","opts":["金融普惠","金融融通","金融發行","金融兌換"],"ans":1,"exp":["📝 解析：若資料或演算法存在偏差（如信用評分歧視窮人），弱勢族群將更難取得貸款等金融服務，直接傷害「金融普惠」（Financial Inclusion，讓所有人都能平等取得金融服務）的目標。其他選項並非專有概念。"],"pos":0.15,"w":1,"sw":0.01201,"id":"11科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"11-10","stem":"人工智慧在金融方面應用的加速，不包括下列何種原因？","opts":["大數據發展，尤其非結構化資料","資通訊硬體設備的高價化","機器學習技術的進步","消費者對技術的信任提昇"],"ans":2,"exp":["📝 解析：AI 在金融應用加速的原因包括：大數據（尤其非結構化資料）發展、機器學習技術進步、消費者對技術的信任提升，以及資通訊硬體設備「低價化」（運算與儲存成本下降）。說硬體「高價化」是原因錯誤，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1667,"w":1,"sw":0.01201,"id":"11科技力-10"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"11-45","stem":"下列何種種類的學習不是機器學習？","opts":["強化式學習","非強化式學習","監督式學習","非監督式學習"],"ans":2,"exp":["📝 解析：機器學習一般分為監督式學習、非監督式學習、半監督式學習與強化式學習。「非強化式學習」並不是一種機器學習類別，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.75,"w":1,"sw":0.01201,"id":"11科技力-45"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"11-46","stem":"有關人工智慧的敘述，下列何者錯誤？","opts":["機器有智慧不一定代表必須像人類一樣思考","機器展現出感知、推理、學習、動作行為都可稱人工智慧","機器學習就是機器依照撰寫程式的設定，對已知資料做分類","應用型人工智慧和人類的能力是互補的"],"ans":3,"exp":["📝 解析：機器學習是讓機器從資料中自行學習規律並改進表現，而不是單純依照程式設定的固定規則對已知資料分類，故(3)錯。其餘正確：機器有智慧不必像人類一樣思考；展現感知、推理、學習、動作行為都可稱 AI；應用型（弱）AI 與人類能力互補。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7667,"w":1,"sw":0.01201,"id":"11科技力-46"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"10-5","stem":"「金管會」與「金融監督管理委員會」兩個資料意義上皆表示同一機構，而在電腦數據中卻會認為是兩筆不同資料，這是屬於下列何種數據清理的問題？","opts":["資料遺缺問題","重覆資料問題","不一致性問題","數值誤植及檢核錯誤問題"],"ans":3,"exp":["📝 解析：「金管會」與「金融監督管理委員會」指同一機構，卻因寫法不同被電腦當成兩筆資料，屬於資料表示方式不統一的「不一致性問題」，清理時需建立對照表統一名稱。資料遺缺是欄位空白、重覆資料是同一筆記錄寫法完全相同而重複出現、數值誤植是輸入錯誤。"],"pos":0.0833,"w":1,"sw":0.01201,"id":"10科技力-05"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"10-6","stem":"有關數據資料大小單位的敘述，下列何者錯誤？","opts":["1KB=1,024Bytes","1MB=1,024KB","1GB=1,024MB","1PB=1,024GB"],"ans":4,"exp":["📝 解析：數據單位依序為 1KB＝1,024 Bytes、1MB＝1,024KB、1GB＝1,024MB、1TB＝1,024GB、1PB＝1,024TB。1PB 應等於 1,024TB（約 1,048,576GB），不是 1,024GB，故(4)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1,"w":1,"sw":0.01201,"id":"10科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"10-9","stem":"下列何者非近年人工智慧於金融應用加速的驅動力？","opts":["機器學習方面技術進展快速","大數據 (Big Data) 的發展","金融消費者的期待","消費者對技術的信任降低"],"ans":4,"exp":["📝 解析：近年 AI 在金融應用加速的驅動力包括：機器學習技術快速進展、大數據發展、金融消費者對個人化與即時服務的期待，以及消費者對技術的信任「提升」。說信任降低是驅動力錯誤，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.15,"w":1,"sw":0.01201,"id":"10科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"10-10","stem":"人工智慧是以「機器學習」為基礎的認知能力，針對特定功能做出與人類相同的決策，甚至表現得比人類更好，例如影像辨識、聲音辨識 (Siri)、Google AlphaGo、IBM Watson 或谷歌自駕車，可稱為下列何者？","opts":["弱人工智慧","高人工智慧","強人工智慧","類人工智慧"],"ans":1,"exp":["📝 解析：弱人工智慧（Narrow／Weak AI）是在特定功能上做出與人類相同、甚至更好的決策，如影像辨識、Siri、AlphaGo、IBM Watson、自駕車，現有 AI 皆屬此類。強人工智慧是具備與人類同等的通用智慧與自我意識，目前尚未實現；高人工智慧、類人工智慧不是標準分類。"],"pos":0.1667,"w":1,"sw":0.01201,"id":"10科技力-10"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"10-15","stem":"銀行可以透過架設於門口的攝影機，藉由下列何種技術讓服務人員可以在重要客戶(Very Important Person)一進門便辨識出來，立即給予專屬的特別服務？","opts":["靜脈辨識","人臉辨識","指紋辨識","簽名辨識"],"ans":2,"exp":["📝 解析：人臉辨識屬非接觸式，可透過門口攝影機在客戶走進時遠距、自動辨識身分，讓服務人員立即認出 VIP 客戶並提供專屬服務。靜脈、指紋、簽名辨識都需要客戶主動接觸設備或配合操作，無法在進門瞬間辨識。"],"pos":0.25,"w":1,"sw":0.01201,"id":"10科技力-15"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"10-46","stem":"有關機器學習的敘述，下列何者錯誤？","opts":["是非題是一種基本的機器學習要解決的分類問題","機器學習是深度學習的一種應用","機器學習是人工智慧的分支之一","運用已知學習分類未知就是一種機器學習"],"ans":2,"exp":["📝 解析：答案(2)錯誤：關係應是「人工智慧 ⊃ 機器學習 ⊃ 深度學習」，深度學習是機器學習的一種（以多層類神經網路為基礎），不是機器學習為深度學習的應用。是非題屬二元分類問題（1）、機器學習是 AI 分支（3）、以已知資料學習後分類未知資料（4）皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7667,"w":1,"sw":0.01201,"id":"10科技力-46"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"9-9","stem":"人工智慧交易因為採取類似演算法，加大市場波動，導致產生下列何種效應？","opts":["牛群","羊群","狼群","魚群"],"ans":2,"exp":["📝 解析：答案(2)：人工智慧交易若各家採用相似的演算法與資料，會在同一時間做出相同買賣決策，形成「羊群效應」（herding effect），使價格同向劇烈波動、放大市場風險，這也是監理機關關注 AI 交易的原因。牛群、狼群、魚群並非金融市場慣用的效應名稱。"],"pos":0.15,"w":1,"sw":0.01201,"id":"9科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"9-10","stem":"下列何種學習適合用來分析複雜、多維度的數據，比如影像、音訊、影片、時間序列和文字檔等，或像是即時數據流、感測器數據等？","opts":["視覺學習","深度學習","體驗式學習","聽覺學習"],"ans":2,"exp":["📝 解析：答案(2)：深度學習（Deep Learning）以多層類神經網路自動擷取特徵，特別適合處理影像、音訊、影片、時間序列、文字等複雜高維度資料，以及即時資料流與感測器資料。視覺學習、體驗式學習、聽覺學習是教育學上的學習風格，不是機器學習技術。"],"pos":0.1667,"w":1,"sw":0.01201,"id":"9科技力-10"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"9-44","stem":"利用網頁爬蟲程式(Crawler)抓取網頁資料與透過API 方式取得資料，關於兩者的敘述何者錯誤？","opts":["網頁爬蟲程式(Crawler)所抓取到的資料，資料取得較為即時，正確性也較高","一般來說API 方式取得的資料欄位，比爬蟲程式抓取的資料要完整","API 方式需要資料擁有者的授權才可以使用，而網頁爬蟲程式不用","網頁爬蟲程式(Crawler)會因為網頁改版導致抓不到資料，而API 方式不會"],"ans":1,"exp":["📝 解析：答案(1)錯誤：網頁爬蟲是解析網頁畫面擷取資料，受網頁更新頻率、版面改版與解析錯誤影響，即時性與正確性通常「低於」由資料擁有者直接提供的 API。API 欄位通常較完整（2）、須經資料擁有者授權（3）、不受網頁改版影響（4），皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7333,"w":1,"sw":0.01201,"id":"9科技力-44"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"8-7","stem":"有關半結構化資料(Semi-structured Data)的敘述，下列何者正確？","opts":["一般常用的半結構性資料格式大致可分為CSV、JSON、XML 等三類","CSV 格式被廣泛作為跨系統或跨平台之間交換的標準","XML 格式資料可以從MS EXCEL 軟體以另存檔案方式得到","JSON 格式資料可讓資料傳輸量上升，提高瀏覽網頁效率"],"ans":null,"exp":["📝 解析：官方答案為一律給分，未公布理由。教材將常見半結構化資料格式列為 CSV、JSON、XML 三類，(1) 應為出題原意；但 MS Excel 確實可「另存」為 XML 試算表格式，(3) 也說得通，可能因此送分。(2) 依教材，XML 才是跨系統、跨平台資料交換的通用標準；(4) 錯：JSON 格式精簡，是「降低」傳輸量、提高網頁效率。","⚠ 本題官方答案為一律給分（送分），依教材最合理答案為(1)。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.1167,"w":1,"sw":0.01201,"id":"8科技力-07"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"8-8","stem":"甲乙丙丁四位專家在一場論壇中各自分享人工智慧對金融業重要性的看法，請問下列敘述何者錯誤？","opts":["甲：人工智慧可提昇反洗錢的偵防品質","乙：流程自動化，主要在簡化重複工作與資源浪費","丙：弱人工智慧與人類的互補關係目前並不存在","丁：人工智慧技術將有利於強化對客戶的了解"],"ans":3,"exp":["📝 解析：答案(3)錯誤：弱人工智慧（專精特定任務的 AI，如客服機器人、詐欺偵測）目前正與人類形成互補，由 AI 處理大量重複運算、由人做最終判斷，互補關係是存在的。AI 可提升反洗錢偵防品質（1）、流程自動化簡化重複工作（2）、強化對客戶的了解（4），皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1333,"w":1,"sw":0.01201,"id":"8科技力-08"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"8-46","stem":"將偽造資料引入模型用以扭曲AI 演算法，稱為何種攻擊？","opts":["洪水","山洪","颶風","對抗"],"ans":1,"exp":["📝 解析：答案(1)：依教材，將大量偽造資料引入模型、使 AI 演算法學習結果被扭曲的攻擊稱為「洪水攻擊」（學術上常稱資料投毒 data poisoning）。「對抗攻擊」是對輸入資料加入人眼難察覺的微小擾動，讓已訓練好的模型誤判，攻擊對象不同；山洪、颶風不是 AI 攻擊名稱。"],"pos":0.7667,"w":1,"sw":0.01201,"id":"8科技力-46"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"8-55","stem":"2018 年，道瓊指數暴跌千點，以及同年台股選擇權大跌542 點，被認為是程式交易的何種風險所造成？","opts":["事件／流動性風險","資安風險","作業風險","道德風險"],"ans":1,"exp":["📝 解析：答案(1)：2018 年2月道瓊指數盤中暴跌千點以上，同月台股重挫 542 點且台指選擇權價格異常（0206 事件），被認為是程式交易在市場急跌時同步觸發停損賣單，造成流動性瞬間枯竭、價格崩跌，屬「事件／流動性風險」。資安風險是系統被入侵，作業風險是內部流程或人為疏失，道德風險是利益衝突。"],"pos":0.9167,"w":1,"sw":0.01201,"id":"8科技力-55"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"7-8","stem":"在大數據資料分析中，資料通常會有一些不確定性，需歸納且整理出具真實性及具可預測性的資料性，此種是屬於大數據的哪個特徵？","opts":["Volume","Variety","Velocity","Veracity"],"ans":4,"exp":["📝 解析：答案(4)：大數據常見特徵 4V：Volume（資料量大）、Variety（資料型態多樣）、Velocity（產生與處理速度快）、Veracity（真實性）。Veracity 強調資料存在不確定性與雜訊，需清理、驗證出真實且具預測性的資料，正符合題意。"],"pos":0.1333,"w":1,"sw":0.01201,"id":"7科技力-08"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"7-10","stem":"有關數位通路資料(網站互動記錄)的敘述，下列何者錯誤？","opts":["數位通路行為蒐集的二大主要目的為「理解訪客特質」與「管理網站內容與功能分析」","數位通路資料分析只能針對有登錄過帳號後的客戶進行分析","數位通路資料分析可讓通路的管理人員以科學化的技術及工具，強化商機的育成","數位行為可與結構化資料進行整合，以建立各強大的分析內容"],"ans":2,"exp":["📝 解析：答案(2)錯誤：數位通路行為資料可透過 Cookie、裝置識別碼等方式追蹤，未登入的匿名訪客也能分析其瀏覽路徑與偏好，並非只能分析已登入的客戶。數位通路蒐集目的為理解訪客特質與網站功能分析（1）、科學化育成商機（3）、可與結構化資料整合分析（4），正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1667,"w":1,"sw":0.01201,"id":"7科技力-10"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"7-20","stem":"Google 搜尋引擎和 YouTube 影音平台將使用者輸入的關鍵字儲存分析，以提供使用者可能有興趣的廣告，這樣的作法又稱為關鍵字行銷。下列何者並非關鍵字行銷的必要項目？","opts":["建置有用的網路服務，吸引使用者創建帳戶","對個別帳戶蒐集輸入的關鍵字歷程並進行分析","建置自有雲端平台，以掌握服務的穩定度","合理的收費機制，如當使用者點擊了廣告才向廣告主收費"],"ans":3,"exp":["📝 解析：答案(3)：關鍵字行銷的必要項目是：吸引使用者建立帳戶的服務（1）、蒐集分析個別帳戶的關鍵字歷程（2）、依點擊等方式向廣告主收費的合理機制（4）。是否建置「自有」雲端平台只是基礎設施的選擇，可租用公有雲，並非關鍵字行銷的必要項目。"],"pos":0.3333,"w":1,"sw":0.01201,"id":"7科技力-20"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"7-25","stem":"有關大數據分析處理平台在金融業務上的應用，下列何者錯誤？","opts":["作為客戶身份識別","預測客戶回應行為，強化行銷成效","透過客戶資料分析，發展通路管理","進行企業流動性風險管理與個人信用風險"],"ans":1,"exp":["📝 解析：答案(1)：教材所列大數據分析平台在金融業務的應用包括預測客戶回應行為強化行銷（2）、通路管理（3）、流動性與信用風險管理（4）。客戶身分識別屬身分認證機制（如證件核對、憑證、生物辨識），不是大數據分析平台的主要應用。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4167,"w":1,"sw":0.01201,"id":"7科技力-25"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"7-29","stem":"下列何者不是企業級SQL 引擎的資料儲存方式？","opts":["DFS","HBase","Hive","Pig"],"ans":4,"exp":["📝 解析：答案(4)：企業級 SQL 引擎（如 Hadoop 生態系）的資料儲存方式包括分散式檔案系統 DFS（HDFS）、HBase（分散式欄式資料庫）、Hive（資料倉儲，以 SQL 查詢儲存在 HDFS 的資料表）。Pig 是以 Pig Latin 腳本語言撰寫資料處理流程的工具，屬資料處理而非儲存方式。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.01201,"id":"7科技力-29"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"7-43","stem":"下列何種不是我們常用的資料探勘手法？","opts":["資料分群：將資料中相似的個體聚集在一起，並以人為判定的方法，將資料分為數個群體","類神經網路：將資料的特徵透過電腦進行類似腦與神經的處理技術，再將結果作不同的呈現","迴歸分析：瞭解兩個或多個變數間是否相關，相關的方向與強度為何？並建立數學模型以便觀察特定變數","假設檢定：統計上對參數的假設，就是對一個或多個參數的論述。它通常反應了執行檢定的研究者對參數可能數值的另一種(對立的)看法"],"ans":4,"exp":["📝 解析：答案(4)：常用的資料探勘手法包括資料分群（1）、類神經網路（2）、迴歸分析（3）、決策樹、關聯規則等，用於從大量資料中找出規律或建立預測模型。假設檢定是傳統統計推論方法，用來驗證研究者對母體參數的既定假設，不是從資料中「探勘」新模式的手法。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7167,"w":1,"sw":0.01201,"id":"7科技力-43"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"7-44","stem":"有關大數據分析的應用層次，下列敘述何者正確？","opts":["流通業常用的購物籃分析係屬於進階預測","瞭解房貸利率調整對授信業務的影響屬於基礎分析","規範分析能夠依據過去和當前事件的瞭解提供運作建議","透過外部環境評估能夠推估未來會發生什麼事"],"ans":3,"exp":["📝 解析：答案(3)：大數據分析層次依序為基礎分析（描述發生什麼事）、進階預測（推估會發生什麼事）、規範分析（依過去與當前事件的了解，建議應採取什麼行動）。(1) 購物籃分析是描述商品關聯，屬基礎分析；(2) 評估利率調整對授信的影響屬預測／模擬分析；(4) 推估未來須以歷史資料建模，單靠外部環境評估不足，故只有(3)正確。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.7333,"w":1,"sw":0.01201,"id":"7科技力-44"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"7-45","stem":"在統計學上常用的大數據分析工具是：","opts":["常態分配","迴歸分析","T 檢定","變異數分析"],"ans":2,"exp":["📝 解析：答案(2)：迴歸分析可建立多個變數之間的數學關係，用來解釋影響因素並進行預測，是統計學上最常用於大數據分析的工具。常態分配是機率分配型態，T 檢定與變異數分析是檢定平均數差異的推論方法，較少作為大數據分析的主要工具。"],"pos":0.75,"w":1,"sw":0.01201,"id":"7科技力-45"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"7-56","stem":"下列哪一項是金融業使用智慧型機器的特色？","opts":["法人機構和個別投資人之間的差異將減少","各種金融業作業將走向一致性","即時事件將無法反應在市場價格上","金融業的整體成本將增加"],"ans":2,"exp":["📝 解析：答案(2)：金融業使用智慧型機器後，作業依相同的演算法與標準化流程執行，各種金融作業將走向一致性、標準化。(1) 法人機構擁有更快的運算與資料優勢，與個別投資人的差距不必然縮小；(3) 智慧機器使即時事件「更快」反映在價格上；(4) 自動化使整體成本「降低」。"],"pos":0.9333,"w":1,"sw":0.01201,"id":"7科技力-56"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"6-5","stem":"下列何者不屬於資料倉儲系統定義的四個面向？","opts":["具主題導向的(Subject-Oriented)","具整合性的(Integrated)","具時間區間的(Time-Variant)","可揮發的(Volatile)"],"ans":4,"exp":["📝 解析：依 Bill Inmon 對資料倉儲的定義，四個面向為：主題導向（Subject-Oriented）、整合性（Integrated）、時間區間性（Time-Variant）、非揮發性（Non-Volatile）。資料倉儲的資料載入後通常只供查詢、不隨交易即時修改或刪除，所以是「非揮發」；選項(4)「可揮發的」錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0833,"w":1,"sw":0.01201,"id":"6科技力-05"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"6-6","stem":"下列何者不屬於非結構化文字分析常使用的應用方式？","opts":["線上多維分析","文字屬性分類","情感分析","時間軸分析"],"ans":1,"exp":["📝 解析：非結構化文字分析常見應用有文字屬性分類（主題／類別歸類）、情感分析（正負面口碑）、時間軸分析（話題隨時間的變化）。線上多維分析（OLAP）是針對資料倉儲中結構化資料做切片、鑽取等多維度查詢，不屬於文字分析，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1,"w":1,"sw":0.01201,"id":"6科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"6-7","stem":"金融行業擁有數量龐大的客戶群，無法一一直接詢問客戶的狀況。所以我們希望建立360 度客戶視圖，以充分瞭解客戶狀態。過去以交易資料所建立的客戶視圖和現今以大數據資料所建立的客戶視圖，這兩者之間有什麼不一樣？","opts":["既然都叫作客戶視圖，當然不會有什麼不一樣","透過實體通路記錄客戶的狀態即可，無需建立客戶視圖","客戶視圖只是一個概念，就是觀察金融機構和客戶間的交易記錄，所以過去以交易資料所建立的客戶視圖就己足夠，不需重新建立","除了交易記錄之外，我們還想知道客戶的互動過程及行為資料，所以應用大數據分析的技術，可以知道更多的客戶狀態，更加完整的建立360 度客戶視圖"],"ans":4,"exp":["📝 解析：過去的客戶視圖主要建立在交易紀錄上；大數據時代可再加入客戶在各通路的互動過程、網頁點擊、社群與行為資料等，讓 360 度客戶視圖更完整，故選(4)。選項(1)(3)認為兩者無差別或交易資料已足夠，選項(2)認為只靠實體通路紀錄即可，都忽略了行為資料的價值。"],"pos":0.1167,"w":1,"sw":0.01201,"id":"6科技力-07"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"6-8","stem":"下列何者不屬於社群媒體分析的四個面向？","opts":["蒐集","分群","挖掘","關聯"],"ans":1,"exp":["📝 解析：社群媒體分析的四個面向為：趨勢分析／評估（Social Media Impact）、客戶分群（Segmentation）、衍生話題挖掘（Discovery）、關聯分析（Relationships）。「蒐集」只是取得資料的前置步驟，不是分析面向，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1333,"w":1,"sw":0.01201,"id":"6科技力-08"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"6-9","stem":"下列哪一個大數據的特徵，係指大數據包含結構化與非結構化資料？","opts":["具大量性的","具多樣性的","具不斷傳輸性的","真實性的"],"ans":2,"exp":["📝 解析：大數據常用的 4V：Volume（大量性）、Variety（多樣性）、Velocity（速度／不斷傳輸性）、Veracity（真實性）。其中「多樣性」指資料型態多元，同時包含結構化資料（如交易欄位）與非結構化資料（如文字、影像、影音），故選(2)。"],"pos":0.15,"w":1,"sw":0.01201,"id":"6科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"6-10","stem":"下列何者屬於結構化資料？","opts":["社群媒體資料","多媒體資料","銀行帳號","視訊影像"],"ans":3,"exp":["📝 解析：結構化資料是有固定欄位格式、可直接存入關聯式資料庫表格的資料，例如銀行帳號、交易金額、日期，故選(3)。社群媒體貼文、多媒體檔案、視訊影像都沒有固定欄位結構，屬於非結構化資料。"],"pos":0.1667,"w":1,"sw":0.01201,"id":"6科技力-10"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"6-28","stem":"對於許多企業而言，不斷增長的非結構化資料如電子郵件、社群媒體預示著尚未開發的商機，企業可以透過下列何種分析功能來提升洞察力並將之轉化為全方位視圖形式及時提供給用戶？","opts":["同質運算","超級電腦運算","異質運算","感知運算"],"ans":4,"exp":["📝 解析：選項(4)「感知運算」即認知運算（Cognitive Computing，如 IBM Watson），結合自然語言處理與機器學習，能理解電子郵件、社群媒體等非結構化資料，從中產生洞察並以全方位視圖即時提供給使用者，故選(4)。同質／異質運算是指處理器硬體架構的組合方式；超級電腦運算強調運算效能，都不是對非結構化資料的理解分析能力。"],"pos":0.4667,"w":1,"sw":0.01201,"id":"6科技力-28"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"6-43","stem":"下列何者不屬於大數據分析的三個應用層次？","opts":["基礎分析","進階預測","規範分析","樣本分析"],"ans":4,"exp":["📝 解析：大數據分析的三個應用層次為：基礎分析（描述性分析，了解發生了什麼）、進階預測（預測性分析，推估會發生什麼）、規範分析（處方性分析，建議該怎麼做）。「樣本分析」不是其中一層，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7167,"w":1,"sw":0.01201,"id":"6科技力-43"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"6-44","stem":"下列哪一種資料探勘的分析手法之目的在於瞭解兩個或多個變數間是否相關？","opts":["資料分群","類神經網路","迴歸分析","決策樹"],"ans":3,"exp":["📝 解析：迴歸分析用來探討兩個或多個變數之間是否相關及其關係強弱（如以收入、年齡解釋消費金額），故選(3)。資料分群是把相似對象歸成群組；類神經網路模仿人腦神經元做分類或預測；決策樹以樹狀規則進行分類。"],"pos":0.7333,"w":1,"sw":0.01201,"id":"6科技力-44"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"6-45","stem":"下列何者不是應用資料倉儲系統進行的查詢分析方式？","opts":["隨興查詢","線上多維分析","資料探勘","語音辨識"],"ans":4,"exp":["📝 解析：應用資料倉儲常見的查詢分析方式有：隨興查詢（Ad hoc Query）、線上多維分析（OLAP）、資料探勘（Data Mining）。語音辨識是把聲音轉成文字的人工智慧技術，不是資料倉儲的查詢分析方式，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.75,"w":1,"sw":0.01201,"id":"6科技力-45"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"5-4","stem":"有關金融行業使用大數據的敘述，下列何者正確？","opts":["金融行業傳統交易類使用的資料大多為非結構化資料","結構化資料屬新興的資料型態，如多媒體資料或社群媒體資料","金融行業處理的交易資料內容中，對每一欄位內容有一定的規範及定義","金融行業只要分析新型態的資料內容即可，結構化資料不需要分析"],"ans":3,"exp":["📝 解析：金融業交易資料屬結構化資料，每個欄位（帳號、金額、日期等）都有一定的規範與定義，故(3)正確。(1)錯：傳統交易類資料多為結構化資料；(2)錯：多媒體、社群媒體資料是非結構化資料；(4)錯：大數據分析應整合結構化與新型態資料，結構化資料仍是分析基礎。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.0667,"w":1,"sw":0.01201,"id":"5科技力-04"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"5-5","stem":"金融業大數據分析的應用，在客戶關係管理上，應以下列何者為其應用方向？","opts":["客戶開戶時，建立客戶個人資料","建立360 度客戶視圖及整合性客戶主檔資訊","協助客戶處理稅務問題","提供公務人員作財產申報之用"],"ans":2,"exp":["📝 解析：大數據在客戶關係管理上的應用方向，是整合交易、互動與行為資料，建立 360 度客戶視圖與整合性客戶主檔，以了解客戶全貌並提供適切服務，故選(2)。開戶建檔只是基本作業；協助稅務、公務員財產申報都不是 CRM 的應用方向。"],"pos":0.0833,"w":1,"sw":0.01201,"id":"5科技力-05"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"5-6","stem":"在社群資料分析的四個面向中，哪一種是用來量化群眾認知、口碑與情感的分析？","opts":["趨勢分析(Social Media Impact)","客戶分群(Social Media Segmentation)","衍生話題(Social Media Discovery)","關聯分析(Social Media Relationships)"],"ans":1,"exp":["📝 解析：社群資料分析四個面向中，趨勢分析（Social Media Impact）用來量化群眾對品牌或議題的認知、口碑與情感（聲量、正負評），故選(1)。客戶分群是把社群使用者依特徵分群；衍生話題挖掘是找出相關新話題；關聯分析是找出人、議題之間的關係。"],"pos":0.1,"w":1,"sw":0.01201,"id":"5科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"5-9","stem":"在情境式行銷的建立中，大數據分析的能力，主要是強化分析一般消費者在數位通路間的互動資訊，其中不包含下列哪一項？","opts":["網頁點擊資訊","數位通路間的往來路徑","其他企業的銷售狀況","對互動式行銷推薦的回應及非結構化文字的分析"],"ans":3,"exp":["📝 解析：情境式行銷中的大數據分析，強化的是消費者在本企業數位通路的互動資訊：網頁點擊資訊、各數位通路間的往來路徑、對互動式行銷推薦的回應與非結構化文字分析。其他企業的銷售狀況不是消費者在數位通路的互動資訊，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.15,"w":1,"sw":0.01201,"id":"5科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"5-27","stem":"下列何者不是大數據儲存平台Hadoop 的元件？","opts":["分散式作業系統iOS","分散式檔案系統HDFS","分散式運算框架MapReduce","分散式資源管理YARN"],"ans":1,"exp":["📝 解析：Hadoop 的核心元件包括：分散式檔案系統 HDFS、分散式運算框架 MapReduce、分散式資源管理 YARN（另有共用函式庫 Hadoop Common）。iOS 是蘋果公司的行動裝置作業系統，不是 Hadoop 元件，也不是分散式作業系統，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.45,"w":1,"sw":0.01201,"id":"5科技力-27"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"5-28","stem":"未來全球大量新增的資料，多數以非結構化或半結構化的形式產生，IT 專業人員使用下列何者來形容此一現象？","opts":["大數據","資料庫","資料倉儲","資料探勘"],"ans":1,"exp":["📝 解析：全球新增資料大量以非結構化或半結構化形式產生，且數量龐大、速度快、型態多元，IT 專業人員以「大數據」（Big Data）形容此現象，故選(1)。資料庫、資料倉儲是儲存與管理資料的系統；資料探勘是從資料中找出規律的分析技術。"],"pos":0.4667,"w":1,"sw":0.01201,"id":"5科技力-28"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"5-45","stem":"在建立客戶價值模型上，下列敘述何者錯誤？","opts":["首先進行業務蒐集與整合，並置入進階分析環境中","導入客戶價值模型定義，設計客戶價值模型架構","貢獻度模型上是利用RFM (Recency、Frequency、Monetary)架構計算客戶關係與忠誠度因子","在潛力模型上利用已知的客戶貢獻度、忠誠度及其他客戶屬性及偏好資訊，推估潛在的客戶銷售潛力"],"ans":3,"exp":["📝 解析：選項(3)錯：利用 RFM（最近一次交易、交易頻率、交易金額）計算客戶關係與忠誠度因子的是「忠誠度模型」，不是貢獻度模型；貢獻度模型主要衡量客戶帶來的收益與利潤。建立客戶價值模型的步驟為先蒐集整合業務資料置入進階分析環境(1)、導入定義設計模型架構(2)，潛力模型則依已知貢獻度、忠誠度與屬性偏好推估銷售潛力(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.75,"w":1,"sw":0.01201,"id":"5科技力-45"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"4-6","stem":"若購買A 產品的消費者通常也傾向購買B 產品，這種可找出同一組商品同時被購買的分析手法稱為：","opts":["迴圈分析","類神經網路","關聯分析","產品分類"],"ans":3,"exp":["📝 解析：找出「買 A 的人通常也買 B」這類同一組商品同時被購買的規則，是關聯分析（Association Analysis，又稱購物籃分析），故選(3)；銀行可用於交叉銷售。類神經網路用於分類或預測；產品分類是依屬性把商品歸類；「迴圈分析」不是資料探勘的分析手法。"],"pos":0.1,"w":1,"sw":0.01201,"id":"4科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"4-7","stem":"下列哪一個不是社群資料分析的四個面向？","opts":["挖掘","評估","統合","分群"],"ans":3,"exp":["📝 解析：社群資料分析的四個面向為：趨勢分析／評估（Impact）、客戶分群（Segmentation）、衍生話題挖掘（Discovery）、關聯分析（Relationships）。「統合」不是其中的面向，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1167,"w":1,"sw":0.01201,"id":"4科技力-07"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"4-8","stem":"數位通路資料的分析方式，通常為：","opts":["資料蒐集的範圍包含網路世界中所有的網站，如PTT","均為即時的蒐集與分析","資料蒐集的範圍僅含網站，不含行動APP","以統一的Cookie ID 為基準作為用戶識別的方式"],"ans":4,"exp":["📝 解析：數位通路（網站、App）的行為分析，通常以同一個 Cookie ID（或裝置 ID）把同一用戶在不同頁面、不同次造訪的足跡串起來，作為用戶識別基準，故選(4)。(1)錯：只能蒐集自家可埋碼的網站／App，無法涵蓋 PTT 等全網路；(2)錯：多數為批次分析，並非全部即時；(3)錯：行動 App 也是數位通路資料的重要來源。"],"pos":0.1333,"w":1,"sw":0.01201,"id":"4科技力-08"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"4-9","stem":"有關金融業應用大數據的分析方向，下列敘述何者錯誤？","opts":["交易資料是客戶已完成交易後的資訊，偏向落後指標","可全面瞭解企業風險資訊，以精準的資訊，支援業務決策","大數據分析有助於客群區隔與排除、優惠精選商品與通路的指派","將風險資訊、資產管理等財務資訊整合一起無助於績效管理"],"ans":4,"exp":["📝 解析：(4)錯：把風險資訊、資產管理等財務資訊整合在一起，正是做績效管理（例如風險調整後報酬、客戶貢獻度）的基礎，整合後「有助於」而非無助於績效管理。(1)交易資料是事後結果，屬落後指標；(2)大數據可全面掌握風險資訊、支援決策；(3)可用於客群區隔、精選商品與通路指派，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.15,"w":1,"sw":0.01201,"id":"4科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"4-27","stem":"下列何者為結合大數據和生物辨識的應用？","opts":["以虹膜認證取代無卡提款","以手機做空中簽名對客戶進行身份認證","以臉型識別技術對客戶進行身份認證","以臉型識別技術觀察客戶對數位看板播放內容的反應，預測客戶的喜好"],"ans":4,"exp":["📝 解析：(4)以臉型識別（生物辨識）觀察客戶看數位看板時的反應，再累積大量反應資料分析、預測客戶喜好，同時用到生物辨識與大數據分析，故選(4)。(1)(2)(3)都只是用生物特徵或簽名做身分認證，屬單純的生物辨識應用，沒有大數據預測成分。"],"pos":0.45,"w":1,"sw":0.01201,"id":"4科技力-27"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"4-29","stem":"便利商店為迅速掌握客戶群推出特定商品廣告，下列何者為其利用大數據的解決方案？","opts":["以買一送一方式適時推出特定商品廣告","以購買金額達到定額就可以抽獎的方式適時推出特定商品廣告","利用紙本問卷調查適時推出特定商品廣告","以臉型識別技術偵測客戶之性別、年齡，適時推出迎合該年齡層的特定商品廣告"],"ans":4,"exp":["📝 解析：以臉型識別即時偵測來客的性別、年齡，再依累積的客群資料推出迎合該族群的商品廣告，屬利用大數據即時掌握客群的解決方案，故選(4)。買一送一、滿額抽獎是傳統促銷手法，紙本問卷則是傳統小樣本調查，都不是大數據方案。"],"pos":0.4833,"w":1,"sw":0.01201,"id":"4科技力-29"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"4-44","stem":"有關資料探勘的敘述，下列何者錯誤？","opts":["資料探勘可以創造資料的規律性","模型需要定期更新","資料探勘只是個工具，還需要業務配合","模型使用者需要對模型演算法有一定的了解"],"ans":1,"exp":["📝 解析：(1)錯：資料探勘是從大量資料中「發掘」既有的規律與樣式（pattern），不能「創造」資料本身沒有的規律。(2)市場與客戶行為會變，模型需定期更新；(3)資料探勘只是工具，需業務單位配合解讀與運用；(4)使用者需對演算法有一定了解才能正確使用結果，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7333,"w":1,"sw":0.01201,"id":"4科技力-44"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"4-45","stem":"請問資料倉儲系統的應用，有下列哪幾項？ a.隨興查詢 (Ad hoc) b.線上多維分析 (OLAP) c.主管決策支援 (EIS) d.資料探勘 (Data Mining)","opts":["僅abc","僅bcd","僅abd","abcd"],"ans":4,"exp":["📝 解析：資料倉儲整合了各系統的歷史資料，可支援 a.隨興查詢（Ad hoc，使用者自行下條件查詢）、b.線上多維分析（OLAP，依產品、地區、時間等維度切片分析）、c.主管決策支援（EIS）、d.資料探勘（Data Mining），四項都是其應用，故選(4)。"],"pos":0.75,"w":1,"sw":0.01201,"id":"4科技力-45"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"3-4","stem":"下列何者為規範分析的特定應用場景？","opts":["以過往的行業知識為依歸，按經驗給出分析的條件","根據長時間累積的事實統計，推估未來可能發生什麼事","針對資料表象上進行解讀，並作量化的數值呈現","根據期望的結果，特定場景、資源以及對過去和當前事件的瞭解給出運作建議"],"ans":4,"exp":["📝 解析：分析層次分為：描述性（發生什麼）、預測性（未來可能發生什麼）、規範性（應該怎麼做）。規範分析是根據期望結果，結合特定場景、可用資源與對過去及當前的了解，直接給出行動建議，故選(4)。(2)是預測分析；(3)是描述性分析；(1)是憑經驗判斷，不屬規範分析。"],"pos":0.0667,"w":1,"sw":0.01201,"id":"3科技力-04"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"3-5","stem":"下列何者為駕馭企業風險的三個構面：","opts":["資訊、流程與組織","基礎分析、進階預測與規範分析","大量、多樣與不斷傳輸資訊","蒐集、運算、分析"],"ans":1,"exp":["📝 解析：教材指出企業要以大數據駕馭風險，須從三個構面著手：資訊（建立完整、即時的風險資料）、流程（把風險管理嵌入作業流程）、組織（權責分工與風險文化），故選(1)。(2)是分析層次；(3)是大數據大量、多樣、不斷傳輸的特徵；(4)是資料處理步驟。"],"pos":0.0833,"w":1,"sw":0.01201,"id":"3科技力-05"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"3-6","stem":"有關大數據「具多樣性」的特徵，下列敘述何者錯誤？","opts":["各式各樣大量的來源資料都可視為分析母體","資料格式是多樣貌的，甚或是沒有格式的","資料來源有結構化資料、亦有非結構化資料","多媒體資料、社群媒體資料、感應器等資料均可進行分析"],"ans":1,"exp":["📝 解析：(1)錯：把大量來源資料「全部」當成分析母體（全量而非抽樣），描述的是大數據的「大量性（Volume）」，不是多樣性。多樣性（Variety）是指資料格式多樣甚至無格式（(2)）、同時有結構化與非結構化資料（(3)）、可分析多媒體、社群、感應器等各種來源（(4)），這三項皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1,"w":1,"sw":0.01201,"id":"3科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"3-7","stem":"有關金融業大數據分析的框架，下列敘述何者正確？","opts":["與客戶間接互動對話","投入大量成本提升執行效率","應用各種風險評分方式評量客戶","使用單一方法確認行銷活動與顧客回應的關係"],"ans":3,"exp":["📝 解析：金融業大數據分析框架會應用各種風險評分方式（如信用評分、行為評分、詐欺評分）評量客戶，作為授信與行銷依據，故(3)正確。(1)錯：強調與客戶「直接」即時互動對話；(2)錯：目標是以合理成本提升效率，不是投入大量成本；(4)錯：應用多種方法驗證行銷活動與顧客回應的關係，而非單一方法。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.1167,"w":1,"sw":0.01201,"id":"3科技力-07"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"3-8","stem":"客戶區隔主要依賴於客戶價值模型的建立，下列何者不是建立的內容？","opts":["建立的過程包含資料蒐集與整合、組織與架構的瞭解、業務經營現況與風險觀察指標","僅以過往歷史交易資料建立貢獻度模型、忠誠度模型、潛力模型","客戶分群中每群的特徵，是由業務人員與分析人員共同討論而得出的結論","分群的結果是要瞭解客群的特色與定義未來的經營策略"],"ans":2,"exp":["📝 解析：(2)錯：客戶價值模型（貢獻度、忠誠度、潛力模型）不能「僅」用過往歷史交易資料建立，還須納入客戶行為、互動、外部與社群等資料，才能反映客戶現況與未來潛力。(1)建立過程包含資料蒐集整合、了解組織架構、業務現況與風險指標；(3)各群特徵由業務與分析人員共同討論；(4)分群目的在了解客群並訂定經營策略，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1333,"w":1,"sw":0.01201,"id":"3科技力-08"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"3-9","stem":"某銀行想運用社群媒體輔助業務進行，下列何者不屬於社群媒體分析？","opts":["透過類神經網路處理文字辨識","蒐集並處理多個社群網站的討論內容","客戶體驗追蹤，並持續關注主要發言者的評價","透過行動裝置與批次報表進行分析，查閱討論原文"],"ans":1,"exp":["📝 解析：社群媒體分析是蒐集多個社群網站的討論內容（(2)）、追蹤客戶體驗與主要發言者評價（(3)）、透過行動裝置與報表分析並查閱原文（(4)），以掌握口碑與輿情。透過類神經網路做文字辨識（如 OCR 辨識手寫或影像中的字），屬影像辨識技術，不是社群媒體分析的內容，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.15,"w":1,"sw":0.01201,"id":"3科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"3-27","stem":"大數據一般以4V 來定義它，下面哪一個和大數據的4V 無關聯？","opts":["數量(Volume)","不斷傳輸性/速度(Velocity)","有效性(Validity)","準確性/真實性(Veracity)"],"ans":3,"exp":["📝 解析：大數據的 4V 是：大量（Volume）、多樣性（Variety）、不斷傳輸性／速度（Velocity）、真實性（Veracity）。有效性（Validity）不在 4V 之內，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.45,"w":1,"sw":0.01201,"id":"3科技力-27"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"3-43","stem":"過往資料庫行銷與現今情境式行銷有何不同？","opts":["情境式行銷能整合線上線下資料進行分析，並按互動的情境導引客戶進行多波段式的行銷","沒有什麼不同，只是名稱不同","只要有多波段式的行銷，就是情境式行銷","只有舉辦用戶體驗(Persona)的研討，就是情境式的行銷"],"ans":1,"exp":["📝 解析：情境式行銷能整合線上與線下資料，依客戶當下互動情境即時導引，並進行多波段的持續行銷，這是它與過去僅以資料庫名單做單次行銷的不同，故選(1)。(2)兩者本質不同；(3)多波段只是其中一個要素，還需依情境互動；(4)只辦用戶體驗研討不等於情境式行銷。"],"pos":0.7167,"w":1,"sw":0.01201,"id":"3科技力-43"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"3-44","stem":"有關情境式行銷的敘述，下列何者錯誤？","opts":["可根據客戶的點擊與互動行為來建立客戶意圖資料庫","應加強社群資料進行數位導流及社群行銷","改以互動資訊作為分析依據，從而推薦適合的商品","透過推薦資訊將客戶導流至交易頁面，行銷波動即行結束"],"ans":4,"exp":["📝 解析：(4)錯：情境式行銷是持續循環的過程，把客戶導流到交易頁面後，還要追蹤其後續行為、回饋分析並啟動下一波段行銷，並非導流後行銷就結束。(1)依點擊互動建立意圖資料庫；(2)加強社群資料做數位導流；(3)以互動資訊分析推薦商品，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7333,"w":1,"sw":0.01201,"id":"3科技力-44"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"3-45","stem":"大數據對銀行業的影響甚大，下列敘述何者錯誤？","opts":["金融大數據分析概念架構，包括資料蒐集與分析、即時互動行銷到全通路客戶互動","情感分析能夠讓銀行業者知道多個社群媒體管道的大量談話語氣與態度，進而掌握公司聲譽狀況","若資料看不出規則時，則可使用資料探勘(data mining)技術來尋找潛在的規則(pattern)","客戶價值模型的建立，必須考慮到客戶貢獻度模型、客戶忠誠度模型及客戶創造力模型"],"ans":4,"exp":["📝 解析：(4)錯：客戶價值模型應包含客戶貢獻度模型、客戶忠誠度模型與客戶「潛力」模型，不是「創造力」模型。(1)分析架構從資料蒐集分析、即時互動行銷到全通路互動；(2)情感分析可掌握社群聲量與公司聲譽；(3)資料看不出規則時以資料探勘尋找潛在規則，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.75,"w":1,"sw":0.01201,"id":"3科技力-45"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-4","stem":"使用結構化交易資料建立資料倉儲系統的分析作法，已應用了二十多年，下列何者為需要建立大數據分析系統，以分析更多來源資料的主要理由？","opts":["因為應用了二十多年的手法是比較落伍的作法，我們必須用比較新的手法來進行分析作業","應用資料倉儲系統資料建立客戶分群與預測分析，是合理而且有效的分析作法，事實上我們不需要分析其他類型的資料","交易資料代表的過去某一個時間點的事實資料，代表已發生的事情。但客戶當下的狀況，卻不能具體作表現，所以我們希望能蒐集客戶的行為資料，以進行更精準的分析","在物聯網盛行的年代，各式各樣的資料都符合大數據所定義的四個V(Volume, Variety, Velocity, Veracity)，所以我們要將所有可取得的資料都蒐集起來進行分析"],"ans":3,"exp":["📝 解析：交易資料只代表過去某個時間點已發生的事實（落後指標），無法呈現客戶當下的狀況與意圖，因此需要建立大數據系統，蒐集客戶的行為資料（瀏覽、互動、社群等），做更精準的分析，故選(3)。(1)不是因為舊方法落伍；(2)錯在認為不需其他資料；(4)錯在主張不論目的蒐集所有資料。"],"pos":0.0667,"w":1,"sw":0.01201,"id":"2科技力-04"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-5","stem":"下列何者不是社群資料分析的四個面向之一？","opts":["評估(Assess)","測試(Test)","分群(Segment)","挖掘(Discover)"],"ans":2,"exp":["📝 解析：教材所列社群資料分析的四個面向，包括評估（Assess，評估聲量與口碑）、分群（Segment，區分討論族群）、挖掘（Discover，從討論中發現議題與洞見）等分析動作；測試（Test）屬行銷活動執行時的 A/B 測試，不在社群資料分析四面向之中，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0833,"w":1,"sw":0.01201,"id":"2科技力-05"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-6","stem":"傳統上應用結構化交易資料所建立的資料倉儲系統，其主要特徵為何？","opts":["具主題導向的 (Subject-Oriented)、具整合性的(Integrated)、具時間區間的(Time-Variant)，以及不可揮發的 (Nonvolatile)等四大特徵所建立的系統","將各來源系統的資料，按其原有的格式，搬移到一套具有大容量的資料庫系統，即為資料倉儲系統","按各式各樣的分析需求，將來源資料萃取到一整合的系統，並加上時間欄位進行儲存，即為資料倉儲系統","按金融行業各項物資的需求，需建立一個倉庫來進儲存及取用，管理這個倉庫的系統即為倉儲系統"],"ans":1,"exp":["📝 解析：資料倉儲之父 Bill Inmon 定義資料倉儲具四大特徵：主題導向（依客戶、產品等主題組織）、整合性（統一各系統資料格式）、具時間區間（保存歷史資料可看變化）、不可揮發（資料載入後不被隨意更改刪除），故選(1)。(2)按原格式搬移欠缺整合；(3)只加時間欄位不足以構成；(4)把倉儲誤解為實體物資倉庫。"],"pos":0.1,"w":1,"sw":0.01201,"id":"2科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-7","stem":"下列何者不算是情境式行銷框架中的重要行動？","opts":["Analyse","Decide","Control","Interact"],"ans":3,"exp":["📝 解析：情境式行銷框架的重要行動是「分析（Analyse）客戶資料與情境 → 決策（Decide）最適推薦 → 互動（Interact）與客戶即時溝通」並持續循環。控制（Control）不屬於該框架的行動，故選(3)。"],"pos":0.1167,"w":1,"sw":0.01201,"id":"2科技力-07"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-8","stem":"傳統上，我們所認知的大數據特徵不包含下列哪一項？","opts":["具大量性的","具多樣性的","具不斷傳輸性的","具主題性的"],"ans":4,"exp":["📝 解析：大數據的傳統特徵是大量性（Volume）、多樣性（Variety）、不斷傳輸性（Velocity）（後來加入真實性 Veracity 成 4V）。「主題性（主題導向）」是資料倉儲的特徵，不是大數據的特徵，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1333,"w":1,"sw":0.01201,"id":"2科技力-08"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-9","stem":"在大數據分析應用三個面向中，下列何者不屬於金融業客戶關係管理的應用？","opts":["績效管理","瞭解客戶","客戶分群","差異化行銷"],"ans":1,"exp":["📝 解析：金融業大數據應用分三個面向：客戶關係管理、風險管理、績效（營運）管理。瞭解客戶、客戶分群、差異化行銷都屬客戶關係管理的應用；績效管理是另一個獨立面向，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.15,"w":1,"sw":0.01201,"id":"2科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-27","stem":"針對大數據相關的資訊工具敘述，下列何者正確？","opts":["區塊鏈一定是去中心化的且必須允許任何人都可以加入","感知運算可以提升機器人的能力使其聽懂更多自然語言的語意","機器人與智慧設備可以完全取代行員，節省營運成本","臉部辨識可以觀察客戶對互動數位內容的反應，完全瞭解客戶的需求"],"ans":2,"exp":["📝 解析：感知運算(Cognitive Computing)結合自然語言處理與機器學習，可讓機器人理解更多自然語言語意，故(2)正確。(1)錯：區塊鏈有公有鏈，也有只限授權節點的私有鏈／聯盟鏈；(3)錯：機器人與智慧設備是輔助，無法「完全」取代行員；(4)錯：臉部辨識可觀察反應，但無法「完全」瞭解客戶需求。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.45,"w":1,"sw":0.01201,"id":"2科技力-27"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-28","stem":"有關Hadoop 的技術應用，下列何者錯誤？","opts":["為Apache 軟體基金會底下的開放原始碼","包含分散式檔案系統 HDFS、分散式運算框架MapReduce 以及分散式資源管理 YARN","Hive 是Hadoop 中的身分認證服務","有些Hadoop 平台提供企業級SQL 引擎"],"ans":3,"exp":["📝 解析：Hive 是建構在 Hadoop 上的資料倉儲工具，提供類 SQL（HiveQL）查詢，並非身分認證服務（Hadoop 的認證通常用 Kerberos），故(3)錯誤。(1)Hadoop 是 Apache 軟體基金會的開源專案；(2)核心包含 HDFS、MapReduce、YARN；(4)部分商用 Hadoop 平台提供企業級 SQL 引擎（如 Impala、IBM Big SQL）。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4667,"w":1,"sw":0.01201,"id":"2科技力-28"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-41","stem":"下列何者為大數據結合數位金融的應用？","opts":["透過QR Code 掃描，提供線上信用卡申辦服務","以虹膜辨識身分，在ATM 進行無卡提款","透過簡訊傳遞帳號，提供手機支付功能","透過社群行為分析，提供網路P2P 借貸業務信用模型建立"],"ans":4,"exp":["📝 解析：大數據的特點是分析大量、多樣化的資料；透過社群行為分析建立 P2P 借貸的信用評分模型，正是大數據結合數位金融的應用，故選(4)。(1)QR Code 申辦、(3)簡訊傳帳號屬數位通路／支付應用；(2)虹膜辨識無卡提款屬生物辨識應用，都不涉及大數據分析。"],"pos":0.6833,"w":1,"sw":0.01201,"id":"2科技力-41"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-43","stem":"大數據分析應用的概念，下列何項敘述較為完整？","opts":["應用框架應包含四大主軸，即資料收集、資料分析、即時互動行銷及全通路客戶互動","大數據分析應包含各類型資料，包含交易資料、互動資料及預測資料，整合這些資料後，進行各項客戶行為預測","大數據分析應著重於資料分析的技能上，和行銷管理及通路互動沒有具體的關聯，也不會太過考慮","大數據通常包含結構化資料與非結構化資料，而要分析這些資料，只要以Hadoop 軟體建立大數據分析平台即可"],"ans":1,"exp":["📝 解析：大數據分析應用框架包含四大主軸：資料收集、資料分析、即時互動行銷、全通路客戶互動，從分析延伸到對客戶的行動才是完整概念，故選(1)。(2)「預測資料」並非原始資料類型；(3)錯在把分析與行銷、通路切割；(4)錯在以為建 Hadoop 平台即可，忽略分析方法與應用。"],"pos":0.7167,"w":1,"sw":0.01201,"id":"2科技力-43"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-44","stem":"建立顧客價值／忠誠度模型，一般常利用所謂RFM 架構。 RFM 指的是下列何者？","opts":["Royalty, Friendship, Money","Royalty, Freedom, Money","Recency, Frequency, Monetary","Recency, Frequency, Manipulation"],"ans":3,"exp":["📝 解析：RFM 模型以三個指標衡量顧客價值：Recency（最近一次消費距今多久）、Frequency（消費頻率）、Monetary（消費金額），故選(3)。Royalty、Friendship、Freedom、Manipulation 都不是 RFM 的組成。"],"pos":0.7333,"w":1,"sw":0.01201,"id":"2科技力-44"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-45","stem":"下列何者不是客戶價值模型的主要設計重點與分析維度？","opts":["客戶貢獻度模型設計","客戶忠誠度模型設計","客戶流失模型設計","客戶潛力模型設計"],"ans":3,"exp":["📝 解析：依教材，客戶價值模型的主要設計重點與分析維度為客戶貢獻度、客戶忠誠度與客戶潛力三項，用以衡量客戶現在與未來的價值；客戶流失模型屬另一類預警模型，不是價值模型的維度，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.75,"w":1,"sw":0.01201,"id":"2科技力-45"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"2-52","stem":"有關感知運算(Cognitive Computing)在金融領域的應用，下列敘述何者錯誤？","opts":["在電話客服中，感知運算可以協助客服人員，在和客戶幾次的問答之後，快速而較正確地尋找、組織、分析相關金融資訊","感知運算可以協助金融人員和普通不了解理財或保險的人互動，提供財務規劃或資產配置","感知運算大都針對特定問題提出解決之道，而非著眼於為客戶提供全方位的關聯性資訊視圖","感知運算可以讓機器人聽懂更多自然語言的語意"],"ans":3,"exp":["📝 解析：感知運算的特色是整合大量結構化與非結構化資料，為客戶提供全方位、具關聯性的資訊視圖，而不是只針對特定問題給單點解答，故(3)錯誤。(1)協助客服快速組織分析資訊、(2)協助不懂理財保險的客戶並提供規劃、(4)讓機器人理解更多自然語言，都是其應用。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8667,"w":1,"sw":0.01201,"id":"2科技力-52"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"1-4","stem":"下列何者不屬於現行常用的資料探勘分析手法？","opts":["決策樹","關聯分析","客戶明細查詢","資料分群"],"ans":3,"exp":["📝 解析：資料探勘常用手法包括分類（如決策樹）、關聯分析（如購物籃分析）、分群（集群分析）、迴歸預測等，目的是從資料中找出隱藏規則；「客戶明細查詢」只是一般資料檢索，不屬於探勘分析，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0667,"w":1,"sw":0.01201,"id":"1科技力-04"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"1-5","stem":"對於資料探勘的運用，下列何者正確？","opts":["對於結構化的資料而言，資料探勘是萬能的，什麼樣不能解決的問題，都可以使用資料探勘的分析手法來獲得答案","運用資料探勘手法所建定的分析模型，因環境在變，資料內容在變，或者很多分析的因素都在變，所以需要定期更新","現行資料探勘的工具都能自動選用適合模型算法(演算法則)，所以分析人員僅要會操作工具而不需要對模型算法有一定的瞭解","業務人員應用資料探勘工具，只要按一種程序進行資料預測分析，即可得到合適的業務規則"],"ans":2,"exp":["📝 解析：環境、資料內容與影響因素會隨時間改變，資料探勘模型的準確度會衰退，需定期監控並更新（重新訓練），故(2)正確。(1)錯：資料探勘不是萬能；(3)錯：分析人員仍須了解演算法才能選對模型、解讀結果；(4)錯：需經資料準備、建模、驗證、反覆調整，不是按單一程序就能得到合適的業務規則。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.0833,"w":1,"sw":0.01201,"id":"1科技力-05"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"1-6","stem":"大數據分析應用在客戶關係上，最主要的目標為何？","opts":["強化客戶服務中心的回應時間，提昇客戶對金融機構的滿意度","增加銷售自動化系統的管理能力，讓所有銷售人員均能有效的記錄其工作內容，以易於進行績效評比","蒐集、整合、並全面瞭解客戶資料，以精準的資訊，支援建立完整的360 度客戶視圖","為強化客戶貢獻度的計算，運用大數據分析的能力建立資金轉撥計價的公式"],"ans":3,"exp":["📝 解析：大數據分析應用於客戶關係管理，最主要目標是蒐集、整合並全面瞭解客戶資料，建立完整的 360 度客戶視圖，作為精準服務與行銷的基礎，故選(3)。(1)客服回應時間、(2)業務績效評比、(4)資金轉撥計價(FTP)都只是局部或非 CRM 核心目標。"],"pos":0.1,"w":1,"sw":0.01201,"id":"1科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"1-7","stem":"對於與客戶間的互動記錄，多屬於非結構化文字資料的範圍，下列哪一項不是我們常用的分析手法？","opts":["情感分析：我們需要分析出文章中所帶的情緒屬於「正向」、「負向」或是「中立」，藉以判斷客戶當下的情緒","時間軸分析：配合時間軸的建立及文字屬性分析的變化，我們可以看出一段時間內客戶偏好的變化","字詞屬性交叉比對：可針對不同詞句或詞性相同的語句進行交互比對分析，讓不同時間點所表達相似的含義，可以獲得一致性的分析","文字多維分析：將文字拆解成不同的文字區塊，再將文字區塊隨機組合成不同的分析面向，藉以瞭解文章內不易理解的內涵"],"ans":4,"exp":["📝 解析：非結構化文字的常用分析手法有：情感分析（判斷正向／負向／中立情緒）、時間軸分析（觀察偏好隨時間的變化）、字詞屬性交叉比對（讓不同說法的相似語意獲得一致分析）。(4)把文字區塊「隨機組合」成分析面向並無分析意義，不是常用手法，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1167,"w":1,"sw":0.01201,"id":"1科技力-07"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"1-9","stem":"大數據分析是一個分析的概念，分析完的成果和通路之間的關係為何？","opts":["分析完成的結果通常是一組預測名單，只要將這種名單交給電銷專員進行電話行銷即會獲得很好的成效","大數據分析使用各式各樣的資料分析方法及行為預測，產出的分析結果己經很精準，只要儲存於交易通路中，客戶自動會上門交易","大數據分析雖使用各種分析手法來預測客戶的行為，但若沒有影響客戶的行動，分析的成果只淪為一份報告而己，所以我們需在全通路間設計各項情境式行銷，來發揮分析的成果","各個事業單位和各個應用通路，都有其設立的目的和業績指標，對於可掌握的客戶，屬於自身最重要的資產。大數據分析所得到的成果可以輔助我們進行更好的客戶對待，但對於其他通路間的行為，則由該通路負責即可"],"ans":3,"exp":["📝 解析：大數據分析的預測結果若沒有轉化為影響客戶的行動，就只是一份報告；因此需在全通路設計情境式行銷，把分析成果落實到客戶互動中，故選(3)。(1)只交名單給電銷、(2)以為客戶會自動上門、(4)各通路各自為政，都無法發揮分析價值。"],"pos":0.15,"w":1,"sw":0.01201,"id":"1科技力-09"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"1-30","stem":"有關大數據處理平台Hadoop 的描述，下列何者錯誤？","opts":["企業級Hadoop 處理能力強，速度快，是理想的線上即時交易處理系統","Hadoop 採用分散式運算框架MapReduce","Hadoop 採用分散式資源管理系統YARN","Hadoop 採用以列為主的非關聯式資料庫HBase"],"ans":[1,4],"exp":["📝 解析：官方答案(1)(4)皆給分。(1)錯：Hadoop 適合大量資料的批次處理、延遲較高，不是線上即時交易處理(OLTP)系統；(4)HBase 是以「欄（欄族）」為主的非關聯式資料庫(column-oriented NoSQL)，台灣用語「列」指 row，寫「以列為主」即有誤（中國用語的「列」才指 column，題目用語混淆），因此兩者都算對。(2)MapReduce、(3)YARN 敘述正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5,"w":1,"sw":0.01201,"id":"1科技力-30"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"1-43","stem":"對大數據分析應用的方向，下列何種觀念正確？","opts":["大數據分析的應用僅用在風險管理上","大數據分析主要應用在進階預測 (Advanced , Predictive)及規範分析(Prescriptive)上，最重要的是能產出預測清單","大數據分析的應用是多個面向的，主要應用在客戶關係管理上、風險管理上及績效管理上","大數據分析應用主要是和物聯網有所聯接，能隨時隨地運用金融機構的終端設備來追蹤客戶的動作"],"ans":3,"exp":["📝 解析：大數據分析應用是多面向的，主要用於客戶關係管理（精準行銷、交叉銷售）、風險管理（信用評分、詐欺偵測）與績效管理，故選(3)。(1)只用於風險管理太窄；(2)產出預測清單只是過程，重點是轉化為行動；(4)隨時追蹤客戶動作不是主要方向，且涉及隱私疑慮。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.7167,"w":1,"sw":0.01201,"id":"1科技力-43"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"1-44","stem":"大數據分析與多波段行銷的關係為何？","opts":["行銷活動本應具備多波段設計，只要有大數據分析作為輔助，就會有更好的行銷成效","使用大數據分析，就是在作精準行銷，客戶會不會購買，應在收到行銷活動時即會決定，不需要多次影響客戶","客戶會不會購買商品，存在著許多客觀的事實，如產品的單價、與其他公司之間的同質產品比較…等，所以只要根據客戶對商品的回應程度，作多次的促銷，才能增加銷售成效","大數據分析應根據客戶的購買旅程，依各項可能發生的情境，預先設計好各項接觸規則、吸納互動回應、並適時強化分析成果，以建立多波段行銷架構，導引客戶購買所需的商品"],"ans":4,"exp":["📝 解析：多波段行銷是依客戶購買旅程，預先設計各情境的接觸規則、蒐集客戶互動回應，再適時修正分析與下一波行銷，逐步引導客戶購買所需商品，故選(4)。(1)以為有分析就有成效、(2)以為一次接觸就決定、(3)只靠多次促銷，都忽略依客戶回應動態調整的核心。"],"pos":0.7333,"w":1,"sw":0.01201,"id":"1科技力-44"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"1-45","stem":"有關建立客戶分群的目的，下列何者正確？","opts":["依據客戶往來行為基礎，建立客戶區隔，並針對不同區隔特性，發展獨特的行銷策略","客戶分群通常是依客戶的人口屬性加上客戶的資產狀況所建立的，可讓各業務部門依其產品的特色，找到適合的行銷名單","客戶分群是使用資料探勘工具建立的，按各項可用的資料分群後，工具本身會給各項分群一個名稱及其適用的商品","客戶區隔可以有效的進行客戶分析，而且客戶區隔有著標準的作法，並可從A 金融機構搬移至B 金融機構來執行"],"ans":1,"exp":["📝 解析：客戶分群是依客戶往來行為等資料建立區隔，再針對不同區隔特性發展差異化行銷策略，故選(1)。(2)不應只用人口屬性加資產狀況；(3)工具只產出分群，命名與適用商品仍需人工解讀；(4)客群特性因機構而異，沒有可直接移植的標準作法。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.75,"w":1,"sw":0.01201,"id":"1科技力-45"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"21-2","stem":"下列何者不是雲端運算的三大服務模式？","opts":["PaaS(Platform as a Service)","IaaS(Infrastructure as a Service)","SaaS(Software as a Service)","EaaS(Engineering as a Service)"],"ans":4,"exp":["📝 解析：NIST 定義的雲端三大服務模式為 IaaS、PaaS、SaaS。EaaS（Engineering as a Service）不是三大服務模式之一，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0333,"w":1,"sw":0.00276,"id":"21科技力-02"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"21-3","stem":"對於協力廠商提供的私有雲，其安全性主要取決於什麼？","opts":["企業的安全設置","網路的基本安全性","協力廠商的安全措施和服務水平協議","用戶的安全使用習慣"],"ans":3,"exp":["📝 解析：由協力廠商（第三方）代管的私有雲，基礎設施的實體與系統安全由廠商負責，因此安全性主要取決於該廠商的安全措施，以及雙方簽訂的服務水準協議（SLA）中的資安責任條款。企業設定、網路基本安全、使用者習慣雖會影響，但非主要決定因素。"],"pos":0.05,"w":1,"sw":0.00276,"id":"21科技力-03"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"21-28","stem":"下列何者最常被用來發動DDoS？","opts":["單一台個人電腦","印表機","受控制的大量殭屍電腦","手機相機"],"ans":3,"exp":["📝 解析：DDoS（分散式阻斷服務攻擊）是駭客控制大量受感染的殭屍電腦（Botnet，包含 IoT 設備），同時向目標發送大量請求使其癱瘓。單一電腦只能發動 DoS，流量有限；印表機、手機相機不是典型的發動工具。"],"pos":0.4667,"w":1,"sw":0.00276,"id":"21科技力-28"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"21-29","stem":"網站只有一頁，只賣一種商品，沒有其他頁面超連結。常假冒名人名店、盜用名人照片、知名商店推薦商品，上述為目前何種常見的詐騙手段？","opts":["三方詐欺","一頁式廣告","盜用帳戶從事假網拍","商業電子郵件入侵詐騙"],"ans":2,"exp":["📝 解析：一頁式廣告詐騙：網站只有一頁、只賣一種商品、沒有其他連結，常盜用名人照片或冒用知名商店推薦，多以貨到付款收款，寄出的貨物與廣告不符且無法退貨聯絡。三方詐欺、假網拍、商業電子郵件入侵詐騙（BEC）手法不同。"],"pos":0.4833,"w":1,"sw":0.00276,"id":"21科技力-29"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"21-34","stem":"金融機構在導入大型語言模型處理內部文本時，受金管會指引與個資法約束，首先應落實下列哪類基本控管以降低資料外洩風險？","opts":["無限制外呼API","隨意上傳個資到第三方","敏感資料遮蔽、權限控管與存取稽核","將資料寄到私人信箱"],"ans":3,"exp":["📝 解析：依金管會「金融業運用人工智慧（AI）指引」（2024年6月）重視隱私與資料保護，以及個資法要求的適當安全維護措施，金融機構導入大型語言模型前，應先落實敏感資料遮蔽（去識別化）、權限控管與存取稽核。其他三個選項都是會造成資料外洩的錯誤做法。"],"pos":0.5667,"w":1,"sw":0.00276,"id":"21科技力-34"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"21-38","stem":"下列何者是物聯網層級架構由下至上的正確層級順序？","opts":["感知層→應用層→表面層","感知層→應用層→網路層","網路層→應用層→表面層","感知層→網路層→應用層"],"ans":4,"exp":["📝 解析：物聯網三層架構由下而上為：感知層（感測器、RFID 蒐集資料）→網路層（以 Wi-Fi、4G/5G 等傳輸資料）→應用層（資料處理與應用服務）。其他選項的順序錯誤，或含不存在的「表面層」。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.6333,"w":1,"sw":0.00276,"id":"21科技力-38"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"21-55","stem":"有關雲端服務的資安問題，下列敘述何者錯誤？","opts":["駭客常使用雲端服務進行隱匿通訊(Cloud Tunneling)","駭客使用雲端服務可減少建置永久性網路基礎架構之需求","駭客利用合法雲端服務建置釣魚頁面，以規避偵測","駭客使用雲端服務發動攻擊時，仍需刻意掩飾真實來源IP 位址"],"ans":4,"exp":["📝 解析：駭客濫用合法雲端服務可進行隱匿通訊（Cloud Tunneling）、免建永久基礎設施、架設釣魚頁面規避偵測。因為攻擊流量來自知名雲端業者的 IP，本身就能隱藏真實來源，不需再刻意掩飾來源 IP，故(4)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9167,"w":1,"sw":0.00276,"id":"21科技力-55"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"21-58","stem":"使實體物件能連結上網路且透過網路進行識別和定位，並讓物件彼此之間可以相互溝通的技術為下列何者？","opts":["自動化","機械化","物聯網","人工智慧"],"ans":3,"exp":["📝 解析：物聯網（IoT）讓實體物件透過感測器與網路連線，可被識別、定位，並與其他物件相互溝通與交換資料，例如智慧電錶、穿戴裝置。自動化、機械化是生產方式，人工智慧是讓機器模擬人類智慧，均非題述定義。"],"pos":0.9667,"w":1,"sw":0.00276,"id":"21科技力-58"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"21-59","stem":"有關「金融機構使用物聯網設備安全控管規範」之敘述，下列何者錯誤？","opts":["為確保經授權之使用者始得進行資料存取、設備管理及安全性更新等操作，設備應具備身分驗證機制，並應進行初始密碼變更，密碼長度不應少於四位","設備應具備安全性更新機制，以維持設備之整體安全性","設備以無線連接網路者，應採用具加密協定之無線存取點連接網路，並以網路卡卡號白名單等機制進行設備綁定","設備應關閉不必要之網路連線及服務，限制其對網際網路不必要之網路連線"],"ans":1,"exp":["📝 解析：「金融機構使用物聯網設備安全控管規範」規定：設備應具身分驗證機制並變更初始密碼，密碼長度「不應少於六位」，建議英數混合並包含大小寫或符號，且依最小權限原則授權。(1)寫「不應少於四位」錯誤。其他選項（安全性更新、無線加密並以網卡卡號白名單綁定、關閉不必要連線）皆為規範內容。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9833,"w":1,"sw":0.00276,"id":"21科技力-59"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"20-2","stem":"何謂混合雲？","opts":["僅由第三方擁有的雲","結合公有雲與私有雲的技術","僅由企業擁有的雲","社群特定的雲"],"ans":2,"exp":["📝 解析：混合雲結合公有雲與私有雲（必要時含地端系統），例如敏感資料放私有雲、尖峰運算用公有雲，兼顧安全與彈性。僅由第三方擁有的是公有雲，僅由企業擁有的是私有雲，社群特定的是社群雲。"],"pos":0.0333,"w":1,"sw":0.00307,"id":"20科技力-02"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"20-29","stem":"對於透過資訊工具的金融犯罪，下列敘述何者錯誤？","opts":["駭客使用進階持續威脅攻擊(APT)，入侵SWIFT 系統盜轉金錢","駭客使用分散式阻斷攻擊(DDoS)，造成業者服務中斷，再進行勒索金錢","駭客使用勒索病毒軟體(RaaS)，常要求使用比特幣等加密貨幣繳交贖金","台灣因為資安防護佳，因此未傳出災情"],"ans":4,"exp":["📝 解析：台灣同樣發生過資訊金融犯罪：2016年第一銀行 ATM 遭植入惡意程式盜領約8千萬元、2017年遠東銀行 SWIFT 系統遭 APT 攻擊盜轉、2017年多家券商遭 DDoS 勒索比特幣。故「台灣未傳出災情」錯誤。其他三個選項對 APT、DDoS、勒索病毒的描述均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.00307,"id":"20科技力-29"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"20-37","stem":"有關「金融服務業辦理數位身分驗證指引」中，「應用場景採用之身分驗證機制失效時之可能風險」之敘述，下列何者錯誤？","opts":["「造成客戶及金融服務業之名譽上損害」為可能風險","可能產生之風險及程度，區分等級，並以四個等級為限","「造成客戶不便、困擾」為可能風險","「機敏資料未經授權公布」為可能風險"],"ans":2,"exp":["📝 解析：「金融服務業辦理數位身分驗證指引」第6點列出身分驗證失效的可能風險：客戶不便困擾、名譽損害、財務損失或代理責任、公共利益損害、機敏資料未經授權公布、違反法規。風險程度應區分等級，「例如」低、中、高、極高四級，說明欄明言並非只能分四級，故(2)「以四個等級為限」錯誤。(1)(3)(4)都是條文列舉的風險。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6167,"w":1,"sw":0.00307,"id":"20科技力-37"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"20-38","stem":"下列何者政府部門已依FIDO 聯盟之規範，建置並啟用臺灣行動身分識別Taiwan FidO 服務？","opts":["金管會","經濟部","內政部","國發會"],"ans":3,"exp":["📝 解析：內政部依FIDO聯盟規範建置「臺灣行動身分識別（TW FidO）」，民眾以手機綁定自然人憑證或健保卡後，可用生物特徵或PIN碼在線上辦理政府服務，故選(3)。金管會、經濟部、國發會並非此服務的建置機關。"],"pos":0.6333,"w":1,"sw":0.00307,"id":"20科技力-38"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"20-42","stem":"公用雲的資安問題常讓人擔憂，因此過去雲端供應商都藉由通過下列何種的 Type II 稽核標準，證明其服務對於資安控管措施與目標已達到一定的安全標準？","opts":["ISO 27701","NEMA","SAS70","BSI"],"ans":3,"exp":["📝 解析：過去雲端服務商多以通過SAS70 Type II稽核（由會計師查核服務機構的內部控制設計與一段期間的執行有效性）來證明資安控管達一定標準，故選(3)。SAS70於2011年後已由SSAE16／SSAE18（SOC 1/2報告）取代，題目問「過去」所以答SAS70。ISO 27701是隱私資訊管理標準，NEMA是美國電機製造商協會，BSI是英國標準協會，均非此類稽核報告。"],"pos":0.7,"w":1,"sw":0.00307,"id":"20科技力-42"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"20-47","stem":"下列敘述何者非屬多因子生物識別平台的目的或重要性？","opts":["使用者可用於快速查詢多國匯利率變動等用途","使用者可依據所處環境選擇適合的技術","可在同樣風險等級下提供多種辨識技術","能一次整合多種生物辨識工具"],"ans":1,"exp":["📝 解析：多因子生物識別平台的目的是整合多種生物辨識工具（指紋、臉部、聲紋等），讓使用者依環境選擇合適技術，並可在同一風險等級下提供多種辨識方式。(1)「快速查詢多國匯利率」是一般資訊服務，與身分識別無關，故非屬其目的。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7833,"w":1,"sw":0.00307,"id":"20科技力-47"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"20-58","stem":"下列何者不是NIST(National Institute of Standards and Technology)定義的雲端運算部署模式？","opts":["Private Cloud","Home Cloud","Hybrid Cloud","Community Cloud"],"ans":2,"exp":["📝 解析：NIST SP 800-145定義的雲端部署模式有四種：私有雲（Private）、社群雲（Community）、公有雲（Public）、混合雲（Hybrid）。沒有「Home Cloud」，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9667,"w":1,"sw":0.00307,"id":"20科技力-58"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"19-2","stem":"比較公有雲和私有雲，下列哪一項是私有雲的特點？","opts":["開放給所有人使用","資料與程式都在組織內部管理","由企業外部的供應商管理","無法進行擴展"],"ans":2,"exp":["📝 解析：私有雲是專供單一組織使用的雲端環境，資料與程式在組織內部（或專屬環境）管理，安全與控制度高，故選(2)。(1)開放給所有人是公有雲特性；(3)由外部供應商管理多指公有雲；(4)私有雲仍可擴展，只是彈性與成本不如公有雲。"],"pos":0.0333,"w":1,"sw":0.02901,"id":"19科技力-02"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"19-3","stem":"下列何種雲端運算的部署模型透過技術結合公有與私有雲端，讓資料及應用程式可在兩者間共用？","opts":["公有雲","共用雲","私有雲","混合雲"],"ans":4,"exp":["📝 解析：混合雲（Hybrid Cloud）以技術結合公有雲與私有雲，讓資料與應用程式可在兩者間移動、共用，例如敏感資料留在私有雲、尖峰運算借用公有雲，故選(4)。"],"pos":0.05,"w":1,"sw":0.02901,"id":"19科技力-03"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"19-26","stem":"有關資訊安全與金融穩定之敘述，下列何者錯誤？","opts":["資訊安全的破口一定在金融機構本身","視監理科技的發展與應用方式，主管機關可能必須承擔相當大資訊安全的責任","資訊安全的風險，不僅限於個人與金融機構，政府機關亦可能潛藏資訊安全風險","無論係出於技術原因或資訊安全問題，對整體交易秩序可預見有非常大的影響"],"ans":1,"exp":["📝 解析：資訊安全破口可能來自金融機構本身，也可能來自第三方服務商、委外廠商、客戶端或政府系統，並非「一定在金融機構本身」，故(1)錯誤。(2)監理科技若由主管機關蒐集處理大量資料，須承擔資安責任；(3)政府機關亦有資安風險；(4)技術或資安問題會嚴重影響交易秩序，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4333,"w":1,"sw":0.02901,"id":"19科技力-26"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"19-28","stem":"下列何者非Gartner(2014)對資安防護作法的正確敘述？","opts":["資安防護應該尋求一勞永逸的方法","資安防護應有持續防禦流程","應該要體認「萬物皆聯網，萬物皆可駭」","改採以風險為基礎的檢查"],"ans":1,"exp":["📝 解析：Gartner（2014）提出資安防護應從「預防」轉為持續性防禦流程（預測、預防、偵測、回應循環），體認萬物皆聯網、萬物皆可駭，並改採以風險為基礎的檢查。資安威脅持續演變，不存在一勞永逸的方法，故(1)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4667,"w":1,"sw":0.02901,"id":"19科技力-28"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"19-29","stem":"2017 年襲捲全球一百多個國家的「想哭(Wanna Cry)」勒索病毒，台灣金融業損失輕微，下列何者不是主要原因？","opts":["台灣金融業員工不能隨意安裝軟體","台灣是海島國家，國際連結較低","台灣資安防護標準較高","網路銀行與ATM 等都放在伺服器"],"ans":2,"exp":["📝 解析：2017年WannaCry利用Windows SMB漏洞散播，台灣金融業損失輕微，主因是員工不能隨意安裝軟體、資安防護標準較高、網銀與ATM等系統集中於伺服器並與外網隔離管控。網路攻擊無國界，「海島國家國際連結較低」並非原因，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.02901,"id":"19科技力-29"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"19-37","stem":"知名網路零售業者 Amazon 提供下列何種雲端計算服務供使用者存取 web services？","opts":["ALI","PLS","EC2","HIS"],"ans":3,"exp":["📝 解析：Amazon Web Services的EC2（Elastic Compute Cloud）提供可彈性調整的虛擬運算主機，使用者透過網路存取並依使用量付費，屬IaaS雲端服務，故選(3)。其餘選項不是AWS的服務名稱。"],"pos":0.6167,"w":1,"sw":0.02901,"id":"19科技力-37"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"19-42","stem":"考量自動擴展服務(Auto Scaling)的多面向功能與效益，下列何者最能全面反映其核心特點？","opts":["自動擴展僅依賴時間因素來決定資源的調整","自動擴展主要增加了系統的複雜性和管理難度","自動擴展根據預設的規則或當前的系統指標自動調整資源，並能有效降低運營成本","自動擴展僅專注於提高計算資源，而不涉及儲存資源的調整"],"ans":3,"exp":["📝 解析：自動擴展（Auto Scaling）依預設規則（排程）或即時系統指標（CPU使用率、流量等）自動增減運算資源，尖峰時擴充、離峰時縮減，兼顧服務穩定與成本，故選(3)。(1)不只依時間；(2)其目的是降低管理負擔；(4)也可涉及儲存等其他資源。"],"pos":0.7,"w":1,"sw":0.02901,"id":"19科技力-42"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"19-47","stem":"冒用者被接受次數10 次、冒用者嘗試次數為100 次，而冒用被接受率(FAR)公式如何表示？","opts":["(1-10)/100","90/100","10/(100-10)","10/100"],"ans":4,"exp":["📝 解析：冒用被接受率FAR＝冒用者被系統錯誤接受的次數÷冒用者嘗試總次數＝10÷100＝10%，故選(4)。FAR越低代表系統越不易被冒用；另一指標FRR（錯誤拒絕率）則是合法使用者被拒的比例。"],"pos":0.7833,"w":1,"sw":0.02901,"id":"19科技力-47"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"19-58","stem":"依據「金融機構使用物聯網設備安全控管規範」之規定，金融機構應建立物聯網設備管理清冊並至少多久時間更新一次，以識別設備用途、設備 IP、存放位置與管理人員，評估適當之實體環境控管措施及存取權限管制？","opts":["每半年","每年","每兩年","視情況而定"],"ans":2,"exp":["📝 解析：依銀行公會「金融機構使用物聯網設備安全控管規範」，應建立物聯網設備管理清冊並「至少每年」更新一次，以識別設備用途、IP、存放位置與管理人員，評估實體環境控管與存取權限，故選(2)。"],"pos":0.9667,"w":1,"sw":0.02901,"id":"19科技力-58"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"18-2","stem":"下列何者非屬雲端運算的特性？","opts":["確保資料安全(Security Guaranteed)","資源匯集(Resource Pooling)","隨需自助服務(On-demand Self-service)","快速彈性(Rapid Elasticity)"],"ans":1,"exp":["📝 解析：NIST定義雲端運算五大特性：隨需自助服務、廣泛網路存取、資源匯集、快速彈性、可量測的服務。「確保資料安全」並非雲端特性，反而是雲端常見的疑慮，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0333,"w":1,"sw":0.02901,"id":"18科技力-02"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"18-12","stem":"下列何者並非影響生物辨識系統「冒用被接受率(False Acceptance Rate)」的主因？","opts":["硬體品質","軟體","演算法","使用次數"],"ans":4,"exp":["📝 解析：生物辨識系統的冒用被接受率（FAR）主要取決於感測硬體品質、軟體與比對演算法（含門檻值設定）。使用次數多寡不會改變系統誤判的比率，故選(4)。"],"pos":0.2,"w":1,"sw":0.02901,"id":"18科技力-12"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"18-28","stem":"根據行政院國家資通安全會報2022 年的報告，下列資安威脅之敘述，何者錯誤？","opts":["社交工程電子郵件攻擊，如釣魚攻擊(Phishing)","進階持續性攻擊(APT)攻擊對象包括社群平台、手機、Office 文件等產品漏洞，進行滲透與竊取機密資料","物聯網裝置常缺乏有效資安控管，易受駭客入侵攻擊","提供雲端服務的廠商會做資安把關，因此資安較有保障"],"ans":4,"exp":["📝 解析：國家資通安全會報2022年報告指出主要威脅包括：社交工程郵件（釣魚）、APT利用社群平台與文件漏洞滲透竊密、物聯網設備缺乏控管易遭入侵。雲端服務採「責任共擔」，使用者仍須自行做好帳號、設定與資料保護，不能因雲端廠商有把關就認為較有保障，故(4)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4667,"w":1,"sw":0.02901,"id":"18科技力-28"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"18-39","stem":"駭客使用網路上，兩個以上被攻陷的電腦做為跳板，向特定目標進行阻斷服務的攻擊，稱為下列何種網路攻擊？","opts":["DDOS","Logic bomb","Spyware","Computer worm"],"ans":1,"exp":["📝 解析：分散式阻斷服務攻擊（DDoS）是駭客控制多台被入侵的電腦（殭屍網路）同時向目標發送大量請求，使其服務癱瘓，故選(1)。Logic bomb是條件觸發的惡意程式；Spyware是間諜軟體；Computer worm是自我複製傳播的蠕蟲。"],"pos":0.65,"w":1,"sw":0.02901,"id":"18科技力-39"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"18-42","stem":"在2022 年的「全球企業雲指數調查」中，受訪者認為哪種雲為組織理想的運營模式？","opts":["公共雲","混合雲","私有雲","社區雲"],"ans":2,"exp":["📝 解析：Nutanix 2022年「全球企業雲指數（ECI）」調查中，多數受訪者認為「混合雲（混合多雲）」是組織理想的IT營運模式，兼顧私有雲的控制與公有雲的彈性，故選(2)。"],"pos":0.7,"w":1,"sw":0.02901,"id":"18科技力-42"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"18-43","stem":"依歐盟個資法《一般資料保護規範》，資料當事人在特定條件下有要求資料蒐集者刪除其個人資料的權利，此一公民權被稱為何？","opts":["資料可攜權","處理限制權","自動化個人決策","被遺忘權"],"ans":4,"exp":["📝 解析：歐盟GDPR第17條規定「刪除權」，即俗稱的「被遺忘權」：在資料已非必要、當事人撤回同意等特定條件下，可要求控管者刪除其個人資料，故選(4)。資料可攜權（第20條）是取得並移轉資料；處理限制權（第18條）是限制處理但不刪除。"],"pos":0.7167,"w":1,"sw":0.02901,"id":"18科技力-43"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"18-55","stem":"根據行政院國家資通安全會報2022 年的報告，下列何者為政府機關資安通報非法入侵的最主要原因？","opts":["網站設計不當","應用程式漏洞","弱密碼／密碼遭暴力破解","作業系統漏洞"],"ans":1,"exp":["📝 解析：依行政院國家資通安全會報2022年報告，政府機關通報的「非法入侵」事件中，最主要原因是「網站設計不當」（如注入攻擊、權限控管疏漏），故選(1)。應用程式漏洞、弱密碼、作業系統漏洞亦是原因，但比例較低。"],"pos":0.9167,"w":1,"sw":0.02901,"id":"18科技力-55"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"17-2","stem":"何謂邊緣運算？","opts":["一種儲存數據的技術","一種分散式運算架構","一種雲端通訊技術","一種資料加密技術"],"ans":2,"exp":["📝 解析：邊緣運算（Edge Computing）是一種分散式運算架構，將資料處理移到靠近資料來源的裝置或節點（如物聯網閘道器），減少傳回雲端的延遲與頻寬，故選(2)。"],"pos":0.0333,"w":1,"sw":0.01201,"id":"17科技力-02"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"17-3","stem":"2022 年2 月發布了「全球企業雲指數調查」，在多重雲端架構(Multicloud)中，何者不是企業部署多雲環境的主要應用？","opts":["測試和開發敏捷性","災難復原","資料探勘","應用程式現代化"],"ans":3,"exp":["📝 解析：2022年2月發布的Nutanix「全球企業雲指數」調查指出，企業部署多雲環境的主要應用包括：測試與開發敏捷性、災難復原（備援）、應用程式現代化等。資料探勘不在主要應用之列，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.05,"w":1,"sw":0.01201,"id":"17科技力-03"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"17-11","stem":"下列何者非屬臉部辨識與聲音辨識的優點？","opts":["導入容易","普及性高","被接受度高","隱私性佳"],"ans":4,"exp":["📝 解析：臉部與聲音辨識只需手機鏡頭或麥克風即可，導入容易、普及性高、使用者接受度高，是其優點。缺點正是隱私性較差：臉部影像、聲音容易在公開場合被拍攝或錄下而遭蒐集、偽造（如深偽），故「隱私性佳」不是其優點，選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1833,"w":1,"sw":0.01201,"id":"17科技力-11"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"17-12","stem":"有關「多因子生物辨識平台」之敘述，下列何者錯誤？","opts":["必須同時完成建置","可搭配客服中心與虛擬網路銀行提供服務","隨著使用者的應用場域不同或交易安全等級差異","平台建置是可以分階段執行"],"ans":1,"exp":["📝 解析：多因子生物辨識平台可依使用者應用場域（臨櫃、ATM、網銀、客服中心）與交易安全等級差異，彈性選用指紋、臉部、聲紋等不同因子，因此平台可以分階段建置，不必所有因子、所有通路一次同時完成。(1)「必須同時完成建置」錯誤；(2)(3)(4)皆為平台的正確特性。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2,"w":1,"sw":0.01201,"id":"17科技力-12"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"17-14","stem":"有關數位金融業務採取之開放FIDO (Fast Identity Online)數位身分認證方式，下列敘述何者錯誤？","opts":["可透過公開加密金鑰(Public Key Cryptography)的架構，進行多重因素驗證及生物辨識登入","可確保登入流程中，伺服器及終端裝置協定之安全性","可嚴密保護雲端帳號之個人資料","目前國內財政部尚未將 FIDO 納入個人綜合所得稅之個人身分認證方式"],"ans":4,"exp":["📝 解析：FIDO採公開金鑰加密架構，私鑰留在使用者裝置、伺服器只存公鑰，可結合生物辨識做多重因素驗證，確保登入流程安全並保護帳號個資，故(1)(2)(3)正確。(4)錯誤：內政部「行動自然人憑證（TW FidO）」即採FIDO標準，財政部自109年度綜所稅結算申報（2021年申報期）起已將其列為手機報稅的身分驗證方式，目前仍為三種免讀卡機驗證方式之一。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2333,"w":1,"sw":0.01201,"id":"17科技力-14"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"17-28","stem":"供應鏈的資安風險日益重要，駭客在尋求入侵突破口時，往往會採取什麼策略？","opts":["隨機攻擊","攻擊名氣最大的供應商","鎖定資安防護較不嚴謹的供應商","攻擊資安防護最嚴謹的供應商比較有成就感"],"ans":3,"exp":["📝 解析：供應鏈攻擊的邏輯是「從最弱的一環下手」：駭客會鎖定資安防護較鬆散的上下游供應商或委外廠商，入侵後再藉其合法連線、軟體更新管道（如SolarWinds事件）滲透到真正目標，故選(3)。隨機攻擊效率低；攻擊名氣大或防護最嚴謹者成本高、成功率低，不符駭客策略。"],"pos":0.4667,"w":1,"sw":0.01201,"id":"17科技力-28"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"17-29","stem":"2022 年爆發的俄烏戰爭，雙方網路攻擊也是重要一環，下列敘述何者錯誤？","opts":["金融業受到攻擊較少","分散式阻斷服務(DDoS)為主要工具","企圖刪除烏克蘭資料庫資","企圖中斷烏克蘭網路與能源基礎設施"],"ans":1,"exp":["📝 解析：俄烏戰爭期間網路攻擊是重要戰場，俄方以分散式阻斷服務（DDoS）癱瘓網站、以資料抹除惡意程式（Wiper，如HermeticWiper）企圖刪除烏克蘭資料庫，並攻擊網路與能源等關鍵基礎設施，(2)(3)(4)皆正確。(1)錯誤：金融業反而是主要目標之一，例如2022年2月烏克蘭國防部及PrivatBank、Oschadbank等銀行遭DDoS攻擊導致網銀中斷。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.01201,"id":"17科技力-29"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"17-42","stem":"利用雲端技術，追蹤其網路足跡、建立顧客側寫(Customer Profiling)，從而瞭解顧客需求、興趣、做出適當推薦以執行精準行銷，這是屬於下列哪一種雲端運算的應用？","opts":["測試中心雲應用","雲端數位行銷應用","基礎架構雲應用","異業雲端協作應用"],"ans":2,"exp":["📝 解析：利用雲端技術追蹤顧客網路足跡、建立顧客側寫（Customer Profiling），分析其需求與興趣後做個人化推薦與精準行銷，屬「雲端數位行銷應用」，選(2)。測試中心雲用於系統開發測試；基礎架構雲是提供運算、儲存等基礎資源；異業雲端協作是與其他產業夥伴在雲端共享資源與合作。"],"pos":0.7,"w":1,"sw":0.01201,"id":"17科技力-42"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"17-55","stem":"關於物聯網資安之敘述，下列何者錯誤？","opts":["駭客常以此為入侵突破口進行攻擊","DDoS 常以此作為入侵管道","物聯網因與主要系統有隔離，故風險較低","多數物聯網裝置缺乏有效資安控管"],"ans":3,"exp":["📝 解析：物聯網裝置數量龐大、多數缺乏有效資安控管（預設密碼、少更新），常被駭客當作入侵突破口，或被植入殭屍網路（如Mirai）發動DDoS，(1)(2)(4)正確。(3)錯誤：物聯網裝置通常與企業網路或主要系統相連，並非完全隔離，一旦被攻破就可能橫向滲透，風險反而較高。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9167,"w":1,"sw":0.01201,"id":"17科技力-55"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"17-58","stem":"微軟公司 Microsoft Office 365 是屬於雲端運算的下列何種服務模式？","opts":["韌體即服務(FaaS)","軟體即服務(SaaS)","平台即服務(PaaS)","基礎架構即服務(IaaS)"],"ans":2,"exp":["📝 解析：Microsoft Office 365（現名Microsoft 365）讓使用者透過網路訂閱、直接使用雲端上的文書軟體，不需自行安裝維護應用程式與底層平台，屬軟體即服務（SaaS），選(2)。PaaS提供開發與執行應用程式的平台；IaaS提供伺服器、儲存等基礎設施；FaaS在雲端通常指函數即服務，並非「韌體即服務」。"],"pos":0.9667,"w":1,"sw":0.01201,"id":"17科技力-58"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"17-59","stem":"依據「金融機構運用新興科技作業規範」之規定，銀行應制定雲端服務管理政策，至少多久時間檢視一次？","opts":["每半年","每年","每兩年","每五年"],"ans":2,"exp":["📝 解析：依銀行公會「金融機構運用新興科技作業規範」（109年4月17日發布）第二條「雲端服務安全控管」第四款：「應制定雲端服務管理政策，至少每年檢視一次。」故選(2)每年。每半年過於頻繁、每兩年或每五年則不符規範要求。"],"pos":0.9833,"w":1,"sw":0.01201,"id":"17科技力-59"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"16-14","stem":"下列何者代表衡量生物辨識系統的本人被誤拒率？","opts":["RAR","FFR","FAR","FRR"],"ans":4,"exp":["📝 解析：生物辨識系統的兩項關鍵錯誤率：誤拒率FRR（False Rejection Rate）＝本人卻被系統拒絕的比率；誤納率FAR（False Acceptance Rate）＝非本人卻被系統接受的比率。題目問本人被誤拒，選(4)FRR。RAR、FFR非標準指標。"],"pos":0.2333,"w":1,"sw":0.01201,"id":"16科技力-14"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"16-47","stem":"選擇生物辨識工具時，除技術外還需考慮社會因素如導入難易、隱私性、普及性與接受度，下列敘述何者正確？","opts":["人臉辨識的隱私性較高","靜脈辨識的導入難易與隱私性較差","人臉和指紋辨識的導入難易、普及性與接受度較高","視網膜辨識的導入難易、普及性與接受度較高"],"ans":3,"exp":["📝 解析：人臉與指紋辨識只需手機鏡頭或感測器，導入容易、普及性與接受度都高，故(3)正確。(1)人臉易被拍攝取得，隱私性反而較低；(2)靜脈辨識需專用設備所以導入較難，但靜脈在皮下不易竊取，隱私性高，敘述「隱私性較差」錯誤；(4)視網膜辨識需近距離掃描眼底，導入難、普及性與接受度低。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.7833,"w":1,"sw":0.01201,"id":"16科技力-47"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"15-2","stem":"雲端運算的五大特性「隨需自助服務」、「廣泛的網路連接」、「資源匯集」、「快速彈性」、「可量測服務」是由下列何者所提出？","opts":["美國國家標準協會(American National Standards Insitute, ANSI)","美國國家資訊標準組織(National Information Standards Organization, NISO)","國際標準化組織(International Organization for Standardization, ISO)","美國國家標準局與技術研究院(National Insitute of Standards and Technology, NIST)"],"ans":4,"exp":["📝 解析：雲端運算的五大基本特性（隨需自助服務、廣泛網路存取、資源匯集、快速彈性、可量測服務）及三種服務模式、四種部署模式，出自美國國家標準與技術研究院（NIST）2011年發布的SP 800-145雲端運算定義，選(4)。ANSI、NISO、ISO皆非此定義的提出者。"],"pos":0.0333,"w":1,"sw":0.01201,"id":"15科技力-02"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"15-4","stem":"由雲端服務業者將基礎設備資源提供給消費者使用，是下列何種雲端運算的服務模式？","opts":["基礎架構即服務","平台即服務","軟體即服務","資料即服務"],"ans":1,"exp":["📝 解析：雲端服務業者提供伺服器、儲存、網路等基礎設備資源，讓消費者自行安裝作業系統與應用程式使用，屬基礎架構即服務（IaaS），選(1)。PaaS提供開發執行平台；SaaS直接提供應用軟體；資料即服務（DaaS）是提供資料內容，非NIST定義的三大服務模式。"],"pos":0.0667,"w":1,"sw":0.01201,"id":"15科技力-04"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"15-14","stem":"根據瑞典紅眼(Redeye)公司2016 年評比，下列何種生物辨識技術在安全性、正確性與穩定性均是較高的？","opts":["指紋辨識","人臉辨識","聲音辨識","靜脈辨識"],"ans":4,"exp":["📝 解析：瑞典紅眼（Redeye）公司2016年對生物辨識技術的評比中，靜脈辨識因利用皮下血管影像、不易被複製或偽造，且不受皮膚表面狀況影響，在安全性、正確性與穩定性三項均屬較高，選(4)。指紋易留存被複製，人臉、聲音則易受光線、噪音、偽造影響。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.2333,"w":1,"sw":0.01201,"id":"15科技力-14"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"15-35","stem":"下列何項目未包含在ISO/IEC 27037 的數位證據指引中？","opts":["數位證據識別","數位證據擷取","數位證據調查","數位證據保存"],"ans":3,"exp":["📝 解析：ISO/IEC 27037是數位證據的識別（Identification）、蒐集（Collection）、擷取（Acquisition）與保存（Preservation）指引，著重第一線處理流程以確保證據完整性。數位證據的調查與分析則由ISO/IEC 27042、27043等其他標準規範，故選(3)。"],"pos":0.5833,"w":1,"sw":0.01201,"id":"15科技力-35"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"14-13","stem":"純網銀開辦後，業者進行KYC(know-your-customer)時，最不可能用到的生物辨識技術為下列何者？","opts":["指紋辨識","虹膜辨識","聲紋辨識","臉部辨識"],"ans":2,"exp":["📝 解析：純網銀以手機App線上開戶、KYC，可用手機內建的指紋感測、鏡頭（臉部）與麥克風（聲紋）完成生物辨識。虹膜辨識需專用紅外線攝影設備，一般手機多不具備，導入難、普及性低，最不可能用於純網銀KYC，選(2)。"],"pos":0.2167,"w":1,"sw":0.01201,"id":"14科技力-13"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"14-15","stem":"生物辨識技術在身分確認上帶給數位金融很大的便利，下列敘述何者不是主要特色？","opts":["靜脈辨識為利用血液中的血紅素吸收近紅外線光後，產生的靜脈影像","指紋辨識是自指紋圖像中取得特徵點，組成指紋模組來辨識","虹膜辨識為透過紅外線攝影機，根據微血管的跳動情形做為依據","聲紋辨識是使用客戶發音的特徵和模式，進行聲紋分析記錄辨識"],"ans":3,"exp":["📝 解析：虹膜辨識是以紅外線攝影機拍攝虹膜上獨特的紋理（皺褶、斑點、隱窩等）作為比對依據，並不是依據「微血管跳動」，故(3)敘述錯誤；以眼底血管分布辨識的是視網膜辨識。(1)靜脈、(2)指紋、(4)聲紋的描述都正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.25,"w":1,"sw":0.01201,"id":"14科技力-15"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"14-42","stem":"大多數企業採用混合雲作為他們的資訊架構與服務運作模式，其中沒有完全採用公有雲，而選擇混合雲的主要考量原因為何？","opts":["成本與安全","效率與成本","安全與合規","成本與合規"],"ans":3,"exp":["📝 解析：企業不全面採用公有雲而選混合雲，主因是「安全與合規」：敏感資料與核心系統放私有雲以符合資安與法規（如金融業資料保存、委外監理要求），一般性服務才放公有雲。成本與效率反而是採用公有雲的優勢，不是保留私有部分的理由。"],"pos":0.7,"w":1,"sw":0.01201,"id":"14科技力-42"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"14-56","stem":"Gartner 主張建立一個了解環境脈絡，隨時進行調適因應的資安防護體制。持續進行監測與分析，不間斷地進行預測與其他三件工作。下列何者非其中之一？","opts":["預防","偵測","回應","更新"],"ans":4,"exp":["📝 解析：Gartner 提出的「調適性安全架構」（Adaptive Security Architecture）以持續監測與分析為核心，包含預測（Predict）、預防（Prevent）、偵測（Detect）、回應（Respond）四大能力。「更新」不在其中，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9333,"w":1,"sw":0.01201,"id":"14科技力-56"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"14-59","stem":"請問下列何項聯盟是為各種數位化服務提供一套開放、互通標準，以解決身分認證技術彼此之間缺乏互通性的問題，並解決使用者以傳統輸入帳號密碼方式進行身分辨識可能衍生的問題？","opts":["EIDO 聯盟","FIDO 聯盟","GIDO 聯盟","HIDO 聯盟"],"ans":2,"exp":["📝 解析：FIDO（Fast IDentity Online）聯盟成立於 2012 年，制定開放、可互通的身分認證標準（如 UAF、U2F、FIDO2），以生物辨識或安全金鑰取代傳統帳號密碼，解決密碼外洩與各家認證技術不互通的問題。EIDO、GIDO、HIDO 皆為虛構名稱。"],"pos":0.9833,"w":1,"sw":0.01201,"id":"14科技力-59"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"13-14","stem":"下列何者非屬指紋辨識的缺點？","opts":["屬於接觸式辨識，有衛生考量","指紋容易因水分或磨損影響識別結果","指紋容易被有心人不當取得","設置成本高"],"ans":4,"exp":["📝 解析：指紋辨識技術成熟、感測器便宜（手機普遍內建），設置成本低是其優點而非缺點，故選(4)。其缺點正是：屬接觸式辨識有衛生疑慮、手指潮濕或磨損會影響辨識、指紋容易被殘留取得而遭複製。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2333,"w":1,"sw":0.01201,"id":"13科技力-14"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"13-42","stem":"下列何項服務或技術受到2020 年新冠病毒(COVID-19)帶來的衝擊或影響最小？","opts":["自動駕駛車興起的邊緣運算技術","雲端運算的桌面即服務(Desktop as a Service)","雲端協作平台服務","遠距辦公及遠距會議系統"],"ans":1,"exp":["📝 解析：2020 年新冠疫情使遠距辦公、視訊會議、雲端協作平台與桌面即服務（DaaS）需求暴增，直接受到疫情衝擊與帶動。自動駕駛車所用的邊緣運算技術與防疫居家需求關聯最小，受影響程度最低，故選(1)。"],"pos":0.7,"w":1,"sw":0.01201,"id":"13科技力-42"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"12-13","stem":"SCA 中有關雙重因子認證之搭配方式，下列何者錯誤？","opts":["客戶自訂登入密碼與金融業者提供之密碼卡","客戶自訂第一段與第二段認證密碼且不可相同","客戶生物辨識與客戶自訂登入密碼","金融業者與客戶共同約定之手機與客戶指紋"],"ans":2,"exp":["📝 解析：強客戶認證（SCA）的雙重因子必須來自不同類別：所知（密碼）、所持（手機、密碼卡、晶片卡）、所具（指紋、臉部等生物特徵）。兩段都是客戶自訂密碼，即使不相同也同屬「所知」一類，不構成雙重因子，故(2)錯。其他
