<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d1d1f;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--sel:#dbeafe;--bd:#d1d5db}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--fg:#f3f4f6;--mut:#9ca3af;--pri:#3b82f6;--okbg:#14532d;--badbg:#7f1d1d;--sel:#1e3a8a;--bd:#374151}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);z-index:5;padding:8px 12px}
header h1{font-size:18px;margin:4px 0 8px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.links{display:flex;gap:6px;margin-bottom:6px}
.links a{color:var(--pri);text-decoration:none;border:1px solid var(--bd);border-radius:10px;padding:5px 10px;font-size:15px;white-space:nowrap}
nav{display:flex;gap:4px}.tab{flex:1;padding:8px 2px;font-size:14px;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:12px 12px 40px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.on,.primary{background:var(--pri)!important;color:#fff!important;border-color:var(--pri)!important}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card button{margin:4px 6px 4px 0}
.row{display:block;width:100%;text-align:left;margin-bottom:8px;border-radius:14px}
.rt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.rt span{color:var(--mut);font-size:14px}
.pbar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok)}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;margin:0}
label{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0}
select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
input[type=checkbox]{width:18px;height:18px}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}header.bar button{white-space:nowrap;flex:none}header.bar span{font-size:15px;color:var(--mut);text-align:center}
.meta{color:var(--mut);font-size:13px;margin-bottom:6px}
.stem{font-size:17px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px;line-height:1.5;word-break:break-word;margin:0!important}
.opt.sel{background:var(--sel);border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{opacity:1}
.exp{margin-top:12px;padding:10px 12px;border-radius:10px;border-left:4px solid}
.exp.ok{border-color:var(--ok);background:var(--okbg)}.exp.bad{border-color:var(--bad);background:var(--badbg)}
.exp p{margin:6px 0;word-break:break-word}.exp p.fix{background:rgba(34,197,94,.18);border-radius:8px;padding:6px 8px;font-weight:600}.res{font-weight:700}.refs{color:var(--mut);font-size:13px}
.nav{display:flex;gap:8px;margin-bottom:12px}.nav button{flex:1;padding:14px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid button{padding:6px 0;font-size:13px;border-radius:6px;margin:0}
.grid .done{background:var(--sel)}.grid .cur{outline:2px solid var(--pri)}.grid .ok{background:var(--okbg)}.grid .bad{background:var(--badbg)}
.grid button small{display:block;font-size:12px;line-height:1.2}.mk{display:flex;gap:6px;margin:-4px 0 12px}.mk button{flex:1;margin:0;padding:8px 4px;font-size:22px;line-height:1.2}
.center{text-align:center}.big{font-size:44px;font-weight:800;line-height:1.2}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
.warn{border-color:#f59e0b}
.mut{color:var(--mut);font-size:14px}
#timer{font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.fav{font-size:20px;padding:4px 12px;color:#f59e0b}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left}
.btnlink{display:inline-block;color:var(--pri);text-decoration:none;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:4px 6px 4px 0}

<script>
const DATA = {"cfg":{"key":"fintechquiz_v1","title":"金融科技力知識檢定 互動題庫","old":"","order":["all"],"subj":{"all":{"name":"金融科技力","short":"科技力","min":90,"n":60}},"pts":[[40,1.5],[60,2]]},"hot":[{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":1,"n":3,"refs":"18-5、14-6、11-44","stem":"下列何種特色並非是在世界經濟論壇中提到新市場平台(New Market Platform)所具備的特色？","opts":["社群化","個人化","標準化","自動化"],"ans":2,"exp":["📝 解析：世界經濟論壇（WEF, 2015）指出「新市場平台」具備社群化、標準化、自動化三大特色：透過平台聚集參與者、以標準化商品與流程撮合、並自動化交易。「個人化」不在其中，故選(2)。"],"pos":0.3056,"w":1,"sw":0.01429,"id":"科技力-A0013"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":1,"n":3,"refs":"16-57、13-38、9-39","stem":"「創新科技使金融機構能夠獲得新的資料型態，如社群網路資料，進而以新的方法來理解客戶及市場。」以上描述指的是何項金融創新議題？","opts":["高價值活動自動化","中介減少","數據策略性角色","專利化利基商品"],"ans":3,"exp":["📝 解析：WEF（2015）金融創新六大議題之一「數據策略性角色」（Strategic Role of Data），指創新科技讓金融機構取得社群網路等新型態資料，以新方法理解客戶與市場，故選(3)。高價值活動自動化是用演算法取代專業判斷；中介減少是去除中間人；專利化利基商品是新進者專攻特定領域。"],"pos":0.7444,"w":1,"sw":0.09375,"id":"科技力-A0023"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":1,"n":2,"refs":"20-43、10-7","stem":"有關「新市場平台(New Market Platform)」的敘述，下列何者錯誤？","opts":["具資訊媒合平台使用特點","具資源使用效率提高特點","與共享經濟或平台經濟完全不同","可提高市場流動性及交易透明度"],"ans":3,"exp":["📝 解析：新市場平台透過資訊媒合讓供需雙方直接交易，提高資源使用效率、市場流動性與交易透明度，概念上與共享經濟、平台經濟高度相關，並非「完全不同」，故(3)錯誤，選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4167,"w":1,"sw":0.04808,"id":"科技力-A0042"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":1,"n":2,"refs":"17-32、9-40","stem":"金融創新的議題中之「流線型設施(Streamlined Infrastructure)」，係指下列何者？","opts":["創新科技讓客戶可以連結到以往受限而無法取得的資產和服務，對於產品有更多的資訊及工具可以管理各種產品選項，進而成為生產性消費者","創新科技如「平台化」及「分散式」技術，提供全新整合及分析資訊的方法。同時方便連結能力也降低取得金融資訊及參與金融服務的成本","許多金融創新應用先進的演算法及高效的處理能力，將過去需要專業人員判斷的應用加以自動化。進而提供更便宜、更快速、擴展性更強的替代服務及產品","新進者專精於特定領域，並設計具有高度針對性的產品及服務，加大在這些領域的競爭"],"ans":2,"exp":["📝 解析：WEF金融創新議題中「流線型設施」（Streamlined Infrastructure）指平台化、分散式等新技術提供整合與分析資訊的新方法，連結更方便並降低取得金融資訊及參與服務的成本，故選(2)。(1)是「客戶賦權」，(3)是「高價值活動自動化」，(4)是「專利化利基商品」。"],"pos":0.6,"w":1,"sw":0.02,"id":"科技力-A0066"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":1,"n":2,"refs":"16-7、8-44","stem":"有關「新市場平台(New Market Platform)」商業模式，下列何者正確？","opts":["新進或小型金融機構可加入平台，透過資訊整合與潛在的交易者進行聯繫","台灣尚未出現新市場平台商業模式","Novus 是一個著名的自動化股票期貨交易數據分析平台","新市場平台難以擴展現有市場的運作架構"],"ans":1,"exp":["📝 解析：新市場平台讓新進或小型金融機構加入平台，透過資訊整合接觸潛在交易對手，(1)正確。(2)台灣已有類似平台商業模式；(3)Novus是提供機構投資人投資組合分析的平台，不是自動化股票期貨交易數據平台；(4)新市場平台正是用來擴展現有市場運作架構。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.425,"w":1,"sw":0.02,"id":"科技力-A0083"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":1,"n":2,"refs":"16-58、10-60","stem":"針對2016 世界經濟論壇(WEF)提到影響金融業的七項新興科技，下列應用敘述何者正確？","opts":["「分析用戶消費習慣」屬於生物科技應用","「從自動提款機器中提款」屬於機器學習應用","「手機藍牙 GPS 定位技術」屬於機器人學(Robotics)應用","「將資訊系統放入遠端虛擬伺服器」屬於雲端運算應用"],"ans":4,"exp":["📝 解析：「將資訊系統放入遠端虛擬伺服器」屬於雲端運算應用，(4)正確。(1)分析用戶消費習慣屬大數據／機器學習，非生物科技；(2)從ATM提款是自動化設備，不是機器學習；(3)手機藍牙、GPS定位屬行動／物聯網技術，非機器人學。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.9833,"w":1,"sw":0.02,"id":"科技力-A0086"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":1,"n":2,"refs":"16-5、13-7","stem":"世界經濟論壇(WEF,2015)認為「新市場平台(New Market Platform)」對傳統金融機構的三大影響，不包括下列何者？","opts":["中介機構差異變小","價差交易擴大","議價能力重組","諮詢顧問業務增加"],"ans":2,"exp":["📝 解析：WEF（2015）指出新市場平台對傳統金融機構的三大影響為：中介機構差異變小、議價能力重組、諮詢顧問業務增加。平台使價格更透明、撮合更直接，價差交易是「縮小」而非擴大，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1,"w":1,"sw":0.02,"id":"科技力-A0091"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":1,"n":2,"refs":"15-43、12-5","stem":"世界經濟論壇(WEF,2015)認為「新市場平台」的三大特色不包括下列何者？","opts":["結構化","社群化","標準化","自動化"],"ans":1,"exp":["📝 解析：WEF（2015）指出新市場平台的三大特色為社群化、標準化、自動化，「結構化」不在其中，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4,"w":1,"sw":0.02,"id":"科技力-A0106"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":1,"n":2,"refs":"12-6、8-5","stem":"WEF(2015)中有關「新市場平台(New Market Platform)」的功能不包括下列何者？","opts":["增加流動性","提高價格準確性","增加交易機會","降低透明度"],"ans":4,"exp":["📝 解析：WEF《金融服務的未來》（2015）在「市場供應」功能中指出，新市場平台透過連結買賣雙方與數據，可增加流動性、提高價格準確性（價格發現）、增加交易機會並「提高」市場透明度。「降低透明度」與其功能相反，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0917,"w":1,"sw":0.02,"id":"科技力-A0136"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":1,"n":2,"refs":"7-1、3-41","stem":"根據世界經濟論壇(WEF)「金融服務的未來」報告，金融業將在下列哪些領域面對新創公司的競爭？ A.外匯 B.轉帳 C.存貸 D.信用卡 E.籌資 F.投資管理","opts":["ADEF","BCD","CDE","CEF"],"ans":4,"exp":["📝 解析：WEF（2015）把金融服務分為六大功能：支付、保險、存貸、籌資、投資管理、市場資訊供應，新創公司在這些領域與金融業競爭。題中 C 存貸、E 籌資、F 投資管理屬之，外匯、轉帳、信用卡是支付功能底下的細項而非六大功能名稱，故選 CEF。第3屆版本(1)為 AEF，答案同為(4)。"],"pos":0.35,"w":1,"sw":0.02,"id":"科技力-A0155"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":2,"n":4,"refs":"18-13、16-49、14-49、10-18","stem":"資料標記技術(EMVCo Tokenization)主要解決下列何種問題？","opts":["消費者常忘記卡號","降低店家收單成本","付款流程複雜","減少實體卡號外洩風險"],"ans":4,"exp":["📝 解析：EMVCo Tokenization以一組代碼（Token）取代真實卡號（PAN）進行交易，即使代碼外洩也無法在其他通路或裝置盜用，主要目的是降低實體卡號外洩風險，故選(4)。(1)忘記卡號、(2)收單成本、(3)流程複雜都不是代碼化要解決的核心問題。第10屆選項寫「個資外洩」，意思相同，答案一樣是(4)。","⚠ 第 10 屆問法／選項不同：「資料標記技術 (EMVCo Tokenization) 主要解決了下列問題？…」答案「個資外洩」→ 看清楚題目問什麼"],"pos":0.5375,"w":1,"sw":0.3,"id":"科技力-A0004"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":3,"refs":"16-17、14-16、10-19","stem":"下列何者非屬網際網路興起後的支付模式？","opts":["電子資金轉帳","純網路銀行","電子商務支付系統","加密貨幣"],"ans":1,"exp":["📝 解析：電子資金轉帳（EFT）早在1970年代就隨ATM、銀行間清算系統發展，屬網際網路興起「之前」的支付模式，故選(1)。純網路銀行、電子商務支付系統（如第三方支付）、加密貨幣都是網際網路普及後才出現。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2889,"w":1,"sw":0.09375,"id":"科技力-A0026"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"21-47、14-14","stem":"2017 年歐盟支付服務指令II (PSD 2)要求進行電子支付時，要進行的認證為下列何者？","opts":["強化生產者驗證","強化消費者驗證","強化設備驗證","強化動態密碼驗證"],"ans":2,"exp":["📝 解析：歐盟PSD2要求電子支付進行「強化客戶（消費者）驗證」（Strong Customer Authentication, SCA），須具備知識（密碼）、持有（手機、卡片）、生物特徵三類因素中至少兩種，故選(2)。PSD2於2015年通過、2018年1月施行，SCA技術標準自2019年9月起適用；題目寫2017年是教材說法，不影響答案。"],"pos":0.5083,"w":1,"sw":0.03261,"id":"科技力-A0032"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"20-15、8-17","stem":"有關傳統支付模式的挑戰或轉型敘述，下列何者錯誤？","opts":["現金鑄印成本高，容易成為洗錢媒介","紙本票據具被轉讓性質，難轉往電子化發展","信用卡將逐漸轉以數位代碼化進行交易","小額轉帳將流向電子支付機構執行"],"ans":2,"exp":["📝 解析：紙本票據雖可背書轉讓，但已能透過票據影像交換、電子票據等方式電子化，可轉讓性並不阻礙電子化，故(2)錯誤，選(2)。(1)現金鑄印及管理成本高、匿名易被洗錢利用；(3)信用卡逐步以代碼化（Tokenization）交易；(4)小額轉帳逐漸流向電子支付機構，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2667,"w":1,"sw":0.04808,"id":"科技力-A0037"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"20-48、11-51","stem":"NFC 支付通常有三個主要的組成元素，不包括下列何者？","opts":["手機的NFC 天線","手機內建防干擾的安全元件","商店收銀台的非接觸式讀卡機","RFID 無線射頻辨識"],"ans":4,"exp":["📝 解析：NFC支付三個主要元素為：手機的NFC天線、手機內建防干擾的安全元件（Secure Element）、商店收銀台的非接觸式讀卡機，故選(4)。RFID是NFC所源自的無線射頻技術家族，本身不是NFC支付的組成元素。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.825,"w":1,"sw":0.04808,"id":"科技力-A0045"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"19-13、9-50","stem":"下列何項非屬近距離無線通訊(Near Field Communication, NFC)支付的主要組成元素？","opts":["手機的NFC 天線","收銀台的非接觸式讀卡機","手機內建防干擾的安全元件","QR code"],"ans":4,"exp":["📝 解析：NFC支付三要素為手機的NFC天線、手機內建防干擾的安全元件、收銀台的非接觸式讀卡機。QR code是以相機掃描條碼的另一種行動支付技術，不屬於NFC組成元素，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.525,"w":1,"sw":0.02155,"id":"科技力-A0050"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"18-14、13-49","stem":"有關感應式裝置結合線上支付的付款方式，不包括下列何者？","opts":["Amazon Go 無人實體購物商店","台北公車的悠遊卡付款","阿里巴巴的「淘咖啡」服務","VISA 及MasterCard 的自動加油機扣款服務"],"ans":2,"exp":["📝 解析：感應式裝置結合線上支付，是感應後即時連線扣款或結帳，例如Amazon Go無人商店、阿里巴巴淘咖啡、VISA／MasterCard自動加油機扣款。台北公車悠遊卡是離線扣減卡片內儲值金額的儲值卡交易，不屬於結合線上支付，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.525,"w":1,"sw":0.02155,"id":"科技力-A0056"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"17-48、13-48","stem":"各類行動支付技術從保護消費者的安全性來看，下列何者是最安全的行動交易形式？","opts":["近距離無線通訊(NFC)","主機卡模擬(HCE)","EMV Token 代碼服務交易","QR Code"],"ans":1,"exp":["📝 解析：教材比較各類行動支付安全性時，以NFC最安全：卡片資料存放在手機內建的硬體安全元件（SE），與一般作業系統隔離、不易被惡意程式竊取，故選(1)。(2)HCE以軟體模擬卡片，資料存放於雲端或手機記憶體，安全性較依賴軟體防護；(3)EMV Token是以代碼取代卡號的補強機制，常與HCE搭配，本身不是硬體隔離；(4)QR Code容易被偽造或覆蓋竄改，安全性最低。"],"pos":0.8,"w":1,"sw":0.02,"id":"科技力-A0072"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"16-16、10-17","stem":"綜觀各國電子支付的零售行銷活動，下列何者非其主要方式？","opts":["使用類似「回饋幣」的方式擴大參加支付體系的商家與會員","加強宣導電子支付的安全性，使商家願意接受電子支付","消費者完成電子支付後，業者撥付一定比率的點數到客戶帳戶","運用忠實的客群，回頭帶動新加入商家的生意，以增加合作效益"],"ans":2,"exp":["📝 解析：各國電子支付的零售行銷主要用回饋幣擴大商家與會員、消費後撥付一定比率點數、運用忠實客群帶動新加入商家生意等誘因機制。加強宣導安全性屬於教育與風控面，不是主要的零售行銷方式，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.275,"w":1,"sw":0.02,"id":"科技力-A0085"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"15-48、8-50","stem":"下列哪個項目不屬於遠端支付？","opts":["提供繳費、轉帳的網路銀行App 模式","第三方支付的行動購物模式","醫療費用行動支付平台綁定信用卡或金融卡，以繳付醫療費用的App 模式","Apple Pay、Google Pay、Samsung pay"],"ans":4,"exp":["📝 解析：遠端支付是透過網路連線完成付款，不需與收款端實體接觸，例如網銀App繳費轉帳、第三方支付行動購物、醫療費用App綁卡繳費。Apple Pay、Google Pay、Samsung Pay主要用手機NFC在實體店感應付款，屬於近端（近場）支付，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8167,"w":1,"sw":0.02,"id":"科技力-A0097"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"15-17、12-17","stem":"有關感應式裝置結合線上支付的必要裝置或技術，不包括下列何者？","opts":["5G 或其他行動網路","資料庫","IoT 物聯網","RFID 感應晶片"],"ans":4,"exp":["📝 解析：感應式裝置結合線上支付的必要條件是5G或其他行動網路（即時連線）、資料庫（會員與支付資料）、IoT物聯網（感測裝置串接）。RFID感應晶片只是可選用的感應方式之一，例如Amazon Go主要靠攝影機與感測器，並非必要，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2833,"w":1,"sw":0.02,"id":"科技力-A0108"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"14-48、8-51","stem":"有關P2P 匯兌，可能存在一些不易察覺的實質缺陷，下列敘述何者錯誤？","opts":["估計費率與實際費率的差異：P2P 匯兌都會公布現在可用匯率，但當預訂和支付時可能需3 到5 天，匯率可能已大幅變動","P2P 匯兌業者規模大都屬大型機構，其買家及賣家的匯兌金額，通常都能確保在任何時間擁有相同數量的匯兌金額，不曾發生失衡","若客戶預定購買的貨幣發生價格快速上漲，為保護買家P2P 的自動匯兌機制可能自動暫停轉帳，導致必須額外等待時間處理匯款","P2P 匯兌屬於跨境交易，客戶大都來自網路線上，平台若未像電支機構或網銀進行客戶身分驗證，當客戶發生洗錢或資恐，平台可能遭高額罰款"],"ans":2,"exp":["📝 解析：P2P匯兌業者多屬中小型新創，靠撮合買賣雙方的換匯需求，供需並非隨時平衡，常需等待配對或動用自有資金，故(2)「多屬大型機構、不曾發生失衡」錯誤，選(2)。(1)估計匯率與實際成交匯率可能有差、(3)匯率急漲時自動暫停轉帳、(4)未落實客戶身分驗證可能因洗錢資恐遭重罰，皆為實質缺陷。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.825,"w":1,"sw":0.02,"id":"科技力-A0111"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"13-16、10-51","stem":"有關跨境 P2P(peer-to-peer money transfers)匯兌的敘述，下列何者錯誤？","opts":["跨境 P2P 匯兌的估計匯率與實際匯率常有所差距","匯價的波動常會引發 P2P 匯兌延遲處理","P2P 匯兌平台有可能發生資金不平衡現象","客戶身分確認，不易出現漏洞"],"ans":4,"exp":["📝 解析：跨境 P2P 匯兌是平台把兩國反向需求的使用者互相配對，資金不實際跨境。其風險包括：預估匯率與實際成交匯率常有落差、匯價劇烈波動時配對延遲、兩方需求不對等造成資金不平衡。線上開戶的客戶身分確認（KYC）反而容易出現漏洞而被利用於洗錢，故(4)錯。第10屆與第13屆僅空格排版不同，答案相同。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5583,"w":1,"sw":0.02,"id":"科技力-A0132"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"7-13、1-14","stem":"對於第三方支付之敘述，下列何者正確？","opts":["第三方支付等於行動支付","提供買賣雙方交易保障服務","第三方支付業者指的就是銀行機構","第三方支付不含電子票證"],"ans":2,"exp":["📝 解析：第三方支付在買賣雙方間代收代付，買方付款先由業者保管，確認收貨後才撥給賣方，提供交易保障（履約保證）。(1)行動支付是以手機為載具的支付，第三方支付不等於行動支付；(3)業者多為非銀行的電子支付機構；(4)現行電子支付機構管理條例已將電子票證業務整併納入。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.225,"w":1,"sw":0.02,"id":"科技力-A0148"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"7-14、1-15","stem":"有關行動支付的營運與發展，下列敘述何者錯誤？","opts":["行動支付需第三方支付業者才能提供服務","行動支付從技術上，可分為遠端支付與近端支付兩種形式","行動支付可透過手機進行連線／離線的支付服務","許多新科技被應用於行動支付，包括穿戴式裝置與生物辨識技術"],"ans":1,"exp":["📝 解析：行動支付可由銀行（信用卡、金融卡）、電信業、電子支付機構等多種業者提供，例如 Apple Pay 綁定銀行信用卡即可使用，不一定需第三方支付業者，故(1)錯。行動支付依技術分遠端（線上）與近端（NFC、QR Code 等）支付，可連線或離線交易，並結合穿戴裝置與生物辨識等新技術。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2417,"w":1,"sw":0.02,"id":"科技力-A0149"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"7-40、2-40","stem":"下列何者非為電子支付法令應遵循的面向？","opts":["支付機構資格審查","雲端科技控管","用戶管理與洗錢防制","保護消費者權益第二部分：第41~60 題(每題2 分)"],"ans":2,"exp":["📝 解析：電子支付法令應遵循的面向包括：支付機構資格審查（許可、資本額）、用戶管理與洗錢防制（身分確認、KYC）、保護消費者權益（支付款項保障、資訊揭露）。「雲端科技控管」是一般資安管理議題，不是電子支付法令的主要面向，故選(2)。（選項(4)後段「第二部分…」為試卷排版殘字，可忽略。）","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6667,"w":1,"sw":0.02,"id":"科技力-A0152"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":1,"n":2,"refs":"7-12、5-16","stem":"下列何者非屬NFC 應用的安全元件形式？","opts":["SWP－SIM","Embedded SE(Secure Element)","Micro SD 卡","PAN(Primary Account Number)"],"ans":4,"exp":["📝 解析：NFC 手機支付需要安全元件（SE）儲存卡片金鑰，常見形式有：SWP-SIM（放在 SIM 卡）、Embedded SE（手機內建晶片）、Micro SD 卡；另有以雲端模擬的 HCE。PAN 是卡片主帳號（卡號），是被保護的資料而非安全元件，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2333,"w":1,"sw":0.02,"id":"科技力-A0162"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":3,"refs":"21-9、18-46、10-11","stem":"比特幣區塊鏈的公鑰密碼術所選取的「單向函數」，是由下列何者產生？","opts":["RSA 演算法","凱薩演算法","橢圓曲線密碼術","雜湊演算法"],"ans":3,"exp":["📝 解析：比特幣的公私鑰採用橢圓曲線密碼術（ECC，曲線為secp256k1），由私鑰推得公鑰容易、由公鑰反推私鑰在計算上不可行，構成「單向函數」，故選(3)。(1)RSA是另一種公鑰演算法，比特幣未採用；(2)凱薩演算法是古典替換加密；(4)雜湊演算法（SHA-256、RIPEMD-160）用於產生地址與挖礦，不是公鑰密碼的單向函數來源。"],"pos":0.3667,"w":1,"sw":0.03846,"id":"科技力-A0006"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":3,"refs":"18-48、16-18、10-50","stem":"下列何者是美國銀行保密法(Bank Secrecy Act, BSA)下的貨幣傳送者(monetary transmitter)？","opts":["接受或傳送具有貨幣替代性價值之數位貨幣的人","對大眾傳播(Communication)網路資料及服務的人","對大眾遞送(Delivery)網路資料及服務的人","對貨幣傳送者提供網路資料及服務的人"],"ans":1,"exp":["📝 解析：美國FinCEN於2013年發布指引（FIN-2013-G001），將接受並傳送具貨幣替代價值之虛擬（數位）貨幣的管理者與兌換者，認定為銀行保密法（BSA）下的貨幣傳送者（money transmitter），須登記並遵守反洗錢義務，故選(1)。(2)(3)(4)只是提供網路資料傳播、遞送或資訊服務者，並未經手資金移轉，不屬貨幣傳送者。"],"pos":0.6444,"w":1,"sw":0.01429,"id":"科技力-A0012"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"21-10、10-13","stem":"下列何者並非區塊鏈的種類？","opts":["公有鏈","私有鏈","自由鏈","聯盟鏈"],"ans":3,"exp":["📝 解析：區塊鏈依參與權限分為公有鏈（任何人可參與，如比特幣）、私有鏈（單一機構管理）、聯盟鏈（多個機構共同管理，如R3 Corda），另有混合鏈。沒有「自由鏈」這種分類，故選(3)。"],"pos":0.1917,"w":1,"sw":0.03261,"id":"科技力-A0030"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"21-46、15-12","stem":"比特幣的地址(位址)是由下列何者所產生？","opts":["私鑰","公鑰","區塊鏈","比特幣帳本"],"ans":2,"exp":["📝 解析：比特幣地址由「公鑰」產生：公鑰先經SHA-256，再經RIPEMD-160雜湊，最後以Base58Check編碼成地址，故選(2)。私鑰用來推導公鑰與簽署交易，不可公開，也不直接產生地址；區塊鏈與帳本只是記錄交易的資料結構。"],"pos":0.4833,"w":1,"sw":0.03261,"id":"科技力-A0033"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"20-46、10-47","stem":"雜湊函數的輸入是任意長度字串，而輸出是下列何種字串？","opts":["任意長度字串","固定長度字串","隨機長度字串","不固定長度字串"],"ans":2,"exp":["📝 解析：雜湊函數可將任意長度的輸入轉換成「固定長度」的輸出（如SHA-256固定輸出256位元），且輸入稍有變動輸出即大幅改變、無法由輸出反推輸入，故選(2)。"],"pos":0.775,"w":1,"sw":0.04808,"id":"科技力-A0043"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"18-10、14-12","stem":"區塊鏈在金融業最有潛力的應用場景包含下列哪幾項？ A.跨境支付 B.外匯交易 C.貿易融資 D.供應鏈金融","opts":["僅A","僅AB","僅ABC","ABCD"],"ans":4,"exp":["📝 解析：區塊鏈在金融業最具潛力的應用場景包括跨境支付（縮短清算時間、降低費用）、外匯交易、貿易融資（信用狀、單據流轉上鏈）、供應鏈金融（核心企業信用傳遞給上下游），四者皆是，故選(4)。"],"pos":0.1833,"w":1,"sw":0.02155,"id":"科技力-A0059"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"17-10、9-48","stem":"比特幣區塊鏈上的每一個區塊，可分為區塊主體與區塊頭，其區塊頭不包括下列何項資訊？","opts":["時間戳","難度值","前一個區塊之區塊頭的雜湊值","比特幣地址"],"ans":4,"exp":["📝 解析：比特幣區塊頭包含版本號、前一區塊頭的雜湊值、默克爾根（Merkle root）、時間戳、難度目標值、隨機數（Nonce）。比特幣地址出現在區塊主體的交易資料中，不在區塊頭，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.02,"id":"科技力-A0067"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"17-45、12-45","stem":"雜湊函數是執行下列何種壓縮方式，可將輸入資料作不可逆且不可重複的壓縮處理？","opts":["雙向","單向","隨機","比例"],"ans":2,"exp":["📝 解析：雜湊函數是「單向」壓縮：可從輸入算出固定長度的輸出，但無法由輸出反推輸入（不可逆），且不同輸入極難得到相同輸出（抗碰撞），故選(2)。"],"pos":0.75,"w":1,"sw":0.02,"id":"科技力-A0070"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"17-9、14-46","stem":"目前比特幣的「共識機制」是採用下列何者？","opts":["工作量證明","權益證明","工作權益證明","實用拜占庭容錯法"],"ans":1,"exp":["📝 解析：比特幣採用工作量證明（Proof of Work, PoW）共識機制：礦工以算力反覆嘗試Nonce，最先算出符合難度目標之雜湊值者取得記帳權，故選(1)。權益證明（PoS）為以太坊2022年合併後採用；實用拜占庭容錯（PBFT）多用於聯盟鏈。"],"pos":0.4583,"w":1,"sw":0.02,"id":"科技力-A0075"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"16-46、11-11","stem":"有關比特幣區塊鏈中非對稱式金鑰演算法的敘述，下列何者錯誤？","opts":["公鑰與私鑰必然是成對產生的","每個使用者都會有一對公鑰與私鑰","私鑰可以被發佈與傳遞以達到身分驗證","可以公鑰加密、私鑰解密，或以私鑰加密、公鑰解密"],"ans":3,"exp":["📝 解析：非對稱金鑰中，公鑰可公開發布，私鑰必須自行秘密保管；私鑰一旦外流，他人即可冒名簽署交易、轉走資產，故(3)「私鑰可被發佈與傳遞」錯誤，選(3)。(1)公私鑰成對產生、(2)每位使用者有一對金鑰、(4)公鑰加密私鑰解密（保密）或私鑰簽署公鑰驗證（身分驗證），皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.475,"w":1,"sw":0.02,"id":"科技力-A0088"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"13-11、8-11","stem":"區塊鏈使用公鑰及私鑰進行加密工作，此公鑰與私鑰的生成關係，下列敘述何者正確？","opts":["「獨立」生成","「成對」生成","可「獨立」，亦可「成對」生成","非「獨立」且非「成對」生成"],"ans":2,"exp":["📝 解析：非對稱加密的公鑰與私鑰是由同一演算法（如比特幣用的橢圓曲線 secp256k1）一次「成對」產生：先產生私鑰，再由私鑰推導出對應公鑰，兩者數學上綁定。單獨產生的一把鑰匙無法與另一把配對，因此不是「獨立」生成；也不存在可獨立亦可成對的情形。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.1833,"w":1,"sw":0.02,"id":"科技力-A0121"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"13-12、8-48","stem":"對於區塊鏈的數位簽章，下列敘述何者正確？","opts":["使用公鑰上鎖，私鑰解鎖","使用私鑰上鎖，公鑰解鎖","使用公鑰及私鑰聯合上鎖","使用公鑰及私鑰聯合解鎖"],"ans":2,"exp":["📝 解析：數位簽章是「私鑰簽署（上鎖）、公鑰驗證（解鎖）」：只有持有私鑰的人能產生簽章，任何人都能用公開的公鑰驗證簽章確實出自該私鑰且內容未被竄改。反過來「公鑰上鎖、私鑰解鎖」是加密傳訊的用法（保密），不是簽章；兩把鑰匙也不需聯合上鎖或解鎖。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.5,"w":1,"sw":0.02,"id":"科技力-A0125"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"7-52、4-52","stem":"下列何者不是區塊鏈在數位金融應用上的重大影響及效益？","opts":["降低信任風險","交易過程多層次化","驅動新型商業模式的誕生","共同執行可信賴的流程，是實現共享金融的有利工具"],"ans":2,"exp":["📝 解析：區塊鏈的效益在於以分散式共識降低信任風險、去除中介讓交易流程「扁平化」，並可驅動新商業模式、共同執行可信賴流程以實現共享金融。「交易過程多層次化」與去中介化相反，不是區塊鏈的效益，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8667,"w":1,"sw":0.02,"id":"科技力-A0160"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"7-26、6-27","stem":"區塊鏈的技術是藉由下列哪一項與網路通訊科技共享帳簿資料處理的電腦技術，保護交易帳戶的安全與隱私達成共享帳簿的互聯網？","opts":["密碼學","智慧合約","區塊","共識演算法"],"ans":1,"exp":["📝 解析：區塊鏈以密碼學（雜湊函數、非對稱加密、數位簽章）結合網路通訊技術共享帳簿，確保交易無法竄改，並以假名位址保護帳戶安全與隱私。智慧合約、區塊、共識演算法也是區塊鏈元素，但保護安全與隱私的核心是密碼學。"],"pos":0.4417,"w":1,"sw":0.02,"id":"科技力-A0166"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":1,"n":2,"refs":"6-52、5-30","stem":"下列哪一項不是區塊鏈資訊解決方案的組成元件？","opts":["基礎建設層","業務應用模組共用層","業務應用層","資訊通訊層"],"ans":4,"exp":["📝 解析：依教材，區塊鏈資訊解決方案由「基礎建設層、業務應用模組共用層、業務應用層」三層組成。本題（第6屆）選項中「資訊通訊層」不在其中，故選(4)。第5屆版本的干擾項換成「資料儲存層」，答案為(2)，兩版判斷依據相同：只要不是上述三層即為答案。","⚠ 第 5 屆問法／選項不同：「下列何者不是區塊鏈的資訊解決方案的組成元件？…」答案「資料儲存層」→ 看清楚題目問什麼","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6833,"w":1,"sw":0.02,"id":"科技力-A0167"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":3,"refs":"18-31、12-37、8-40","stem":"下列何項金融機構之作業，較不適合運用機器人流程自動化系統(RPA)來處理？","opts":["AML 洗錢防制","個人金融貸款處理","網路銀行轉帳作業","銀行開戶審核作業"],"ans":3,"exp":["📝 解析：RPA適合處理大量、重複、規則明確且需人工跨系統操作的後台作業，如AML名單比對、個人貸款資料處理、開戶審核。網路銀行轉帳本身已由客戶線上自助完成、系統全自動處理，沒有人工重複操作可替代，最不適合導入RPA，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6,"w":1,"sw":0.01429,"id":"科技力-A0008"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":3,"refs":"17-56、13-39、9-59","stem":"金融機構在運用人工智慧技術需要注意的原則中，下列敘述何者錯誤？","opts":["避免過度期望人工智慧的進展","對於要研究的議題需擁有足夠數量的資料","設定合理的期望值","要從大規模的應用開始"],"ans":4,"exp":["📝 解析：金融機構導入AI應避免過度期望、設定合理期望值、確保研究議題有足夠數量的資料，並應「從小規模、可快速驗證效益的應用開始」再逐步擴大。(4)要從大規模應用開始，風險高且違反原則，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8556,"w":1,"sw":0.09375,"id":"科技力-A0017"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":3,"refs":"17-31、15-38、10-38","stem":"目前應用人工智慧進行「客戶經營」，下列何種情境並非該主題的研究重點？","opts":["注重於如何利用人工智慧服務客戶","引進理財機器人提供智慧投資建議","利用量子計算來加速人工智慧運算效能與效率","與外部系統連結智慧音箱提供智慧語音的客戶服務"],"ans":3,"exp":["📝 解析：以AI進行「客戶經營」的研究重點在服務客戶：用AI服務客戶、理財機器人提供投資建議、連結智慧音箱提供語音客服。利用量子計算加速AI運算屬於底層運算技術研究，不是客戶經營主題的重點，故選(3)。"],"pos":0.5944,"w":1,"sw":0.09375,"id":"科技力-A0018"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":3,"refs":"16-10、13-10、8-10","stem":"有關深度學習的說明，下列何者錯誤？","opts":["利用多層神經網路來分析數據","優點是可忍受有雜訊的數據","可分析影像、影片等多維度且複雜的數據","重點是事先決定「特徵值」(Features)"],"ans":4,"exp":["📝 解析：深度學習利用多層神經網路，可「自動」從原始資料中學習特徵，不需事先人工決定特徵值；需要人工做特徵工程的是傳統機器學習，故(4)錯誤，選(4)。(1)多層神經網路、(2)對雜訊有一定容忍度、(3)能分析影像、影片等高維複雜資料，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1667,"w":1,"sw":0.09375,"id":"科技力-A0020"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":3,"refs":"16-6、14-43、9-7","stem":"大數據資料分析的重要步驟，不包括下列何者？","opts":["定義問題","收集數據","數據清理","數據交換"],"ans":4,"exp":["📝 解析：大數據分析的主要步驟為：定義問題 → 收集數據 → 數據清理（整理） → 分析建模 → 解讀與呈現結果。「數據交換」不是分析流程的步驟，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3111,"w":1,"sw":0.09375,"id":"科技力-A0021"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":3,"refs":"16-8、14-8、9-8","stem":"人工智慧的發展第一次熱潮主要環繞在讓機器具備「推論」或「探索」的功能，使用的主要工具是何種結構的搜尋演算法，用以做「狀況區分」？","opts":["線性結構","樹狀結構","網狀結構","環狀結構"],"ans":2,"exp":["📝 解析：AI第一次熱潮（1950～60年代）著重讓機器「推論」與「探索」，主要工具是樹狀結構的搜尋演算法（搜尋樹），把問題逐層分支做狀況區分，例如解迷宮、下棋，故選(2)。線性、網狀、環狀結構都不是當時的主要工具。"],"pos":0.1333,"w":1,"sw":0.09375,"id":"科技力-A0022"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"21-44、17-44","stem":"下列何者非屬弱人工智慧之應用案例？","opts":["影像辨識","聲音辨識","Google AlphaGo","百分之百模仿人類的決策"],"ans":4,"exp":["📝 解析：弱人工智慧只在特定領域完成特定任務，如影像辨識、聲音辨識、AlphaGo下圍棋。能百分之百模仿人類決策、具通用思考能力的是「強人工智慧」，目前尚未實現，故選(4)。第17屆選項寫「模仿人類的決策」，答案同為(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7333,"w":1,"sw":0.03261,"id":"科技力-A0036"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"19-6、10-8","stem":"1980 年代人工智慧發展出的專家系統(Expert System)把取自專家的資訊彙編成一組規則，這些規則往往以「若...則...」結構呈現，稱為下列何種規則？","opts":["設計規則","生產規則","推論規則","專家規則"],"ans":2,"exp":["📝 解析：專家系統將專家知識編寫成「若（IF）…則（THEN）…」形式的規則，稱為生產規則（production rule，又譯產生式規則），由推論引擎依規則推導結論，故選(2)。"],"pos":0.1167,"w":1,"sw":0.02155,"id":"科技力-A0051"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"18-32、11-40","stem":"有關建置機器人流程自動化系統(RPA)建議採用的原則，下列敘述何者錯誤？","opts":["不同於一般的IT 系統，RPA 系統肩負兩項工作，將系統作業自動化以及優化流程","RPA 系統建置將會是跨部門的流程改造，可請資訊部門兼任以優化流程","任何流程均有可能採用RPA 系統來加速作業，但是在選擇流程時需要同時評估所節省的成本以及有形／無形的效益","若是現有流程的作業原則，無法以文字詳細表述將不適合導入RPA 系統"],"ans":2,"exp":["📝 解析：RPA建置是跨部門的流程改造，應由業務單位主導並成立專責團隊（如卓越中心），而非請資訊部門「兼任」，故(2)錯誤，選(2)。(1)RPA兼具作業自動化與流程優化、(3)選流程要評估節省成本與有形無形效益、(4)作業規則無法以文字詳細描述就不適合導入，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6,"w":1,"sw":0.02155,"id":"科技力-A0053"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"18-37、15-59","stem":"下列何項不屬於非監督性機器學習？","opts":["關聯","降維","分類","聚類"],"ans":3,"exp":["📝 解析：非監督式學習處理沒有標籤的資料，包括關聯規則、降維、聚類（分群）；分類需要已標記的訓練資料，屬監督式學習，故選(3)。第15屆變體問「何者屬於監督式學習」，答案為回歸(2)；回歸與分類同屬監督式學習。","⚠ 第 15 屆問法／選項不同：「下列何項屬於監督性機器學習？…」答案「回歸」→ 看清楚題目問什麼","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8,"w":1,"sw":0.02155,"id":"科技力-A0064"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"17-36、12-59","stem":"下列何項因素非屬推動人工智慧演進的主因？","opts":["各國政策強制推動","數據的爆炸性增長","資訊硬體(計算力與儲存量)的巨幅提升","演算法、數據與資訊硬體的整合發展"],"ans":1,"exp":["📝 解析：推動AI演進的主因是數據爆炸性增長、硬體運算力與儲存量巨幅提升，以及演算法、數據、硬體三者整合發展。各國政策強制推動只是外部助力，不是主因，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7917,"w":1,"sw":0.02,"id":"科技力-A0071"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"17-8、14-10","stem":"機器學習中，不同變數之間存在數學上和機率上的規則，稱為下列何者？","opts":["關係","映對","模型","預測"],"ans":3,"exp":["📝 解析：機器學習中，描述不同變數之間數學與機率規則的就是「模型」：以資料訓練出模型，再用模型做預測，故選(3)。關係與映對只是變數間對應的概念；預測是模型的用途。"],"pos":0.15,"w":1,"sw":0.02,"id":"科技力-A0074"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"16-9、8-9","stem":"有關人工智慧在銀行業的應用，下列敘述何者正確？","opts":["精準行銷主要靠結構化數據的掌握與分析","客戶畫像就是精準辨識客戶照片與本人之相符性","機器人理財主要應用在高資產頂端客戶","人工智慧信用評分可應用在無聯徵資料或少與銀行往來客戶的評分"],"ans":4,"exp":["📝 解析：AI信用評分可運用電信、消費、社群等替代數據，替無聯徵紀錄或與銀行往來少的客戶評分，故(4)正確。(1)精準行銷需同時整合結構化與非結構化數據；(2)客戶畫像是以標籤描述客戶屬性與偏好，不是比對照片；(3)機器人理財門檻低，主要服務大眾與小資族，而非高資產客戶。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.15,"w":1,"sw":0.02,"id":"科技力-A0080"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"16-43、11-6","stem":"在非結構化(Unstructured)的大數據分析中，下列敘述何者錯誤？","opts":["非結構化資料中，資料本身格式相對不固定，資料型態也較為多元","非結構化資料很容易以數位化直接處理及運用","新聞資料通常屬於非結構化資料","非結構化資料的表達及呈現較為直覺清楚，例如：影片、音樂"],"ans":2,"exp":["📝 解析：非結構化資料（文字、新聞、影像、音樂、影片）格式不固定、型態多元，雖然人看起來直覺，但電腦不易直接處理，須經文字探勘、影像辨識等前處理才能運用，故(2)「很容易數位化直接處理」錯誤，選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4083,"w":1,"sw":0.02,"id":"科技力-A0087"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"15-6、8-6","stem":"政府為了打擊假新聞，預計針對《廣播電視法》、《災害防制法》、《糧食管理法》等九項法案進行修法，此種假新聞正是大數據四大特徵之一的何種？","opts":["Veracity","Volume","Variety","Velocity"],"ans":1,"exp":["📝 解析：大數據4V為Volume（數量大）、Variety（類型多）、Velocity（速度快）、Veracity（真實性）。假新聞代表資料的真實性與可信度有問題，對應Veracity，故選(1)。"],"pos":0.1,"w":1,"sw":0.02,"id":"科技力-A0096"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"15-10、9-46","stem":"根據2018 年Bank 4.0 一書，下列何項非用於金融服務的主要人工智慧技術？","opts":["專家流程設計(EPD)","自然語言處理","認知計算","深度學習"],"ans":1,"exp":["📝 解析：Brett King《Bank 4.0》（2018）提到金融服務中的主要AI技術包括自然語言處理、認知計算、機器學習／深度學習等。「專家流程設計（EPD）」不是書中列出的AI技術，故選(1)。"],"pos":0.4667,"w":1,"sw":0.02,"id":"科技力-A0099"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"15-7、10-44","stem":"有關結構化(Structured)的大數據資料，下列敘述何者錯誤？","opts":["結構化資料是指採用特定規格組成的數據資料","結構化資料中的每筆資料都有固定的欄位、大小及格式","結構化資料的每個欄位經過特別設計，不同意義的資料會存在同一個欄位中","一般存在傳統資料庫裡的資料，大多都是以結構化資料方式存在"],"ans":3,"exp":["📝 解析：結構化資料依特定規格組成，每筆資料有固定欄位、大小與格式，多存於傳統關聯式資料庫。正因為每個欄位經過設計，每個欄位只存同一種意義的資料，不會把不同意義的資料存在同一欄位，故(3)錯誤，選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.425,"w":1,"sw":0.02,"id":"科技力-A0103"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"15-39、11-60","stem":"雖然人工智慧各項理論，在早期研究時期即已奠定基礎，但是受限於各種因素，人工智慧經過兩次低潮，直到 2014 年再度成為世人的焦點。這次的熱潮在於三個重大的要素交互作用，使人工智慧的應用進入新的領域，這三個要素不包括下列何項？","opts":["強大的計算能力","風險合規的要求","高品質的大數據","機器學習演算法的發展"],"ans":2,"exp":["📝 解析：2014年起AI第三次熱潮來自三大要素交互作用：強大的計算能力（GPU、雲端）、高品質的大數據、機器學習（尤其深度學習）演算法的突破，故選(2)。風險合規要求是AI的應用需求之一，不是推動這波熱潮的技術要素。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.825,"w":1,"sw":0.02,"id":"科技力-A0105"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"15-8、12-8","stem":"1980 年代人工智慧的研究將焦點轉移至何者，因而發展出「專家系統(Expert System)」？","opts":["資訊","知識","資料","規則"],"ans":2,"exp":["📝 解析：1980年代AI研究把焦點轉向「知識」：把專家知識轉成規則讓電腦推論，因而發展出專家系統，進入第二次AI熱潮，故選(2)。規則只是表達知識的形式；資訊、資料不是當時研究的核心轉向。"],"pos":0.1333,"w":1,"sw":0.02,"id":"科技力-A0107"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"14-58、10-59","stem":"金融機構在初期運用人工智慧技術時，下列何者是最適當的作法？","opts":["初期應積極引進與導入各種人工智慧技術與大數據系統","初期應將客戶擺在產品規劃的核心，替客戶帶來真正的效益","人工智慧倚賴多個模組演算法的成功，初期應設定較高的績效期望值","應積極利用各種大數據資料，於初期進行大規模且主題多元的應用實驗"],"ans":2,"exp":["📝 解析：初期導入AI應以客戶為產品規劃核心，從能為客戶帶來真正效益的題目做起，故選(2)。(1)一次引進各種技術成本高、難聚焦；(3)應設定合理而非過高的期望值；(4)應從小規模驗證開始，而非大規模多元實驗。"],"pos":0.975,"w":1,"sw":0.02,"id":"科技力-A0115"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"13-13、8-16","stem":"銀行利用臉部辨識來觀察客戶對數位看板互動數位內容的反應，預測客戶的喜好，從而提供更好的行銷廣告服務。這種系統是利用下列何種技術來完成的？","opts":["結合電玩和眼控","結合電玩和聲控","結合大數據及密碼的應用","結合大數據及生物辨識的應用"],"ans":4,"exp":["📝 解析：臉部辨識屬於生物辨識技術，用來擷取客戶看板前的表情、停留時間等反應；再把大量觀察資料以大數據分析找出偏好，才能精準推播行銷內容，所以是「大數據＋生物辨識」。題中沒有電玩、眼控或聲控元素，密碼技術也與預測喜好無關。"],"pos":0.2417,"w":1,"sw":0.02,"id":"科技力-A0122"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"13-5、9-6","stem":"大數據又稱巨量資料或海量資料，下列何者非其四大特徵(4V)之一？","opts":["具多樣性","具不斷傳輸性的速度","具敏感性","真實性"],"ans":3,"exp":["📝 解析：大數據 4V 為 Volume（大量）、Velocity（速度，資料不斷產生傳輸）、Variety（多樣性）、Veracity（真實性）；第五個 V 常加 Value（價值）。「敏感性」不在 4V 之內，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0917,"w":1,"sw":0.02,"id":"科技力-A0128"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"13-57、9-60","stem":"運用人工智慧的技術，結合各種外部資訊，可以進行網路聲量解析、客戶行為趨勢預測，進而可以進行精準行銷，所指的是金融機構利用人工智慧在何種方面之應用？","opts":["法令遵循","風險合規","數據分析","流程精進"],"ans":3,"exp":["📝 解析：網路聲量解析、客戶行為趨勢預測、精準行銷，都是用 AI 整合內外部資料進行分析與預測，屬「數據分析」應用。法令遵循、風險合規偏向法遵監控與異常偵測，流程精進則是 RPA 等自動化改善作業流程。"],"pos":0.975,"w":1,"sw":0.02,"id":"科技力-A0130"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"13-43、11-7","stem":"近期有專家強調大數據特徵的第五個 V，目的在於：","opts":["成就資料科學家","探究歷史脈胳","將數據轉換為價值","發掘核心問題"],"ans":3,"exp":["📝 解析：大數據第五個 V 是 Value（價值），強調蒐集大量資料的最終目的在於把數據轉換為商業價值與決策依據，而不只是儲存資料。其他選項不是 Value 的意涵。"],"pos":0.4167,"w":1,"sw":0.02,"id":"科技力-A0133"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"7-37、1-57","stem":"QCA(定性信用評估)與議事規則(Discussion rules)等方法最主要的目的為下列何者？","opts":["消除偏見","節省時間","大數據分析","應用於區塊鏈"],"ans":1,"exp":["📝 解析：QCA（定性信用評估）以結構化準則評估質化資訊，議事規則（Discussion rules）則規範討論程序，兩者都是讓判斷過程標準化，主要目的在於消除個人主觀偏見（如錨定、從眾）。節省時間不是主要目的，也與大數據分析、區塊鏈無關。"],"pos":0.7833,"w":1,"sw":0.02,"id":"科技力-A0150"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"7-6、4-5","stem":"在數據分析應用架構下，客戶價值模型的建立，不包含下列何項步驟？","opts":["必須重新計算客戶風險評分","導入客戶價值模型定義","建構貢獻度模型","建構潛力模型"],"ans":1,"exp":["📝 解析：建立客戶價值模型的步驟為：導入客戶價值模型定義、建構貢獻度模型（現有貢獻）、建構潛力模型（未來潛在價值），進而區分客戶價值。客戶風險評分屬風險管理或洗錢防制模型，不是建立價值模型時必須重新計算的步驟，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0917,"w":1,"sw":0.02,"id":"科技力-A0157"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"7-5、4-43","stem":"有關數位通路資料的分析，下列敘述何者正確？","opts":["高流量網站才能夠帶來高收入","透過可識別碼，能夠追蹤客戶在網路的行為","數位通路行為分析能夠取代傳統數據或資料倉儲分析","數位通路行為搜集器能有效蒐集使用者情感、語意等資訊"],"ans":2,"exp":["📝 解析：透過 Cookie、裝置 ID、會員帳號等可識別碼，可追蹤客戶在網路上的瀏覽與交易行為，故(2)正確。(1)流量高不等於轉換率高、收入高；(3)數位通路分析是補充而非取代傳統資料倉儲分析；(4)行為蒐集器主要記錄點擊與瀏覽軌跡，難以直接蒐集情感、語意。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.4,"w":1,"sw":0.02,"id":"科技力-A0159"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"7-7、5-7","stem":"金融機構一直希望擁有全通路的客戶360 度視圖的主要關鍵原因中，不包含下列何者？","opts":["獲得新客戶","找尋新的產品","和現有業務來往的客戶保持共同成長的關係","保留高利潤高價值的客戶"],"ans":2,"exp":["📝 解析：全通路客戶 360 度視圖整合各通路資料完整了解客戶，主要目的是：獲取新客戶、與既有客戶共同成長（交叉銷售）、保留高利潤高價值客戶。「找尋新產品」屬產品開發，不是建立客戶視圖的主要原因，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1167,"w":1,"sw":0.02,"id":"科技力-A0161"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":1,"n":2,"refs":"7-11、6-11","stem":"下列哪一個大數據分析的應用層次，係指根據期望的結果、特定場景、資源以及對過去和當前事件的瞭解給出運作建議？","opts":["基礎分析","進階預測","規範分析","樣本分析"],"ans":3,"exp":["📝 解析：大數據分析由淺至深為：描述性（發生什麼）、診斷性（為何發生）、預測性（會發生什麼）、規範性（該怎麼做）。題目所述「依期望結果、場景、資源與對過去及當前事件的瞭解給出運作建議」是規範分析（Prescriptive analytics）。"],"pos":0.1833,"w":1,"sw":0.02,"id":"科技力-A0164"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":2,"n":4,"refs":"18-3、16-4、12-4、9-43","stem":"下列何者並非組織採用雲端運算服務的常見考量原因？","opts":["成本","速度","隱私","效能"],"ans":3,"exp":["📝 解析：組織採用雲端多半是為了降低成本、加快部署速度、取得彈性擴充的效能，這些是「採用的誘因」。隱私則是企業對雲端最大的疑慮（資料放在第三方機房），屬於採用的障礙而非考量原因，故選(3)。"],"pos":0.225,"w":1,"sw":0.3,"id":"科技力-A0003"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":3,"refs":"21-42、20-3、8-42","stem":"下列何者並非雲端運算的特色？","opts":["資源虛擬化與共享","資源容易擴充與隨需應變","可以依需求量提供資源與計費","資源閒置"],"ans":4,"exp":["📝 解析：雲端運算的特色是資源虛擬化與共享、可彈性擴充並隨需應變、依使用量提供資源與計費，目的正是減少閒置；「資源閒置」是傳統自建機房的缺點，故選(4)。第20屆變體選項不同，該屆「高速與正確計算的軟體系統」不是雲端特色（雲端重點在資源共享與服務模式，而非某種計算軟體），故該屆答案為(2)；依各屆選項內容作答即可。","⚠ 第 20 屆問法／選項不同：「下列何者非屬雲端計算的特色？…」答案「高速與正確計算的軟體系統」→ 看清楚題目問什麼"],"pos":0.4833,"w":1,"sw":0.03846,"id":"科技力-A0005"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":3,"refs":"16-3、12-3、10-4","stem":"下列何者並非資訊安全的三要素之一？","opts":["即時性","機密性","完整性","可用性"],"ans":1,"exp":["📝 解析：資訊安全三要素（CIA）為機密性（Confidentiality）、完整性（Integrity）、可用性（Availability）。即時性不在其中，故選(1)。"],"pos":0.0556,"w":1,"sw":0.09375,"id":"科技力-A0025"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":3,"refs":"7-18、3-49、1-18","stem":"雲端運算的隱私安全問題，不包括下列何者？","opts":["在未經授權的情況下，他人以不正當的方式進行資料侵入，獲得使用者資料","使用者擔心雲端資料遺失，自行於本端硬碟作資料備份","政府部門或其他權利機構為達到目的，對雲端運算平台上的資訊進行檢查，取得相應的資料以達到監管和控制的目的","雲端運算提供商為取得商業利益，對使用者資訊進行收集和處理"],"ans":2,"exp":["📝 解析：雲端隱私安全問題指使用者資料被不當取得或利用：(1)他人未經授權入侵取得、(3)政府機關為監管而檢查取得資料、(4)雲端業者為商業利益蒐集處理。(2)使用者自行在本機硬碟備份是降低資料遺失風險的自保措施，不是隱私問題，故選(2)。第3屆變體是把「本機備份」換成「電力中斷導致資料遺失或錯誤」，那屬於可用性（服務中斷）問題而非隱私問題，所以該屆答(4)；兩屆考點相同、只是干擾選項內容不同。","⚠ 第 3 屆問法／選項不同：「雲端運算的隱私安全問題不包括下列何者？…」答案「企業的資訊系統因電力中斷導致資料遺失或錯誤」→ 看清楚題目問什麼","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4722,"w":1,"sw":0.09375,"id":"科技力-A0028"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"21-11、10-14","stem":"在評估生物辨識系統的安全性時，「冒用被接受率(False Acceptance Rate)」若為五萬分之一，則表示下列何者？","opts":["冒用者被拒絕的機率有五萬分之一","冒用者成功的機率有五萬分之一","本人使用被拒絕的機率有五萬分之一","本人使用成功的機率有五萬分之一"],"ans":2,"exp":["📝 解析：冒用被接受率（FAR）＝冒用者被系統誤判為本人而接受的比率，衡量安全性；FAR為五萬分之一，即冒用者成功的機率為1/50,000，故選(2)。本人被拒的比率是錯誤拒絕率（FRR），衡量便利性。第10屆選項排列不同，答案同樣是「冒用者成功」(2)。"],"pos":0.2083,"w":1,"sw":0.03261,"id":"科技力-A0031"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"21-12、15-15","stem":"下列何者非屬生物辨識技術的類別？","opts":["晶片","簽名","指紋","聲音"],"ans":1,"exp":["📝 解析：生物辨識是以人的生理特徵（指紋、掌紋、人臉、虹膜、靜脈）或行為特徵（簽名、聲音、步態）辨識身分。晶片是持有物（如IC卡），屬「持有因素」驗證，不是生物辨識，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.225,"w":1,"sw":0.03261,"id":"科技力-A0034"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"20-28、8-58","stem":"為加強資安犯罪之偵辦工作，減少因證據力不足而導致在法庭上爭議不斷，台灣高檢署自2018 年起在8 個地檢署成立何種機構？","opts":["數位採證中心","加強資安辦公室","打擊駭客中心","資安防護中心"],"ans":1,"exp":["📝 解析：為解決數位證據因採證程序不嚴謹而在法庭上證據力受質疑的問題，臺灣高等檢察署自2018年起在8個地檢署成立「數位採證中心」，以標準化程序蒐集、保全電子證據，故選(1)。其他選項為虛構的機構名稱。"],"pos":0.7167,"w":1,"sw":0.04808,"id":"科技力-A0039"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"20-12、9-14","stem":"下列何者非屬人臉辨識的優點？","opts":["屬於非接觸式辨識，不會有衛生考量","不受攝影角度與光線影響","通常來說，受辨識者無須額外動作配合","辨識過程簡單快速"],"ans":2,"exp":["📝 解析：人臉辨識的優點是非接觸（較衛生）、受辨識者通常不需額外動作配合、辨識過程簡單快速；但其缺點正是容易受拍攝角度、光線、表情、配件影響辨識率，故(2)「不受攝影角度與光線影響」非優點，選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2167,"w":1,"sw":0.04808,"id":"科技力-A0040"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"20-11、17-47","stem":"在評估生物辨識系統的便利性時常用下列何者來衡量？","opts":["冒用者被接受的次數","冒用者嘗試次數","冒用被接受率","本人被誤拒率"],"ans":4,"exp":["📝 解析：生物辨識的便利性以「本人被誤拒率」（FRR）衡量：本人常被拒絕就得反覆驗證，使用不便，故選(4)。安全性則以「冒用被接受率」（FAR）衡量。第17屆變體問「安全性」，所以答案是冒用被接受率(3)；兩題差在問便利性或安全性。","⚠ 第 17 屆問法／選項不同：「在評估某生物辨識系統的安全性時常用下列何者來衡量？…」答案「冒用被接受率」→ 看清楚題目問什麼"],"pos":0.4833,"w":1,"sw":0.04808,"id":"科技力-A0047"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"18-29、13-56","stem":"Gartner 對於資安的願景、目標、原則與體制的看法，下列何者錯誤？","opts":["應強化例行性檢查機制，增加檢查的頻率","不再只專注防火牆，應擴及到保障營運成果","不再只是被動的防禦者，應是組織的推動者","不再嘗試控制資訊的流向，而是了解資訊流向"],"ans":1,"exp":["📝 解析：Gartner主張資安應從「檢查清單式合規」轉為以風險為基礎：不只專注防火牆而要保障營運成果、從被動防禦者變為組織推動者、不再嘗試控制資訊流向而是了解資訊流向。強化例行性檢查、提高頻率正是被取代的舊思維，故(1)錯誤，選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7083,"w":1,"sw":0.02155,"id":"科技力-A0058"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"18-47、14-47","stem":"下列何者非屬靜脈辨識的特性？","opts":["受環境影響較小","穩定性低","具獨特性","藉由掃描手掌靜脈特徵"],"ans":2,"exp":["📝 解析：靜脈辨識是以近紅外線掃描手掌或手指皮下靜脈分布，特徵位於體內不易偽造、具獨特性、受外在環境（皮膚乾濕、髒污）影響小，且終身變化少、「穩定性高」。故(2)穩定性低錯誤，選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7833,"w":1,"sw":0.02155,"id":"科技力-A0061"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"17-46、16-11","stem":"在數位簽章中，如果要讓訊息接收者基於「簽章不可複製」，相信訊息確定為訊息發送者發出，請問訊息的簽署要使用何把金鑰？","opts":["訊息發送者的公鑰","訊息發送者的私鑰","訊息接收者的公鑰","訊息接收者的私鑰"],"ans":2,"exp":["📝 解析：數位簽章由發送者以自己的「私鑰」簽署，接收者以發送者的公鑰驗證。因為私鑰只有發送者持有、他人無法複製簽章，驗證通過即可確認訊息確由發送者發出（不可否認性），故選(2)。若要加密給接收者，才是用接收者的公鑰加密、接收者私鑰解密。"],"pos":0.475,"w":1,"sw":0.02,"id":"科技力-A0078"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"16-42、8-43","stem":"企業在建置應用服務的時候，對比雲端運算的三大服務模式與傳統模式，下列敘述何者正確？","opts":["企業不需要準備任何軟、硬體即可使用該項雲端服務稱為IaaS 服務模式","為符合企業商業邏輯、作業流程需求，該應用軟體由企業自行設計開發，所需硬體與程式執行環境由雲端服務提供商提供，稱之為PaaS 服務模式","企業自購或向雲端廠商租用設備，放至雲端資料中心代管，並提供企業使用，此模式稱之為IaaS 服務模式","傳統的應用服務系統建置模式，具有高度擴充彈性、較低的花費成本，這也是多數企業仍然使用的主要原因"],"ans":2,"exp":["📝 解析：PaaS由雲端業者提供硬體與程式執行環境，企業自行開發符合商業邏輯的應用軟體，(2)正確。(1)不需準備任何軟硬體即可使用的是SaaS；(3)自購設備放到資料中心代管是主機代管（colocation），不是IaaS；(4)傳統自建模式擴充彈性低、成本高，企業續用多因既有投資與資安考量。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.7083,"w":1,"sw":0.02,"id":"科技力-A0082"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"16-2、9-2","stem":"「一種基於網際網路的運算方式，共享的軟硬體資源和資訊可以按需求提供給電腦和其他裝置」，下列何者最符合以上描述？","opts":["大數據","金融科技","雲端運算","區塊鏈"],"ans":3,"exp":["📝 解析：「以網際網路為基礎、共享軟硬體資源與資訊並依需求提供給電腦及其他裝置」正是雲端運算的定義，故選(3)。大數據重在大量資料分析；金融科技是金融與科技結合的總稱；區塊鏈是分散式帳本技術。"],"pos":0.0333,"w":1,"sw":0.02,"id":"科技力-A0084"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"15-3、9-42","stem":"下列何種雲端運算的部署模型是由擁有相近利益、關注相同議題、或是屬於相同產業的企業組織，且多因為有安全性的考量而組成的？","opts":["公有雲","社群雲","私有雲","混合雲"],"ans":2,"exp":["📝 解析：依NIST對雲端部署模型的定義，社群雲是由利益相近、關注相同議題（如安全、法遵要求）或同產業的組織共同使用的雲端，故選(2)。公有雲開放大眾使用；私有雲由單一組織專用；混合雲結合兩種以上部署模型。"],"pos":0.375,"w":1,"sw":0.02,"id":"科技力-A0098"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"15-47、9-49","stem":"近年經由智慧手機進行銀行服務越來越頻繁，大部分是透過下列何種生物辨識技術來確認使用者身分？","opts":["人臉辨識或指紋辨識","密碼辨識或指紋辨識","虹膜辨識或指紋辨識","靜脈辨識或指紋辨識"],"ans":1,"exp":["📝 解析：智慧手機普遍內建前鏡頭與指紋感測器，因此行動銀行多以人臉辨識（如Face ID）或指紋辨識（如Touch ID）確認身分，故選(1)。密碼不屬生物辨識；虹膜與靜脈辨識需特殊感測硬體，手機少見。"],"pos":0.8,"w":1,"sw":0.02,"id":"科技力-A0100"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"15-42、13-2","stem":"將程式、資料及運算移往就近網路節點上運作，以加快資料的處理及傳送速度稱之為何種技術？","opts":["雲端運算","邏輯運算","高速運算","邊緣運算"],"ans":4,"exp":["📝 解析：邊緣運算把程式、資料與運算移到靠近資料來源或使用者的網路節點（邊緣）處理，以減少回傳雲端的延遲、加快資料處理與傳送，故選(4)。雲端運算是集中在遠端資料中心處理，正好相反。"],"pos":0.3667,"w":1,"sw":0.02,"id":"科技力-A0109"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"14-2、8-3","stem":"對於雲端運算服務的安全敘述，下列何者錯誤？","opts":["企業採用雲端PaaS(Platform as a Service)時，應用系統的使用者權限、資料管理、存取稽核都應該由企業自己負責","雲端運算服務的內容繁多，做好雲端上下游供應鏈管理，也是雲端服務供應商安全的控管要項","企業採用雲端IaaS(Infrastructure as a Service)時，其作業系統與網路存取控制安全都應該由雲端服務提供商負責","雲端安全聯盟(CSA)所提出的雲端控管矩陣(CCM)是基於ISO27001 資訊安全管理系統之要求發展而來"],"ans":3,"exp":["📝 解析：依雲端「責任共擔」原則，採用IaaS時業者只負責實體機房、硬體與虛擬化層；作業系統、網路存取控制、應用程式與資料安全都由企業自己負責，故(3)錯誤，選(3)。(1)PaaS的使用者權限、資料管理、存取稽核由企業負責；(2)做好雲端供應鏈管理；(4)CSA的雲端控管矩陣（CCM）參照ISO 27001等標準發展，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0417,"w":1,"sw":0.02,"id":"科技力-A0110"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"14-3、10-2","stem":"公認最早將雲端運算商業化的公司為下列何者？","opts":["IBM","Amazon","Microsoft","Google"],"ans":2,"exp":["📝 解析：Amazon於2006年推出Amazon Web Services（S3儲存、EC2運算），公認是最早將雲端運算商業化的公司，故選(2)。Google、Microsoft（Azure 2010年正式上線）、IBM的雲端服務都較晚。"],"pos":0.0417,"w":1,"sw":0.02,"id":"科技力-A0113"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"14-4、10-42","stem":"下列何種雲端運算的部署模型是由協力廠商雲端服務提供者所擁有及運作，透過網際網路來使用伺服器及儲存體等運算資源？","opts":["公有雲","特有雲","私有雲","混合雲"],"ans":1,"exp":["📝 解析：公有雲由第三方雲端服務供應商擁有並營運，大眾透過網際網路使用其伺服器與儲存資源，如AWS、Azure、GCP，故選(1)。私有雲為單一組織專用；混合雲結合公有與私有雲；「特有雲」不是標準的部署模型。"],"pos":0.3833,"w":1,"sw":0.02,"id":"科技力-A0114"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"14-60、12-40","stem":"請問臺灣網路認證公司最初與下列何者合作，提出Mobile ID 服務，藉以實現更便捷的身分識別服務？","opts":["內政部","國發會","金融服務業","電信營運商"],"ans":4,"exp":["📝 解析：臺灣網路認證公司（TWCA）最初與電信營運商合作推出Mobile ID，以門號申辦時已完成的實名認證資料結合SIM卡，讓用戶在網路上便捷地證明身分，故選(4)。內政部負責自然人憑證、國發會負責數位政策，皆非最初合作對象；金融服務業是Mobile ID的使用端。","⚠ 第 12 屆問法／選項不同：「請問臺灣網路認證公司最初與下列何者合作，提出Mobile ID 服務，藉以實現更…」答案「電信營運商第二部分：第41~60 題(每題2 分)」→ 看清楚題目問什麼"],"pos":0.8333,"w":1,"sw":0.02,"id":"科技力-A0119"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"13-4、8-4","stem":"下列何種雲端運算的部署模型是由單一企業或組織專屬使用的雲端運算資源，可實體位於公司的資料中心？","opts":["公有雲","特有雲","私有雲","混合雲"],"ans":3,"exp":["📝 解析：私有雲是由單一企業或組織專屬使用的雲端資源，可建置在公司自有資料中心或委託第三方代管，安全與控制程度最高，故選(3)。公有雲供大眾共用；混合雲結合公有與私有；「特有雲」不是標準部署模型。"],"pos":0.0667,"w":1,"sw":0.02,"id":"科技力-A0120"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"13-3、9-4","stem":"消費者自己掌控運作的應用程式，由雲端供應商提供應用程式運作時所需的執行環境、作業系統及硬體，是下列何種雲端運算的服務模式？","opts":["基礎架構即服務","平台即服務","軟體即服務","資料即服務"],"ans":2,"exp":["📝 解析：PaaS（平台即服務）：雲端業者提供作業系統、執行環境與硬體，使用者只需部署並掌控自己的應用程式。IaaS 只提供運算、儲存、網路等基礎設施，作業系統要自己管；SaaS 連應用程式都由業者提供；資料即服務（DaaS）不屬 NIST 定義的三大服務模式。"],"pos":0.0583,"w":1,"sw":0.02,"id":"科技力-A0127"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"13-15、9-16","stem":"對「多因子生物辨識平台(multi-factor biometrics platform)」的敘述，下列何者錯誤？","opts":["依不同的運用場域選擇不同辨識技術","依不同安全等級要求選擇不同辨識技術","必須同時完成建置","可搭配客服中心與虛擬網路銀行提供服務"],"ans":3,"exp":["📝 解析：多因子生物辨識平台是把臉、指紋、聲紋、指靜脈等多種辨識整合在同一平台，可依場域（臨櫃、ATM、行動銀行、客服中心）與交易安全等級挑選適合的技術組合。各項辨識技術可依需求分階段導入擴充，不必「同時完成建置」，故(3)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2583,"w":1,"sw":0.02,"id":"科技力-A0129"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"13-35、11-58","stem":"下列何者非資安問題可能造成金融業的衝擊？","opts":["作業延宕","保險費用增加","商譽損失","人才流失"],"ans":4,"exp":["📝 解析：資安事件對金融業的衝擊包括：系統中斷導致作業延宕、理賠增加使資安保險費用上升、客戶信任下滑造成商譽損失，以及罰款與賠償。「人才流失」不是資安事件的直接衝擊，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.775,"w":1,"sw":0.02,"id":"科技力-A0134"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"12-2、1-17","stem":"下列何者並非雲端運算的服務模式？","opts":["基礎架構即服務","平台即服務","軟體即服務","資料即服務"],"ans":4,"exp":["📝 解析：依 NIST 定義，雲端三大服務模式為 IaaS（基礎架構即服務）、PaaS（平台即服務）、SaaS（軟體即服務）。資料即服務（DaaS）屬延伸概念，不在三大服務模式之內，故選(4)。"],"pos":0.1583,"w":1,"sw":0.02,"id":"科技力-A0135"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"12-36、8-37","stem":"2017 年5 月全球一百多個國家陸續遭到「想哭(Wanna Cry)」病毒攻擊，中毒電腦的檔案將被強制封存，這是一種：","opts":["進階持續威脅攻擊(APT)","分散式阻斷服務(DDoS)","勒索病毒軟體(RaaS)","虛擬貨幣洗錢"],"ans":3,"exp":["📝 解析：WannaCry（想哭）會加密受害電腦檔案並要求以比特幣支付贖金才解鎖，屬勒索病毒（題目以 RaaS 稱之）。APT 是針對特定目標長期潛伏入侵；DDoS 是以大量流量癱瘓服務；虛擬貨幣洗錢則非病毒攻擊類型。"],"pos":0.6083,"w":1,"sw":0.02,"id":"科技力-A0140"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"12-47、10-16","stem":"銀行客戶臨櫃現金取款，若未帶原留印鑑，即便出示身分證證明本人仍無法取款。為了解決未帶原留印鑑的困擾，銀行乃用客戶的生物特徵來進行身分認證。下列何種生物特徵的特性是銀行用來做身分認證掌握交易風險？","opts":["多元性","泛化性","獨特性","隱匿性"],"ans":3,"exp":["📝 解析：生物特徵可作身分認證，是因其「獨特性」（每個人的指紋、臉部、靜脈特徵不同）與穩定性，能確認是本人，從而控制冒領風險。多元性、泛化性、隱匿性都不是用來確認本人身分的關鍵特性。"],"pos":0.525,"w":1,"sw":0.02,"id":"科技力-A0143"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"11-42、8-2","stem":"下列何種技術可以將所有運算資源(如：儲存空間、記憶體、CPU 等)匯整起來，並依據使用者的的需求，彈性動態分配提供給使用者？","opts":["格式化技術","虛擬化技術","動態分割與分配技術","平行運算技術"],"ans":2,"exp":["📝 解析：虛擬化技術把實體的 CPU、記憶體、儲存空間等資源抽象化集中成資源池，再依使用者需求彈性、動態分配，是雲端運算的核心技術。格式化只是磁碟初始化；平行運算是多處理器同時運算，不負責資源匯整與分配。"],"pos":0.3667,"w":1,"sw":0.02,"id":"科技力-A0144"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"10-49、6-29","stem":"因應交易等級的差異而導入多因子生物辨識是金融機構同時提供一種以上的生物辨識給使用者，下列何種是屬於非接觸式多因子生物辨識？","opts":["臉型辨識結合指紋辨識","指紋辨識結合指靜脈辨識","臉型辨識結合聲音辨識","指紋辨識結合虹膜辨識"],"ans":3,"exp":["📝 解析：非接觸式生物辨識不需碰觸感應器，如臉型、聲音、虹膜；指紋、指靜脈則需接觸。第10屆選項中只有「臉型＋聲音」兩者都非接觸，故選(3)。第6屆版本答案為(4)，內容同樣是臉型結合聲音辨識，只是選項順序不同；該版(1)臉型結合密碼，密碼不是生物特徵。"],"pos":0.65,"w":1,"sw":0.02,"id":"科技力-A0147"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":1,"n":2,"refs":"7-48、2-48","stem":"大部分的套裝應用(如存貨管理系統，客戶關係管理系統)移植到雲端後，會以下列哪種雲端服務方式提供？","opts":["IaaS (Infrastructure-as-a-Service)","PaaS (Platform-as-a-Service)","SaaS (Software-as-a-Service)","DaaS (Data-as-a-Service)"],"ans":3,"exp":["📝 解析：存貨管理、客戶關係管理等套裝應用程式移植到雲端後，使用者透過瀏覽器直接使用軟體、按訂閱付費，是 SaaS（軟體即服務），例如 Salesforce CRM。IaaS 提供基礎設施、PaaS 提供開發執行平台，DaaS 則是提供資料。"],"pos":0.8,"w":1,"sw":0.02,"id":"科技力-A0153"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":3,"refs":"18-30、12-38、8-60","stem":"英國「競爭及市場管理局(CMA)」設立下列何種業務，藉此促進英國前九大銀行發展出更好的金融服務給客戶？","opts":["統一的純網銀介接標準格式","統一的開放銀行介接標準格式","統一的物聯網銀行介接標準格式","統一的PSD2 銀行介接標準格式"],"ans":2,"exp":["📝 解析：英國競爭及市場管理局（CMA）2016年設立開放銀行實施組織（OBIE），要求前九大銀行（CMA9）採用統一的開放銀行API標準格式，在客戶同意下把資料提供給第三方業者，故選(2)。純網銀、物聯網銀行都不是CMA設立的標準；PSD2是歐盟支付指令，並非CMA訂的介接格式。"],"pos":0.7111,"w":1,"sw":0.01429,"id":"科技力-A0009"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":3,"refs":"18-25、11-31、10-32","stem":"依據法國零售銀行協會(2017)調查，純網銀等金融科技業對銀行業影響最大的業務為下列何者？","opts":["理財業務","支付、借貸業務","保險業務","企金業務"],"ans":2,"exp":["📝 解析：依法國零售銀行協會2017年調查，純網銀等金融科技業者對銀行衝擊最大的是支付與借貸業務，因為這兩類業務標準化程度高、最容易被線上服務取代，故選(2)。理財、保險、企金業務的衝擊相對較小。"],"pos":0.4889,"w":1,"sw":0.01429,"id":"科技力-A0011"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":3,"refs":"17-53、14-32、12-54","stem":"開放銀行牽涉到金融數據資料的共享，而開放銀行所涉及之資料中，最主要的是哪兩類金融數據？ A.客戶增值數據 B.公開數據 C.聚合數據 D.帳戶及交易數據","opts":["僅AB","僅BC","僅BD","僅CD"],"ans":3,"exp":["📝 解析：開放銀行共享的金融數據主要有兩類：公開數據（如產品資訊、牌告利率、ATM位置）與帳戶及交易數據（客戶授權後的存款、交易紀錄），即B與D，故選(3)。客戶增值數據（銀行加工分析的衍生資料）與聚合數據多屬銀行商業敏感資產，通常不在強制開放之列。"],"pos":0.7722,"w":1,"sw":0.09375,"id":"科技力-A0019"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":3,"refs":"16-35、13-36、9-58","stem":"有關Open API 的相關敘述，下列何者錯誤？","opts":["係指一個可公開取得的應用程式介面","提供開發人員透過程式化存取一個專有的軟體應用程式","Open API 為人與程式提供了便利且快速的溝通界面","如涉及個人資料的傳輸仍應取得個資當事人的同意"],"ans":3,"exp":["📝 解析：Open API是公開的應用程式介面，讓開發人員以程式化方式存取軟體或服務，本質是「程式與程式之間」的溝通介面，不是人與程式的介面，故(3)錯誤，選(3)。(1)(2)為定義；(4)涉及個資傳輸時仍須取得當事人同意（個資法），正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7167,"w":1,"sw":0.09375,"id":"科技力-A0024"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"20-32、11-39","stem":"有關開放銀行，最具代表性的是由何國家的競爭及市場管理局(CMA)所設立的開放銀行實施組織，要求該國前九大銀行用統一的Open Banking API，並強制銀行在客戶同意的情況之下將顧客資料依據此標準格式，提供給參與此計畫的第三方業者使用？","opts":["英國","新加坡","澳洲","日本"],"ans":1,"exp":["📝 解析：英國競爭及市場管理局（CMA）設立開放銀行實施組織（OBIE），要求前九大銀行（CMA9）採用統一的Open Banking API，並在客戶同意下把資料提供給第三方業者，是開放銀行最具代表性的案例，故選(1)。新加坡、澳洲、日本也推動開放銀行，但不是由CMA主導。"],"pos":0.5917,"w":1,"sw":0.04808,"id":"科技力-A0044"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"19-24、9-31","stem":"依據中央銀行定義，下列對純網銀敘述何者錯誤？","opts":["無實體分行","無實體客服中心","所有金融服務均透過網路進行","服務手續費較低"],"ans":2,"exp":["📝 解析：依中央銀行對純網銀的說明，純網銀無實體分行、所有金融服務透過網路進行、因營運成本低而手續費較低；但仍可設立實體客服中心（金管會純網銀審查原則亦允許除總行及客服中心外不設分行），故(2)「無實體客服中心」錯誤，選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4583,"w":1,"sw":0.02155,"id":"科技力-A0049"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"17-25、13-54","stem":"開放銀行的好處不包括下列何者？","opts":["客戶可無縫切換更多金融服務","客戶可整合各項金融財務資訊","銀行可降低資安成本","銀行可培育創新生態圈"],"ans":3,"exp":["📝 解析：開放銀行讓客戶可無縫切換、整合各項金融資訊，銀行可串接第三方培育創新生態圈。但開放API會增加外部連線與資料傳輸點，銀行必須投入更多資安防護與驗證，資安成本是「增加」而非降低，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6583,"w":1,"sw":0.02,"id":"科技力-A0073"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"17-24、16-30","stem":"下列何者屬於開放銀行開放的「客戶資訊」？ A.貸款餘額 B.支付 C.ATM 位置 D.牌告利率 E.存款餘額 F.帳戶扣款","opts":["僅AB","僅AE","僅BF","僅CD"],"ans":2,"exp":["📝 解析：我國開放銀行分三階段：第一階段「公開資料查詢」（ATM位置、牌告利率等），第二階段「消費者資訊查詢」（客戶授權後的存款餘額、貸款餘額等），第三階段「交易面資訊」（支付、帳戶扣款等）。本題問客戶資訊，選A貸款餘額、E存款餘額，即(2)。第16屆變體問第一階段「商品公開資料」，答案是C ATM位置、D牌告利率(4)。","⚠ 第 16 屆問法／選項不同：「下列何者屬於開放銀行在第一階段開放的「商品公開資料」？ A.貸款餘額 B.支付 …」答案「僅CD」→ 看清楚題目問什麼"],"pos":0.45,"w":1,"sw":0.02,"id":"科技力-A0079"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"16-54、12-32","stem":"開放銀行對傳統銀行帶來的機會中，開放銀行是提供一個下列何種模式，傳統銀行可以與其他參與者，透過平台串聯，強化其優勢的產品曝光，提升其競爭力？","opts":["跨業結盟","資料獨立","創新服務","標準化共享服務"],"ans":4,"exp":["📝 解析：開放銀行提供「標準化共享服務」模式：透過統一的API規格，傳統銀行可與第三方業者在平台上串聯，把自身優勢產品曝光到更多通路以提升競爭力，故選(4)。跨業結盟、創新服務是結果；資料獨立則與開放銀行精神相反。"],"pos":0.7167,"w":1,"sw":0.02,"id":"科技力-A0089"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"16-32、13-32","stem":"各國發展開放銀行多採用階段性的開放，但新加坡沒有設定開放階段進程，而是將API 功能分為六大類，不包括下列哪兩類？","opts":["產品、行銷","銷售、服務","支付、監理","法遵、委外"],"ans":4,"exp":["📝 解析：新加坡銀行公會（ABS）與金融管理局（MAS）2016年API Playbook未設開放階段，而將API分為產品、行銷、銷售、服務、支付（交易）、監理六大類。法遵與委外不在六大類中，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5333,"w":1,"sw":0.02,"id":"科技力-A0092"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"15-54、10-33","stem":"開放銀行主要牽涉到下列哪兩類的金融數據資訊共享？","opts":["公開數據、聚合數據","帳戶及交易數據、商業敏感數據","客戶增值數據、聚合數據","公開數據、帳戶及交易數據"],"ans":4,"exp":["📝 解析：開放銀行主要共享兩類金融數據：公開數據（產品資訊、利率、ATM位置）與客戶授權的帳戶及交易數據，故選(4)。商業敏感數據、客戶增值數據、聚合數據多屬銀行的專有加值資產，一般不在開放範圍。"],"pos":0.725,"w":1,"sw":0.02,"id":"科技力-A0101"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"15-56、11-37","stem":"下列何者非政府提供Open API 可獲得的好處？","opts":["增加服務的可及性","節省成本","增加安全性","節省時間"],"ans":3,"exp":["📝 解析：政府開放Open API可增加服務可及性、節省人工處理成本、節省民眾與企業的時間。開放介面會增加外部存取點，資安風險與防護需求反而提高，「增加安全性」不是其好處，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.775,"w":1,"sw":0.02,"id":"科技力-A0104"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"12-30、8-32","stem":"下列何者非Open API 對金融業者帶來的好處？","opts":["加速產品開發","節省成本","降低法遵風險","節省時間"],"ans":3,"exp":["📝 解析：Open API 讓第三方以標準化介面串接金融服務，可加速產品開發、節省開發成本與時間。但對外開放資料介面會增加個資保護、資安與第三方管理等法遵責任，不會「降低法遵風險」，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5167,"w":1,"sw":0.02,"id":"科技力-A0138"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"12-39、8-59","stem":"建置「數位分行」需要事先考慮許多要素，下列何者非必要之要素？","opts":["掌握所在地理位置之客戶群體的特性","了解當地客戶使用數位科技的意願及熟悉度","分析數位分行功能與其他數位通路功能的互補性","持續複製與移植具各國特色之先進數位分行進行展示"],"ans":4,"exp":["📝 解析：數位分行要因地制宜：先掌握所在地客群特性、了解當地客戶使用數位科技的意願與熟悉度，並分析與網銀、行動銀行等其他通路的互補性。一味複製各國先進數位分行做展示，未必符合在地客戶需求，非必要要素，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8167,"w":1,"sw":0.02,"id":"科技力-A0142"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"7-50、2-25","stem":"下列哪一種實體分行型態是為特定的客戶族群或特定的區域提供完整的金融服務？","opts":["旗艦分行","衛星分行","自助化服務中心","僅有傳統提款機的無人分行"],"ans":2,"exp":["📝 解析：依教材的分行型態分類：衛星分行是針對特定客群或特定區域提供完整金融服務的據點，與主力分行分工；旗艦分行強調品牌形象與全功能展示；自助化服務中心與只有提款機的無人分行只提供自助交易，無法提供完整服務。"],"pos":0.625,"w":1,"sw":0.02,"id":"科技力-A0151"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":1,"n":2,"refs":"7-22、6-22","stem":"下列何者不應該是推動分行轉型的驅動力？","opts":["銀行內部的成本壓力","為技術而導入技術","科技對生產力的提升","客戶臨櫃交易需求的降低"],"ans":2,"exp":["📝 解析：分行轉型的驅動力應來自實際需求：銀行內部成本壓力、科技提升生產力、客戶臨櫃交易需求降低。「為技術而導入技術」脫離客戶與經營需求，是轉型應避免的錯誤心態，故選(2)。"],"pos":0.3667,"w":1,"sw":0.02,"id":"科技力-A0165"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":2,"n":5,"refs":"21-19、17-18、15-51、13-24、9-25、9-53","stem":"有關P2P 借貸保證收益模式之敘述，下列何者正確？","opts":["僅協助資訊中介","銀行參與合作撥貸","向出借人承諾一定收益","以自有資金撥貸"],"ans":3,"exp":["📝 解析：依中央銀行2019年對P2P借貸的分類，「保證收益模式」是平台向出借人承諾一定收益（如陸金服），故選(3)。其餘對應：(1)僅協助資訊中介＝傳統模式（如Zopa）；(2)銀行參與合作撥貸＝公證模式（如Lending Club與WebBank合作）；(4)以自有資金撥貸＝資產負債表模式（如SoFi）。各屆變體只是換問不同模式，答案依上述對應即可：問傳統選(1)、公證選(2)、資產負債表選(4)。","⚠ 第 17 屆問法／選項不同：「有關P2P 借貸傳統模式之敘述，下列何者正確？…」答案「僅協助資訊中介」→ 看清楚題目問什麼","🔄 同題型換數字：第 13 屆「依據中央銀行2019 年之分類，P2P 借貸公證模式之敘述，下列何者正確？…」答案「銀行參與合作撥貸」→ 練算法，別背答案","⚠ 第 9 屆問法／選項不同：「P2P 借貸資產負債表模式之敘述，下列何者正確？…」答案「以自有資金撥貸」→ 看清楚題目問什麼","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.5278,"w":1,"sw":0.125,"id":"科技力-A0001"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":2,"n":4,"refs":"21-18、14-24、12-23、12-51、8-24","stem":"P2P 借貸分類模式中，下列平台何者屬於資產負債表模式？","opts":["Zopa","Lending Club","陸金服","SoFi"],"ans":4,"exp":["📝 解析：SoFi以自有資金放款並承擔信用風險，屬資產負債表模式，故選(4)。其他平台：Zopa屬傳統模式（純資訊中介），Lending Club屬公證模式（由合作銀行WebBank撥貸後再轉售債權），陸金服屬保證收益模式（向出借人承諾收益）。變體依問法換答案：保證收益選陸金服(3)、傳統選Zopa(1)、公證選Lending Club(2)。","⚠ 第 14 屆問法／選項不同：「P2P 借貸分類模式中，下列平台何者屬於保證收益模式？…」答案「陸金服」→ 看清楚題目問什麼","🔄 同題型換數字：第 12 屆「依據中央銀行2019 年P2P 借貸分類模式中，下列平台何者屬於傳統模式？…」答案「Zopa」→ 練算法，別背答案","⚠ 第 8 屆問法／選項不同：「P2P 借貸分類模式中，下列平台哪一個屬於公證模式？…」答案「Lending Club」→ 看清楚題目問什麼"],"pos":0.4667,"w":1,"sw":0.125,"id":"科技力-A0002"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":3,"refs":"18-20、16-25、14-25","stem":"下列何者非屬世界經濟論壇(WEF)所歸納的群眾募資之特色項目？","opts":["群體基礎－管道增加且準確度提升","客製化－多樣化及參與感","顧客權益增加－成本降低","創新創意－符合時代潮流"],"ans":4,"exp":["📝 解析：WEF歸納群眾募資的特色為：群體基礎（管道增加且準確度提升）、客製化（多樣化及參與感）、顧客權益增加（成本降低）。「創新創意－符合時代潮流」不是WEF列出的項目，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3889,"w":1,"sw":0.01429,"id":"科技力-A0014"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":3,"refs":"17-23、12-29、8-30","stem":"有關演算法交易、程式交易、高頻交易之區別，下列敘述何者錯誤？","opts":["演算法交易屬於程式交易的一種，高頻交易被視為演算法交易的一種","相較於程式交易而言，演算法交易強調下單這指令本身的形成","高頻交易與其他兩者的最大不同，在於利用高速電腦運算獲取稍縱即逝的套利機會","高頻交易者傾向將伺服器設於交易所的伺服器附近"],"ans":2,"exp":["📝 解析：三者關係是：演算法交易屬於程式交易的一種，高頻交易又是演算法交易的一種。程式交易著重「下單指令本身的形成」（何時買賣），演算法交易則著重下單之後「如何執行」（拆單、時機、價格以降低衝擊成本），(2)把兩者講反，故選(2)。(3)高頻交易靠高速運算捕捉瞬間套利、(4)把伺服器設在交易所附近（co-location）縮短延遲，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4556,"w":1,"sw":0.09375,"id":"科技力-A0015"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"21-51、9-27","stem":"群募貝果與嘖嘖是屬於下列何種群募平台？","opts":["捐贈型","回饋型","股權型","債權型"],"ans":2,"exp":["📝 解析：嘖嘖（zeczec）與群募貝果都是「回饋型」群募平台：支持者出資後取得產品或服務作為回報，不取得股權或債權，故選(2)。捐贈型無回報、股權型取得股份、債權型取得本息。"],"pos":0.65,"w":1,"sw":0.03261,"id":"科技力-A0029"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"21-52、15-28","stem":"有關高頻交易(High Frequency Trading, HFT)的敘述，下列何者錯誤？","opts":["被視為演算法交易(Algorithmic Trading)的一種","透過高速電腦運算，以微秒(百萬分之一秒)為單位尋找可能的套利機會","由於技術與門檻不高，一般投資人皆有能力執行","有些交易者會將下單伺服器設置在離交易所伺服器比較近的地方，以縮短交易指令時間"],"ans":3,"exp":["📝 解析：高頻交易需高速電腦、低延遲網路、交易所主機共置（co-location）等昂貴設備與專業技術，門檻很高，多為機構投資人使用，一般投資人難以執行，故(3)錯誤，選(3)。(1)屬演算法交易的一種、(2)以微秒為單位搜尋套利、(4)伺服器設在交易所附近，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6667,"w":1,"sw":0.03261,"id":"科技力-A0035"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"20-20、9-26","stem":"下列何種募資方式，主要是運用於公益事業上？","opts":["股權","回饋","捐贈","債權"],"ans":3,"exp":["📝 解析：捐贈型群眾募資的出資者不求任何回報，主要用於公益、慈善、社會關懷專案，故選(3)。股權型取得股份、債權型取得本息、回饋型取得產品或服務，多用於商業或創意專案。"],"pos":0.3833,"w":1,"sw":0.04808,"id":"科技力-A0041"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"19-23、9-30","stem":"有關金融科技應用於投資之「投資者賦權」敘述，下列何者錯誤？","opts":["個人藉由學習參與、合作等過程，使獲得「掌握自己本身相關事務的力量」","使小資投資者有更好能力做決策","投資者需學習專業投資策略，增加財務管理門檻","促使傳統理財專員需進化以為因應"],"ans":3,"exp":["📝 解析：「投資者賦權」是指金融科技讓個人透過學習、參與、合作掌握自身理財事務，小資投資者也能做出更好的決策，並迫使傳統理專進化。其重點是「降低」財務管理門檻（機器人理財、資訊透明），而非要求投資者學專業策略、提高門檻，故(3)錯誤，選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4417,"w":1,"sw":0.02155,"id":"科技力-A0048"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"18-52、15-27","stem":"有關「演算法交易」之敘述，下列何者錯誤？","opts":["可進行自動交易","是程式交易的一種","事先設計交易策略","投資人不易測試及執行交易演算"],"ans":4,"exp":["📝 解析：演算法交易事先設計交易策略並寫成程式自動下單（又稱自動交易），屬程式交易的一種。現今投資人可利用交易平台與歷史資料回測，容易測試並執行演算法，故(4)「不易測試及執行」錯誤，選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6583,"w":1,"sw":0.02155,"id":"科技力-A0063"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"17-52、12-28","stem":"有關我國自動化投資顧問相關作業要點，下列敘述何者錯誤？","opts":["完全經由網路互動","全無或極少人工服務","可由人工協助客戶完成系統「瞭解客戶」","人工服務會主動輔導客戶投資"],"ans":4,"exp":["📝 解析：依投信投顧公會「證券投資顧問事業以自動化工具提供證券投資顧問服務（Robo-Advisor）作業要點」（2017年6月訂定），自動化投資顧問服務是指完全經由網路互動、全無或極少人工服務而提供投資組合建議，(1)(2)正確。人工服務僅屬輔助，限於協助客戶完成系統「瞭解客戶」作業，或解釋系統產生的投資組合建議，(3)正確；人工不得調整或擴張系統建議，也不得提供非系統自動產生的其他建議，更不會主動輔導客戶投資，故(4)錯誤，選(4)。","🏷 名稱更新：投信投顧公會原作業要點已於113.11.21廢止，改訂「自動化投資顧問服務作業規範」；人工僅得輔助KYC／解釋建議、不得主動輔導投資，答案仍為(4)","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6667,"w":1,"sw":0.02,"id":"科技力-A0069"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"17-51、15-25","stem":"根據台灣「證券商經營股權性質群眾募資管理辦法」符合一定資格條件之證券經紀商得與下列哪家機構簽約後才可以經營？","opts":["證券交易所","財團法人櫃檯買賣中心","券商公會","金管會"],"ans":2,"exp":["📝 解析：我國2015年開放股權性質群眾募資，依櫃買中心訂定的「證券商經營股權性質群眾募資管理辦法」，符合資格的證券經紀商須與財團法人中華民國證券櫃檯買賣中心簽約後才能經營，故選(2)。證交所、券商公會不是簽約對象；金管會是主管機關，負責核准而非簽約。"],"pos":0.6333,"w":1,"sw":0.02,"id":"科技力-A0076"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"16-26、14-26","stem":"台灣的群眾募資，集中於下列何者？","opts":["捐贈型與回饋型","回饋型與股權型","捐贈型與股權型","股權型與債權型"],"ans":1,"exp":["📝 解析：台灣群眾募資以捐贈型與回饋型為主（如嘖嘖、flyingV等平台的專案），股權型（櫃買中心創櫃板與券商股權募資）及債權型（P2P借貸）規模相對很小，故選(1)。"],"pos":0.4333,"w":1,"sw":0.02,"id":"科技力-A0094"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"14-23、11-24","stem":"由存款中介機構承擔風險，並利用其規模與槓桿操作，將存戶存款貸放給借款人，並獲得利差作為利潤，這是何種機構的營運模式？","opts":["傳統存貸中介機構(例如：商業銀行)","傳統錢莊","P2P 貸款平台","人壽保險公司"],"ans":1,"exp":["📝 解析：吸收存款、由中介機構自行承擔信用風險、運用規模與槓桿將存款貸給借款人並賺取利差，是商業銀行等傳統存貸中介機構的營運模式，故選(1)。P2P平台（傳統模式）只撮合、不承擔風險、收手續費；人壽保險公司以保費為資金來源；傳統錢莊非正規金融。"],"pos":0.3917,"w":1,"sw":0.02,"id":"科技力-A0116"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"14-52、12-26","stem":"金管會於2015 年4 月30 日開放民間業者經營股權性質群眾募資，因為股權群眾募資屬證券業務，依法開放符合一定資格條件之下列何者得與財團法人中華民國證券櫃檯買賣中心簽約後經營？","opts":["證券承銷商","證券經紀商","證券自營商","批發商"],"ans":2,"exp":["📝 解析：金管會於2015年4月30日開放民間業者經營股權性質群眾募資；因屬證券業務，由符合一定資格條件的「證券經紀商」與櫃買中心簽約後經營，故選(2)。承銷商負責證券承銷、自營商以自有資金買賣證券，都不是本業務的主體；批發商與證券業無關。"],"pos":0.65,"w":1,"sw":0.02,"id":"科技力-A0118"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"13-26、8-27","stem":"群眾募資具有協助新創業者募資之功能，但亦存在許多風險。下列何者非為群眾募資之可能風險？","opts":["較少的法律保障","較低的投資損失","稀釋風險","資訊不對稱"],"ans":2,"exp":["📝 解析：群眾募資的典型風險包括：法律保障較少（平台與發行人監理較寬鬆）、後續增資造成股權稀釋、新創資訊揭露不足的資訊不對稱，以及股份流通性差。新創失敗率高，投資損失反而可能「較高」，所以「較低的投資損失」不是風險，是錯誤敘述。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4417,"w":1,"sw":0.02,"id":"科技力-A0123"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"13-53、8-29","stem":"下列何者非演算法交易相較傳統交易模式的特點？","opts":["不易追漲追跌，平衡市場波動","避免人為情緒與延遲","不會漏失演算法所定義的交易機會","避免交易目的被提早探知"],"ans":1,"exp":["📝 解析：演算法交易由程式依預設規則下單，優點是避免人為情緒與延遲、不漏失規則定義的機會，且可拆單隱藏交易意圖（避免被提早探知）。但演算法會依訊號同向大量進出，反而可能放大追漲殺跌（如2010年美股閃崩），不能說能「平衡市場波動」，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6833,"w":1,"sw":0.02,"id":"科技力-A0124"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"13-51、8-53","stem":"P2P 借貸為何會有流動性風險？","opts":["資金規模小","債權憑證多缺乏次級市場，不易轉售換取現金","無投資人保護機制","有網路攻擊風險"],"ans":2,"exp":["📝 解析：流動性風險指資產無法及時以合理價格變現。P2P 借貸的債權憑證大多沒有次級市場，投資人想提前收回資金時很難轉讓，只能等借款人按期還款，所以有流動性風險。資金規模小、缺乏投資人保護屬平台／信用面問題，網路攻擊屬作業（資安）風險。"],"pos":0.8667,"w":1,"sw":0.02,"id":"科技力-A0126"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"13-25、10-26","stem":"群眾募資最早起源於下列哪一個國家？","opts":["瑞典","英國","新加坡","美國"],"ans":4,"exp":["📝 解析：依教材，群眾募資的現代模式起源於美國：2001年 ArtistShare 讓樂迷預購資助音樂創作，之後 Indiegogo（2008）、Kickstarter（2009）等平台在美國興起並擴散全球，故官方答案為美國。英國雖有早期粉絲集資的案例，但考試以美國為準。"],"pos":0.425,"w":1,"sw":0.02,"id":"科技力-A0131"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"12-24、8-23","stem":"有關P2P 借貸平台之敘述，下列何者錯誤？","opts":["提供借方信用評等分數，協助核貸與後續程序","資金供給者可以自行挑選符合其風險偏好的放貸對象","投資人無法獲得更高利率的報酬","借款人較易取得貸款"],"ans":3,"exp":["📝 解析：P2P 借貸平台省去銀行中介成本，投資人（資金供給者）通常可獲得比存款更高的利率，借款人也較容易借到錢；平台會提供借款人信用評等協助核貸，投資人也可自選符合風險偏好的對象。故「投資人無法獲得更高利率的報酬」錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3917,"w":1,"sw":0.02,"id":"科技力-A0137"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"11-55、10-29","stem":"有關「演算法」交易的特性，下列敘述何者正確？","opts":["不易追漲追跌，可降低系統風險","經由電腦程式，可避免人為延遲及心理影響","追蹤單一市場","僅追蹤過去證券價格成交狀況進行演算"],"ans":2,"exp":["📝 解析：演算法交易由電腦程式依規則自動下單，可避免人為延遲與心理（情緒）影響，故(2)正確。(1)演算法同向操作可能放大波動、增加系統風險；(3)可同時追蹤多個市場；(4)除歷史成交價外也會納入即時報價、量能、新聞等多種資料。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.7,"w":1,"sw":0.02,"id":"科技力-A0145"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":1,"n":2,"refs":"7-36、5-36","stem":"一般而言，P2P 借貸平台的本質是下列何者？","opts":["信息中介而非信用中介","信息與信用中介","信用中介而非信息中介","非信息與非信用中介"],"ans":1,"exp":["📝 解析：P2P 借貸平台本質上是「資訊中介」：撮合借貸雙方並提供資訊與信評，信用風險由出借人自行承擔，平台不像銀行以自身資產負債表承擔風險（信用中介）。若平台提供保證或自有資金放款，就偏離純資訊中介，監理風險也提高。"],"pos":0.6,"w":1,"sw":0.02,"id":"科技力-A0163"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":3,"refs":"18-54、13-34、9-34","stem":"根據德勤(RegTech is the new FinTech)的報告，能夠快速配置及產出報告，是監理科技的何種特性？","opts":["速度","整合","敏捷性","分析"],"ans":1,"exp":["📝 解析：Deloitte〈RegTech is the new FinTech〉提出監理科技四特性：敏捷性（快速解析與組合錯綜複雜的數據）、速度（快速配置及產出報告）、整合（短時間內共享多項法規所需數據）、分析（運用分析工具挖掘既有數據）。本題「快速配置及產出報告」＝速度，故選(1)。第9屆變體問「錯綜複雜數據快速解析與組合」＝敏捷性，答案(3)，兩題問的特性不同。","⚠ 第 9 屆問法／選項不同：「根據德勤(RegTech is the new FinTech)的報告，對於錯綜…」答案「敏捷性」→ 看清楚題目問什麼"],"pos":0.6778,"w":1,"sw":0.01429,"id":"科技力-A0010"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":3,"refs":"17-7、15-44、9-45","stem":"人工智慧對RegTech 主要應用在金融業中後台業務，重點在於透過機械學習辨識眾多非既定格式情境並及時調整預測及決策展出，有三大應用主軸，包括辨識、報告以及下列何者？","opts":["統計","分析","法遵","分類"],"ans":3,"exp":["📝 解析：人工智慧在RegTech的應用集中於金融業中後台，透過機器學習辨識非既定格式的情境並即時調整，三大應用主軸為辨識、報告與法遵，故選(3)。統計、分析、分類只是技術手段，不是教材列出的應用主軸。"],"pos":0.5333,"w":1,"sw":0.09375,"id":"科技力-A0016"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":3,"refs":"16-44、12-44、10-45","stem":"跨境聯合監管機制及交易完整性驗證、反詐欺識別、交易安全監控預警、高風險異常交易監控及即時處理機制、交易後結算後台流程自動化風險辨識，主要屬於下列何種 RegTech 的可能應用？","opts":["風險管理","資訊安全","異常行為預測辨識","交易追蹤"],"ans":4,"exp":["📝 解析：教材將跨境聯合監管與交易完整性驗證、反詐欺識別、交易安全監控預警、高風險異常交易即時處理、交易後結算自動化風險辨識，歸為RegTech的「交易追蹤」應用，重點是對交易全流程監控，故選(4)。風險管理、資訊安全、異常行為預測辨識是另外分列的應用類別。"],"pos":0.7389,"w":1,"sw":0.09375,"id":"科技力-A0027"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"20-7、8-45","stem":"有關人工智慧在保險業方面的可能應用，下列何者錯誤？","opts":["利用機器學習增加交叉銷售與追加銷售成功率","利用地理圖像資料，主要應用在幫投資型保險客戶做差別定價","利用掃描與文檔分析，加速核保及理賠流程","自然語言技術，可減少保險客服中心人力負荷"],"ans":2,"exp":["📝 解析：地理圖像資料（衛星、空拍、地圖）主要用於產物保險，例如評估建物所在地的淹水、地震等風險以差別定價或加速災損理賠，不是用於投資型保險定價，故(2)錯誤，選(2)。(1)機器學習提升交叉銷售／追加銷售、(3)掃描與文檔分析加速核保理賠、(4)自然語言技術減輕客服人力，皆為正確應用。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4333,"w":1,"sw":0.04808,"id":"科技力-A0038"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"18-56、8-38","stem":"隨著下列何項金融科技的發展，人工智慧預期將會讓監理機關以及受監理機構節省大量合規成本？","opts":["RegTech","InsurTech","Blockchain","Cloud Computing"],"ans":1,"exp":["📝 解析：RegTech（監理科技／法遵科技）運用AI、大數據等技術自動化法規遵循、監控與申報，可大幅節省監理機關與受監理機構的合規成本，故選(1)。InsurTech是保險科技；區塊鏈與雲端運算是底層技術，不是以合規為目的的領域。"],"pos":0.7833,"w":1,"sw":0.02155,"id":"科技力-A0052"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"18-44、13-8","stem":"近年來探討科技如何輔助金融創新監理是一個熱門的議題，包括RegTech(法遵科技)、SupTech(監理科技) 或LegalTech(法律科技)的解決方案，其中三大關鍵是演算法、判讀以及下列何者？","opts":["資料","深度學習","分群","決策樹"],"ans":1,"exp":["📝 解析：RegTech、SupTech、LegalTech解決方案的三大關鍵是資料、演算法與判讀：先有充分且高品質的資料，再以演算法分析，最後由人或系統判讀結果做決策，故選(1)。深度學習、分群、決策樹都只是演算法的一種。"],"pos":0.4333,"w":1,"sw":0.02155,"id":"科技力-A0054"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"18-38、13-40","stem":"下列何者非屬目前監理科技的應用範圍？","opts":["法規要求的合規分析","身分辨識的管理與控制","風險控制","廣告效益分析"],"ans":4,"exp":["📝 解析：監理科技應用範圍包括法規合規分析、身分辨識管理與控制（KYC）、風險控制、交易監控與申報等。廣告效益分析屬行銷領域，與監理合規無關，故選(4)。","⚠ 第 13 屆問法／選項不同：「下列何者非屬目前監理科技的應用範圍？…」答案「廣告效益分析第二部分：第41~60 題(每題2 分)」→ 看清楚題目問什麼","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.65,"w":1,"sw":0.02155,"id":"科技力-A0055"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"18-17、13-50","stem":"下列何項非屬保險業結合現代科技手段之項目？","opts":["P2P 借貸","物聯網","區塊鏈","基因檢測"],"ans":1,"exp":["📝 解析：保險科技（InsurTech）結合物聯網（車聯網UBI、穿戴裝置）、區塊鏈（理賠自動化）、基因檢測（風險評估）等技術。P2P借貸是借貸媒合模式，屬借貸科技而非保險科技項目，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5583,"w":1,"sw":0.02155,"id":"科技力-A0057"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"18-49、14-21","stem":"保險業在保險科技的何種技術幫助下，對動態客戶管理系統(CRM)中之數據進行實時監控分析並有效建立客戶風險模型？","opts":["物聯網","雲端計算","區塊鏈","基因檢測"],"ans":2,"exp":["📝 解析：保險業藉雲端計算的大量儲存與運算能力，對動態CRM系統中的客戶數據做即時監控分析，並建立客戶風險模型，故選(2)。物聯網負責蒐集數據、區塊鏈用於資料不可竄改與理賠自動化、基因檢測用於健康風險評估，均非本題所述功能。"],"pos":0.5833,"w":1,"sw":0.02155,"id":"科技力-A0060"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"18-26、14-55","stem":"下列何者非PwC(2016a)報告中「效率和合作」之監理科技類型內涵？","opts":["監理報告呈現方式","內建合規","風險評估統一化","雲端計算"],"ans":2,"exp":["📝 解析：PwC（2016a）把監理科技分成「效率和合作」與「整合和控制」等類型。效率和合作包括監理報告呈現方式、風險評估統一化、雲端計算等；「內建合規」（compliance by design）屬將合規要求嵌入系統的整合控制類，不在效率和合作之下，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.675,"w":1,"sw":0.02155,"id":"科技力-A0062"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"17-54、8-34","stem":"透過機器學習及演算法能夠組織和分析大量數據，是IMF(2017)提出之何種監理科技領域？","opts":["身分驗證技術","雲應用程序","數據分析工具","認知計算與人工智慧技術"],"ans":4,"exp":["📝 解析：IMF（2017）列舉的監理科技領域中，「認知計算與人工智慧技術」指透過機器學習與演算法組織、分析大量數據，故選(4)。身分驗證技術用於KYC；雲應用程序提供運算資源；數據分析工具偏一般分析軟體，本題強調機器學習與演算法，故屬AI類。"],"pos":0.7333,"w":1,"sw":0.02,"id":"科技力-A0065"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"17-26、11-57","stem":"透過不同來源資訊之關連性及計算以降低風險，是指PwC(2016a)報告中何類監理科技內涵？","opts":["內建合規","風險與合規監控","共享數據","大數據分析"],"ans":2,"exp":["📝 解析：PwC（2016a）監理科技內涵中，「風險與合規監控」是透過不同來源資訊的關聯性與計算來降低風險，故選(2)。內建合規是把合規要求直接寫進系統；共享數據是機構間交換資料；大數據分析偏向以分析建模找出規律。"],"pos":0.6917,"w":1,"sw":0.02,"id":"科技力-A0068"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"17-27、15-55","stem":"有關法遵科技(CompTech)與法規科技(SupTech)之敘述，下列何者錯誤？","opts":["法遵科技是從被監理機構的角度來看","法規科技是從監理機構的角度來看","監理機構對監理對象應用新技術，為法規科技","銀行利用新技術提升風險管理能力以滿足監理需求，為法規科技"],"ans":4,"exp":["📝 解析：法遵科技（CompTech）是被監理機構運用科技滿足監理要求；法規科技（SupTech）是監理機構運用科技進行監理。(4)銀行利用新技術提升風險管理以滿足監理需求，是從被監理機構角度出發，應屬法遵科技而非法規科技，故(4)錯誤，選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6833,"w":1,"sw":0.02,"id":"科技力-A0077"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"16-33、13-33","stem":"啟用第二道防線之防禦功能，運用共享平台分享常用方法與監理數據，是PwC(2016a)報告中何類監理科技內涵？","opts":["機器學習","大數據分析與建模","監理報告呈現方式","風險評估統一化"],"ans":4,"exp":["📝 解析：PwC（2016a）監理科技內涵中，「風險評估統一化」是啟用第二道防線的防禦功能，透過共享平台分享常用方法與監理數據，使各機構風險評估一致，故選(4)。機器學習、大數據分析與建模偏技術工具；監理報告呈現方式是給企業提供監理數據的彈性。"],"pos":0.55,"w":1,"sw":0.02,"id":"科技力-A0093"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"16-34、14-34","stem":"下列何者非屬「RegTech is the new FinTech」報告提出之核心特點？","opts":["敏捷性","分層化","速度","整合"],"ans":2,"exp":["📝 解析：Deloitte〈RegTech is the new FinTech〉提出監理科技四大核心特點：敏捷性、速度、整合、分析。「分層化」不在其中，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5667,"w":1,"sw":0.02,"id":"科技力-A0095"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"15-33、10-34","stem":"在監理數據的提供方面給予企業更多彈性以降低監理報告成本，是指PwC(2016a)報告中何類監理科技內涵？","opts":["應用程式界面","監理報告呈現方式","風險與合規監控","生物識別技術"],"ans":2,"exp":["📝 解析：PwC（2016a）監理科技內涵中，「監理報告呈現方式」是在監理數據提供方面給企業更多彈性（如自動化、標準化報表格式），降低監理報告成本，故選(2)。應用程式界面是系統串接；風險與合規監控是以資料關聯降低風險；生物識別技術用於身分驗證。"],"pos":0.5583,"w":1,"sw":0.02,"id":"科技力-A0102"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"12-33、8-35","stem":"可讓金融監理機構直接獲取金融機構之訊息，並可以通過監理機構參與分類帳取代監理報告，是IMF 提出之何種監理科技領域？","opts":["數據分析工具","區塊鏈與其他分佈式分類帳","身分驗證技術","認知計算與人工智慧技術"],"ans":2,"exp":["📝 解析：IMF 對監理科技的分類中，「區塊鏈與其他分散式分類帳」可讓監理機關成為分類帳節點，直接即時讀取金融機構的交易資料，以參與帳本取代事後申報的監理報告。數據分析工具重在處理分析資料、身分驗證技術用於 KYC，認知計算與 AI 則用於解讀非結構化資料。"],"pos":0.5667,"w":1,"sw":0.02,"id":"科技力-A0139"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"12-55、8-57","stem":"有關風險控管防線之敘述，下列何者錯誤？","opts":["第一道防線是最直接面對風險之人員","第二道防線包括風險管理及法令遵循等單位","在風險評估上，內部控制係單一單位的責任","第二道防線應該加強與第一道防線之溝通及與第三道防線之合作"],"ans":3,"exp":["📝 解析：三道防線：第一道為直接承擔風險的業務單位，第二道為風險管理、法令遵循等單位，第三道為內部稽核；二線應與一線溝通並與三線合作。內部控制與風險評估是全體單位共同的責任，不是「單一單位」的責任，故(3)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9333,"w":1,"sw":0.02,"id":"科技力-A0141"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"11-34、10-57","stem":"根據德勤(RegTech is the new FinTech)的報告，可在短時間內整合多個監理數據結構，並對眾多規定要求形成統一的合規標準，是監理科技的何種特性？","opts":["速度","整合","敏捷性","分析"],"ans":2,"exp":["📝 解析：Deloitte〈RegTech is the new FinTech〉列出監理科技四大特性：敏捷性（Agility）、速度（Speed）、整合（Integration）、分析（Analytics）。其中「整合」指能在短時間內整合多個監理數據結構，並對眾多規定形成統一的合規標準。速度指快速產出報告、敏捷性指快速解耦與組織資料、分析指挖掘資料洞見。"],"pos":0.7583,"w":1,"sw":0.02,"id":"科技力-A0146"},{"s":"all","ch":"科技力 8｜保險科技、監理科技與法遵科技","star":1,"n":2,"refs":"7-30、3-31","stem":"根據2015 年6 月世界經濟論壇(WEF)「金融服務的未來」報告，科技新產品與共享經濟使保險價值鏈發生什麼變化？","opts":["市場新進者更難進入保險行銷市場","傳統所有權人與保險對應關係發生調整","小型保險公司風險定價模式與服務能力更形重要，大型保險公司較不受科技影響","透過智慧感測器與資料傳輸，未來汽車公司更需要向保險公司索取駕駛人數據"],"ans":2,"exp":["📝 解析：WEF（2015）指出，共享經濟（如共享汽車、共享住宿）讓「擁有者」與「使用者」分離，傳統以所有權人為被保險人的對應關係因而調整，保險需轉向依使用投保。(1)新進者因科技更容易進入；(3)大型保險公司同樣受衝擊；(4)相反地，車廠掌握感測器數據，保險公司未來更需向車廠取得駕駛人數據。"],"pos":0.5083,"w":1,"sw":0.02,"id":"科技力-A0154"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":1,"n":2,"refs":"16-56、12-56","stem":"下列何種機制對於洗錢防制較無助益？","opts":["認識客戶身份(KYC)","使用密碼學技術使帳戶去識別化","綁定銀行同名存款帳戶","監控可疑交易"],"ans":2,"exp":["📝 解析：洗錢防制的核心是確認客戶身分（KYC）、資金來源可追溯、監控並申報可疑交易，綁定同名銀行帳戶也有助追蹤金流。用密碼學讓帳戶去識別化會使金流難以追查、反而便利洗錢，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9333,"w":1,"sw":0.02,"id":"科技力-A0090"},{"s":"all","ch":"科技力 9｜監理沙盒與金融科技法規","star":1,"n":2,"refs":"14-31、9-33","stem":"當銀行作業多倚賴金融科技之第三方廠商，倘作業發生問題時，責任歸屬不清之風險為下列何種風險？","opts":["資安風險","委外風險","作業風險","法遵風險"],"ans":2,"exp":["📝 解析：銀行將作業交由金融科技第三方廠商處理，發生問題時權責歸屬不清，屬於委外風險，故選(2)。資安風險著重資訊遭竊或系統遭攻擊；作業風險是內部流程、人員、系統失誤的廣義風險；法遵風險是違反法規。題目強調「依賴第三方、責任不清」，最貼切的是委外風險。"],"pos":0.5333,"w":1,"sw":0.02,"id":"科技力-A0112"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":1,"n":3,"refs":"21-32、13-37、10-39","stem":"下列何者非數位時代下應優先考量的「金融從業人員的應對策略」？","opts":["提升金融專業知識","持續關注科技應用的變化","多方了解異業數位科技的應用案例","積極輔導金融從業人員轉職"],"ans":4,"exp":["📝 解析：數位時代金融從業人員應對策略強調「與時俱進」：提升金融專業、持續關注科技變化、多方吸收異業數位應用案例。積極輔導轉職是被動退出而非應對策略，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6,"w":1,"sw":0.03846,"id":"科技力-A0007"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":1,"n":2,"refs":"20-21、11-54","stem":"根據統計新創企業，多處於下列哪一階段企業產業週期？","opts":["構想期","種子期","成熟期","準備IPO 期"],"ans":2,"exp":["📝 解析：新創企業多數處於「種子期」：已有產品構想並開始開發原型、尋求天使或種子資金，尚未形成穩定營收，故選(2)。構想期仍未成立事業；成熟期與準備IPO期的企業比例很低。"],"pos":0.625,"w":1,"sw":0.04808,"id":"科技力-A0046"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":1,"n":2,"refs":"16-38、8-39","stem":"傳統銀行在應對挑戰時的「數位化策略」，下列何者較不適合？","opts":["擴大實體分行規模，以提供更好服務","適時引進成熟的人工智慧應用","建立數位時代金融從業人員的應對策略","與異業結盟，將金融服務嵌入客戶的生活場景"],"ans":1,"exp":["📝 解析：傳統銀行的數位化策略應適時引進成熟AI、建立從業人員數位應對策略、與異業結盟把金融服務嵌入生活場景。擴大實體分行規模與數位化趨勢背道而馳、成本高，較不適合，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6417,"w":1,"sw":0.02,"id":"科技力-A0081"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":1,"n":2,"refs":"14-57、11-59","stem":"數位時代金融從業人員的應對策略應為「與時俱進」，建議考慮的原則不包括下列何項？","opts":["從工作流程中設想客戶的痛點，尋求以創新的方法解決","學習金融科技專業能力且能完成系統程式之開發","多方吸取外部企業(同業或異業)數位科技應用案例，觸類旁通","持續關注科技應用的變化，並以開放的態度嘗試"],"ans":2,"exp":["📝 解析：數位時代金融從業人員的「與時俱進」原則包括：從工作流程設想客戶痛點並以創新方法解決、多方吸取同業或異業數位應用案例、持續關注科技變化並以開放態度嘗試。從業人員需理解科技應用即可，不必自己完成系統程式開發，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9667,"w":1,"sw":0.02,"id":"科技力-A0117"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":1,"n":2,"refs":"7-2、3-42","stem":"社群行銷最視化的意義是指下列何者？","opts":["社群行銷應該提供瀏覽者最有意義的內容","社群行銷應該提供色彩最搭配的畫面","社群行銷應該提供最容易閱讀的圖文或影片資訊","社群行銷應該解決因為螢幕大小不同所造成的瀏覽不便"],"ans":4,"exp":["📝 解析：題目「最視化」應為「最適化」，即響應式設計（RWD）：網頁依手機、平板、電腦等不同螢幕尺寸自動調整版面，解決瀏覽不便。提供有意義內容、配色、易讀圖文屬內容與視覺設計，不是最適化的定義。"],"pos":0.3667,"w":1,"sw":0.02,"id":"科技力-A0156"},{"s":"all","ch":"科技力 10｜數位轉型、商業模式與創新管理","star":1,"n":2,"refs":"7-4、4-42","stem":"有關社群行銷使用效益分析工具的目的，下列敘述何者錯誤？","opts":["決定社群行銷的成本","對企業而言是很重要的優化工具與持續改善的行銷利器","協助企業獲取網站的各項關鍵績效指標","探索訪客的偏好習性，且有助於企業了解網站營運及行銷活動的表現"],"ans":1,"exp":["📝 解析：社群行銷效益分析工具（如 Google Analytics）的目的是取得網站關鍵績效指標、了解訪客偏好與行銷活動成效，作為持續優化的工具。它是「衡量」成效，不是用來「決定」行銷成本，故(1)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3833,"w":1,"sw":0.02,"id":"科技力-A0158"}],"single":[{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"21-5","stem":"依WEF(2015)認為，下列何者「非」新市場平台功能？","opts":["提升交易效率","提高價格準確性","提升就業參與率","增加流動性"],"ans":3,"exp":["📝 解析：WEF（2015）認為新市場平台可提升交易效率、提高價格準確性、增加流動性與交易機會。「提升就業參與率」與市場平台功能無關，故選(3)。"],"pos":0.0833,"w":1,"sw":0.00276,"id":"21科技力-05"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"21-41","stem":"根據2015 年6 月世界經濟論壇(World Economic Forum, WEF)之報告所提出之股權投資者(Empowered Investors)及流程外部化(Process Externalisation)等創新項目，是屬於下列何種功能？","opts":["存貸","市場資訊提供者","投資管理","籌資"],"ans":3,"exp":["📝 解析：WEF（2015）六大功能中，「投資管理」的創新項目包括賦權投資者（Empowered Investors，如機器人理財、社群交易）與流程外部化（Process Externalisation，把投資流程委外給專業科技服務）。存貸的創新為替代性貸款、籌資為群眾募資、市場資訊提供者為機器革命與新市場平台。"],"pos":0.6833,"w":1,"sw":0.00276,"id":"21科技力-41"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"21-56","stem":"依WEF(2015)報告，金融創新對金融產業的影響，下列敘述何者正確？","opts":["金融創新對保險業影響較銀行輕微","破壞式創新屬短期事件，監理機關可單獨因應","以平台化與資料密集模式進入高獲利市場，重塑金融業生態","金融創新多發生於低獲利且易獲取服務的領域，對產業衝擊有限"],"ans":3,"exp":["📝 解析：WEF（2015）指出，金融創新多以平台化、資料密集、輕資本的模式，切入高獲利、高度依賴中介的市場，重塑金融生態，故(3)正確。(1)保險業同樣受重大影響；(2)破壞式創新是長期趨勢，需監理機關與業者共同因應；(4)創新多發生在高獲利領域，對產業衝擊大。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.9333,"w":1,"sw":0.00276,"id":"21科技力-56"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"20-1","stem":"下列敘述較符合金融科技發展的何種階段？「金融監理法規大量增加，資通業快速發展，非銀行(Nonbank)的新創公司有機會推銷其利基型的金融商品與服務給一般消費者、公司行號、甚至是傳統金融業者。」","opts":["FinTech1.0","FinTech2.0","FinTech3.0","FinTech4.0"],"ans":3,"exp":["📝 解析：依 Arner 等學者的分期：FinTech 1.0（1866～1967）為電報、海底電纜等基礎建設；2.0（1967～2008）為傳統金融機構主導電子化；3.0（2008金融海嘯後）監理法規大增、資通業快速發展，非銀行新創得以直接向消費者、企業甚至金融業提供利基型金融服務，即題述情形。"],"pos":0.0167,"w":1,"sw":0.00307,"id":"20科技力-01"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"20-33","stem":"有關金融科技創新對金融產業帶來的衝擊，下列敘述何者錯誤？","opts":["對金融業者而言，這不會是短暫性的衝擊","對保險業而言，將會帶來新的通路銷售模式","創新的衝擊主要來自於更新、更快的硬體設備","金融監理沙盒可以為金融科技創新的商業式提供一個試營運機制"],"ans":3,"exp":["📝 解析：金融科技創新的衝擊主要來自新的商業模式、數據運用與客戶行為改變，而非硬體設備本身，故(3)錯。其他敘述正確：衝擊不會是短暫的；保險業將出現網路投保等新通路模式；監理沙盒為創新商業模式提供試營運機制。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.55,"w":1,"sw":0.00307,"id":"20科技力-33"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"20-41","stem":"目前金融業運用之大數據(Big Data)、人工智慧(Artificial Intelligence)與電腦自動研判數據(Machine Accessible Data)等係屬於下列何種金融科技對傳統金融業之衝擊？","opts":["顧客關係主導權瓦解","智慧型機器使用(Smarter, Faster Machines)","金融機構與市場新進者的合縱連橫","去中介化"],"ans":2,"exp":["📝 解析：金融科技對傳統金融的衝擊之一是「智慧型機器使用（Smarter, Faster Machines）」：以大數據、人工智慧、機器可讀數據取代人工判斷與作業，提升速度與精準度，故選(2)。顧客關係主導權瓦解指客戶轉向新平台；合縱連橫指與新進者合作或競爭；去中介化指繞過金融機構直接媒合，皆與題意不符。"],"pos":0.6833,"w":1,"sw":0.00307,"id":"20科技力-41"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"19-1","stem":"當現代化的自動清算機構的出現，加速了金融業的數位科技發展，也使得金融業在交易與溝通上都有大幅改變時，我們將之稱為金融科技發展的何種階段？","opts":["FinTech 1.0","FinTech 2.0","FinTech 3.0","FinTech 4.0"],"ans":2,"exp":["📝 解析：依Arner等學者分期：FinTech 1.0（約1866～1967）以電報、海底電纜等基礎建設為主；FinTech 2.0（1967～2008）為數位化時期，ATM、自動清算機構（如BACS、CHIPS）、SWIFT出現，金融交易與溝通大幅數位化；FinTech 3.0（2008後）為新創科技公司直接提供金融服務。題述自動清算機構屬2.0，故選(2)。"],"pos":0.0167,"w":1,"sw":0.02901,"id":"19科技力-01"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"19-12","stem":"下列何項金融科技服務是因新冠疫情出現，成為後新冠疫情時代的重點工作之一？","opts":["區塊鏈","無接觸服務","圖像辨識","雲端計算"],"ans":2,"exp":["📝 解析：新冠疫情促使民眾減少接觸，金融業加速推動「無接觸服務」（線上開戶、行動支付、遠距驗證等），成為後疫情時代的重點工作，故選(2)。區塊鏈、圖像辨識、雲端計算在疫情前即已發展，並非因疫情而出現的服務。"],"pos":0.2,"w":1,"sw":0.02901,"id":"19科技力-12"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"18-1","stem":"在金融科技的衝擊下，有關顧客和金融機構的關係轉變，下列敘述何者錯誤？","opts":["金融機構對顧客關係主導權瓦解","金融機構演變為「一站購足」的大眾市場模式","金融機構需與同業或異業合作來增加競爭力","金融商品交叉銷售的優勢降低"],"ans":2,"exp":["📝 解析：金融科技使顧客可在不同平台挑選最適服務，金融機構對顧客關係的主導權瓦解、交叉銷售優勢降低，需與同業或異業合作。市場走向分眾化、客製化與服務拆分（Unbundling），而非「一站購足」的大眾市場模式，故(2)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0167,"w":1,"sw":0.02901,"id":"18科技力-01"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"18-11","stem":"下列何項非屬新冠疫情後開始發展的無接觸服務？","opts":["將生物識別與行動裝置結合","發展具備身分識別與電子文件簽署等功能的機制","開放更多元身分認證方式","限制開立帳戶型態及交易範圍"],"ans":4,"exp":["📝 解析：疫情後無接觸服務的發展方向是：結合生物識別與行動裝置、建立身分識別與電子簽署機制、開放更多元身分認證方式，以便民眾遠端辦理業務。(4)「限制開立帳戶型態及交易範圍」是在收緊服務，與無接觸服務的發展方向相反，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1833,"w":1,"sw":0.02901,"id":"18科技力-11"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"18-59","stem":"金管會在金融科技發展策略白皮書中提出：創新數位科技，打造智慧金融願景，主要推動下列何種產業與金融產業合作？","opts":["資通訊業","影音後製業","出版業","傳播業"],"ans":1,"exp":["📝 解析：金管會「金融科技發展策略白皮書」提出「創新數位科技，打造智慧金融」願景，主要推動資通訊產業（ICT）與金融產業合作，運用雲端、大數據、行動通訊等技術發展數位金融，故選(1)。"],"pos":0.9833,"w":1,"sw":0.02901,"id":"18科技力-59"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"17-41","stem":"根據聯合國UNSGSA 之報告，金融科技的技術種類不包括下列何者？","opts":["雲端計算","大數據","保險科技","區塊鏈"],"ans":3,"exp":["📝 解析：聯合國普惠金融特別倡議者（UNSGSA）報告將金融科技區分為「技術」與「新商品服務」：技術包括雲端計算、大數據、人工智慧、區塊鏈／分散式帳本、生物辨識、API等；保險科技、電子錢包、P2P借貸、行動支付則屬運用技術產生的商品服務。故「保險科技」不屬技術種類，選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6833,"w":1,"sw":0.01201,"id":"17科技力-41"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"16-1","stem":"根據聯合國UNSGSA(2019) 報告，金融科技的新商品服務不包括下列何者？","opts":["電子錢包","另類借貸P2P","行動支付","人工智慧"],"ans":4,"exp":["📝 解析：依聯合國UNSGSA(2019)報告的分類，電子錢包、另類借貸（P2P）、行動支付等屬於金融科技的「新商品服務」；人工智慧則是「技術」，用來支撐這些商品服務，本身不是商品，故選(4)。可與「技術種類不包括保險科技」的題目對照記憶。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0167,"w":1,"sw":0.01201,"id":"16科技力-01"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"16-55","stem":"金融科技與傳統金融在分群上比較為例，金融科技關注過去在尾端被忽略的族群，稱之為何種理論？","opts":["市場假設理論","前端理論","流動性理論","長尾理論"],"ans":4,"exp":["📝 解析：長尾理論（Long Tail，Chris Anderson提出）指需求分布中尾端數量龐大的小眾客群，累積起來的市場規模可與頭部匹敵。傳統金融重視高資產頭部客戶，金融科技則以低成本數位通路服務過去被忽略的長尾族群（小額、年輕、無信用紀錄者），選(4)。"],"pos":0.9167,"w":1,"sw":0.01201,"id":"16科技力-55"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"15-37","stem":"創立於2008-2009 年間之金融科技公司Square、Wealthfront 所提供之金融服務分別為何？","opts":["支付、自動化理財","支付、保險","P2P 貸款、保險","P2P 貸款、自動化理財"],"ans":1,"exp":["📝 解析：Square於2009年在美國成立（Twitter共同創辦人Jack Dorsey），以手機外接讀卡機起家提供行動支付與收單服務；Wealthfront前身kaChing於2008年成立，後轉型為自動化理財（理財機器人）公司，選(1)支付、自動化理財。"],"pos":0.6167,"w":1,"sw":0.01201,"id":"15科技力-37"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"15-41","stem":"根據2015 年6 月世界經濟論壇(World Economic Forum, WEF)之報告所提出之機器革命(Smarter, Faster Machines) 及新興平台(New Market Platforms)等創新項目，是屬於下列何種功能？","opts":["存貸","市場資訊供應","投資管理","籌資"],"ans":2,"exp":["📝 解析：WEF(2015)「金融服務的未來」報告6項功能中，「市場資訊供應（Market Provisioning）」的創新項目為機器革命（更聰明、更快速的機器，如高頻交易、AI分析）與新興平台（新市場平台，自動化蒐集交易資訊、提升價格發現），選(2)。"],"pos":0.6833,"w":1,"sw":0.01201,"id":"15科技力-41"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"15-58","stem":"針對2015 世界經濟論壇(WEF)曾提到「最易受金融科技公司」衝擊的「六項金融服務」，不包括下列何者？","opts":["利用人工智慧進行投資管理","利用電子支付服務支付生活開銷","參考客戶運動量動態調整壽險保費","利用量子運算評估企業社會責任影響"],"ans":4,"exp":["📝 解析：WEF(2015)指出最易受金融科技衝擊的六項金融服務為：支付、保險、存貸、籌資、投資管理、市場資訊供應。(1)AI投資管理屬投資管理、(2)電子支付屬支付、(3)依運動量動態調整壽險保費屬保險（連結式保險）；(4)量子運算評估企業社會責任影響不屬這六項服務，選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9667,"w":1,"sw":0.01201,"id":"15科技力-58"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"14-1","stem":"下列何種現象不是造成「去中介化(Disintermediation)」興起之原因？","opts":["傳統銀行存貸業務受到法規、技術和存款準備金的限制，無法完全滿足風險偏好程度高的存款者與高風險的借款人之需求","2008 年金融海嘯後，歐美投資銀行在資本市場的中介機構角色與對金融市場風險接受度已減少","人們從事金融交易時不考慮時間及空間之便利性及手續費之節省","投資銀行的資本需求增加，也限制了投行創造市場流動性的能力"],"ans":3,"exp":["📝 解析：去中介化興起的原因包括：銀行受法規、技術與存款準備金限制，無法滿足高風險偏好者與高風險借款人（1）；金融海嘯後投資銀行中介角色與風險承受度降低（2）；投行資本需求增加限制其創造流動性的能力（4）。(3)說反了：正是因為人們「重視」交易的時間、空間便利與手續費節省，才轉向網路平台，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0167,"w":1,"sw":0.01201,"id":"14科技力-01"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"14-38","stem":"依據2016 年世界經濟論壇提出的報告「未來金融服務的基礎建設」提到將會影響金融業的新興科技中，下列何者目前仍在科技公司的研發階段，其他科技金融機構已開始嘗試可能的應用？","opts":["雲端運算","量子計算","分散式帳本
