選項皆為不同類別的組合。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2167,"w":1,"sw":0.01201,"id":"12科技力-13"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"12-14","stem":"下列何者為金融機構的多因子生物辨識技術？","opts":["人臉辨識結合密碼","指紋辨識結合密碼","聲紋辨識結合密碼","虹膜辨識結合人臉辨識"],"ans":4,"exp":["📝 解析：「多因子生物辨識」是指同時結合兩種以上的生物特徵進行辨識，例如虹膜辨識結合人臉辨識，故選(4)。人臉、指紋或聲紋結合密碼，是生物特徵（所具）加上密碼（所知）的多因子認證，但只用到一種生物特徵，不屬於多因子生物辨識。"],"pos":0.2333,"w":1,"sw":0.01201,"id":"12科技力-14"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"12-15","stem":"有關臉部辨識的敘述，下列何者正確？","opts":["不易受距離影響","不易受膚色深淺影響","不易受臉部角度影響","不易受環境光源影響"],"ans":2,"exp":["📝 解析：依教材，臉部辨識的限制在於容易受拍攝距離、臉部角度、環境光源影響，而膚色深淺相對不是主要限制，故官方選(2)。補充：實務上美國 NIST 2019 年人臉辨識測試發現部分演算法對不同膚色族群的準確率仍有差異，但就本題四個選項而言以(2)最符合教材說法。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.25,"w":1,"sw":0.01201,"id":"12科技力-15"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"12-35","stem":"根據2018 年行政院國家資通安全會報技術服務中心的報告指出，政府網頁被攻陷的主要原因中，不包括下列何項？","opts":["網頁設計不當","應用程式漏洞","內容編排方式","弱密碼"],"ans":3,"exp":["📝 解析：依 2018 年行政院國家資通安全會報技術服務中心報告，政府網頁被攻陷的主因包括網頁設計不當、應用程式漏洞、弱密碼等技術與管理缺失。「內容編排方式」只是版面呈現，與安全漏洞無關，故選(3)。","🏷 名稱更新：該中心自112.1.1改制為國家資通安全研究院（數發部監督）；報告內容之攻擊原因未變，答案仍為(3)","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5833,"w":1,"sw":0.01201,"id":"12科技力-35"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"12-42","stem":"下列何者並非提供基礎架構即服務IaaS 的較大廠商？","opts":["Microsoft Azure","IBM BlueMix","Amazon Web Services","Google Cloud Platform"],"ans":2,"exp":["📝 解析：Microsoft Azure、Amazon Web Services（AWS）、Google Cloud Platform 都是主要的基礎架構即服務（IaaS）供應商。IBM BlueMix 是以 Cloud Foundry 為基礎的平台即服務（PaaS），提供開發與部署應用程式的平台，並非以 IaaS 為主（2017 年後併入 IBM Cloud），故選(2)。"],"pos":0.7,"w":1,"sw":0.01201,"id":"12科技力-42"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"11-2","stem":"雲端服務提供商將所有運算資源(如: 儲存空間, 記憶體, CPU 等)匯整起來，並依據使用者的需求，提供給使用者，我們稱為三大服務模式的何種？","opts":["基礎架構即服務(IaaS)","平台即服務(PaaS)","軟體即服務(SaaS)","訊息即服務(MaaS)"],"ans":1,"exp":["📝 解析：基礎架構即服務（IaaS）是把儲存空間、記憶體、CPU、網路等運算資源池化，依使用者需求提供，使用者自行安裝作業系統與應用程式。PaaS 提供開發平台、SaaS 提供現成應用軟體；MaaS 不在 NIST 三大服務模式內。"],"pos":0.0333,"w":1,"sw":0.01201,"id":"11科技力-02"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"11-3","stem":"消費者直接使用雲端業者開發完成的應用程式，完全不用理會該應用程式的技術架構、作業系統及硬體，是下列何種雲端運算的服務模式？","opts":["基礎架構即服務","平台即服務","軟體即服務","資料即服務"],"ans":3,"exp":["📝 解析：軟體即服務（SaaS）是消費者直接使用雲端業者開發完成的應用程式（如 Gmail、Office 365），完全不必管理底層技術架構、作業系統與硬體。IaaS 需自行管理作業系統與應用、PaaS 需自行開發應用程式；資料即服務不屬 NIST 三大服務模式。"],"pos":0.05,"w":1,"sw":0.01201,"id":"11科技力-03"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"11-4","stem":"國際數據資訊有限公司(IDC)預期未來有超過85% 的台灣企業將規畫雲的相關部署，其中超過五成企業將部署下列何種雲端運算的部署模型？","opts":["公有雲","社群雲","私有雲","混合雲"],"ans":4,"exp":["📝 解析：依 IDC 預測，超過 85% 台灣企業將規劃雲端部署，其中超過五成將採用「混合雲」，兼顧公有雲的彈性與成本，以及私有雲的安全與合規。"],"pos":0.0667,"w":1,"sw":0.01201,"id":"11科技力-04"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"11-14","stem":"下列何種生物辨識其安全性比人臉辨識高？","opts":["指紋辨識","聲音辨識","簽名辨識","手語辨識"],"ans":1,"exp":["📝 解析：依教材，指紋紋路具唯一性、終身不變，辨識準確度高，安全性高於人臉辨識（人臉易受照片、雙胞胎、化妝及角度光線影響）。聲音易受感冒與環境噪音影響且可被錄音模仿，簽名可被練習偽造，手語不是生物辨識技術，安全性都不比人臉高。"],"pos":0.2333,"w":1,"sw":0.01201,"id":"11科技力-14"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"11-16","stem":"下列敘述何者正確？","opts":["手機指紋辨識的成本效益較差","虹膜辨識的成本效益最佳","靜脈辨識的處理速度最快","聲音辨識的穩定性較差"],"ans":4,"exp":["📝 解析：聲音辨識易受感冒、情緒、年齡變化與環境噪音影響，穩定性較差，故(4)正確。(1)錯：手機指紋辨識感測器便宜、普及，成本效益佳；(2)錯：虹膜辨識設備昂貴，成本效益不是最佳；(3)錯：靜脈辨識需紅外線取像比對，處理速度並非最快。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.2667,"w":1,"sw":0.01201,"id":"11科技力-16"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"11-43","stem":"根據美國國家標準局與技術研究院NIST 定義，下列何者並非雲端運算的必要特性？","opts":["不可量測服務","隨需自助服務","廣泛的網路連接","資源匯集"],"ans":1,"exp":["📝 解析：依美國 NIST SP 800-145，雲端運算五大必要特性為：隨需自助服務、廣泛的網路存取、資源匯集（池化）、快速彈性調整、「可量測」的服務（依使用量計費）。「不可量測服務」與定義相反，故選(1)。"],"pos":0.7167,"w":1,"sw":0.01201,"id":"11科技力-43"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"11-49","stem":"下列何者非屬虹膜辨識的正確知識？","opts":["結構性特徵於胚胎時期已形成","紅外線攝影機可進行辨識","辨識時的危險性較低","微血管變化為重要依據"],"ans":3,"exp":["📝 解析：官方答案為(3)。教材（金融科技力 2021 版 p.160）寫道：虹膜表面紋路與結構性特徵在胚胎時期即已形成、終生不變；虹膜辨識透過紅外線攝影機，根據微血管的分佈變化作為辨識依據；優點是錯誤率低、不易造假，缺點是危險性較高、較不為人接受。因此(1)(2)(4)照教材都是正確知識，「危險性較低」與教材相反。實務上虹膜辨識為非接觸式、所用近紅外線強度低，一般視為安全，且辨識依據是虹膜紋理（隱窩、皺褶、斑點），以血管分布辨識的其實是視網膜辨識；考試仍照官方答案(3)。","⚠ 官方答案有疑義（考試以官方答案為準）：虹膜辨識為非接觸近紅外線，實務多視為低風險；(4)亦屬錯誤知識，可能雙錯，存疑","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8167,"w":1,"sw":0.01201,"id":"11科技力-49"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"10-3","stem":"除了公有雲、私有雲、混合雲三種部署模型，美國國家標準局與技術研究院(National Insitute of Standards and Technology, NIST)還定義了下列哪一種雲？","opts":["社群雲","社會雲","國家雲","世界雲"],"ans":1,"exp":["📝 解析：美國 NIST（SP 800-145）定義四種雲端部署模型：公有雲、私有雲、混合雲、社群雲。社群雲是由具有共同需求（如任務、法規、資安要求）的特定組織社群共享的雲端環境；社會雲、國家雲、世界雲皆非 NIST 定義。"],"pos":0.05,"w":1,"sw":0.01201,"id":"10科技力-03"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"10-20","stem":"有關eKYC 的敘述，下列何者錯誤？","opts":["所謂eKYC，係指利用電子化的方式，確認客戶的身分","指紋掃描是eKYC 的方法之一","eKYC 所使用的辨識方式，可以保證百分之百正確","eKYC 係潮流所趨，會越來越普遍"],"ans":3,"exp":["📝 解析：答案(3)錯誤：eKYC 常用的人臉、指紋等生物辨識都有誤判率（冒用接受率 FAR、本人誤拒率 FRR），任何辨識技術都不可能保證百分之百正確，因此實務上會搭配多因子驗證與風險分級。(1) eKYC 即以電子化方式確認客戶身分；(2) 指紋掃描是常見的 eKYC 方法；(4) 遠距開戶、純網銀普及，eKYC 是趨勢，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3333,"w":1,"sw":0.01201,"id":"10科技力-20"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"10-36","stem":"世界經濟論壇公布的「2019 全球風險報告」中，有關資安的敘述，下列何者錯誤？","opts":["資安問題已經擠進全球十大可能發生風險(risks in terms of Likelihood)","由於資通技術的進步，可完全控制資安問題","資安問題已經擠進全球十大衝擊風險(risks in terms of Impact)","未來資安風險持續增加中"],"ans":2,"exp":["📝 解析：答案(2)錯誤：資通技術進步的同時，攻擊手法也在進化，資安風險只能降低與管理，無法「完全控制」。WEF《2019 全球風險報告》中，網路攻擊同時名列十大可能發生風險（第 5 名）與十大衝擊風險（第 7 名），且報告指出資安風險持續增加，故(1)(3)(4)正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6,"w":1,"sw":0.01201,"id":"10科技力-36"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"10-37","stem":"政府為了防止民眾遭受網路詐騙，成立哪個網站，公布假網站、假帳號及最新詐騙手法供民眾參考？","opts":["1999 反詐騙資訊網","110 反詐平台","165 全民防騙網","168 反詐騙網"],"ans":3,"exp":["📝 解析：答案(3)：內政部警政署設立「165 全民防騙網」（165 反詐騙諮詢專線），公布假網站、假投資網站、詐騙帳號與最新詐騙手法供民眾查詢。1999 是各縣市政府市民服務專線，110 是報案電話，168 反詐騙網並非政府官方網站。"],"pos":0.6167,"w":1,"sw":0.01201,"id":"10科技力-37"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"10-43","stem":"雲端運算對於企業的效益眾多，下列敘述何者錯誤？","opts":["大部分雲端服務提供商透過大量資安強化措施的宣傳及說明，來獲取使用者的信任，企業據以減少資訊安全的投資","雲端服務可以讓企業IT 人員將時間花在企業的核心應用或服務上，達成商業目標","採用雲端服務後，企業可以依據使用量多寡支付多少費用，不致造成企業過大的負擔","採用雲端服務的企業，通常可以在幾分鐘內快速大量的佈署所需的資源，讓資源配置更有效率及靈活性"],"ans":1,"exp":["📝 解析：答案(1)錯誤：雲端採「責任共擔」模式，雲端服務商負責基礎設施安全，但企業仍須負責自身帳號權限、資料加密與應用程式安全，不能因業者宣傳而減少資安投資。(2) IT 人力可專注核心業務；(3) 依使用量付費（pay-as-you-go）；(4) 可快速彈性部署資源，均是雲端效益。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7167,"w":1,"sw":0.01201,"id":"10科技力-43"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"10-58","stem":"如果要參詢數位證據的識別、蒐集、擷取的程序可參考下列何項標準？","opts":["ISO 27701","NIST SP800-34","ISO 27001","ISO／IEC 27037"],"ans":4,"exp":["📝 解析：答案(4)：ISO/IEC 27037 是「數位證據的識別、蒐集、擷取與保存」指引，屬數位鑑識標準。ISO 27701 是隱私資訊管理系統（PIMS）、ISO 27001 是資訊安全管理系統（ISMS）、NIST SP800-34 是資訊系統營運持續（應變）計畫指引，均與數位證據蒐集程序無直接關係。"],"pos":0.9667,"w":1,"sw":0.01201,"id":"10科技力-58"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"9-3","stem":"依美國國家標準局與技術研究院(NIST)定義，下列何種模式是讓多個不同使用者可以使用相同的系統或程式元件，彼此的資料是被隔離的，不會互相干擾與影響？","opts":["平行運算模式","跨平台API 資料傳輸模式","資料保護模式","多租戶模式"],"ans":4,"exp":["📝 解析：答案(4)：NIST 對雲端運算的定義中，「資源池化」以多租戶模式（Multi-tenancy）提供服務，多個使用者共用同一套系統或程式元件，但彼此的資料與設定在邏輯上隔離，不會互相干擾。平行運算是多處理器同時運算，API 傳輸與資料保護模式都不是此定義。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.05,"w":1,"sw":0.01201,"id":"9科技力-03"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"9-5","stem":"下列何項個人資料項目屬臺灣個人資料保護法中定義的特種個資？","opts":["身分證字號","電話號碼","護照號碼","健康檢查"],"ans":4,"exp":["📝 解析：答案(4)：依個人資料保護法第6條，特種個資為「病歷、醫療、基因、性生活、健康檢查及犯罪前科」，原則上不得蒐集、處理或利用，例外情形才可。身分證字號、電話號碼、護照號碼屬個資法第2條所列的一般個人資料，雖須保護但不屬特種個資。"],"pos":0.0833,"w":1,"sw":0.01201,"id":"9科技力-05"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"9-15","stem":"目前智慧手機所搭配指紋辨識的冒用接受率(False Acceptance Rate, FAR)大約可做到五萬分之一。下列有關冒用接受率的定義何者正確？","opts":["冒用者被接受次數除以本人嘗試次數","冒用者被接受次數除以冒用者嘗試次數","本人被接受次數除以本人嘗試次數","本人被接受次數除以冒用者嘗試次數"],"ans":2,"exp":["📝 解析：答案(2)：冒用接受率 FAR（False Acceptance Rate）＝冒用者被系統接受的次數 ÷ 冒用者嘗試的總次數，衡量安全性；五萬分之一表示冒用者試 5 萬次約有 1 次被誤認。相對的「本人誤拒率」FRR＝本人被拒絕次數 ÷ 本人嘗試次數，衡量便利性。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.25,"w":1,"sw":0.01201,"id":"9科技力-15"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"9-36","stem":"2017 年2 月國內券商交易系統遭到強大的攻擊流量，癱瘓網路運作，這種手法為何？","opts":["進階持續威脅攻擊(APT)","分散式阻斷服務(DDoS)","勒索病毒軟體(RaaS)","釣魚郵件"],"ans":2,"exp":["📝 解析：答案(2)：2017 年2月國內多家券商遭駭客以大量流量灌爆交易網站並勒索比特幣，屬分散式阻斷服務攻擊（DDoS）：利用大量被控制的殭屍電腦同時送出請求，使系統資源耗盡而癱瘓。APT 是長期潛伏竊密，勒索軟體是加密檔案勒贖，釣魚郵件是騙取帳密，均非以流量癱瘓網路。"],"pos":0.6,"w":1,"sw":0.01201,"id":"9科技力-36"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"9-37","stem":"依據2018 年行政院國家資通安全會報技術服務中心統計，政府機關通報的事件，有40%以上是受到網頁攻擊，主要的原因不包括下列何者？","opts":["網站設計不當","應用程式漏洞","弱密碼","系統稽核軌跡不足"],"ans":4,"exp":["📝 解析：答案(4)：依 2018 年行政院國家資通安全會報技術服務中心統計，政府機關網頁攻擊事件多因網站設計不當（1）、應用程式漏洞（2，如 SQL Injection、XSS）、弱密碼（3）被入侵。「系統稽核軌跡不足」影響的是事後追查，並不是遭受網頁攻擊的主要原因。","🏷 名稱更新：該中心自112.1.1改制為國家資通安全研究院（數發部監督）；統計敘述未變，答案仍為(4)","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6167,"w":1,"sw":0.01201,"id":"9科技力-37"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"9-38","stem":"請問依據Accenture 於2019 年的報告指出，網路犯罪對何種行業所增加的成本最大？","opts":["銀行業","軟體業","汽車業","保險業"],"ans":1,"exp":["📝 解析：答案(1)：Accenture 與 Ponemon Institute 2019 年《網路犯罪成本研究》指出，銀行業因網路犯罪產生的平均年度成本最高（約 1,837 萬美元），高於軟體、汽車、保險等產業，原因是銀行持有大量資金與敏感資料，是駭客首要目標。"],"pos":0.6333,"w":1,"sw":0.01201,"id":"9科技力-38"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"8-14","stem":"指紋辨識是屬於接觸式辨識，它透過指紋的獨特性進行辨識，其資料庫系統建立較早也較完整但易受到下列何種影響而影響辨識結果？","opts":["指紋磨損","指紋增生","指紋岔點太多","指紋斷點太多"],"ans":1,"exp":["📝 解析：答案(1)：指紋辨識屬接觸式生物辨識，技術成熟、資料庫建置早；缺點是易受指紋磨損（勞力工作者、年長者）、手指乾濕或髒污影響，導致辨識失敗。指紋不會「增生」，岔點、斷點是用來比對的特徵點，並非干擾因素。"],"pos":0.2333,"w":1,"sw":0.01201,"id":"8科技力-14"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"8-15","stem":"一套兼具安全性與便利性的生物辨識系統必須具備何種特性？","opts":["低「冒用被接受率(false acceptance rate)」、高「本人被誤拒率(false rejection rate)」","高「冒用被接受率」、高「本人被誤拒率」","低「冒用被接受率」、低「本人被誤拒率」","高「冒用被接受率」、低「本人被誤拒率」"],"ans":3,"exp":["📝 解析：答案(3)：安全性看「冒用被接受率」FAR，越低越不容易被冒用；便利性看「本人被誤拒率」FRR，越低本人越不會被拒絕。兼具安全與便利須兩者都低。實務上兩者有此消彼長的關係，需調整門檻找平衡點，高 FAR 不安全、高 FRR 不便利。"],"pos":0.25,"w":1,"sw":0.01201,"id":"8科技力-15"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"8-36","stem":"在2019 世界經濟論壇的「全球風險報告」(WEF Global Risks Report)中，何項風險同時列居十大可能風險及十大衝擊風險中？","opts":["身分被冒用","網路攻擊","關鍵基礎建設被毀","個人資料被竊取"],"ans":2,"exp":["📝 解析：答案(2)：WEF《2019 全球風險報告》中，「網路攻擊」同時名列十大可能風險（第 5）與十大衝擊風險（第 7）。「資料詐欺或竊取」只名列可能風險（第 4），「關鍵資訊基礎建設崩潰」只名列衝擊風險；身分被冒用不是該報告的獨立風險項目。"],"pos":0.6,"w":1,"sw":0.01201,"id":"8科技力-36"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"8-49","stem":"信用卡公司Mastercard 於2017 年陸續推展「生物辨識卡」，以加強刷卡者的身分辨識，它的作法是把卡片擁有者的生物特徵存入信用卡的晶片以作為刷卡時的比對，下列何種生物特徵資料是Mastercard 用來存入信用卡？","opts":["人臉","指靜脈","聲紋","指紋"],"ans":4,"exp":["📝 解析：答案(4)：Mastercard 2017 年推出的生物辨識卡，是在卡片晶片內存入持卡人「指紋」範本，並在卡片上嵌入指紋感應器，刷卡時以指紋與晶片內資料比對取代簽名或 PIN，指紋資料只存在卡片中不上傳。"],"pos":0.8167,"w":1,"sw":0.01201,"id":"8科技力-49"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"7-19","stem":"在雲端運算的各種服務模型中可以讓消費者使用處理能力、儲存空間、網路元件或中介軟體等的運算資源，該服務模型為何？","opts":["基礎架構即服務","平台即服務","軟體即服務","資料即服務"],"ans":1,"exp":["📝 解析：答案(1)：依 NIST 定義，基礎架構即服務（IaaS）提供處理能力、儲存空間、網路元件等基礎運算資源，使用者可自行部署作業系統與應用程式。PaaS 提供開發與執行應用程式的平台，SaaS 直接提供可用的應用軟體，資料即服務（DaaS）則是提供資料本身。"],"pos":0.3167,"w":1,"sw":0.01201,"id":"7科技力-19"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"7-21","stem":"在企業界採用雲端運算平台時，業務擴充及移轉之彈性為企業採用雲端運算服務之重要考量因素，因此要求雲端服務之互通性及可移轉性，下列哪一項非屬建議採用的業界標準？","opts":["虛擬化平台","資料檔案格式","虛擬機檔案格式","收費模式"],"ans":4,"exp":["📝 解析：答案(4)：為確保雲端服務的互通性與可移轉性，建議採用的業界標準集中在技術面：虛擬化平台（1）、資料檔案格式（2）、虛擬機檔案格式（3，如 OVF），讓系統與資料可在不同雲端業者間搬遷。收費模式屬商業條件，各家自訂，不是技術互通標準。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.35,"w":1,"sw":0.01201,"id":"7科技力-21"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"7-34","stem":"下列何者為個資隱私保護在跨國情境下的國際趨勢？","opts":["Privacy by Design","Security by Design","Privacy as A Service","Confidentiality Rules"],"ans":1,"exp":["📝 解析：答案(1)：跨國個資隱私保護的國際趨勢是「隱私設計」（Privacy by Design），即在系統與服務設計之初就把隱私保護納入，而非事後補救，已被歐盟 GDPR 第25條（資料保護設計及預設）入法。Security by Design 偏資安設計，其他兩項並非國際通用原則。"],"pos":0.5667,"w":1,"sw":0.01201,"id":"7科技力-34"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"7-49","stem":"在平台即服務模式中，消費者掌控運作應用程式的環境，通常也就是掌控著下列哪種組合？","opts":["應用程式的開發與執行、資料庫管理","應用程式的開發與執行、網路連線管理、磁碟儲存空間管理","應用程式的啟用與關閉、網路連線管理、作業系統種類","應用程式的啟用與關閉、網路連線管理、磁碟儲存空間管理、作業系統種類"],"ans":1,"exp":["📝 解析：答案(1)：依 NIST 定義，PaaS（平台即服務）的使用者不管理底層網路、伺服器、作業系統與儲存空間，但能掌控自己部署的應用程式（開發與執行）及應用程式執行環境的相關設定，例如資料庫管理。(2)(3)(4) 涉及網路連線、磁碟空間或作業系統種類的管理，屬 IaaS 使用者才掌控的範圍。"],"pos":0.8167,"w":1,"sw":0.01201,"id":"7科技力-49"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"7-57","stem":"下列何者不是金融科技資訊安全整體性解決框架的重要內涵？","opts":["人身健康與責任安全的保障","身份識別與生物辨識安全","隱私安全管理","區塊鏈技術安全應用"],"ans":1,"exp":["📝 解析：答案(1)：金融科技資訊安全整體性解決框架的內涵包括身分識別與生物辨識安全（2）、隱私安全管理（3）、區塊鏈技術安全應用（4）等，聚焦於資訊、身分與交易安全。人身健康與責任安全的保障屬保險或職業安全範疇，不是資訊安全框架的內涵。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.95,"w":1,"sw":0.01201,"id":"7科技力-57"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"6-18","stem":"下列哪個項目不是常見的資訊安全檢驗項目？","opts":["客觀性(Objectivity)","機密性(Confidentiality)","完整性(Integrity)","可用性(Availablity)"],"ans":1,"exp":["📝 解析：資訊安全的三大檢驗要素為 CIA：機密性（Confidentiality，只有授權者能存取）、完整性（Integrity，資料不被竄改）、可用性（Availability，需要時可正常使用）。「客觀性」不是資訊安全的檢驗項目，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3,"w":1,"sw":0.01201,"id":"6科技力-18"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"6-20","stem":"現代金融機構的運作幾乎完全仰賴資訊系統，因此有些銀行業者為能專注於核心業務，而將資訊中心設施資源的建置與維護管理，交由專業的資訊夥伴處理，這種方式稱為：","opts":["軟體即服務(SaaS)","委託代工(OEM)","資訊委外(IT Outsourcing)","隨需服務(On-demand)"],"ans":3,"exp":["📝 解析：銀行把資訊中心設施的建置與維運交給外部專業資訊廠商，以專注核心業務，稱為資訊委外（IT Outsourcing），故選(3)。SaaS 是透過網路租用應用軟體；OEM 是製造業代工生產；On-demand 是依需求即時提供服務的計價／供應方式。"],"pos":0.3333,"w":1,"sw":0.01201,"id":"6科技力-20"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"6-21","stem":"雲端運算的部署模型，下列敘述何者錯誤？","opts":["免費公用雲上的使用者資料不可供任何人隨意檢視","公用雲適合處理一般性資料與機敏資料","混合雲為結合公用雲及私有雲的模式","私有雲對使用者與網路做了特殊限制管理，具有安全性與彈性"],"ans":2,"exp":["📝 解析：選項(2)錯：公用雲由多個用戶共享基礎設施，適合處理一般性資料；機敏資料（如客戶個資、交易資料）較適合放在有特殊存取管理的私有雲。(1)即使是免費公用雲，也有存取控制，使用者資料不能被任何人隨意檢視；(3)混合雲結合公用雲與私有雲；(4)私有雲對使用者與網路作特殊限制管理，兼具安全與彈性，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.35,"w":1,"sw":0.01201,"id":"6科技力-21"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"6-48","stem":"為因應業務擴充及移轉彈性以避免受制於雲端運算服務業者，下列何者不是考量虛擬平台標準化的因素？","opts":["資料檔案格式","虛擬平台演算模式","應用程式介面(API)","網路協定"],"ans":2,"exp":["📝 解析：為避免被單一雲端服務業者綁定（vendor lock-in），虛擬平台標準化要考量資料檔案格式、應用程式介面（API）、網路協定等可攜與互通的要素，才能在業者間移轉。虛擬平台內部的演算模式屬各業者技術細節，不是標準化考量因素，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8,"w":1,"sw":0.01201,"id":"6科技力-48"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"6-49","stem":"雲端運算與服務的優點，不包含下列何者？","opts":["運算與服務更加快速靈敏","減少資本支出與營運成本","使組織更為扁平化","善用資訊資源提高生產力"],"ans":3,"exp":["📝 解析：雲端運算的優點包括：運算與服務更快速靈敏（彈性擴充）、以租代買減少資本支出與營運成本、善用資訊資源提高生產力。「使組織更扁平化」是組織結構調整的結果，不是雲端運算本身的優點，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8167,"w":1,"sw":0.01201,"id":"6科技力-49"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"5-17","stem":"雲端運算技術最早是由下列哪一家公司所提出的一種軟體技術？","opts":["Google","Apple","IBM","Amazon"],"ans":4,"exp":["📝 解析：依官方答案，雲端運算技術最早由 Amazon 提出並商業化：Amazon 於 2006 年推出 AWS 的 S3 儲存與 EC2 運算服務，是最早的大規模商用雲端服務，故選(4)。⚠ 疑義：「Cloud Computing」一詞通常被認為由 Google 執行長 Eric Schmidt 在 2006 年 8 月公開提出並普及，若題目問「誰提出此名詞」答案可能是 Google；考試仍照官方答案選 Amazon。","⚠ 官方答案有疑義（考試以官方答案為準）：Cloud Computing一詞多歸Google Schmidt於2006提出；Amazon同年商用AWS。題意「提出」答Amazon有疑義"],"pos":0.2833,"w":1,"sw":0.01201,"id":"5科技力-17"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"5-18","stem":"下列哪一雲端運算服務模式主要是讓消費者使用應用程式、但不掌控作業系統、硬體或運作的網路基礎架構？","opts":["IaaS(基礎架構即服務)","PaaS(平台即服務)","SaaS(軟體即服務)","HaaS(硬體即服務)"],"ans":3,"exp":["📝 解析：依 NIST 定義，SaaS（軟體即服務）讓消費者透過網路使用業者提供的應用程式，但不管理或掌控底層的作業系統、硬體與網路基礎架構，故選(3)。IaaS 讓使用者自行掌控作業系統與部署的應用；PaaS 讓使用者在平台上部署自己開發的應用程式；HaaS 是租用硬體。"],"pos":0.3,"w":1,"sw":0.01201,"id":"5科技力-18"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"5-19","stem":"有關公用雲(Public Cloud)的敘述，下列何者正確？","opts":["一定是免費的","所有使用者資料可供任何人檢視","通常會對使用者實施存取控制機制","特別適合機敏資料處理"],"ans":3,"exp":["📝 解析：公用雲雖由多個用戶共享，但通常會對使用者實施身分驗證與存取控制，故(3)正確。(1)錯：公用雲有免費也有付費服務；(2)錯：使用者資料受存取控制保護，不是任何人都能檢視；(4)錯：機敏資料較適合放私有雲，公用雲適合一般性資料。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.3167,"w":1,"sw":0.01201,"id":"5科技力-19"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"5-20","stem":"下列何者是指運算資源的使用量可以被監視及控制，也可作為計價的依據？","opts":["隨需自助服務","可量測服務","資料匯集服務","快速彈性"],"ans":2,"exp":["📝 解析：NIST 雲端運算五大特徵之一的「可量測服務」（Measured Service），指運算資源（儲存、運算、頻寬、使用者數）的使用量可被監視、控制與報告，並作為計價依據（用多少付多少），故選(2)。隨需自助服務是用戶可自行取得資源；快速彈性是資源可快速擴充或縮減。"],"pos":0.3333,"w":1,"sw":0.01201,"id":"5科技力-20"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"5-21","stem":"下列何者指的是簡單易用的程式介面，可以讓分屬不同平台或服務的應用程式，相對簡單的溝通？","opts":["API","Web 2.0","USB 3.0","HTML5"],"ans":1,"exp":["📝 解析：API（Application Programming Interface，應用程式介面）定義了程式之間溝通的規則，讓不同平台或服務的應用程式可以相對簡單地交換資料與呼叫功能，故選(1)；開放銀行也是以 API 與第三方業者串接。Web 2.0 是強調使用者參與的網路型態；USB 3.0 是硬體傳輸規格；HTML5 是網頁標記語言。"],"pos":0.35,"w":1,"sw":0.01201,"id":"5科技力-21"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"5-38","stem":"駭客攻擊過程之先後順序為何？ A.研究安全弱點 B.測試攻擊 C.網路或社交攻擊 D.資料外傳","opts":["ABCD","ADBC","ABDC","BADC"],"ans":1,"exp":["📝 解析：駭客攻擊的順序：先研究目標的安全弱點(A) → 測試攻擊是否可行(B) → 正式發動網路或社交工程攻擊入侵(C) → 竊取並外傳資料(D)，故為 ABCD，選(1)。"],"pos":0.6333,"w":1,"sw":0.01201,"id":"5科技力-38"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"5-48","stem":"利用雲端數位系統，建立顧客側寫，進而執行精準行銷，這是屬於下列哪一種雲端運算的應用？","opts":["測試中心雲應用","雲端數位行銷應用","基礎架構雲應用","異業雲端協作應用"],"ans":2,"exp":["📝 解析：利用雲端數位系統蒐集分析顧客資料、建立顧客側寫（Customer Profiling），進而執行精準行銷，屬於「雲端數位行銷應用」，故選(2)。測試中心雲是提供系統開發測試環境；基礎架構雲是提供運算儲存資源；異業雲端協作是不同產業透過雲端共享合作。"],"pos":0.8,"w":1,"sw":0.01201,"id":"5科技力-48"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"5-49","stem":"DevOps 係指下列何者？","opts":["軟體開發人員與運維技術人員合作溝通的方式","軟體系統分析人員與運維技術人員合作溝通的方式","軟體設計人員與生產作業人員合作溝通的方式","軟體系統分析人員與生產作業人員合作溝通的方式"],"ans":1,"exp":["📝 解析：DevOps 是 Development（軟體開發）與 Operations（運維）的合稱，指軟體開發人員與運維技術人員密切合作溝通的文化與方法，透過自動化部署與持續整合，加快軟體交付並提高穩定性，故選(1)。"],"pos":0.8167,"w":1,"sw":0.01201,"id":"5科技力-49"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"4-17","stem":"在網路上常常看到有人使用Google App Engine 服務，是屬於哪一種服務模式？","opts":["資料即服務","軟體即服務","平台即服務","基礎架構即服務"],"ans":3,"exp":["📝 解析：Google App Engine 提供程式執行環境、開發框架與資料庫等平台，使用者只要上傳自己寫的應用程式即可部署執行，不必管作業系統與伺服器，屬平台即服務（PaaS），故選(3)。軟體即服務（SaaS）是直接使用現成軟體（如 Gmail）；基礎架構即服務（IaaS）是租用虛擬機、儲存、網路等底層資源。"],"pos":0.2833,"w":1,"sw":0.01201,"id":"4科技力-17"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"4-18","stem":"下列哪一種雲端佈署模型可視為企業利用虛擬化技術與跨異質平台整合及管理工具，優化內部資源使用，加速資源配置到終端使用者手上的新資訊架構？","opts":["私有雲","公有雲","混合雲","社群雲"],"ans":1,"exp":["📝 解析：企業在自己內部用虛擬化與跨異質平台管理工具，把自有資源集中調度、快速配置給內部使用者，這是私有雲的定義，故選(1)。公有雲是向外部供應商租用、多家共用；混合雲是公有＋私有結合；社群雲是由有共同需求的特定組織共享。"],"pos":0.3,"w":1,"sw":0.01201,"id":"4科技力-18"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"4-19","stem":"為求儲存在雲端的資料不會在未經授權的情況下被竄改，雲端服務供應商需要實現資訊安全三要素中的哪一項？","opts":["機密性 (Confidentiality)","完整性 (Integrity)","可用性 (Availability)","不可否認性 (Undeniable)"],"ans":2,"exp":["📝 解析：資訊安全三要素 CIA 中，完整性（Integrity）指資料在未經授權下不被竄改、刪除，保持正確一致，故選(2)。機密性是防止未經授權者讀取；可用性是授權者需要時可以取用；不可否認性不屬 CIA 三要素。"],"pos":0.3167,"w":1,"sw":0.01201,"id":"4科技力-19"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"4-20","stem":"在各種雲端的服務模型中，有關各種服務的敘述，下列何者錯誤？","opts":["區塊儲存(Block Storage)是屬於基礎架構即服務","運行環境(Runtime)是屬於平台即服務","財務管理是屬於軟體即服務","協同作業(Collaboration)是屬於平台即服務"],"ans":4,"exp":["📝 解析：(4)錯：協同作業（Collaboration，如線上文件共編、視訊會議軟體）是使用者直接使用的現成應用軟體，屬軟體即服務（SaaS），不是平台即服務。(1)區塊儲存是底層儲存資源，屬 IaaS；(2)程式運行環境（Runtime）屬 PaaS；(3)財務管理應用軟體屬 SaaS，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3333,"w":1,"sw":0.01201,"id":"4科技力-20"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"4-21","stem":"透過雲端平台來達到數位行銷，下列敘述何者錯誤？","opts":["數位通路比實體通路更容易追蹤與分析其軌跡","透過大數據的運算，可以取得客戶的偏好，提供量身訂做的服務","可以建立顧客側寫(Customer profiling)，進而瞭解客戶的需求及興趣，作出適當的推薦，執行精準行銷","可以透過租用公用雲(基礎設施即服務)增加客戶數量，進而提供潛在的客戶人數"],"ans":4,"exp":["📝 解析：(4)錯：租用公用雲的基礎設施（IaaS）只是增加運算、儲存資源，本身不會帶來客戶，也不能直接擴大潛在客戶人數；客戶增加靠的是數據分析與行銷應用。(1)數位通路的行為軌跡比實體通路容易記錄；(2)大數據可推知偏好、提供客製服務；(3)顧客側寫可做精準推薦，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.35,"w":1,"sw":0.01201,"id":"4科技力-21"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"4-36","stem":"組織欲防範自身的APP 容易成為惡意人士利用之工具，建議在開發Mobile App 時，可參考下列何種基準與規範？","opts":["敏捷式APP 開發委外風險查核基準","行動應用APP 基本資安檢測基準","APP 使用者介面經驗檢測基準","APP 資料安全滲透測試查核基準"],"ans":2,"exp":["📝 解析：經濟部工業局（現由數位發展部數位產業署接續維護）訂有「行動應用 App 基本資安檢測基準」，規範 App 在發布、安裝、執行、資料保護、身分認證與通訊安全等面向的檢測項目，開發 Mobile App 時可據以防範被惡意利用，故選(2)。其他三個選項並非實際存在的官方基準名稱。"],"pos":0.6,"w":1,"sw":0.01201,"id":"4科技力-36"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"4-38","stem":"下列情境何者可歸類為社群安全風險？","opts":["銀行透過FB 聆聽使用者需求及調查滿意度","駭客透過網路釣魚方式獲取個資後偽冒交易","保險業者透過行動APP 宣傳最新旅平險活動","詐騙集團透過ATM 遠端誘使民眾匯款"],"ans":2,"exp":["📝 解析：社群安全風險是指利用網路、社群與社交工程手法造成的資安風險，駭客以網路釣魚騙取個資後冒用交易屬之，故選(2)。(1)以 FB 聆聽需求、(3)用 App 宣傳保險活動是正常的社群經營與行銷；(4)以 ATM 誘騙匯款是傳統電話詐騙手法，不屬社群安全風險。"],"pos":0.6333,"w":1,"sw":0.01201,"id":"4科技力-38"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"4-48","stem":"有關雲端運算的多租戶模式(Multi-tenant model)，下列敘述何者正確？","opts":["是一種商業計價模式，將雲伺服器的計算資源同時分租給多個用戶","是一種軟體技術架構，由一個監控軟體管理多台虛擬機器","是一種商業計價模式，根據虛擬機器的開機時間與網路頻寬使用量按用戶別計算費用","是一種軟體架構技術，讓多用戶可以共用相同的系統或程式元件，但各用戶的資料是彼此隔離的"],"ans":4,"exp":["📝 解析：多租戶模式（Multi-tenant）是一種軟體架構技術：同一套系統或程式元件同時服務多個用戶（租戶），資源共用以降低成本，但各租戶的資料邏輯上彼此隔離、互不可見，故選(4)。它不是計價模式（(1)(3)錯）；(2)由監控軟體管理多台虛擬機器是虛擬化的 Hypervisor 概念。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.8,"w":1,"sw":0.01201,"id":"4科技力-48"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"4-49","stem":"下列何者並非雲端運算所可能帶來的好處？","opts":["不再需要購置與維護伺服器","不再需要購置、安裝、升級軟體","不再需要向 ISP 租賃網路頻寬","可根據電腦資源的使用量來計算費用"],"ans":3,"exp":["📝 解析：雲端運算的服務是透過網路存取的，企業不但仍需向 ISP 租用網路頻寬，對頻寬與穩定度的需求反而更高，故(3)不是雲端帶來的好處。(1)不必自購維護伺服器（IaaS）、(2)不必自購安裝升級軟體（SaaS）、(4)依資源使用量計費（隨需付費），都是雲端的好處。"],"pos":0.8167,"w":1,"sw":0.01201,"id":"4科技力-49"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"3-16","stem":"有關生物辨識技術的敘述，下列何者錯誤？","opts":["虹膜辨識是透過紅外線攝影機，根據眼球瞳孔與眼白中間的虹膜紋路特徵，作為辨識依據。優點是錯誤率低，缺點是虹膜紋路特徵易隨年齡增長而變化","聲紋辨識是使用客戶發音特徵和模式進行聲紋分析紀錄，優點是可進行遠距離身分辨識，缺點是容易受到外在環境影響","臉部辨識是偵測五官的位置並記錄其相對位置，優點是危險較低，大眾接受度較高，缺點是容易受到距離、角度、光線等影響","指紋辨識是自指紋圖像中取得特徵點組成指紋模組來進行辨識。優點是技術成熟，缺點是指紋易隨年紀增長而難以辨識"],"ans":1,"exp":["📝 解析：(1)錯：虹膜紋路在幼年成形後終身穩定、幾乎不隨年齡改變，這正是它錯誤率低的原因；其缺點是設備成本高、使用者接受度較低。(2)聲紋可遠距辨識但易受環境噪音影響；(3)臉部辨識接受度高但受距離、角度、光線影響；(4)指紋技術成熟但可能因年齡或磨損而難辨識，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2667,"w":1,"sw":0.01201,"id":"3科技力-16"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"3-17","stem":"在雲端運算技術中，服務的租用者可以隨時建立、執行、終止自己的虛擬伺服器，提供這種服務的稱為：","opts":["資料即服務","軟體即服務","平台即服務","基礎架構即服務"],"ans":4,"exp":["📝 解析：租用者可隨時自行建立、執行、終止自己的虛擬伺服器，取得的是運算、儲存、網路等底層資源，屬基礎架構即服務（IaaS，如 AWS EC2），故選(4)。PaaS 提供的是程式開發與執行平台；SaaS 提供現成軟體；DaaS 提供資料服務。"],"pos":0.2833,"w":1,"sw":0.01201,"id":"3科技力-17"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"3-18","stem":"下列何者不是雲端計算的特色之一？","opts":["資源虛擬化及共享","各種雲端服務可以免費使用","資源容易擴充與隨需應變","可以依需求量提供資源"],"ans":2,"exp":["📝 解析：雲端運算多採依使用量付費（隨需付費），並非各種服務都免費，故(2)不是其特色。(1)資源虛擬化與共享、(3)資源容易擴充、隨需應變、(4)依需求量彈性提供資源，皆為雲端運算特色。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3,"w":1,"sw":0.01201,"id":"3科技力-18"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"3-19","stem":"什麼樣的技術可以在同一台實體機器上作邏輯層的切割供多個應用系統使用，可以有效降低硬體的投資成本？","opts":["虛擬化技術","個別化技術","資源匯集技術","自動化技術"],"ans":1,"exp":["📝 解析：虛擬化技術可在同一台實體伺服器上切割出多個邏輯上獨立的虛擬機器，分別執行不同應用系統，提高硬體使用率、降低硬體投資成本，也是雲端運算的基礎技術，故選(1)。"],"pos":0.3167,"w":1,"sw":0.01201,"id":"3科技力-19"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"3-20","stem":"依照美國國家標準局與技術研究院(NIST)對雲端服務模式的分類， IaaS 不包含下列哪項服務？","opts":["處理能力","系統監控","儲存空間","網路元件"],"ans":2,"exp":["📝 解析：依 NIST 定義，IaaS 是提供處理能力（運算）、儲存空間、網路元件及其他基礎運算資源，讓用戶部署自己的作業系統與應用程式。系統監控屬管理工具或平台層服務，不在 NIST 對 IaaS 所列的基礎資源中，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3333,"w":1,"sw":0.01201,"id":"3科技力-20"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"3-21","stem":"有關混合雲的敘述，下列何者錯誤？","opts":["公用雲及私有雲各自運作，彼此隔絕，防止網路入侵","公用雲一般處理非機敏資料應用","私有雲一般處理客戶機敏資料相關的應用","依IDC 2015 年12 月發表的調查報告「2016 年台灣ICT 市場十大趨勢預測」，過半企業均認為混合雲為最適雲架構"],"ans":1,"exp":["📝 解析：(1)錯：混合雲是把公用雲與私有雲「整合串連」，讓資料與應用可依需要在兩者之間移動或擴充，而不是各自運作、彼此隔絕。(2)公用雲多處理非機敏資料；(3)私有雲處理客戶機敏資料；(4)IDC 2015 年調查顯示過半企業認為混合雲為最適架構，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.35,"w":1,"sw":0.01201,"id":"3科技力-21"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"3-28","stem":"下列何者為金融機構的多因子生物辨識(Multi-Factors Biometrics)技術？","opts":["指紋辨識結合密碼","聲音辨識結合密碼","指靜脈辨識結合密碼","指靜脈辨識結合臉型辨識"],"ans":4,"exp":["📝 解析：多因子生物辨識是指同時結合兩種以上的「生物特徵」來驗證身分，例如指靜脈辨識結合臉型辨識，故選(4)。(1)(2)(3)都是一種生物特徵加上密碼（知識因子），屬多因子認證，但其中只有一種生物辨識，不是多因子生物辨識。"],"pos":0.4667,"w":1,"sw":0.01201,"id":"3科技力-28"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"3-37","stem":"有關個人資料或隱私外洩事件敘述，下列何者錯誤？","opts":["外洩事件的發生原因，可分為人為疏失與駭客攻擊兩種","駭客攻擊過程通常只經過研究安全弱點、網路或社交攻擊，到資料外傳等三個階段","金融消費評議中心是以第三方公正的角色，協助解決金融紛爭，但對象不包括專業投資機構與符合一定財力或專業能力之自然人或法人","我國的個資法要求，一般個人資料的蒐集、處理及利用，已由當事人「書面同意」修改為「同意」即可"],"ans":2,"exp":["📝 解析：(2)錯：駭客攻擊（尤其進階持續性威脅 APT）通常歷經偵察研究弱點、初始入侵（網路或社交工程攻擊）、建立據點、權限提升、橫向移動、最後資料外傳等多個階段，不只三個階段。(1)外洩原因可分人為疏失與駭客攻擊；(3)依金融消費者保護法，專業投資機構與符合一定財力或專業能力之自然人或法人不屬受保護的金融消費者；(4)個資法 2015 年修正後，一般個資的蒐集、處理及利用由「書面同意」放寬為「同意」，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6167,"w":1,"sw":0.01201,"id":"3科技力-37"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"3-48","stem":"雲端運算的隱私安全問題上，資訊安全經常是雲端運算最重要的議題，而資訊安全有三要素(通常簡稱CIA Triad)，下列何者不是三者之一？","opts":["可重製性","機密性","完整性","可用性"],"ans":1,"exp":["📝 解析：資訊安全三要素 CIA Triad 為機密性（Confidentiality）、完整性（Integrity）、可用性（Availability）。可重製性不在其中，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8,"w":1,"sw":0.01201,"id":"3科技力-48"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"2-18","stem":"下列何者不是基本的資訊安全要素？","opts":["機密性(Confidentiality)","完整性(Integrity)","可用性(Availability)","一致性(Consensus)"],"ans":4,"exp":["📝 解析：資訊安全三要素為 CIA：機密性(Confidentiality)、完整性(Integrity)、可用性(Availability)。「共識(Consensus)」是區塊鏈節點對帳本達成一致的機制，不屬於資安基本要素，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3,"w":1,"sw":0.01201,"id":"2科技力-18"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"2-19","stem":"依IDC 2015 年12 月發表的調查報告「2016 年台灣ICT 市場十大趨勢預測」，混合雲的主流佈署模式不包含下列何者？","opts":["因應外部公用雲介接的應用發展模式","因應跨國企業快速佈署的擴散模式","因應企業內部基礎架構發展的開發模式","因應供應鏈業者資料分享與交換的資料管道模式"],"ans":3,"exp":["📝 解析：IDC「2016 年台灣 ICT 市場十大趨勢預測」指出混合雲三種主流佈署模式：因應外部公用雲介接的應用發展模式、因應跨國企業快速佈署的擴散模式、因應供應鏈業者資料分享與交換的資料管道模式。「因應企業內部基礎架構發展的開發模式」不在其中，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3167,"w":1,"sw":0.01201,"id":"2科技力-19"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"2-20","stem":"雲端運算技術最早是由下列何者所提出的一種軟體技術，提供電子商務服務平台？","opts":["亞馬遜","谷歌","臉書","蘋果"],"ans":1,"exp":["📝 解析：依教材，雲端運算服務最早由電子商務業者亞馬遜(Amazon)把內部基礎架構對外提供而成形（2006 年推出 AWS 的 S3、EC2），作為電子商務服務平台，故選(1)。補充：「cloud computing」一詞是 2006 年 Google 執行長 Eric Schmidt 公開使用後普及，但題目強調「提供電子商務服務平台」，答案為亞馬遜。","⚠ 官方答案有疑義（考試以官方答案為準）：用語提出多歸Google；Amazon為最早大規模商用。考試若仍採官方答案請留意題意歧義"],"pos":0.3333,"w":1,"sw":0.01201,"id":"2科技力-20"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"2-21","stem":"在平台即服務中，下列何者為消費者能掌控的？","opts":["作業系統","運作應用程式的環境","硬體","網路基礎架構"],"ans":2,"exp":["📝 解析：依 NIST SP 800-145，平台即服務(PaaS)中消費者可掌控自己部署的應用程式及其運作環境（應用程式託管環境的設定），故選(2)。作業系統、硬體（伺服器、儲存）與網路基礎架構都由雲端服務商管理，消費者無法掌控。"],"pos":0.35,"w":1,"sw":0.01201,"id":"2科技力-21"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"2-22","stem":"除了常見的三種佈署模型，美國國家標準局與技術研究院(NIST)還定義了下列何種雲？是由擁有相近利益、關注相同議題、或是屬於相同產業的企業組織而組成的。","opts":["利益雲","議題雲","社群雲","產業雲"],"ans":3,"exp":["📝 解析：NIST 定義四種雲端佈署模型：私有雲、公用雲、混合雲，以及由具共同關注（任務、安全需求、政策、法遵考量）的組織共享的「社群雲」(Community Cloud)，故選(3)。利益雲、議題雲、產業雲都不是 NIST 的正式分類。"],"pos":0.3667,"w":1,"sw":0.01201,"id":"2科技力-22"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"2-35","stem":"某金控公司資訊長正考慮導入金融科技資訊安全整體解決方案，其中範圍包括了臉部辨識的VTM、行動APP、雲服務與風險數據分析，資訊長應考量下述哪些風險？ 1.身分識別與生物辨識安全；2.雲端與隱私安全管理；3.數位貨幣安全；4. Mobile APP 安全；5.敏捷式開發；6. Web 應用系統安全","opts":["僅1，2，4","僅1，2，4，6","僅1，2，3，4，5","僅1，2，4，5，6"],"ans":4,"exp":["📝 解析：此方案範圍為臉部辨識 VTM、行動 APP、雲服務與風險數據分析，對應風險為：身分識別與生物辨識安全(1)、雲端與隱私安全管理(2)、Mobile APP 安全(4)、敏捷式開發（快速迭代下的安全開發流程）(5)、Web 應用系統安全(6)。方案並未涉及數位貨幣，(3)不在考量範圍，故選(4)僅1,2,4,5,6。"],"pos":0.5833,"w":1,"sw":0.01201,"id":"2科技力-35"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"2-36","stem":"請選出以下描述科技風險的正確選項：1.比特幣目前已是台灣主管機關認可的合法交易貨幣；2.非面對面進行的客戶身分識別方式包括了聲紋、虹膜、指紋、人臉等；3.雲端與隱私安全管理可參考ISO 27107 等標準；4.台灣金管會提議研擬「非銀行支付機構網路支付業務管理辦法」；5.區塊鏈技術可廣泛運用於機器學習","opts":["1，2，3，4，5","僅2，3，4，5","僅2，3，4","僅2，3"],"ans":4,"exp":["📝 解析：正確的只有2、3：非面對面身分識別可用聲紋、虹膜、指紋、人臉等生物特徵；雲端與隱私安全管理可參考 ISO 國際標準（題目「ISO 27107」應為雲端資安 ISO/IEC 27017 或雲端個資 ISO/IEC 27018 的筆誤），故選(4)。1 錯：比特幣在台灣不是法定貨幣，央行與金管會視為虛擬商品；4 錯：「非銀行支付機構網路支付業務管理辦法」是中國人民銀行的規定，台灣為電子支付機構管理條例；5 錯：區塊鏈是分散式帳本技術，並非廣泛運用於機器學習。","⚠ 官方答案有疑義（考試以官方答案為準）：雲端資安常見為ISO/IEC 27017／27018，未見通行之ISO 27107；官方仍以(4)僅2、3為準","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.6,"w":1,"sw":0.01201,"id":"2科技力-36"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"2-38","stem":"數位時代下，個資保護由於易忽略許多小細節，為與國際接軌，因此在資料蒐集系統上應以最大限度保護，所以下列何者為業務推廣的優先基礎工作？","opts":["研究安全弱點","進行社交攻擊演練","進行隱私衝擊評估","進行測試攻擊演練"],"ans":3,"exp":["📝 解析：在新業務、新系統上線前先做隱私衝擊評估(PIA, Privacy Impact Assessment)，評估個資蒐集、處理、利用的風險並先設計保護措施（Privacy by Design；歐盟 GDPR 第35條亦要求高風險處理須做資料保護影響評估 DPIA），是業務推廣的優先基礎工作，故選(3)。研究安全弱點、社交工程演練、攻擊測試屬資安檢測，不是業務推廣前的個資保護基礎。"],"pos":0.6333,"w":1,"sw":0.01201,"id":"2科技力-38"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"2-49","stem":"以資訊長(CIO)角度而言，下列何種雲端運算之需求與效益最明確？","opts":["內部知識雲","測試中心雲","基礎架構雲","外部社群雲"],"ans":2,"exp":["📝 解析：從資訊長角度，建置「測試中心雲」可讓開發測試環境隨需建立、用完即釋放，大幅縮短環境準備時間並節省硬體成本，需求與效益最明確，故選(2)。內部知識雲、外部社群雲效益較難量化；基礎架構雲牽涉面廣、導入較複雜。"],"pos":0.8167,"w":1,"sw":0.01201,"id":"2科技力-49"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"2-53","stem":"下列何種生物辨識結構複雜不易改變，最不易被複製或取得，且辨識精確度極高？","opts":["指紋辨識","人臉辨識","虹膜辨識","聲音辨識"],"ans":3,"exp":["📝 解析：虹膜紋路在幼兒期即穩定、終生不易改變，結構複雜且位於眼球內不易被複製或取得，辨識準確率在常見生物辨識中最高，故選(3)。指紋易被殘留複製；人臉易受化妝、角度影響；聲音易受健康與環境影響或被錄音模仿。"],"pos":0.8833,"w":1,"sw":0.01201,"id":"2科技力-53"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"2-57","stem":"在對於匿名客戶身分的識別上，一般以雙因子認證，來強化身分驗證技術，也就是以三種主要方式取兩種來驗證，這三種方式包括了客戶與銀行約定的資訊，客戶所持有的設備以及下列何者？","opts":["客戶的生物特徵","客戶的社交資訊","客戶的信用資訊","客戶的交易資訊"],"ans":1,"exp":["📝 解析：身分驗證三因子為：所知（客戶與銀行約定的密碼等資訊）、所持（手機、晶片卡、OTP 載具等設備）、所具（指紋、臉部、虹膜等生物特徵）；雙因子認證是取其中兩種不同類別，故選(1)。社交、信用、交易資訊都不是身分驗證因子。"],"pos":0.95,"w":1,"sw":0.01201,"id":"2科技力-57"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"1-10","stem":"生物辨識技術在身分確認上帶給數位金融很大的便利，下列敘述何者不是主要特色？","opts":["指紋辨識是自指紋圖像中取得特徵點，組成指紋模組來辨識","靜脈辨識為透過靜脈血管流動時的跳動律感，建立辨識模組","聲紋辨識是使用客戶發音的特徵和模式，進行聲紋分析記錄辨識","虹膜辨識為透過紅外線攝影機，根據微血管的分佈變化做為依據"],"ans":2,"exp":["📝 解析：靜脈辨識是以近紅外線照射手指或手掌，利用血紅素吸收紅外線所呈現的靜脈分布影像建立模組，而不是靠血管流動的跳動律感，故(2)錯誤、為官方答案。(1)指紋取特徵點、(3)聲紋分析發音特徵與模式，敘述正確。⚠ 疑義：(4)「根據微血管分佈」其實是視網膜辨識的原理，虹膜辨識是依虹膜紋理（斑點、皺褶、溝紋）辨識，嚴格說(4)也有誤；考試仍照官方答案(2)。","⚠ 官方答案有疑義（考試以官方答案為準）：虹膜辨識依虹膜紋理特徵；依眼底微血管分佈者為視網膜辨識。官方僅給(2)，考試仍以官方為準。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1667,"w":1,"sw":0.01201,"id":"1科技力-10"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"1-19","stem":"混合雲架構最受企業歡迎的原因為何？","opts":["成本最低廉","安全等級最高","實施架構最單純","可支持不同的應用程式業務需求"],"ans":4,"exp":["📝 解析：混合雲結合私有雲（放核心敏感系統）與公用雲（放彈性需求、對外服務），企業可依不同應用程式與業務需求選擇放置位置，兼顧安全與彈性，因此最受歡迎，選(4)。混合雲並非成本最低（公用雲較低）、安全等級最高（私有雲較高）或架構最單純（混合雲反而最複雜）。"],"pos":0.3167,"w":1,"sw":0.01201,"id":"1科技力-19"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"1-20","stem":"依IDC 2015 年12 月發表的調查報告「2016 年台灣ICT 市場十大趨勢預測」，台灣雲端運算部署現況，下列敘述何者正確？","opts":["有一半以上的企業都還沒進行雲部署","公用雲成本低廉，管理簡便，最受青睞","混合雲架構複雜，不受歡迎","公用雲服務中，IaaS 目前佔比最高"],"ans":4,"exp":["📝 解析：依 IDC 該報告，台灣企業採用的公用雲服務中以 IaaS（基礎架構即服務）占比最高，故(4)正確。報告認為兼顧安全與彈性的混合雲是企業主流趨勢，(2)「公用雲最受青睞」、(3)「混合雲不受歡迎」與報告相反；(1)也不符報告所描述的部署現況。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.3333,"w":1,"sw":0.01201,"id":"1科技力-20"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"1-21","stem":"根據2015 年11 月IBM 出版了全球高階主管調查報告，高階主管眼中的雲端運算，下列敘述何者正確？","opts":["科技業者的流行名詞，技術還未成熟","對法規嚴謹的金融業者，私有雲適用性不高","能減少資本支出與營運成本","是雲端服務業者針對中小企業或新創公司推出的新業務模式，與大型企業傳統應用無關"],"ans":3,"exp":["📝 解析：IBM 2015 年高階主管調查指出，雲端運算已是成熟的企業策略工具，能把資本支出轉為營運支出、降低 IT 成本並加速創新，故(3)正確。(1)錯：技術已成熟，不只是流行名詞；(2)錯：法規嚴謹的金融業反而適合私有雲／混合雲；(4)錯：大型企業亦廣泛採用，並非只適用中小企業。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.35,"w":1,"sw":0.01201,"id":"1科技力-21"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"1-27","stem":"有關生物特徵辨識在金融領域的應用，下列敘述何者適當？","opts":["生物特徵辨識在金融領域的應用主要是在確定人與人之間的關係，以便建立社群網絡","由於生物特徵具有唯一性，所以金融機構可以利用生物特徵作為唯一登入系統的依據","語音客服中，客服人員必須一再提出問題確認客戶的身分，往往引起客戶的不耐煩；利用聲紋辨識可以唯一確定對方身分，不必再提問，即可進行服務，可以提升客戶滿意度","客戶臨櫃交易時，透過分行攝影機，使用臉部辨識技術，可以及早認出VIP 客戶，準備個別化服務資料"],"ans":4,"exp":["📝 解析：在分行以攝影機結合臉部辨識，及早辨認 VIP 客戶並準備個別化服務，是適當的應用，故選(4)。(1)錯：生物辨識主要用於身分驗證，不是建立人際社群網絡；(2)(3)錯：生物特徵仍可能被偽冒或誤判，宜搭配其他因子做多因子驗證，不宜作為「唯一」登入或確認身分的依據。"],"pos":0.45,"w":1,"sw":0.01201,"id":"1科技力-27"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"1-36","stem":"在數位金融目前實務上常採取第一階段輸入用戶密碼，第二階段由業者透過行動APP 傳送驗證碼至用戶的手機，客戶再回傳完成身分驗證。請問通常這樣的認證稱為何種認證？","opts":["KYC 認證","P2P 認證","敏感度認證","雙因子認證"],"ans":4,"exp":["📝 解析：先輸入密碼（所知），再以手機接收驗證碼並回傳（所持裝置），結合兩種不同類別的驗證因子，稱為雙因子認證(2FA)，故選(4)。KYC 是認識客戶程序、P2P 是點對點，「敏感度認證」並非正式名詞。"],"pos":0.6,"w":1,"sw":0.01201,"id":"1科技力-36"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"1-40","stem":"數位金融服務下，我們對於消費者資料保護的重點是：","opts":["確保有效利用客戶的資料進行分析並強化服務推廣","跨業整合時對於資料傳輸的控管","使用者的資料在利用目的外的使用，必須要強化資料安全防護","使用者良好體驗為最終目標第二部分：第41~60 題(每題2 分)"],"ans":2,"exp":["📝 解析：數位金融服務常需跨業整合（與電商、電信、第三方合作），資料在不同機構間傳輸時最易外洩，因此跨業整合時對資料傳輸的控管是消費者資料保護的重點，故選(2)。(1)(4)著重資料利用與體驗而非保護；(3)錯在個資的特定目的外利用須符合個資法 §20 等法定要件（如經當事人同意），不是強化資安就可以使用。"],"pos":0.6667,"w":1,"sw":0.01201,"id":"1科技力-40"},{"s":"all","ch":"科技力 5｜雲端運算、資安與個資保護","star":0,"n":1,"refs":"1-49","stem":"在基礎架構即服務中，下列何者不是消費者能掌控的？","opts":["作業系統","儲存空間","雲端基礎架構","已部署的應用程式"],"ans":3,"exp":["📝 解析：依 NIST SP 800-145，基礎架構即服務(IaaS)中消費者可掌控作業系統、儲存空間與已部署的應用程式（部分網路元件如主機防火牆可有限控制），但底層雲端基礎架構（實體伺服器、網路、虛擬化層）由服務商管理，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8167,"w":1,"sw":0.01201,"id":"1科技力-49"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"21-24","stem":"下列何者屬於「公開數據」？","opts":["客戶電話","客戶地址","銀行ATM 據點","客戶交易明細"],"ans":3,"exp":["📝 解析：公開數據是不涉及個資、可公開提供的資訊，例如 ATM 與分行據點、匯率、利率、產品資訊；我國開放銀行第一階段即開放這類公開資料查詢。客戶電話、地址、交易明細都屬個人資料，受個資法保護，不得任意公開。"],"pos":0.4,"w":1,"sw":0.00276,"id":"21科技力-24"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"21-25","stem":"下列哪些是純網銀可在線上完成的交易？ A.貸款 B.信用卡 C.保險 D.外匯 E.理財","opts":["僅BCDE","僅BCD","僅BDE","ABCDE"],"ans":4,"exp":["📝 解析：純網路銀行無實體分行，所有業務皆透過網路與行動 App 辦理，存款、貸款、信用卡、外匯、理財、代銷保險等均可在線上完成，故選 ABCDE。"],"pos":0.4167,"w":1,"sw":0.00276,"id":"21科技力-25"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"21-53","stem":"開放銀行在理想上，對客戶、對金融科技公司、對金融業都是有益的，有關開放銀行的益處敘述，下列何者錯誤？","opts":["不必處理多個帳戶即可讓財務狀況整合，為開放銀行對客戶的好處","數據做有效的利用，為開放銀行對金融科技公司的好處","一切虛擬服務，不必實際持有用戶存款，為開放銀行對金融科技的好處","無需取得個人同意，即可更無縫切換金融服務，為開放銀行對客戶的好處"],"ans":4,"exp":["📝 解析：開放銀行必須在客戶「同意授權」後，才能把其資料分享給第三方，客戶同意是核心原則，「無需取得個人同意」違反開放銀行與個資保護原則，故(4)錯。其他：客戶可整合多帳戶財務狀況、金融科技公司可有效利用數據且不必實際持有存款，皆為正確益處。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8833,"w":1,"sw":0.00276,"id":"21科技力-53"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"20-24","stem":"有關各國純網路銀行發展狀況，下列敘述何者正確？","opts":["我國於2019 年7 月開放設立三家純網路銀行","歐美國家純網路銀行業者，強調提供完整生態圈模式","亞洲國家純網路銀行業者，強調手續費優惠、提升客戶體驗","日本純網路銀行主要透過實體分行及網路提供服務"],"ans":1,"exp":["📝 解析：金管會於2019年7月30日核准三家純網銀設立（樂天國際、將來、連線銀行 LINE Bank），故(1)正確。(2)(3)說反了：亞洲純網銀（如中國、韓國）多由科技集團主導，強調完整生態圈；歐美純網銀較強調手續費優惠與客戶體驗。(4)日本純網銀主要透過網路並結合合作夥伴通路，不靠實體分行。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.4,"w":1,"sw":0.00307,"id":"20科技力-24"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"20-25","stem":"下列何者指的是一個可公開取得的應用程式介面，提供開發人員透過程式化存取一個專有的軟體應用程式？","opts":["Blockchain","Digital currency","Open API","RPA"],"ans":3,"exp":["📝 解析：Open API（開放應用程式介面）是可公開取得的應用程式介面，讓外部開發者以程式化方式存取專有軟體或服務的功能與資料，開放銀行即以此串接第三方服務。Blockchain 是分散式帳本，Digital currency 是數位貨幣，RPA 是流程自動化。"],"pos":0.4167,"w":1,"sw":0.00307,"id":"20科技力-25"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"20-27","stem":"金融科技對銀行催生了四項特性，下列何者錯誤？","opts":["網路帳戶虛擬化","客戶識別遠端化","資金流轉即時化","交易線下化"],"ans":4,"exp":["📝 解析：金融科技對銀行催生的四項特性為：網路帳戶虛擬化、客戶識別遠端化、資金流轉即時化、交易「線上化」。(4)寫成「交易線下化」錯誤，金融科技是把交易從臨櫃移到線上。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.45,"w":1,"sw":0.00307,"id":"20科技力-27"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"20-53","stem":"銀行戰略，係屬下列何種金融數據類型？","opts":["聚合數據","商業敏感數據","客戶增值數據","公開數據"],"ans":2,"exp":["📝 解析：銀行數據依開放程度分類：公開數據（如分行位置、產品資訊）、聚合數據（統計彙總）、客戶增值數據、商業敏感數據等。銀行戰略、內部定價與分析模型屬於不宜對外分享的「商業敏感數據」，故選(2)。"],"pos":0.8833,"w":1,"sw":0.00307,"id":"20科技力-53"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"19-33","stem":"依據我國行政院 2019 年「智慧政府行動方案」，金管會與國發會共同推動「數位服務個人化」應用於金融領域，則此一平臺名稱為何？","opts":["MyData 平臺","OurData 平臺","YourData 平臺","DigitalData 平臺"],"ans":1,"exp":["📝 解析：行政院2019年「智慧政府行動方案」推動「數位服務個人化（MyData）」，由國發會建置MyData平臺，民眾經身分驗證後可下載或授權傳送個人資料給服務機構；金管會將其應用於金融領域（如線上申辦貸款、開戶免附紙本），故選(1)。"],"pos":0.55,"w":1,"sw":0.02901,"id":"19科技力-33"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"19-43","stem":"有關開放銀行(Open Banking)敘述，下列何者錯誤？","opts":["可讓消費者及其他第三方服務商，能與銀行在安全監理規範下共享數據","英國於2015 年開始進行開放銀行的標準規範及建立","台灣尚未推動開放銀行","金融資安是資料共享的挑戰之一"],"ans":3,"exp":["📝 解析：金管會於2019年宣布以「自願參與、循序漸進」方式推動開放銀行，分三階段：公開資料查詢、消費者資訊查詢、交易面資訊，第一階段已於2019年10月上線，故(3)「台灣尚未推動」錯誤。(1)數據共享概念、(2)英國2015年開始制定標準、(4)資安是共享挑戰，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7167,"w":1,"sw":0.02901,"id":"19科技力-43"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"19-53","stem":"有關純網路銀行國際發展狀況，下列敘述何者正確？ A.我國目前開放設立三家純網路銀行 B. 2017 年全球50 大純網路銀行中有1/3 以日本為根據地 C.中國大陸的純網路銀行於2017 年居全球50 大純網路銀行的前二名 D.與亞洲國家相比，歐美國家主要由電子商務、通訊軟體公司設立或合資","opts":["僅AB","僅AC","僅BD","僅ACD"],"ans":2,"exp":["📝 解析：A正確：金管會2019年核准三家純網銀（LINE Bank、將來銀行、樂天國際商銀）。C正確：2017年全球50大純網銀中，中國大陸的微眾銀行與網商銀行居前兩名。B錯誤：依教材，日本並未佔1/3。D錯誤：亞洲純網銀多由電商、通訊軟體業者設立或合資，歐美則多由傳統金融機構設立，題述剛好相反。故選僅AC(2)。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.8833,"w":1,"sw":0.02901,"id":"19科技力-53"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"18-24","stem":"有關純網銀的敘述，下列何者錯誤？","opts":["世界第一家純網銀是Fidor Bank","歐洲首家純網銀成立於英國","亞洲純網銀日本起步最早","截至2015 年，最多純網銀的國家是美國"],"ans":1,"exp":["📝 解析：世界第一家純網路銀行是1995年在美國成立的Security First Network Bank（SFNB），德國Fidor Bank於2009年成立，並非第一家，故(1)錯誤。依教材，歐洲首家純網銀成立於英國、亞洲以日本起步最早（2000年後陸續成立）、截至2015年美國純網銀家數最多，均為正確敘述。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4,"w":1,"sw":0.02901,"id":"18科技力-24"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"18-53","stem":"面對純網銀的競爭，傳統銀行因應策略之敘述，下列何者錯誤？","opts":["增加網路銀行服務","增加實體分行據點與服務人員，以提高服務品質","輔導員工轉型","加速與資訊科技業合作"],"ans":2,"exp":["📝 解析：面對純網銀競爭，傳統銀行應加強網路銀行服務、輔導員工數位轉型、加速與資訊科技業合作。增加實體分行與人力會提高成本，與數位化方向相反，故(2)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8833,"w":1,"sw":0.02901,"id":"18科技力-53"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"17-1","stem":"目前金管會對開放銀行之作法及態度，下列何者錯誤？","opts":["暫採尊重市場機制與發展","鼓勵金融業以自願自律方式推動","強制規定銀行與第三方服務提供者合作的自律規範","請財金資訊公司研擬應用程式介面(API)技術標準及資安標準"],"ans":3,"exp":["📝 解析：金管會對開放銀行採「尊重市場機制、鼓勵自願自律」方式推動，請財金資訊公司研擬API技術與資安標準，並由銀行公會訂定自律規範供業者遵循。合作規範並非由主管機關「強制」規定，故(3)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0167,"w":1,"sw":0.01201,"id":"17科技力-01"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"16-13","stem":"下列敘述何者非屬Bank3.0 數位金融環境下，身分識別更形重要的原因？","opts":["銀行不再是一個地方，而是一種行為","適合取代臨櫃人員面對面查核身分","可以靠生物辨識在各種合適的交易環境下完成身分識別","Bank3.0 下未來各產業的身分識別機制都能提供金融服務"],"ans":4,"exp":["📝 解析：Bank 3.0（Brett King）主張「銀行不再是一個地方，而是一種行為」，金融服務轉向行動與網路通路，因此需要以生物辨識等方式取代臨櫃面對面查核、在各種交易環境中完成身分識別，(1)(2)(3)都是身分識別更重要的原因。(4)「未來各產業的身分識別機制都能提供金融服務」是延伸推論，並非身分識別重要性的原因，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2167,"w":1,"sw":0.01201,"id":"16科技力-13"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"16-31","stem":"金融API 提供金融相關資料交換的標準，包含哪些？ A.借貸內容 B.投資組合 C.消費模式 D.商業模式 E.風險偏好程度","opts":["僅ACE","僅ABCD","僅ABCE","ABCDE"],"ans":3,"exp":["📝 解析：金融API（如開放銀行API）提供的金融資料交換標準，涵蓋借貸內容、投資組合、消費模式與風險偏好程度等與客戶金融行為相關的資料，故A、B、C、E屬之，選(3)。D「商業模式」是企業的經營策略，不是API交換的金融資料欄位。"],"pos":0.5167,"w":1,"sw":0.01201,"id":"16科技力-31"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"16-36","stem":"有關Open API 的好處之敘述，下列何者錯誤？","opts":["增加服務的可及性","較無資安風險","加速產品開發","節省時間成本"],"ans":2,"exp":["📝 解析：Open API讓外部開發者能串接服務，可增加服務可及性、加速產品開發、節省時間與成本。但對外開放介面等於擴大攻擊面，存在資料外洩、未授權存取等資安風險，必須搭配身分驗證、加密與存取控管，故(2)「較無資安風險」錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6,"w":1,"sw":0.01201,"id":"16科技力-36"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"16-37","stem":"銀行進行數位轉型，運用數位科技與外部合作夥伴合作的模式，下列何者錯誤？","opts":["銀行可以運用API 技術，與外部合作夥伴進行資料交換","銀行與外部合作夥伴，在客戶同意的前提下，可以互相交換客戶資訊","銀行應該以開放的心態，與外部合作夥伴建立新的業務模式","銀行與外部合作夥伴建立合作關係，應該只採用開放銀行所訂定的資料交換格式"],"ans":4,"exp":["📝 解析：銀行數位轉型可運用API與外部夥伴交換資料、在客戶同意下共享資訊、以開放心態建立新業務模式，(1)(2)(3)正確。(4)錯誤：合作方式與資料格式應視業務需求彈性選擇（如專屬API、合作契約、其他產業標準），不必「只採用」開放銀行訂定的資料交換格式。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6167,"w":1,"sw":0.01201,"id":"16科技力-37"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"16-39","stem":"於1995 年設立於美國亞特蘭大市，全球第一家「純網路銀行」亦即無任何分行的銀行為下列何者？","opts":["CheBanca!","WellsFargo","Mediobanca","SFNB"],"ans":4,"exp":["📝 解析：全球第一家純網路銀行是1995年10月在美國亞特蘭大成立的安全第一網路銀行（Security First Network Bank, SFNB），沒有任何實體分行，選(4)。CheBanca!是義大利Mediobanca集團於2008年成立的數位銀行；Wells Fargo是傳統大型銀行。"],"pos":0.65,"w":1,"sw":0.01201,"id":"16科技力-39"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"15-30","stem":"有關API 的敘述，下列何者錯誤？","opts":["開放應用程式介面(Open API)係指一個可公開取得的應用程式介面","開放銀行要做到資料共享，API 這項成熟的技術扮演了關鍵角色","開放應用程式介面(Open API)係提供內部開發人員使用","API 分為Open API 和私密API"],"ans":3,"exp":["📝 解析：開放應用程式介面（Open API）是可公開取得、提供給「外部」第三方開發人員使用的介面，讓外部業者串接服務，是開放銀行資料共享的關鍵技術，故(3)「提供內部開發人員使用」錯誤（那是私密／內部API）。(1)(2)(4)正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5,"w":1,"sw":0.01201,"id":"15科技力-30"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"15-31","stem":"開放銀行對傳統銀行帶來的挑戰，不包括下列何者？","opts":["詐騙、數位入侵等風險提高","銀行中介角色被弱化","客戶流失","客戶抱怨必然增加"],"ans":4,"exp":["📝 解析：開放銀行對傳統銀行的挑戰包括：資料開放後詐騙與數位入侵等資安風險提高、第三方服務業者直接接觸客戶使銀行中介角色被弱化、客戶可能流失到體驗更好的平台。「客戶抱怨必然增加」並無必然關係，不屬開放銀行帶來的主要挑戰，選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5167,"w":1,"sw":0.01201,"id":"15科技力-31"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"15-32","stem":"台灣若要推動開放銀行，必須兼顧的重點，不包括下列何項？","opts":["金融業的競爭","風險管理","消費者保護","適法性"],"ans":1,"exp":["📝 解析：我國推動開放銀行採「市場主導、主管機關鼓勵」三階段模式，必須兼顧的重點是風險管理（含資安）、消費者保護（客戶同意與個資）與適法性（個資法、銀行法保密義務）。促進金融業競爭是推動的效益與目的，而非「必須兼顧的重點」，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5333,"w":1,"sw":0.01201,"id":"15科技力-32"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"15-57","stem":"針對數位銀行CheBanca!總經理Roberto Ferrari 曾提出「純數位化銀行」應努力達到的三件事情，為下列何者？","opts":["信任、品牌、服務","監理、遵法、科技觀","監理科技、數位科技、量子科技","社會(顧客)、工會(員工)、董事會(股東)"],"ans":1,"exp":["📝 解析：義大利數位銀行CheBanca!（Mediobanca集團旗下）總經理Roberto Ferrari指出，純數位化銀行沒有實體分行可依靠，應努力建立「信任、品牌、服務」三件事，以爭取客戶信賴與忠誠，選(1)。其他選項並非其所提內容。"],"pos":0.95,"w":1,"sw":0.01201,"id":"15科技力-57"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"14-30","stem":"有關純網路銀行與傳統銀行的說明，下列敘述何者錯誤？","opts":["兩者皆有營業時間限制","前者風險內涵與後者或有所差異","面對前者，後者恐有面臨輔導員工轉型之挑戰","面對前者，後者恐有面臨客戶流失、收益下降之問題"],"ans":1,"exp":["📝 解析：純網路銀行透過網路與App提供服務，24小時全年無休，沒有營業時間限制；傳統銀行臨櫃才有營業時間，故(1)「兩者皆有營業時間限制」錯誤。(2)純網銀以數位通路與資安為主，風險內涵不同；(3)(4)傳統銀行面臨員工轉型、客戶流失與收益下降挑戰，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5,"w":1,"sw":0.01201,"id":"14科技力-30"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"14-37","stem":"金融機構與開放銀行之合作夥伴進行策略合作，主要的目的為何？","opts":["增加在現有通路交叉銷售自有金融商品的機會","能夠獲取以前從未接觸的客戶","能夠藉由分享任何客戶交易資料，獲取利益","能夠獲取傳統資料"],"ans":2,"exp":["📝 解析：開放銀行下，金融機構與第三方服務業者（電商、記帳App、生活平台）策略合作，主要目的是藉由合作夥伴的通路與場景，觸及過去從未接觸的新客群，選(2)。(1)只在既有通路交叉銷售並非開放合作的重點；(3)客戶資料須經客戶同意才可分享，不可「分享任何客戶交易資料」獲利；(4)傳統資料銀行本已擁有。"],"pos":0.6167,"w":1,"sw":0.01201,"id":"14科技力-37"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"14-40","stem":"根據我國金管會2020 年公布的《金融科技發展路徑圖》，下列何者國家是推動「開放銀行」的先驅？","opts":["新加坡","美國","英國","澳大利亞第二部分：第41~60 題(每題2 分)"],"ans":3,"exp":["📝 解析：英國是開放銀行的先驅：英國競爭與市場管理局（CMA）2016 年要求九大銀行建置標準化 Open API，2018 年 1 月正式上路，金管會 2020 年《金融科技發展路徑圖》亦以英國為推動先例。新加坡採市場自律、美國未強制推動、澳洲的消費者資料權（CDR）2020 年才上路，皆晚於英國。（選項4後方的「第二部分…」為原卷排版殘字，可忽略。）"],"pos":0.6667,"w":1,"sw":0.01201,"id":"14科技力-40"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"14-41","stem":"紐西蘭的奧克蘭儲蓄銀行推出在臉書的虛擬分行，讓客戶或是潛在客戶可以在臉書上選擇行員，以臉書為溝通工具進行詢問及討論，此乃下列何種金融科技之因應趨勢？","opts":["開放銀行","社群媒體","眾包","身分認證"],"ans":2,"exp":["📝 解析：奧克蘭儲蓄銀行（ASB）在臉書開設虛擬分行，讓客戶直接在社群平台上與行員互動，屬於「社群媒體」趨勢：金融機構把社群平台當成服務與行銷通路。開放銀行是以 API 分享資料、眾包是把工作外包給群眾、身分認證是驗證客戶身分技術，都不符合題意。"],"pos":0.6833,"w":1,"sw":0.01201,"id":"14科技力-41"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"14-54","stem":"開放銀行對傳統銀行帶來的挑戰，下列何者錯誤？","opts":["銀行部分客戶因為開放銀行而流失，銀行應如何保住現有客戶","銀行因為開放銀行而減少產品曝光","銀行敏感數據可能被非法使用","銀行中介角色面臨被弱化的風險"],"ans":2,"exp":["📝 解析：開放銀行透過 API 讓第三方平台串接銀行商品，反而會「增加」銀行產品的曝光與觸及管道，說「減少產品曝光」錯誤。其他挑戰皆正確：客戶可能被第三方吸走、資料透過 API 流出有被濫用的風險、銀行與客戶之間的中介角色可能被第三方弱化。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9,"w":1,"sw":0.01201,"id":"14科技力-54"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"13-1","stem":"我國金管會於2019 年7 月30 日核准的三間純網路銀行執照，不包括下列何者？","opts":["智能銀行","將來銀行","連線銀行","樂天國際"],"ans":1,"exp":["📝 解析：金管會 2019 年 7 月 30 日核准的三家純網路銀行為：將來銀行、連線商業銀行（LINE Bank）、樂天國際商業銀行。「智能銀行」並非獲准的業者，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0167,"w":1,"sw":0.01201,"id":"13科技力-01"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"13-30","stem":"新科技使客戶快速在不同銀行、不同帳戶間移轉資金以取得較高報酬，導致客戶忠誠度降低及存款波動度提高，屬於金融科技對銀行業(含純網銀)所帶來的何種風險？","opts":["流動性風險","科技風險","作業風險","個資風險"],"ans":1,"exp":["📝 解析：新科技讓客戶能快速在不同銀行與帳戶間搬移資金追逐較高利率，使存款穩定度下降、波動度提高，銀行資金來源不穩，屬於「流動性風險」。科技風險指系統或技術失誤、作業風險指內部流程與人員疏失、個資風險指資料外洩，都不是存款移轉造成的問題。"],"pos":0.5,"w":1,"sw":0.01201,"id":"13科技力-30"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"13-31","stem":"根據國家發展委員會研究，提供Open API，政府部門或金融機構業者可以獲得的好處，下列何者錯誤？","opts":["增加服務的可及性","增加成本","節省時間","加速產品的開發"],"ans":2,"exp":["📝 解析：依國發會研究，提供 Open API 的好處包括：增加服務可及性、節省時間、加速產品開發，並可「降低」重複開發與資料交換的成本。說增加成本不是好處，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5167,"w":1,"sw":0.01201,"id":"13科技力-31"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"12-31","stem":"我國開放銀行第一階段是開放何種項目？","opts":["商品公開資料","消費者資訊查詢(客戶資訊)","交易資訊","帳戶申請資訊"],"ans":1,"exp":["📝 解析：我國開放銀行分三階段：第一階段開放「公開資料查詢」（商品公開資料，如存放款利率、信用卡、匯率等），2019 年 10 月上路；第二階段為經客戶同意的「消費者資訊查詢」；第三階段為「交易面資訊」（如帳戶交易、支付指示）。故選(1)。"],"pos":0.5167,"w":1,"sw":0.01201,"id":"12科技力-31"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"11-32","stem":"依據中央銀行對純網路銀行的定義，下列敘述何者錯誤？","opts":["具有實體分行","營業時間全年無休","可設置實體客服中心","透過網路或行動管道提供金融服務"],"ans":1,"exp":["📝 解析：純網路銀行不設實體分行，全年無休透過網路或行動管道提供金融服務；依規定可設總行與實體客服中心處理客訴與身分確認等事務，故(1)「具有實體分行」錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5333,"w":1,"sw":0.01201,"id":"11科技力-32"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"11-33","stem":"有關開放銀行的說明，下列敘述何者正確？","opts":["將資訊主要控制權還給消費者","開放銀行對客戶、金融科技公司、金融業都是無益的","第三方服務提供者，可在未經客戶同意下，使用客戶資料","預計開放的資料，僅有「公開數據」，不包括「帳戶及交易數據」"],"ans":1,"exp":["📝 解析：開放銀行的核心理念是「資料屬於客戶」，把資料的主要控制權還給消費者，由消費者決定是否授權第三方使用，故(1)正確。(2)錯：開放銀行對客戶、金融科技業者與金融業可創造多贏；(3)錯：第三方必須經客戶同意（授權）才能取得資料；(4)錯：除公開資料外，後續階段也開放客戶資訊與帳戶交易資料。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.55,"w":1,"sw":0.01201,"id":"11科技力-33"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"11-53","stem":"傳統存貸中介機構的主要利潤來源為下列何者？","opts":["手續費收入","存放款利差","外匯操作收入","不良資產管理"],"ans":2,"exp":["📝 解析：傳統存貸中介機構（銀行）以較低利率吸收存款，再以較高利率放款，主要利潤來源是「存放款利差」。手續費、外匯操作收入是輔助收入；不良資產管理是處理呆帳的成本或專門業務，不是主要利潤來源。"],"pos":0.8833,"w":1,"sw":0.01201,"id":"11科技力-53"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"11-56","stem":"下列何者非開放銀行對客戶的好處？","opts":["整合財務狀況","培育創新生態系統","可更無縫切換金融服務","可更有效率獲得金融服務"],"ans":2,"exp":["📝 解析：開放銀行對客戶的好處包括：整合各家金融帳戶的財務狀況、更無縫地切換金融服務、更有效率地取得金融服務。「培育創新生態系統」是對金融業與金融科技產業整體的效益，不是客戶直接得到的好處，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9333,"w":1,"sw":0.01201,"id":"11科技力-56"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"10-31","stem":"有關純網銀與傳統銀行網銀的比較，下列何者錯誤？","opts":["純網銀沒有總行","純網銀可在線上完成開戶","純網銀「服務手續費」較低","純網銀營業時間較長"],"ans":1,"exp":["📝 解析：答案(1)錯誤：依金管會純網路銀行設立相關規範，純網銀仍須設立「總行」（並可設客服中心），只是不得設立實體分行，業務主要透過網路與行動裝置提供。純網銀可線上開戶（2）、因無分行成本手續費較低（3）、24 小時服務營業時間較長（4），均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5167,"w":1,"sw":0.01201,"id":"10科技力-31"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"10-56","stem":"有關開放銀行的敘述，下列何者錯誤？","opts":["係將帳戶資訊的主控權還給消費者","消費者有權決定讓其他銀行或非銀行的第三方服務提供者獲得自己帳戶資訊的權利","消費者往往要與第三方業者簽署授權Private API 的權限，以共享數據","消費者可獲得更為多元的金融服務"],"ans":3,"exp":["📝 解析：答案(3)錯誤：開放銀行是銀行以標準化、公開規格的「Open API」，在消費者同意下把資料分享給第三方服務提供者（TSP），而不是由消費者與業者簽署「Private API」權限。開放銀行把帳戶資訊主控權還給消費者（1）、由消費者決定授權對象（2）、可獲得更多元服務（4），皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9333,"w":1,"sw":0.01201,"id":"10科技力-56"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"9-32","stem":"開放銀行為傳統銀行帶來的機會不包括下列何者？","opts":["風險管理","金融服務的創新","增加利息收入","強化市場競爭力"],"ans":3,"exp":["📝 解析：答案(3)：開放銀行透過 Open API 與第三方合作，為傳統銀行帶來的機會包括利用更多資料改善風險管理（1）、與科技業者共創金融服務創新（2）、擴大生態圈強化市場競爭力（4）。開放銀行主要帶動的是服務與手續費收入、客戶黏著度，並不直接增加利息收入，反而可能因比價更容易而壓縮利差。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5333,"w":1,"sw":0.01201,"id":"9科技力-32"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"9-41","stem":"若客戶可以使用隨身攜帶的手機或是生物特徵，來進行啟動ATM 之交易，此乃下列何種金融科技之因應趨勢？","opts":["分行角色與功能的演進","應用新科技進行身分認證與無卡取款","網路銀行","社群媒體"],"ans":2,"exp":["📝 解析：答案(2)：客戶以手機（行動銀行 App、OTP、NFC）或生物特徵（指靜脈、人臉）啟動 ATM 交易，不需插入實體金融卡，屬「應用新科技進行身分認證與無卡取款」的趨勢。分行角色演進談的是分行轉型，網路銀行與社群媒體則不涉及 ATM 身分認證。"],"pos":0.6833,"w":1,"sw":0.01201,"id":"9科技力-41"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"9-56","stem":"下列何者的資料屬於「帳戶及交易數據」？ A.銀行地址 B.客戶地址 C.客戶帳戶餘額 D.銀行存款牌告利率","opts":["僅AB","僅BC","僅BD","僅CD"],"ans":2,"exp":["📝 解析：答案(2)：開放銀行的資料可分為「公開數據」與「帳戶及交易數據」。客戶地址（B）、客戶帳戶餘額（C）屬於特定客戶的個人資料與帳戶資訊，需經客戶同意才能分享；銀行地址（A）、銀行存款牌告利率（D）是銀行對外公開的資訊，屬公開數據，故選僅 BC。"],"pos":0.9333,"w":1,"sw":0.01201,"id":"9科技力-56"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"8-1","stem":"金管會於2019 年7 月30 日核准幾家純網路銀行業者之設立，透過其發揮鯰魚效應，帶動業界發展以消費者為中心的數位化、行動化之服務？","opts":["一家","二家","三家","四家"],"ans":3,"exp":["📝 解析：答案(3)：金管會於 2019 年7月30日核准三家純網路銀行設立：連線商業銀行（LINE Bank）、樂天國際商業銀行、將來商業銀行，希望藉其「鯰魚效應」刺激既有銀行加速數位化、行動化服務。三家於 2021～2022 年間陸續開業（樂天 2021 年1月、LINE Bank 2021 年4月、將來 2022 年3月）。"],"pos":0.0167,"w":1,"sw":0.01201,"id":"8科技力-01"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"8-31","stem":"有關開放銀行的敘述，下列何者正確？","opts":["只要是對消費者有利，不須消費者同意，銀行就可以開放共享","帳戶者資訊是銀行資產，由銀行決定是否開放分享","帳戶資訊主控權是消費者的，由消費者決定是否開放分享","公開數據的開放分享，需要取得消費者的同意"],"ans":3,"exp":["📝 解析：答案(3)：開放銀行的核心精神是把帳戶資訊的主控權還給消費者，由消費者決定是否、以及開放給哪個第三方使用。(1)(2) 銀行不得未經消費者同意自行分享；(4) 公開數據（如牌告利率、ATM 據點）本來就公開，分享不需取得消費者同意。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.5167,"w":1,"sw":0.01201,"id":"8科技力-31"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"8-33","stem":"依香港金融管理局規劃，開放下列四階段建置Open API 的順序為何？ 1.開放申請銀行產品 2.開放查閱銀行產品和服務資料 3.開放財務交易資料 4.開放帳戶資訊","opts":["1234","2143","2413","3214"],"ans":2,"exp":["📝 解析：答案(2)：香港金融管理局 2018 年公布的 Open API 框架分四階段：第一階段開放查閱銀行產品和服務資料（2）→ 第二階段開放申請銀行產品（1）→ 第三階段開放帳戶資訊（4）→ 第四階段開放財務交易（3），順序為 2143，由風險低的公開資訊逐步走向高風險的交易功能。"],"pos":0.55,"w":1,"sw":0.01201,"id":"8科技力-33"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"8-41","stem":"歐盟PSD2(Revised Directive on Payment Services)指令於2018 年1 月13 日生效後，要求銀行必須開放其客戶資料給非銀行的第三方(Third Party Providers, TPPs)使用，稱為下列何者？","opts":["網路銀行","純網路銀行","普惠金融","開放銀行"],"ans":4,"exp":["📝 解析：答案(4)：歐盟支付服務指令修正版 PSD2 於 2018 年1月13日生效，要求銀行在客戶同意下，透過 API 將帳戶資訊與支付功能開放給非銀行第三方服務提供者（TPPs，如帳戶資訊服務 AISP、支付發起服務 PISP），即「開放銀行」。網路銀行、純網銀是銀行經營型態，普惠金融是政策目標。"],"pos":0.6833,"w":1,"sw":0.01201,"id":"8科技力-41"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"8-56","stem":"下列何者的資料屬於「公開數據」？ A.銀行ATM 據點 B.銀行存款牌告利率 C.銀行牌告匯率 D.客戶聯絡電話 E.客戶交易明細","opts":["僅AD","僅ABD","僅AE","僅ABC"],"ans":4,"exp":["📝 解析：答案(4)：開放銀行中的「公開數據」是銀行對外公開、不涉及個人的資訊，如 ATM 據點（A）、存款牌告利率（B）、牌告匯率（C）。客戶聯絡電話（D）、客戶交易明細（E）屬客戶個人與帳戶交易資料，需經客戶同意才能分享，故選僅 ABC。"],"pos":0.9333,"w":1,"sw":0.01201,"id":"8科技力-56"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"7-24","stem":"下列何者非屬智慧分行轉型方案？","opts":["使用者行為研究","擴增交易櫃檯","數位內容及使用者介面設計","確認主要業務情境"],"ans":2,"exp":["📝 解析：答案(2)：智慧分行轉型方案包括使用者行為研究（1）、數位內容及使用者介面設計（3）、確認主要業務情境（4），目的是以自助設備、數位服務取代例行交易，讓行員轉向諮詢與銷售。擴增交易櫃檯與轉型方向相反，智慧分行通常是「縮減」交易櫃檯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4,"w":1,"sw":0.01201,"id":"7科技力-24"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"7-28","stem":"下列何者為金融機構服務和商品的應用程式介面化(API: Application Programming Interface)變得非常重要的原因？","opts":["應付金融沙盒的需要","區塊鏈的興起，增加匯款和理財的便利性","和行業內外產業整合，發展一站式服務，擴大服務範圍","機器人的興起，增加自動化"],"ans":3,"exp":["📝 解析：答案(3)：金融服務與商品 API 化的重要原因，是讓金融機構能與行業內外的業者（電商、旅遊、電信等）快速串接整合，發展一站式服務、擴大服務範圍與場景，這也是開放銀行的基礎。金融沙盒、區塊鏈、機器人與 API 化沒有直接因果關係。"],"pos":0.4667,"w":1,"sw":0.01201,"id":"7科技力-28"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"7-41","stem":"下列何者目前不被臺灣金融主管機關認可作為ATM 存提款輔助身份認證用途？","opts":["晶片金融卡","以生物辨識技術(如指靜脈等)","智慧型手機(以行動銀行、OTP、NFC 及Apple Pay 等方式)","聲波"],"ans":4,"exp":["📝 解析：答案(4)：臺灣主管機關認可的 ATM 存提款身分認證方式包括晶片金融卡（1）、生物辨識（指靜脈、人臉等，2）、以智慧型手機透過行動銀行、OTP、NFC 等方式無卡提款（3）。聲波目前並未被認可作為 ATM 存提款的輔助身分認證方式。"],"pos":0.6833,"w":1,"sw":0.01201,"id":"7科技力-41"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"7-53","stem":"下列何者不是目前銀行導入機器人或智慧型設備的目的？","opts":["提高分行自助化設備的使用比率，進行降低分行的整體營運成本","優化分行作業流程，減少客戶等待時間與提高客戶滿意度","取代大部分分行的理財專員人力，並進行全智能化的財富管理","節省行員作業時間，同時創造更多與客戶互動的機會，以提高分行整體營運績效"],"ans":3,"exp":["📝 解析：答案(3)：銀行導入機器人或智慧設備的目的，是提高自助設備使用率降低營運成本（1）、優化流程減少等待（2）、節省行員作業時間以創造更多與客戶互動的機會（4）。財富管理仍需理專的專業判斷與人際服務，目前並非要取代大部分理專、全面智能化。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8833,"w":1,"sw":0.01201,"id":"7科技力-53"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"6-23","stem":"日本MIZUHO 銀行於2015 年引進的Pepper 機器人，初期的功能不包含下列哪一項？","opts":["雙向的智慧可自行學習成長","集客效果","與客戶互動","業務的導引與Q&A"],"ans":1,"exp":["📝 解析：瑞穗（Mizuho）銀行 2015 年在分行導入 Pepper 機器人，初期功能是集客效果（吸引來客）、與客戶互動、業務導引與簡單問答（Q&A）。「雙向智慧、可自行學習成長」並非初期導入時的功能，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3833,"w":1,"sw":0.01201,"id":"6科技力-23"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"6-24","stem":"有關多通路與全通路的異同之敘述，下列何者錯誤？","opts":["以銀行為中心vs.以客戶為中心","交易vs.互動","滿足需求vs.預測需要與喜好","產品導向架構vs.服務導向架構"],"ans":4,"exp":["📝 解析：多通路 vs. 全通路的對照為：以銀行為中心 vs. 以客戶為中心、交易 vs. 互動、滿足需求 vs. 預測需要與喜好，選項(1)(2)(3)正確。選項(4)錯：教材中多通路是建立在「服務導向架構（SOA）」上，全通路則建立在「海量資料（大數據）」基礎上，不是「產品導向 vs. 服務導向」。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4,"w":1,"sw":0.01201,"id":"6科技力-24"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"6-50","stem":"有關全通路銀行業務之敘述，下列何者錯誤？","opts":["以多通路策略為建立基礎","在通路之間享有一致的經驗","著重在交易的執行，處理的是客戶的顯性需求","著重在互動，處理的是交易背後的動機和背景，找出客戶的潛在喜好"],"ans":3,"exp":["📝 解析：選項(3)錯：「著重交易執行、處理客戶顯性需求」是多通路的特色；全通路著重與客戶互動，處理交易背後的動機與背景、找出潛在喜好(4)。全通路是以多通路為基礎進一步整合(1)，讓客戶在各通路之間享有一致的體驗(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8333,"w":1,"sw":0.01201,"id":"6科技力-50"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"6-51","stem":"有關通路轉型的敘述，下列何者錯誤？","opts":["台灣準備在2019 年發放的兩張純網銀執照就屬於數位銀行類型中的「純數位銀行」","多通路是建立在海量資料基礎上，此技術能夠管理與分析各式各樣的資料","日本將舉辦2020 年的奧運會，BTMU 三菱東京日聯銀行引進機器人，希望透過機器人來處理海外觀光客業務","從多通路進化到全方位通路意味著將注意力轉移到與客戶的互動上"],"ans":2,"exp":["📝 解析：選項(2)錯：建立在海量資料（大數據）基礎上、能管理分析各式資料的是「全通路」，多通路是建立在服務導向架構上。(3)三菱東京日聯銀行曾引進機器人服務 2020 東京奧運的海外觀光客；(4)從多通路進化到全通路就是把重心轉到與客戶互動。⚠ 現行狀況：選項(1)的「兩張」是出題時金管會的規劃，2019 年 7 月實際核准三張純網銀執照（將來、樂天國際、連線 LINE Bank）；東京奧運也延至 2021 年舉行，三菱東京日聯銀行已於 2018 年更名為三菱日聯銀行。考試若再出，仍以官方答案(2)為準。","⚠ 現行狀況：金管會 2019 年 7 月實際核准三張純網銀執照（將來、樂天國際、連線 LINE Bank），非選項(1)所稱兩張；東京奧運延至 2021 年舉行，三菱東京日聯銀行 2018 年已更名三菱日聯銀行。考試以官方答案(2)為準。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.85,"w":1,"sw":0.01201,"id":"6科技力-51"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"6-53","stem":"可以在實體服務場域中協助辨識特定VIP 客戶，並將相關該客戶重要資訊推播至服務人員行動裝置或即時推播專屬客群化的行銷廣告到數位看板播放系統，下列哪一種生物辨識方式會比較適合？","opts":["指紋辨識","臉部辨識","虹膜辨識","簽名辨識"],"ans":2,"exp":["📝 解析：在分行等實體場域辨識 VIP 客戶，需要在客戶不必刻意配合（不需接觸設備）的情況下由攝影機即時辨識，最適合臉部辨識，並可把客戶資訊推播到行員行動裝置或在數位看板播放專屬廣告，故選(2)。指紋、虹膜、簽名辨識都需要客戶主動接觸或靠近設備配合操作。"],"pos":0.8833,"w":1,"sw":0.01201,"id":"6科技力-53"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"5-22","stem":"實體分行轉型態樣，如：旗艦分行、衛星分行等，其所據以決定之因素，下列何者錯誤？","opts":["銀行賦予任務","增加分行數量","目標客戶群","分行所在地理位置"],"ans":2,"exp":["📝 解析：實體分行轉型為旗艦分行、衛星分行、數位分行等型態，主要依據銀行賦予該分行的任務、目標客戶群、分行所在地理位置來決定。轉型的目的是優化分行功能與配置，而不是增加分行數量，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3667,"w":1,"sw":0.01201,"id":"5科技力-22"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"5-23","stem":"為了讓客戶可隨時隨地使用任何裝置存取，在通路之間享有一致的經驗，請問銀行就通路轉型應採用下列何項策略？","opts":["全通路","多通路","實體通路","數位通路"],"ans":1,"exp":["📝 解析：讓客戶隨時隨地用任何裝置存取，並在各通路之間享有一致的體驗，是「全通路」（Omni-channel）策略，故選(1)。多通路只是同時提供多個通路，各通路之間未必整合；實體通路、數位通路都只是單一類型的通路。"],"pos":0.3833,"w":1,"sw":0.01201,"id":"5科技力-23"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"5-24","stem":"日本Resona Bank 在分行導入新的現金櫃員機設備，為便於辨識身分，提供誘因使客戶儘量採用何種身份認證方式？","opts":["印鑑","簽名","指印","密碼"],"ans":2,"exp":["📝 解析：日本傳統銀行業務以印鑑確認身分，手續耗時。依教材，Resona（理索納）銀行在分行導入新型現金櫃員機設備時推動「免印鑑」，提供誘因讓客戶改以簽名確認身分，以簡化流程、縮短等候時間，故選(2)。印鑑正是要被取代的傳統方式。","⚠ 官方答案有疑義（考試以官方答案為準）：理索納印鑑レス係以IC卡＋指靜脈／密碼為主；以簽名代印鑑較近三井住友。官方仍答(2)"],"pos":0.4,"w":1,"sw":0.01201,"id":"5科技力-24"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"5-25","stem":"按數位銀行類型分類，下列何者為數位子銀行不具備的條件？","opts":["服務通路","銀行執照","營運中後台","獨立的商品銷售與行銷"],"ans":2,"exp":["📝 解析：依數位銀行類型分類，數位子銀行是由既有銀行另設的數位品牌或子單位，擁有自己的服務通路、營運中後台與獨立的商品銷售行銷，但依附母行的執照營運，本身不具獨立的銀行執照，故選(2)。純數位銀行（純網銀）則須取得獨立銀行執照。"],"pos":0.4167,"w":1,"sw":0.01201,"id":"5科技力-25"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"5-26","stem":"依銀行智慧分行轉型方案，請問在使用者介面設計上，下列何者是最主要的考量因素？","opts":["便利行員操作","加速電腦運算","從防弊監控設想","從關懷客戶優質體驗"],"ans":4,"exp":["📝 解析：智慧分行轉型強調以客戶為中心，使用者介面設計最主要的考量是從關懷客戶、提供優質體驗出發，故選(4)。便利行員操作、加速電腦運算、防弊監控雖然也重要，但不是使用者介面設計的首要考量。"],"pos":0.4333,"w":1,"sw":0.01201,"id":"5科技力-26"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"5-50","stem":"請問全通路銀行所具特色，下列何者正確？ A.以銀行為中心 B.著重與客戶互動 C.預測需要與喜好 D.服務導向架構","opts":["僅AB","僅BC","僅CD","僅AC"],"ans":2,"exp":["📝 解析：全通路銀行的特色是著重與客戶互動(B)、預測客戶需要與喜好(C)，故選(2)僅BC。A 錯：以銀行為中心是多通路的特色，全通路以客戶為中心；D 錯：依教材，服務導向架構是多通路的基礎，全通路建立在海量資料（大數據）上。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.8333,"w":1,"sw":0.01201,"id":"5科技力-50"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"5-51","stem":"銀行智慧分行轉型方案在確認主要業務情境時，下列何者係「根據銀行業務發展策略，在銀行分行功能佈局中充分考慮未來業務發展的需要」？","opts":["整體性","協同性","差異性","前瞻性"],"ans":4,"exp":["📝 解析：「根據銀行業務發展策略，在分行功能佈局中充分考慮未來業務發展的需要」強調的是著眼未來，屬於「前瞻性」原則，故選(4)。整體性強調全行一致規劃；協同性強調各通路與部門互相配合；差異性強調依分行特性區別配置。"],"pos":0.85,"w":1,"sw":0.01201,"id":"5科技力-51"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"5-53","stem":"目前智慧設備的導入主要應用在銀行實體分行場景，下列何者不是主要的分行應用場景？","opts":["VTM 提高自助化設備使用比率","機器人智慧迎賓優化分行作業流程","半自助式櫃員機創造更多客戶互動","大數據分析預測風險"],"ans":4,"exp":["📝 解析：智慧設備在實體分行的主要應用場景包括：VTM（遠端視訊櫃員機）提高自助化比率、機器人智慧迎賓優化流程、半自助式櫃員機創造更多與客戶互動。大數據分析預測風險是後台的資料分析應用，不是分行智慧設備的應用場景，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8833,"w":1,"sw":0.01201,"id":"5科技力-53"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"4-4","stem":"金融機構各個通路之間的關係為：","opts":["各個通路本來就是根據各自交易類型不同所設計出來的，可獨立運作","實體通路(如分行)，屬過時的通路，不需要太過重視，只需專注於數位通路即可","在數位時代，人工智能(AI)愈來愈廣泛，因此只需擴充具人工智能服務的通路","對客戶而言，面對的同一金融機構，在不同的通路間，應獲得一致性的對待"],"ans":4,"exp":["📝 解析：對客戶而言，面對的是同一家金融機構，在不同通路間應獲得一致的對待與體驗，這是全通路整合的核心，故選(4)。(1)各通路獨立運作會造成體驗割裂；(2)實體分行仍有其功能，只是轉型；(3)只擴充 AI 通路忽略了通路整合，皆不正確。"],"pos":0.0667,"w":1,"sw":0.01201,"id":"4科技力-04"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"4-22","stem":"有關金融通路轉型趨勢的敘述，下列何者錯誤？","opts":["客戶使用的交易載具愈趨多元化","銀行對交易方式的掌握愈趨不易","銀行可透過科技力量，發揮黏著度，主動關懷客戶","實體通路交易量相對降低，業務複雜度亦隨之減少"],"ans":4,"exp":["📝 解析：(4)錯：簡單交易移往網路、行動與自動化設備後，實體通路交易量雖相對降低，但留在臨櫃的多是諮詢、理財、授信等複雜業務，業務複雜度反而提高。(1)交易載具多元化；(2)客戶交易方式分散，銀行較難掌握；(3)可藉科技提升黏著度、主動關懷客戶，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3667,"w":1,"sw":0.01201,"id":"4科技力-22"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"4-23","stem":"下列何者不屬於傳統實體分行「使用者介面設計」之內容？","opts":["手勢引導","地面識別導引","取號櫃檯設計","結合臉部識別的互動性電子看板數位行銷"],"ans":4,"exp":["📝 解析：傳統實體分行的使用者介面設計，指的是動線與現場引導，例如手勢引導、地面識別導引、取號與櫃檯配置。(4)結合臉部識別的互動式電子看板做數位行銷，屬智慧分行／數位分行導入的新科技應用，不是傳統分行介面設計內容，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3833,"w":1,"sw":0.01201,"id":"4科技力-23"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"4-24","stem":"有關銀行分行轉型的原因，下列何者錯誤？","opts":["銀行內部成本的壓力","科技對生產力的提升","客戶臨櫃交易需求的降低","行動及網路銀行可完全取代實體銀行功能"],"ans":4,"exp":["📝 解析：(4)錯：行動與網路銀行可承接大部分簡單交易，但複雜諮詢、高額授信、理財規劃與身分查核等仍需實體分行，無法完全取代，因此分行是「轉型」而非消失。(1)內部成本壓力、(2)科技提升生產力、(3)客戶臨櫃需求降低，都是分行轉型的原因。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4,"w":1,"sw":0.01201,"id":"4科技力-24"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"4-26","stem":"有關全通路銀行(Omni-Channel)特性的敘述，下列何者錯誤？","opts":["應著重與客戶之互動","從滿足需求提升到預測需要與喜好","應建立與客戶互動之系統","應以銀行為中心設計客戶使用經驗"],"ans":4,"exp":["📝 解析：(4)錯：全通路銀行（Omni-Channel）強調「以客戶為中心」，讓客戶在任何通路切換都有一致、連續的體驗，而不是以銀行為中心設計。(1)著重與客戶互動、(2)從滿足需求進一步預測需要與喜好、(3)建立與客戶互動的系統，皆是全通路特性。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4333,"w":1,"sw":0.01201,"id":"4科技力-26"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"4-28","stem":"在過去三十年，Application Programming Interface (API)歷經多次的演化，下列敘述何者錯誤？","opts":["傳統上， API 是系統整合、資料交換的技術","現今API 已經演化為資訊系統與數位服務之間的介接技術","API 本質上是一種介面技術，與商業模式無關","虛實整合、線上／線下結合的服務架構，也是一種API 應用"],"ans":3,"exp":["📝 解析：(3)錯：API 已從單純的系統介接技術，演化為串接不同業者服務、創造新商業模式的工具（API 經濟，例如開放銀行讓第三方透過 API 提供金融服務），與商業模式密切相關。(1)傳統 API 用於系統整合與資料交換；(2)現今是系統與數位服務的介接技術；(4)虛實整合、O2O 架構也是 API 應用，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4667,"w":1,"sw":0.01201,"id":"4科技力-28"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"4-30","stem":"下列何者是將分行交易頻率高或交易流程複雜但頻率低的交易，透過整合影音客服系統，轉移到此設施上來提供客戶服務？","opts":["虛擬櫃員機","智慧機器人","半自助式櫃員機","互動數位電視牆"],"ans":1,"exp":["📝 解析：虛擬櫃員機（VTM）結合影音客服系統，客戶在機台前透過視訊與遠端行員互動，可辦理交易頻率高、或流程複雜但頻率低的業務，把原本的臨櫃交易移轉到機台上，故選(1)。智慧機器人多做導引與簡單問答；互動數位電視牆屬行銷展示設備。"],"pos":0.5,"w":1,"sw":0.01201,"id":"4科技力-30"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"4-50","stem":"有關科技對金融業務通路的影響，下列何者錯誤？","opts":["客戶體驗改造是首要目標","未來實體分行將無存在價值","促成行動通路與數位銀行興起","實體分行設置互動式電子看板可使大數據分析更準確"],"ans":2,"exp":["📝 解析：(2)錯：科技使交易移往數位通路，但實體分行轉型為諮詢、理財與體驗中心，仍有存在價值，並非完全無存在價值。(1)客戶體驗改造是通路轉型首要目標；(3)科技促成行動通路與數位銀行興起；(4)分行互動式電子看板可蒐集客戶反應資料，使大數據分析更準確，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8333,"w":1,"sw":0.01201,"id":"4科技力-50"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"3-1","stem":"在數位經濟的時代，銀行的服務可以隨時隨地以任何設備取得，面對這樣的變化，銀行未來應特別重視的重點為何？","opts":["國際化趨勢","分行的普及","客戶的體驗","金融業的整併"],"ans":3,"exp":["📝 解析：數位經濟下客戶可隨時隨地用任何裝置取得銀行服務，各銀行功能差異縮小，競爭關鍵轉為「客戶體驗」，銀行應以客戶為中心設計服務流程，故選(3)。分行普及已非重點（實體分行反而在縮減）；國際化與金融業整併不是因應此變化的核心。"],"pos":0.0167,"w":1,"sw":0.01201,"id":"3科技力-01"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"3-22","stem":"客戶透過包括手機、平板、電腦，甚至實體商店等不同的通路進行消費時，都能像是和同一位業務人員打交道，而這位業務人員不但有過人記憶，也能直覺判斷客戶喜好稱之為何？","opts":["社群金融(Community Banking)","全通路銀行(Omni-Channel)","業務多通路 (Multi-Channel)","原生行銷(Native Advertising)"],"ans":2,"exp":["📝 解析：全通路銀行（Omni-Channel）整合手機、平板、電腦與實體據點等所有通路的資料與服務，客戶不論從哪個通路進來，都能得到一致、連續且了解其偏好的服務，如同面對同一位記性好又懂你的業務員，故選(2)。多通路（Multi-Channel）只是提供多個通路，各通路資訊未必整合。"],"pos":0.3667,"w":1,"sw":0.01201,"id":"3科技力-22"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"3-23","stem":"金融業必須有不同的轉型思維才能應對金融通路的轉型趨勢，有關轉型思維之敘述，下列何者錯誤？","opts":["未來自動化通路的交易量會持續增加，實體通路交易量雖然相對會降低，但留下來的業務複雜性提高了，其帶來的高價值性也將增加","未來人員和實體通路不會消失，但金融業應該藉由學習及科技提升人員的能力，做到人員和實體通路的轉型","透過科技的力量，我們能夠比以前更精準地判斷哪些客戶需要關懷或適合怎樣的金融商品","金融實體通路從業人員的主要績效指標將是快速操作電腦完成交易"],"ans":4,"exp":["📝 解析：(4)錯：簡單交易移往自動化通路後，實體通路人員應轉型為提供諮詢、理財與關懷等高價值服務，績效指標不應再是「快速操作電腦完成交易」。(1)自動化通路交易量增加、臨櫃業務變複雜且高價值；(2)人員與實體通路不會消失但需轉型；(3)科技能更精準判斷客戶需求，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3833,"w":1,"sw":0.01201,"id":"3科技力-23"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"3-24","stem":"實體分行如為使用全自助化設備的無人分行或以遠程視訊櫃員機和客服人員互動者，係屬下列何種分行型態？","opts":["旗艦分行","衛星分行","機場分行","高科技分行"],"ans":4,"exp":["📝 解析：使用全自助化設備的無人分行，或以遠程視訊櫃員機（VTM）讓客戶與遠端客服人員互動的分行，屬「高科技分行」型態，故選(4)。旗艦分行強調品牌形象與完整服務；衛星分行是小型輔助據點；機場分行是依地點設立的特殊分行。"],"pos":0.4,"w":1,"sw":0.01201,"id":"3科技力-24"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"3-26","stem":"有關純數位銀行兼具德國銀行執照的Fidor Bank，下列敘述何者錯誤？","opts":["具有堅強的實體通路","資源集中在社群金融為其特色","Banking with Friends 為該銀行口號","將儲蓄與信貸的年利率結合該銀行Facebook 粉絲團按讚數連動以達社群行銷目的"],"ans":1,"exp":["📝 解析：(1)錯：Fidor Bank 是持有德國銀行執照的純數位銀行，沒有實體分行，並不具堅強的實體通路。(2)資源集中在社群金融；(3)口號是「Banking with Friends」；(4)把存款與貸款利率和 Facebook 粉絲團按讚數連動，以社群行銷，皆為其特色。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4333,"w":1,"sw":0.01201,"id":"3科技力-26"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"3-50","stem":"請問法國巴黎銀行所成立之Hello Bank 數位子銀行，不具有下列何種獨立項目？","opts":["商品銷售與行銷","服務通路","營運中後台","銀行執照"],"ans":4,"exp":["📝 解析：法國巴黎銀行（BNP Paribas）2013 年成立的 Hello bank! 是數位子品牌，擁有獨立的商品銷售與行銷、服務通路與營運中後台，但並未另外申請銀行執照，而是使用母行 BNP Paribas 的執照營運，故選(4)。"],"pos":0.8333,"w":1,"sw":0.01201,"id":"3科技力-50"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"3-51","stem":"智慧分行轉型方案首應著手進行者為下列何項？","opts":["數位內容設計","分行整體設計原則","確認主要業務情境","數位科技解決方案"],"ans":3,"exp":["📝 解析：智慧分行轉型應先確認分行的主要業務情境（客群是誰、來分行做什麼），再據以訂定分行整體設計原則、規劃數位內容與選擇科技解決方案，故首先應進行(3)。若先挑科技或設計，容易出現設備與實際需求脫節。"],"pos":0.85,"w":1,"sw":0.01201,"id":"3科技力-51"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"2-23","stem":"下列何者較不屬於目前常見的分行轉型內容？","opts":["以更高的行銷費用吸引顧客前來分行","以更多型態呈現分行功能","強化分行互動功能","重視多通路顧客體驗"],"ans":1,"exp":["📝 解析：分行轉型的方向是以多元型態呈現分行功能（如微型分行、咖啡店分行）、強化互動功能、重視多通路／全通路顧客體驗；單純提高行銷費用吸引顧客上門是傳統做法，不是轉型內容，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3833,"w":1,"sw":0.01201,"id":"2科技力-23"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"2-26","stem":"下列敘述何者錯誤？","opts":["重視顧客體驗成為分行轉型重要考量","金融從業人員績效指標不再是作業快速而是擔任虛實整合樞紐","將來的實體分行型態將更多元","隨著實體通路業務複雜性提高，未來實體通路交易量可望愈來愈高"],"ans":4,"exp":["📝 解析：數位通路普及後，簡單交易移往網路、行動與自助設備，實體通路交易量是逐漸「減少」，分行改為處理較複雜的諮詢與銷售，故(4)「交易量愈來愈高」錯誤。(1)重視顧客體驗、(2)行員角色轉為虛實整合樞紐、(3)分行型態更多元，皆為正確趨勢。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4333,"w":1,"sw":0.01201,"id":"2科技力-26"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"2-30","stem":"下列何者為API 的數位金融應用？","opts":["與行業內外APP 整合，擴大服務的範圍","獨立開發的理財APP","客戶個人資料加解密安全機制","金融機構內部徵審系統"],"ans":1,"exp":["📝 解析：API（應用程式介面）在數位金融的應用，是讓金融機構把服務開放給行業內外的第三方 APP 介接（開放銀行的基礎），擴大服務範圍與場景，故選(1)。獨立開發的理財 APP、加解密機制、內部徵審系統都不涉及對外介接，不是 API 的典型數位金融應用。"],"pos":0.5,"w":1,"sw":0.01201,"id":"2科技力-30"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"2-50","stem":"下列敘述何者正確？","opts":["Frank 為新加坡獨立的純數位銀行","Simple 為美國合眾銀行推出的次品牌","Hello Bank 為法國巴黎銀行推出的數位子銀行","Fidor Bank 將資訊集中在結合實體分行共同行銷"],"ans":3,"exp":["📝 解析：Hello bank! 是法國巴黎銀行(BNP Paribas)2013 年推出的數位子銀行，故(3)正確。(1)錯：Frank 是新加坡華僑銀行(OCBC)針對年輕族群的品牌，不是獨立純數位銀行；(2)錯：Simple 是 2014 年被西班牙 BBVA 收購的數位銀行，不是美國合眾銀行的次品牌（Simple 已於 2021 年關閉）；(4)錯：德國 Fidor Bank 是無實體分行的網路銀行，以社群互動經營，而非結合實體分行行銷。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.8333,"w":1,"sw":0.01201,"id":"2科技力-50"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"2-51","stem":"數位銀行依是否具備下列哪些分類可分為四種類型？","opts":["獨立商品銷售與行銷、分行數、服務通路、銀行執照","獨立商品行銷、服務通路、分行人數、營運中後台","獨立商品銷售與行銷、服務通路、營運中後台、銀行執照","獨立商品行銷、系統運作、服務通路、銀行執照"],"ans":3,"exp":["📝 解析：數位銀行依是否具備「獨立商品銷售與行銷、服務通路、營運中後台、銀行執照」四項要素分為四種類型（由淺到深：數位通路／數位分行、數位品牌、數位子銀行、純數位銀行），具備越多項越獨立，故選(3)。分行數、分行人數、系統運作都不是分類依據。"],"pos":0.85,"w":1,"sw":0.01201,"id":"2科技力-51"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"1-1","stem":"下列何者不屬於2015 年金管會「打造數位金融環境3.0」計畫，新增12 項線上業務之一？","opts":["線上申請結清銷戶","線上申辦信託開戶","客戶線上同意銀行查詢聯徵中心信用資料","線上申請轉出帳號約定"],"ans":4,"exp":["📝 解析：金管會 2015 年「打造數位化金融環境 3.0」開放既有客戶線上辦理 12 項業務：存款類為結清銷戶（5 萬元以下）、約定「轉入」帳號、傳真指示扣款免正本；授信類含客戶線上同意銀行查詢聯徵中心信用資料；財富管理類含信託開戶、KYC、風險承受度測驗、同意或終止推介等。(1)(2)(3)都在清單內；(4)寫成「轉出帳號約定」，與清單的「約定轉入帳號」不同，故選(4)（注意轉入／轉出的文字陷阱）。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0167,"w":1,"sw":0.01201,"id":"1科技力-01"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"1-22","stem":"在2015 年日本瑞穗銀行引進機器人所產生的效益，不含下列何者？","opts":["結合感知運算以讓它聽懂更多自然語意","能確實有效引導顧客","節省成本與給予顧客更好的互動體驗","降低銀行壞帳"],"ans":4,"exp":["📝 解析：瑞穗銀行 2015 年在分行導入軟銀 Pepper 機器人，結合 IBM Watson 感知運算理解自然語言，用於迎賓、引導顧客、介紹商品，節省成本並提升互動體驗，(1)(2)(3)都是效益。機器人負責前台服務，與授信品質無關，無法降低銀行壞帳，故選(4)。"],"pos":0.3667,"w":1,"sw":0.01201,"id":"1科技力-22"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"1-23","stem":"下列何者是未來金融從業人員在通路轉型後應積極扮演的角色？","opts":["文書處理","快速操作電腦完成交易","被動等待上級主管安排新的職務","發揮客戶黏著度，成為跨通路虛實整合無縫接軌的重要樞紐"],"ans":4,"exp":["📝 解析：通路轉型後，交易性作業由數位通路與自動化設備承擔，金融從業人員應轉為諮詢顧問，發揮客戶黏著度，成為跨通路虛實整合、無縫接軌的樞紐，故選(4)。文書處理、快速操作電腦交易會被自動化取代，被動等待安排更不符合轉型需求。"],"pos":0.3833,"w":1,"sw":0.01201,"id":"1科技力-23"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"1-24","stem":"有別於現有的分行，下列何者是未來可能的新型態分行？","opts":["咖啡店分行","總行營業部","外匯指定分行","國際金融業務分行"],"ans":1,"exp":["📝 解析：咖啡店分行（如美國 Capital One 360 Café）把分行融入生活場景，提供輕鬆的諮詢與互動空間，是有別於傳統分行的新型態，故選(1)。總行營業部、外匯指定分行、國際金融業務分行(OBU)都是既有的分行類型。"],"pos":0.4,"w":1,"sw":0.01201,"id":"1科技力-24"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"1-25","stem":"目前所見分行轉型案例，下列敘述何者錯誤？","opts":["美國富國銀行轉型為線上線下相輔相成的理財諮詢中心","中國阿里巴巴集團的網商銀行從實體通路轉型為數位銀行","日本Resona Bank 導入新的現金櫃員機","日本三菱東京日聯銀行引進機器人處理海外觀光客業務"],"ans":2,"exp":["📝 解析：中國網商銀行(MYbank)是阿里巴巴旗下螞蟻金服於 2015 年成立的純網路銀行，一開始就沒有實體分行，並非「從實體通路轉型」為數位銀行，故(2)錯誤。(1)富國銀行打造虛實相輔的理財諮詢中心、(3)Resona Bank 導入新式現金櫃員機、(4)三菱東京日聯銀行引進機器人服務海外觀光客，皆為分行轉型案例。","🏷 名稱更新：該行自2018年4月1日起更名為三菱UFJ銀行（MUFG Bank）；本題答案仍為(2)網商銀行並非由實體轉型。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4167,"w":1,"sw":0.01201,"id":"1科技力-25"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"1-50","stem":"下列敘述何者錯誤？","opts":["全方位通路是建立在海量資料的基礎上","純數位銀行已全面取代傳統具有分行網路的銀行","許多歐美銀行開始廣設微型分行","許多分行轉型失敗在於「為技術而導入技術」"],"ans":2,"exp":["📝 解析：純數位銀行雖快速發展，但具分行網路的傳統銀行仍是主流，並未被「全面取代」，故(2)錯誤。(1)全通路建立在海量資料基礎上、(3)歐美銀行廣設微型分行、(4)許多分行轉型失敗源於為技術而導入技術，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8333,"w":1,"sw":0.01201,"id":"1科技力-50"},{"s":"all","ch":"科技力 6｜數位銀行、純網銀與開放銀行","star":0,"n":1,"refs":"1-51","stem":"下列何者並非虛擬／遠程視訊櫃員機VTM 所能提供的「差異化」服務重點？","opts":["提領現金","降低分行場地成本","延長客戶服務時間","透過客服中心一對多的模式，提高服務的效率"],"ans":1,"exp":["📝 解析：VTM（虛擬／遠端視訊櫃員機）的差異化重點是透過視訊連線客服中心提供類臨櫃服務：降低分行場地與人力成本、延長服務時間、以客服中心一對多提高效率。提領現金是一般 ATM 就有的基本功能，不是 VTM 的差異化服務，故選(1)。"],"pos":0.85,"w":1,"sw":0.01201,"id":"1科技力-51"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"21-20","stem":"有關回饋型群眾募資(Reward-based Crowdfunding)，下列敘述何者正確？","opts":["投資人取得公司股權或分紅","為政府補助計畫，不需回饋支持者","資金提供者以無息借貸形式協助弱勢族群","以小額資金支持專案，獲得產品或服務作為回饋"],"ans":4,"exp":["📝 解析：回饋型群眾募資是支持者以小額資金支持專案，取得產品、服務或紀念品作為回饋（如 Kickstarter、嘖嘖）。(1)取得股權或分紅是股權型；(2)政府補助非群眾募資；(3)無息借貸屬借貸型或公益型。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.3333,"w":1,"sw":0.00276,"id":"21科技力-20"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"21-21","stem":"群眾募資具有協助新創業者募資之功能，但亦存在若干風險，有關所存在之風險，下列何者錯誤？","opts":["流通性風險","稀釋風險","資訊不對稱","較少的投資損失與法律保障"],"ans":4,"exp":["📝 解析：群眾募資的風險包括流通性風險（股份難轉讓）、稀釋風險、資訊不對稱，以及「較高」的投資損失與「較少」的法律保障。(4)把投資損失寫成「較少」，與事實相反（新創失敗率高），故錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.35,"w":1,"sw":0.00276,"id":"21科技力-21"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"21-22","stem":"下列哪一種機器人理財運作模式之交易決策方係由機器算法進行？","opts":["純機器人理財顧問","人機結合理財顧問","純諮詢建議投顧","B2B 投資顧問平台"],"ans":1,"exp":["📝 解析：純機器人理財顧問（Robo-advisor）由演算法完成資產配置、交易與再平衡，無人工介入（如 Betterment、Wealthfront）。人機結合是機器建議加人工顧問；純諮詢投顧由人提供建議；B2B 平台是賣技術給金融機構。"],"pos":0.3667,"w":1,"sw":0.00276,"id":"21科技力-22"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"21-23","stem":"有關「傳統投資管理」與「金融科技投資管理」的比較，下列敘述何者正確？","opts":["傳統投資管理主要依靠演算法自動決策，而金融科技投資管理則以人工分析為主","金融科技投資管理強調大數據分析與人工智慧應用，以提升投資決策效率","傳統投資管理能更快速因應市場變化，反而比金融科技投資管理靈活","金融科技投資管理完全取代了投資顧問與人為判斷"],"ans":2,"exp":["📝 解析：金融科技投資管理強調運用大數據與 AI 分析提升投資決策效率，故(2)正確。(1)說反了，傳統投資管理以人工分析為主；(3)傳統模式反應較慢；(4)金融科技未完全取代人為判斷，仍有人機結合模式。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.3833,"w":1,"sw":0.00276,"id":"21科技力-23"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"21-50","stem":"根據中央銀行(2019)之報告，有關美國P2P 借貸的敘述，下列何者錯誤？","opts":["對於P2P 平台訂有新專法","P2P 借貸平台需向證管會(SEC)及各州證券監管機構註冊","P2P 借貸平台業者發行債券將債權轉讓予投資人，應遵循「有價證券法」","P2P 借貸業務的監理機關，主要包括：證管會(SEC)、消費金融保護局、各州金融監理機關"],"ans":1,"exp":["📝 解析：依中央銀行（2019）報告，美國並未為 P2P 平台訂定新專法，而是適用既有法規：平台發行債券將債權轉讓予投資人，適用有價證券法（1933年證券法），須向 SEC 及各州證券監管機構註冊，並受消費金融保護局、各州金融監理機關監管。故(1)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8333,"w":1,"sw":0.00276,"id":"21科技力-50"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"21-57","stem":"自動化投顧服務會依投資人風險屬性配置資產並動態再平衡，支撐其運作的AI 技術多屬於下列何者？","opts":["自然語言處理","強化學習","機器學習與推薦系統","電腦視覺"],"ans":3,"exp":["📝 解析：自動化投顧依投資人風險屬性（問卷）配置資產並動態再平衡，主要運用機器學習建立風險分類與配置模型，以及推薦系統推薦合適的投資組合。自然語言處理用於理解語言、電腦視覺用於影像，強化學習並非主流理財機器人的主要支撐技術。"],"pos":0.95,"w":1,"sw":0.00276,"id":"21科技力-57"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"20-18","stem":"根據中央銀行(2019)之報告，僅協助資訊中介，屬於P2P 借貸的何種模式？","opts":["傳統","公證","保證收益","資產負債表"],"ans":1,"exp":["📝 解析：依中央銀行（2019）報告，P2P 借貸模式包括傳統模式、保證收益模式、公證模式、資產負債表模式等。僅擔任資訊中介、撮合借貸雙方而不承擔信用風險者為「傳統」模式；資產負債表模式是平台以自有資金放款，保證收益模式則由平台保證本息。"],"pos":0.3,"w":1,"sw":0.00307,"id":"20科技力-18"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"20-19","stem":"有關P2P 借貸平台之敘述，下列何者錯誤？","opts":["直接媒合借款者與貸款者","減少對金融中介機構的依賴","增加資產轉換的交換成本","重要的金融科技服務"],"ans":3,"exp":["📝 解析：P2P 借貸平台直接媒合借款者與出借者，減少對金融中介機構的依賴，降低交易與資產轉換成本，是重要的金融科技服務。「增加資產轉換的交換成本」與其效益相反，故(3)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3167,"w":1,"sw":0.00307,"id":"20科技力-19"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"20-22","stem":"根據WEF(2015)，有關傳統投資管理的敘述，下列何者錯誤？","opts":["主要參與者是機構投資者，標的為金融中介機構所承銷和經紀的股票和債券","個人投資者透過機構投資者間接進行投資，投資機會較有限","客戶注意性價比，價格敏感度高，喜歡新科技","產品多元複雜，標榜客製化量身定做"],"ans":3,"exp":["📝 解析：WEF（2015）描述傳統投資管理：主要參與者為機構投資者、標的是中介機構承銷經紀的股債，個人投資者只能透過機構間接投資，產品多元複雜並標榜客製化。傳統模式的客戶較重視關係與服務、對價格較不敏感；「注重性價比、價格敏感度高、喜歡新科技」描述的是新型投資管理的客戶，故(3)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3667,"w":1,"sw":0.00307,"id":"20科技力-22"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"20-23","stem":"有關人機結合理財顧問(Cyborg-advisor)的運作模式，下列敘述何者錯誤？","opts":["目標客戶為個人投資者","主要產品為機器和顧問共同提供的資產配置組合","收費方式採買斷或授權的一次性付費","代表公司有Personal Capital"],"ans":3,"exp":["📝 解析：人機結合理財顧問（Cyborg-advisor）以個人投資者為目標客戶，由機器與真人顧問共同提供資產配置，代表公司如 Personal Capital。收費多依資產管理規模（AUM）按年收取一定比例費用；「買斷或授權的一次性付費」是 B2B 技術授權（賣系統給金融機構）的收費方式，故(3)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3833,"w":1,"sw":0.00307,"id":"20科技力-23"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"20-50","stem":"有關英國Zopa 的Safeguard 敘述，下列何者錯誤？","opts":["類似風險準備金","資金交付保管後，Zopa 仍有支配權","用於償還違約者欠投資者的本金與利息","交由非營利性信託機構保管"],"ans":2,"exp":["📝 解析：英國P2P平台Zopa的Safeguard機制類似風險準備金，向借款人收取費用存入，由獨立的非營利信託機構（P2PS Ltd）保管，用來償還違約借款人積欠投資人的本息。資金交付信託保管後Zopa即無支配權，以隔離平台經營風險，故(2)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8333,"w":1,"sw":0.00307,"id":"20科技力-50"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"20-51","stem":"下列哪一個群眾募資平台首先提出「領投+跟投」的模式？","opts":["AngelList","IndieGoGo","Kickstarter","Crowdfunder"],"ans":1,"exp":["📝 解析：美國股權群募平台AngelList首創「領投＋跟投」（Syndicate）模式：由具經驗的天使投資人領投並負責盡職調查，其他投資人跟投並支付領投人分潤（Carry），故選(1)。IndieGoGo、Kickstarter為回饋型群募；Crowdfunder雖有股權群募，但非首創此模式。"],"pos":0.85,"w":1,"sw":0.00307,"id":"20科技力-51"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"19-18","stem":"中國大陸最早的P2P 借貸平台為下列何者？","opts":["陸金所","拍拍貸","宜信","恆昌"],"ans":2,"exp":["📝 解析：拍拍貸於2007年在上海成立，是中國大陸第一家P2P網路借貸平台，故選(2)。宜信（2006）初期以線下債權轉讓為主，陸金所（2011）、恆昌成立較晚。"],"pos":0.3,"w":1,"sw":0.02901,"id":"19科技力-18"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"19-19","stem":"依據WEF(2015)報告，P2P 借貸相較傳統金融借貸的優點，下列敘述何者錯誤？","opts":["借貸方雙方貸款流程與事前風險是透明的","協助無法取得金融機構貸款的借款人取得資金","交易成本降低","投資者資金受到存款保險保障"],"ans":4,"exp":["📝 解析：WEF（2015）指出P2P借貸的優點：流程與風險透明、協助無法向金融機構借款者取得資金、降低交易成本。P2P投資人的資金並非存款，不受存款保險保障，違約風險由投資人自負，故(4)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3167,"w":1,"sw":0.02901,"id":"19科技力-19"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"19-20","stem":"群眾募資是利用下列何者快速散播計劃內容和創意作品訊息，獲得支持者的資金最後得以實踐計劃或完成作品？","opts":["網路平台","投資說明會","市場機制","金融機構"],"ans":1,"exp":["📝 解析：群眾募資是透過網路平台（如Kickstarter、FlyingV）公開展示計畫與創意，利用網路快速擴散訊息，向大眾募集小額資金以實現計畫，故選(1)。"],"pos":0.3333,"w":1,"sw":0.02901,"id":"19科技力-20"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"19-21","stem":"美國2012 年通過的《促進創業企業融資法案》(JOBs)中，下列何者通常被稱為A+法案(Regulation A+)？","opts":["Title I Crowdfunding","Title II Crowdfunding","Title III Crowdfunding","Title IV Crowdfunding"],"ans":4,"exp":["📝 解析：美國2012年JOBS Act中，Title IV修正Regulation A，將小額公開發行上限提高（Tier 2達5,000萬美元，後調至7,500萬美元），俗稱Regulation A+，故選(4)。Title I為新興成長公司IPO簡化；Title II開放對合格投資人公開勸募；Title III為一般大眾可參與的股權群募（Regulation Crowdfunding）。"],"pos":0.35,"w":1,"sw":0.02901,"id":"19科技力-21"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"19-22","stem":"有關「機器人理財」(Robo-Advisors)之敘述，下列何者錯誤？","opts":["須由實體機器人服務","客戶可藉由線上填入問卷獲得投資建議","由電腦程式提供投資人建議","降低理財顧問服務成本"],"ans":1,"exp":["📝 解析：機器人理財（Robo-Advisor）是透過電腦程式與演算法，依客戶線上問卷結果提供資產配置建議並自動再平衡，不需實體機器人，故(1)錯誤。(2)(3)(4)線上問卷、程式建議、降低顧問成本均為正確特點。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3667,"w":1,"sw":0.02901,"id":"19科技力-22"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"19-50","stem":"有關P2P 借貸平台之敘述，下列何者錯誤？","opts":["運用先進科技蒐集與分析借款人信用資訊","開發有別於傳統銀行的信用評分系統","補充現行正規徵信機制","無助發展新的商業信用模式"],"ans":4,"exp":["📝 解析：P2P借貸平台運用科技蒐集與分析借款人資訊，開發不同於傳統銀行的信用評分系統，補充正規徵信機制的不足，並有助於發展新的商業信用模式。(4)「無助發展新的商業信用模式」錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8333,"w":1,"sw":0.02901,"id":"19科技力-50"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"19-51","stem":"下列何者是新加坡的線上群眾募資平台？","opts":["FlyingV","Crowdcube","Kickstarter","FundedHere"],"ans":4,"exp":["📝 解析：FundedHere是新加坡的股權／債權群眾募資平台，故選(4)。FlyingV為台灣平台；Crowdcube為英國股權群募平台；Kickstarter為美國回饋型群募平台。"],"pos":0.85,"w":1,"sw":0.02901,"id":"19科技力-51"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"19-52","stem":"在演算法交易(Algorithmic Trading)的定義及內容中，下列敘述何者正確？ A.是屬於程式交易(Program Trading)的一種 B.根據目標設計好交易策略，將其編寫成電腦程式 C.藉由控管下單時點、價格與交易量三者之動態調整，做最佳化交易的執行，以維持程式交易策略的績效符合預期 D.透過演算法交易一定能夠100%獲利","opts":["ABCD","僅ABD","僅BCD","僅ABC"],"ans":4,"exp":["📝 解析：演算法交易屬程式交易的一種（A），依目標設計交易策略並寫成電腦程式（B），藉控管下單時點、價格與數量動態調整，最佳化執行以維持策略績效（C）。任何交易策略都有虧損風險，「一定能100%獲利」（D）錯誤，故選僅ABC(4)。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.8667,"w":1,"sw":0.02901,"id":"19科技力-52"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"18-18","stem":"根據中央銀行(2019)之報告，P2P 借貸平台管理不當時，會帶來許多風險，其中的平台倒閉風險，主要原因為何？","opts":["P2P 平台可能承擔了擔保責任，導致經營風險增加","投資人的資金成本高","借款人壓低利息，壓低利差，造成經營困難","借款人的抵押品價值過低"],"ans":1,"exp":["📝 解析：中央銀行（2019）報告指出，P2P平台若偏離資訊中介角色、承擔擔保責任（保本保息或代償），會使違約風險集中在平台本身，經營風險大增，導致平台倒閉，故選(1)。中國大陸P2P倒閉潮即為例證。"],"pos":0.3,"w":1,"sw":0.02901,"id":"18科技力-18"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"18-19","stem":"成立於2011 年的Market Invoice(英國)是P2P 借貸平台何種營運模式？","opts":["公證模式","發票交易／應收帳款承購","資產負債表模式","保證收益模式"],"ans":2,"exp":["📝 解析：英國MarketInvoice（2011年成立，現名MarketFinance）讓企業將未到期發票（應收帳款）在平台上出售給投資人，提前取得資金，屬「發票交易／應收帳款承購」模式，故選(2)。"],"pos":0.3167,"w":1,"sw":0.02901,"id":"18科技力-19"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"18-21","stem":"英國的Crowdcube 是世界第一個成立何種群募平台，具有大眾化及投資門檻低等特色，於2010 年10 月成立， 2013 年由英國金融行為監管局(FCA)承認合法？","opts":["捐贈","回饋","股權","債權"],"ans":3,"exp":["📝 解析：英國Crowdcube是世界第一個「股權」群眾募資平台，投資人以小額資金換取新創公司股份，具大眾化、門檻低特色，2013年獲FCA承認合法，故選(3)。捐贈型無回報、回饋型以產品或紀念品回饋、債權型以利息回報。"],"pos":0.35,"w":1,"sw":0.02901,"id":"18科技力-21"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"18-22","stem":"下列何項非屬理財機器人之服務流程？","opts":["不需要瞭解客戶的投資需求","提供投資組合建議","建立投資組合，執行交易","自動化管理與風險監控"],"ans":1,"exp":["📝 解析：理財機器人的服務流程：先以線上問卷瞭解客戶投資目標與風險承受度（KYC），再提供投資組合建議、建立組合並執行交易，之後自動化管理、再平衡與風險監控。(1)「不需要瞭解客戶投資需求」錯誤，KYC是第一步。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3667,"w":1,"sw":0.02901,"id":"18科技力-22"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"18-23","stem":"下列何者非金融科技應用於投資管理常見之業務？","opts":["機器人理財","社群投資","演算法交易","電話下單交易"],"ans":4,"exp":["📝 解析：金融科技應用於投資管理的常見業務有機器人理財、社群投資（跟單交易）、演算法交易等。電話下單是傳統的交易方式，非金融科技應用，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3833,"w":1,"sw":0.02901,"id":"18科技力-23"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"18-50","stem":"撥貸銀行債權轉讓其他投資人：平台與銀行合作，由銀行撥貸，而後將債權轉讓予投資人或機構投資人，其代表業者為何？","opts":["英國-Zopa","美國-Prosper","美國-Lending Club","中國-陸金所"],"ans":3,"exp":["📝 解析：美國Lending Club的模式是：借款由合作銀行（WebBank）撥貸，再將債權轉讓給投資人或機構投資人，平台負責撮合與管理，故選(3)。Prosper亦曾採類似模式，但教材以Lending Club為代表；Zopa為英國傳統P2P撮合；陸金所為中國大陸綜合理財平台。"],"pos":0.8333,"w":1,"sw":0.02901,"id":"18科技力-50"},{"s":"all","ch":"科技力 7｜P2P借貸、群眾募資與數位理財","star":0,"n":1,"refs":"18-51","stem":"下列哪一個平台是創立於臺灣的群眾募資？","opts":["Kickstarter","FlyingV","Indiegogo","GoFundMe"],"ans":2,"exp":["📝 解析：FlyingV是2012年在台灣創立的回饋型群眾募資平台，故選(2)。Kickstarter、Indiegogo、GoFundMe都是美國的群眾募資平台。"],"pos":0.85,"w":1,"sw":0.02901,"id":"18科技力-51"},{"s":"all","ch":"科
