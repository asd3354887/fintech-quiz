技術","機器人學"],"ans":2,"exp":["📝 解析：WEF 2016年報告指出影響金融業的新興科技中，雲端運算、分散式帳本技術、機器人學（含RPA）、AI等已有金融機構開始嘗試應用；量子計算當時仍處科技公司的研發階段，選(2)。量子電腦未來可能破解現行RSA／ECC加密，是金融資安的長期議題。"],"pos":0.6333,"w":1,"sw":0.01201,"id":"14科技力-38"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"14-39","stem":"依據2017 年世界經濟論壇出版的報告「超越金融科技」，有關金融科技公司之敘述，下列何者錯誤？","opts":["改變了金融服務的運作結構","已成為各國金融服務市場的主導業者","改變了獲得、使用金融服務的方法","策略已從取代現有金融業者轉向建立合作關係"],"ans":2,"exp":["📝 解析：WEF 2017年「超越金融科技（Beyond Fintech）」報告指出：金融科技公司改變了金融服務的運作結構與客戶取得、使用金融服務的方法，其策略已從取代既有金融業者轉向與其合作，(1)(3)(4)正確。(2)錯誤：金融科技公司並未成為各國市場的主導業者，主導地位仍多在大型既有金融機構與大型科技公司。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.65,"w":1,"sw":0.01201,"id":"14科技力-39"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"13-58","stem":"依據2016 年世界經濟論壇提出的報告「未來金融服務的基礎建設」中提到將會影響金融業的新興科技，不包括下列何者？","opts":["生物科技應用","認知運算","機器學習／預測型分析","開放銀行"],"ans":4,"exp":["📝 解析：世界經濟論壇 2016 年《未來金融服務的基礎建設》報告列出將影響金融業的新興「科技」，包括生物科技（生物辨識）應用、認知運算、機器學習／預測型分析、區塊鏈、雲端、物聯網等。開放銀行是一種資料分享的商業模式／政策，不是新興科技，故不包括。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9667,"w":1,"sw":0.01201,"id":"13科技力-58"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"12-57","stem":"世界經濟論壇2015 年提出的報告「未來的金融服務」，其中關鍵發現之一為「A 將會是立即受到破壞式創新衝擊的產業；但是受到最大影響的將會是B」，A、B 分別指的為下列何者？","opts":["A：銀行業、B：保險業","A：銀行業、B：證券業","A：保險業、B：銀行業","A：保險業、B：證券業"],"ans":1,"exp":["📝 解析：世界經濟論壇 2015 年《未來的金融服務》報告的關鍵發現之一：銀行業會最立即受到破壞式創新衝擊，但受到最大影響的將是保險業，故 A＝銀行業、B＝保險業，選(1)。"],"pos":0.95,"w":1,"sw":0.01201,"id":"12科技力-57"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"10-1","stem":"所謂的「FinTech 3.0」是指下列何者？","opts":["跨國界的金融交易資訊可精確的即時進行交換","現代化的自動清算機構的出現","全球性的機構，如：Worldwide Interbank Financial Telecommunications, SWIFT 之成立","非銀行(Nonbank)的新創公司有機會推銷其利基型的金融產品與服務給消費者、公司行號、甚至是傳統金融業者"],"ans":4,"exp":["📝 解析：依教材（引 CFA Institute 2017 的分期），FinTech 3.0 從 2008 年全球金融風暴後開始：資通訊快速發展，非銀行（Nonbank）新創公司得以向消費者、公司行號甚至傳統金融業者推銷利基型金融產品與服務，故選(4)。(1)跨國金融交易資訊可精確即時交換，指 1866 年海底電報線架設，屬 FinTech 1.0；(2)現代化自動清算機構出現與(3)SWIFT 成立，屬 1960 年代末起的 FinTech 2.0。"],"pos":0.0167,"w":1,"sw":0.01201,"id":"10科技力-01"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"10-41","stem":"根據WEF(2015)，有關金融科技造成顧客與金融機構關係改變，下列敘述何者錯誤？","opts":["傳統金融機構可能發展成金融產品供應商","金融機構走向「一站購足」的大眾市場模式","金融機構需要通過同業或異業結合以滿足顧客需求","金融機構將面臨顧客對服務標準的提高"],"ans":2,"exp":["📝 解析：答案(2)錯誤：WEF（2015）指出金融科技使服務「拆分化」（unbundling），新進業者專攻特定利基服務，傳統金融機構「一站購足」大眾市場模式的優勢反而被削弱。其他敘述正確：傳統機構可能轉為產品供應商（1）、需透過同業或異業合作滿足顧客（3）、顧客對服務標準要求提高（4）。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6833,"w":1,"sw":0.01201,"id":"10科技力-41"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"7-55","stem":"根據2015 年6 月世界經濟論壇(WEF)「金融服務的未來」報告，有關金融業在金融科技時代將面臨的趨勢，下列敘述何者錯誤？","opts":["金融機構與非金融機構差異縮小，金融機構面臨競爭","金融機構實體分行優勢仍在，可透過「一站購足」交叉銷售方式，提高整體營收或利潤","傳統金融機構需調整原本的業務模式，透過自行發展或併購的方式提供金融科技服務","金融機構部分業務流程將委託外部專業企業專責處理(流程外部化，Process Externalisation)"],"ans":2,"exp":["📝 解析：答案(2)錯誤：WEF（2015）指出金融科技業者以專精服務瓜分市場，傳統金融機構的實體分行優勢正被削弱，「一站購足」交叉銷售模式反而受到挑戰。金融與非金融機構界線模糊（1）、傳統機構需自建或併購金融科技（3）、流程外部化（4），皆為報告所述趨勢。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9167,"w":1,"sw":0.01201,"id":"7科技力-55"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"6-30","stem":"金融科技對整體金融業的挑戰與機會，下列何者錯誤？","opts":["廣泛使用人工智慧","廣泛使用大數據","中介化","使顧客與金融機構關係產生改變"],"ans":3,"exp":["📝 解析：金融科技讓供需雙方可透過平台直接媒合（如 P2P 借貸、群眾募資），帶來的是「去中介化」（Disintermediation），而不是中介化，故選項(3)錯誤。廣泛使用人工智慧、大數據，以及使顧客與金融機構的關係改變（客戶主導、通路數位化），都是金融科技帶來的挑戰與機會。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5,"w":1,"sw":0.01201,"id":"6科技力-30"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"6-41","stem":"銀行使用數位科技的發展歷史，請依照時間先後順序排列。 A.網路銀行 B.自動櫃員機(ATM) C.電話銀行 D.直銷銀行","opts":["ABCD","CDBA","BCAD","ACBD"],"ans":3,"exp":["📝 解析：銀行數位科技發展順序：自動櫃員機 ATM（1960 年代末，英國巴克萊銀行 1967 年啟用）→ 電話銀行（1980 年代）→ 網路銀行（1990 年代中期，如 1995 年美國 SFNB）→ 直銷銀行（不設分行、以網路與電話直接服務，1990 年代後期興起），故為 BCAD，選(3)。"],"pos":0.6833,"w":1,"sw":0.01201,"id":"6科技力-41"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"6-54","stem":"在WEF 金融科技創新項目中，下列哪一種創新項目是屬於支付功能？","opts":["群眾募資","無現金世界","股權投資者","通路偏好移轉"],"ans":2,"exp":["📝 解析：WEF 2015 年「金融服務的未來」報告把金融科技創新分成六大功能、十一個創新項目。支付功能的創新項目為「無現金世界」與「新興支付軌道」，故選(2)。群眾募資屬籌資功能；「股權投資者／賦權投資者」屬投資管理功能；「通路偏好移轉」屬存貸功能。"],"pos":0.9,"w":1,"sw":0.01201,"id":"6科技力-54"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"5-1","stem":"有關銀行使用數位科技的歷史敘述，下列何者錯誤？","opts":["花旗銀行的前執行長John Reed 在1980 年，曾經說過\"Banking is just bits and bytes\"","2007 年蘋果公司(Apple Inc)推出iPhone 智慧型手機，重新定義了手機與客戶互動的方式","行動電話自1996 年日益普及後，不少銀行及科技公司嘗試應用此一新設備建立新的服務通路","隨著2005 年將網際網路(Internet) 技術從國防應用開放至民間後，開啟了網路經濟時代"],"ans":4,"exp":["📝 解析：選項(4)錯：網際網路由美國國防（ARPANET）用途開放民間與商業使用是在 1990 年代初（約 1991～1995 年 NSFNET 解除商業限制），隨即開啟網路經濟時代，不是 2005 年。(1)花旗前執行長 John Reed 曾說「Banking is just bits and bytes」；(2)蘋果 2007 年推出 iPhone 重新定義手機互動；(3)1990 年代中期行動電話普及後，銀行與科技公司開始嘗試行動通路，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.0167,"w":1,"sw":0.01201,"id":"5科技力-01"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"5-39","stem":"下列何者不是金融服務創新具備的共同發展特性？","opts":["具備跨境與跨業的商業模式","強調虛擬化的整合與通路應用","需建構服務平台，但也需維持中介化","致力於引進科技應用於金融科技價值鏈"],"ans":3,"exp":["📝 解析：金融服務創新的共同特性包括：具跨境與跨業的商業模式、強調虛擬化整合與通路應用、致力於把科技引進金融價值鏈。金融科技需建構服務平台，但趨勢是「去中介化」，讓供需雙方直接媒合，不是維持中介化，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.65,"w":1,"sw":0.01201,"id":"5科技力-39"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"4-37","stem":"下列何者非未來金融服務業的營運模式與風險管理趨勢？","opts":["未來將以便利、隨取隨用、客製化的服務取勝","依照不同的價值與顧客習慣差別訂價","有更多投資在創新科技上的機會","未來手機、線上、面對面等通路的接觸點界限將更趨清楚"],"ans":4,"exp":["📝 解析：(4)錯：未來手機、線上、面對面等通路會更加融合（全通路），客戶在各通路間無縫切換，接觸點界限是「越來越模糊」，不是更清楚。(1)便利、隨取隨用、客製化服務取勝；(2)依價值與顧客習慣差別訂價；(3)更多投資創新科技的機會，皆是趨勢。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6167,"w":1,"sw":0.01201,"id":"4科技力-37"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"4-55","stem":"根據2015 年6 月世界經濟論壇(WEF)「金融服務的未來」報告，下列何者不是金融科技興起對傳統金融機構的影響？","opts":["智慧型機器的使用","去銀行中介角色","金融機構更能擴大市占率","金融機構與客戶關係改變"],"ans":3,"exp":["📝 解析：WEF 2015 年報告指出金融科技對傳統金融機構的影響包括：智慧型機器（自動化）的使用、去銀行中介化、金融機構與客戶關係改變等。金融科技業者瓜分支付、借貸、理財等業務，傳統金融機構市占率面臨被侵蝕，並非「更能擴大市占率」，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9167,"w":1,"sw":0.01201,"id":"4科技力-55"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"3-34","stem":"醫護社工師定期攜帶科技診具到被關懷者府上看護或服務，平日則以線上平台、穿戴式裝置追蹤他們身心狀況，其意義接近金融科技哪些觀念或應用？a.去中介化 b.智慧感測 c.遠端資料傳輸 d.客製化服務 e.流程外部化","opts":["abc","cde","bcd","ace"],"ans":3,"exp":["📝 解析：以穿戴式裝置追蹤身心狀況屬 b.智慧感測；透過線上平台回傳資料屬 c.遠端資料傳輸；依個別被關懷者狀況到府提供服務屬 d.客製化服務，故選(3) bcd。本情境醫護人員仍是服務提供的中介者，並非 a.去中介化；也沒有把流程交給外部完成的 e.流程外部化。"],"pos":0.5667,"w":1,"sw":0.01201,"id":"3科技力-34"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"2-1","stem":"下列何項發展最不可能影響未來銀行經營面貌？","opts":["行動技術(Mobile)","社群技術(Social)","大數據(Big Data)","3D 列印技術(3D printing)"],"ans":4,"exp":["📝 解析：行動技術、社群技術、大數據直接改變銀行與客戶互動、行銷及風險管理方式，是影響未來銀行經營的關鍵科技。3D 列印主要影響製造業的生產模式，與銀行服務關聯最低，故選(4)。"],"pos":0.0167,"w":1,"sw":0.01201,"id":"2科技力-01"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"2-55","stem":"金融科技(FinTech)並非近年才開始，下列何種金融服務發生的時間最早？","opts":["德國儲蓄與財富銀行(BSV)提供之電話銀行服務","中國大陸阿里巴巴集團提供之電子商務線上交易服務","美國折扣證券商E-Trade 提供之線上證券交易業務","美國安全第一網路銀行(Security First Network Bank)提供之純網路銀行(Online-Only)服務"],"ans":1,"exp":["📝 解析：德國儲蓄與財富銀行(BSV)1965 年在法蘭克福成立並提供電話銀行服務（被視為直銷銀行先驅、ING-DiBa 的前身），是選項中最早的，故選(1)。其餘：E-Trade 1992 年開始提供線上證券交易、美國安全第一網路銀行(SFNB)1995 年成為全球第一家純網路銀行、阿里巴巴 1999 年才成立。"],"pos":0.9167,"w":1,"sw":0.01201,"id":"2科技力-55"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"1-32","stem":"有關金融科技(FinTech)成為潮流之原因，下列敘述何者錯誤？","opts":["資訊科技蓬勃發展","2008 年金融海嘯之發生","1997 年亞洲金融風暴之發生","行動通訊、電子商務與共享經濟的創新"],"ans":3,"exp":["📝 解析：金融科技成為潮流的原因包括：資訊科技蓬勃發展；2008 年金融海嘯後民眾對傳統金融機構信任下降、銀行受更嚴格監理，給新創業者發展空間；行動通訊、電子商務與共享經濟的創新。1997 年亞洲金融風暴與這波 FinTech 興起沒有直接關係，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5333,"w":1,"sw":0.01201,"id":"1科技力-32"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"1-34","stem":"依2015 年6 月世界經濟論壇(WEF)所提出之6 項金融服務功能及11 項金融科技創新項目，下列敘述何者錯誤？","opts":["無現金世界(Cashless World)創新項目屬於「支付」功能","機器革命(Smarter, Faster Machines)創新項目屬於「籌資」功能","流程外部化(Process Externalisation)創新項目屬於「投資管理」功能","通路偏好移轉(Shifting Customer Preferences)創新項目屬於「存貸」功能"],"ans":2,"exp":["📝 解析：WEF 2015《金融服務的未來》把 11 項創新歸入 6 大功能：支付（無現金世界、新興支付管道）、保險（保險分拆、保險串接裝置）、存貸（替代性借貸、通路偏好移轉）、籌資（群眾募資）、投資管理（賦權投資人、流程外部化）、市場資訊供給（機器革命、新興市場平台）。「機器革命」屬市場資訊供給功能，不是籌資，故(2)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5667,"w":1,"sw":0.01201,"id":"1科技力-34"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"1-41","stem":"下列何者非屬互聯網金融業者發展金融服務之優勢？","opts":["創造支付場景／情境的能力","資金優勢","擁有大量顧客群及交易資料(包括電商等交易數據)","與顧客的交易／往來頻次勝於一般的金融業者"],"ans":2,"exp":["📝 解析：互聯網金融業者（如阿里巴巴、騰訊）的優勢在於能創造支付場景、擁有大量顧客群與電商交易數據、與顧客往來頻次高於一般金融業者；資金規模與資本實力則是傳統金融機構的優勢，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.6833,"w":1,"sw":0.01201,"id":"1科技力-41"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"1-48","stem":"下列何者不是 Gartner 在 2016 年的趨勢預測報告中所提出的三大資訊科技趨勢構面？","opts":["數位主軸","電子商務","智慧機器","新型架構及平台"],"ans":2,"exp":["📝 解析：Gartner 2016 年十大策略科技趨勢分為三大構面：數位網格(The Digital Mesh，題目稱數位主軸)、智慧機器(Smart Machines)、新 IT 現實（題目稱新型架構及平台）。電子商務不在其中，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8,"w":1,"sw":0.01201,"id":"1科技力-48"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"1-52","stem":"下列哪一項不屬於金融科技(FinTech)應用的一環？","opts":["大數據應用","生物識別","全球定位","區塊鏈技術"],"ans":3,"exp":["📝 解析：依教材，金融科技應用的核心技術包括大數據、生物識別、區塊鏈、人工智慧、雲端運算等；全球定位(GPS)是一般定位技術，雖可作為輔助（如保險遠程資訊處理），但未被列為金融科技應用的一環，故選(3)。","⚠ 官方答案有疑義（考試以官方答案為準）：GPS／定位廣泛用於詐欺偵測、車險UBI與情境行銷等FinTech場景；官方答案與同卷敘述不一致，考試仍以官方為準。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8667,"w":1,"sw":0.01201,"id":"1科技力-52"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"1-54","stem":"有關金融科技產生的顧客與傳統金融機構關係的改變，下列敘述何者錯誤？","opts":["金融科技公司能夠滿足客戶的金融需求，並培養客戶的金融科技體驗，改變傳統金融機構與客戶的關係","傳統金融機構可能發展成為金融產品供應商","面對金融科技公司的挑戰，傳統金融機構應堅持實體通路的規模優勢","金融科技公司未來可能通過同業或異業結合，提供系列的金融產品或服務套件，與傳統金融業者產生更激烈的競爭"],"ans":3,"exp":["📝 解析：面對金融科技公司挑戰，傳統金融機構應進行數位轉型、與科技業者合作，而不是固守實體通路的規模優勢，故(3)錯誤。(1)金融科技改變傳統機構與客戶的關係、(2)傳統機構可能轉為金融產品供應商、(4)金融科技公司可能透過同業／異業結合提供套件服務加劇競爭，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9,"w":1,"sw":0.01201,"id":"1科技力-54"},{"s":"all","ch":"科技力 1｜金融科技概論與發展趨勢","star":0,"n":1,"refs":"1-59","stem":"下列何者不是未來金融服務的共同發展要素？","opts":["具備跨境與跨業之商業模式","發展服務為平台化與去中介化","僅強調實體通路的變化性與多元應用","致力於引進科技應用於金融科技價值鏈"],"ans":3,"exp":["📝 解析：未來金融服務的共同發展要素包括：跨境與跨業的商業模式、服務平台化與去中介化、引進科技應用於金融價值鏈。「僅強調實體通路」不符趨勢（重點在數位化與虛實整合），故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9833,"w":1,"sw":0.01201,"id":"1科技力-59"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"21-13","stem":"無現金化社會的發展需具備若干關鍵條件，下列敘述何者錯誤？","opts":["健全的身分驗證與資安機制","支付與收款設備的普及與整合","擴大使用場域與行銷推廣誘因","提高現金發行量以刺激支付活動"],"ans":4,"exp":["📝 解析：無現金社會需具備健全的身分驗證與資安機制、普及整合的支付收款設備、擴大的使用場域與推廣誘因。「提高現金發行量」只會強化現金使用，與無現金化方向相反，故(4)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2167,"w":1,"sw":0.00276,"id":"21科技力-13"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"21-14","stem":"下列何者非屬傳統支付模式？","opts":["信用狀","簽帳金融卡","現金","電子商務支付系統"],"ans":4,"exp":["📝 解析：傳統支付模式包括現金、支票、匯款、信用狀、信用卡、簽帳金融卡等由銀行體系提供的工具。電子商務支付系統（如第三方支付、電子支付）屬隨網路發展出的新興支付，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2333,"w":1,"sw":0.00276,"id":"21科技力-14"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"21-15","stem":"隨著金融科技發展，傳統支付工具逐漸轉向數位化系統，金融機構為降低風險導入電子票據與虛擬卡制度。雖提升效率，但仍存在安全疑慮。下列敘述何者正確？","opts":["電子票據仍保有實體存在性，可透過實體背書轉讓","電子簽章技術不具有防偽性","數位代碼化傳遞過程可完全免除身分驗證程序","虛擬卡片的發行實際上是電子信用卡的延伸應用"],"ans":4,"exp":["📝 解析：虛擬卡（無實體卡、僅有卡號與安全碼）由發卡機構發行，本質上是電子信用卡的延伸應用，故(4)正確。(1)電子票據以電子形式存在，以電子方式背書轉讓，不具實體；(2)電子簽章具防偽、防篡改與不可否認性；(3)代碼化（Tokenization）傳遞仍須進行身分驗證。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.25,"w":1,"sw":0.00276,"id":"21科技力-15"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"21-35","stem":"行動支付為強化身分驗證，常以裝置與行為指紋計分；在不侵犯隱私前提下，下列哪種風險評分組合較貼近現場實務？","opts":["僅看桌布圖案","只看記憶體用量","無任何隱私告知","結合打字節奏、地理行為與裝置參數的風險分數"],"ans":4,"exp":["📝 解析：行動支付的風險評分實務上會結合行為生物特徵（打字節奏、滑動習慣）、地理行為（常用地點、異常位置）與裝置參數（裝置指紋、作業系統、IP）計算風險分數，並應進行隱私告知。桌布圖案、記憶體用量與身分無關，無隱私告知則違反個資法。"],"pos":0.5833,"w":1,"sw":0.00276,"id":"21科技力-35"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"21-48","stem":"有關P2P 匯兌(Peer-to-Peer Money Transfers)透過網路平台直接連接使用者進行資金轉移。下列敘述何者正確？","opts":["完全依賴傳統銀行櫃台，交易速度與傳統跨境匯款相同","利用網路平台直接連結用戶，降低手續費並縮短跨境匯款時間","主要以現金交易為主，缺乏電子化管理","不支援行動支付或電子錢包，使用範圍受限"],"ans":2,"exp":["📝 解析：P2P 匯兌透過網路平台直接配對不同國家、反向需求的使用者，資金不需實際跨境流動，可降低手續費與匯差並縮短跨境匯款時間，故(2)正確。它不依賴銀行櫃台、以電子化方式交易，並可支援行動支付與電子錢包。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.8,"w":1,"sw":0.00276,"id":"21科技力-48"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"20-13","stem":"有關行動支付的敘述，下列何者錯誤？","opts":["Apple Pay 及Google Pay 可近端支付","行動支付包括遠端及近端支付","不需將行動裝置靠近任何感應器就可完成支付，稱近端支付","TSM 可說是行動支付成功運作的核心關鍵"],"ans":3,"exp":["📝 解析：近端支付須將手機靠近感應器（NFC）或掃碼，在實體店面完成付款，如 Apple Pay、Google Pay；不需靠近感應器、透過網路完成的是遠端支付，故(3)錯。行動支付包括遠端及近端支付，TSM（信任服務管理平台）負責安全元件的空中下載與金鑰管理，是 NFC 行動支付運作的核心。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2167,"w":1,"sw":0.00307,"id":"20科技力-13"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"20-14","stem":"新冠肺炎疫情以來，許多非接觸裝置被支付公司以植入晶片方式作為支付工具，其「不包括」下列何者？","opts":["髮夾","手環","鑰匙圈","戒指"],"ans":1,"exp":["📝 解析：疫情後支付業者推出多種植入晶片的穿戴式非接觸支付裝置，常見為手環、鑰匙圈、戒指（以及手錶、貼紙）。髮夾不在常見之列，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2333,"w":1,"sw":0.00307,"id":"20科技力-14"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"20-39","stem":"下列何者為Apple Pay 行動支付使用的技術？","opts":["TSM(Trusted Service Manager)","HCE(Host Card Emulation)","RFID(Radio Frequency IDentification)","EMVCo Tokenization"],"ans":4,"exp":["📝 解析：Apple Pay採NFC近場通訊＋手機內安全元件（Secure Element），並以EMVCo Tokenization將真實卡號替換成裝置專屬代碼（Token），交易時不傳送真實卡號，故選(4)。HCE是以軟體模擬卡片、主要為Android Pay等採用；TSM是管理SIM卡安全元件的信任服務管理者；RFID是泛用無線識別技術，非Apple Pay特有技術。"],"pos":0.65,"w":1,"sw":0.00307,"id":"20科技力-39"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"20-40","stem":"電子支付機構之第一類電子支付帳戶中，國內外小額匯兌之每筆金額，以等值新臺幣多少金額為限？","opts":["5 萬元","10 萬元","15 萬元","20 萬元第二部分：第41~60 題(每題2 分)"],"ans":2,"exp":["📝 解析：依「電子支付機構身分確認機制及交易限額管理辦法」§20，第一類電子支付帳戶國內外小額匯兌每筆以等值新臺幣10萬元為限（個人每月累計收、付款各100萬元，非個人各1,000萬元）。第二類帳戶每筆則為5萬元，勿混淆，故選(2)。"],"pos":0.6667,"w":1,"sw":0.00307,"id":"20科技力-40"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"19-11","stem":"2017 年歐盟支付服務指令 II (PSD2) 規定進行電子支付交易時，必須提供下列何者認證？","opts":["單因子認證","雙因子認證","多因子認證","彈性因子認證"],"ans":2,"exp":["📝 解析：歐盟PSD2要求電子支付採「強客戶認證（SCA）」，須使用知識（密碼）、持有（手機）、固有特徵（生物辨識）三類要素中至少兩種獨立要素，即雙因子認證，故選(2)。"],"pos":0.1833,"w":1,"sw":0.02901,"id":"19科技力-11"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"19-15","stem":"無現金化社會的推動，對於身分認證的作法必須跳脫客戶簽名、證件掃描等程序外，下列何者也不適合做為多方勾稽驗證？","opts":["客戶的稅籍資料","客戶的生物特徵","客戶的消費模式","客戶的使用習慣"],"ans":1,"exp":["📝 解析：無現金社會的身分認證可用客戶的生物特徵、消費模式、使用習慣等行為資料多方勾稽。稅籍資料屬高度敏感的政府資料，金融機構無法即時取得、亦不宜作為日常交易的驗證依據，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.25,"w":1,"sw":0.02901,"id":"19科技力-15"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"19-35","stem":"下列何者是行動支付的主要技術？","opts":["NFC","SIM","XML","RFID"],"ans":1,"exp":["📝 解析：行動支付最主要的技術是NFC（近場通訊），手機靠近感應端即可完成交易（如Apple Pay、Google Pay），故選(1)。SIM卡可作為安全元件載體但非支付通訊技術；XML是資料格式；RFID是較廣泛的無線識別技術，NFC即源自RFID但專為短距安全交易設計。"],"pos":0.5833,"w":1,"sw":0.02901,"id":"19科技力-35"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"19-48","stem":"有關P2P 跨境匯款的競爭之敘述，下列何者錯誤？","opts":["TransferWise 為數位式P2P 匯兌業者","因行動裝置普及率提高及跨境交易盛行，新興P2P 匯兌業者已對傳統非數位式業者造成營運壓力","美國Zelle 為數位式P2P 匯兌業者，一直以來只提供已註冊的用戶向其他同樣已註冊的用戶進行匯款，且交易頻率及交易金額由Zelle 限制，不受該帳戶往來銀行所限制","美國Venmo 為數位式P2P 匯兌業者，該公司將帳戶直接設在其系統中，而非運用原本往來銀行帳號進行連結，交易速度較快，但也可能欠缺FDIC 及NCUA 等存保機構對帳戶提供保障"],"ans":3,"exp":["📝 解析：美國Zelle由多家大型銀行共同建立，直接整合在銀行App中，收款人只要有參與銀行的帳戶即可收款，且交易限額由使用者的往來銀行設定，並非由Zelle統一限制，故(3)錯誤。(1)TransferWise（現Wise）為數位P2P匯兌業者；(2)新興業者對傳統業者造成壓力；(4)Venmo餘額存於自家系統、可能欠缺FDIC等存保保障，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8,"w":1,"sw":0.02901,"id":"19科技力-48"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"19-55","stem":"有關「電子支付機構資訊系統標準與安全控管作業基準辦法」的敘述，下列何者錯誤？","opts":["為了確保電子支付機構的收益穩定","確保交易資料隱密性及安全性","維持資料傳輸、交換或處理的正確性","為金融監督管理委員會於2015 年4 月提出"],"ans":1,"exp":["📝 解析：「電子支付機構資訊系統標準及安全控管作業基準辦法」由金管會於2015年4月27日發布（同年5月3日施行），目的在確保交易資料隱密性與安全性、維持資料傳輸交換處理的正確性，而非確保電子支付機構收益穩定，故(1)錯誤。⚠ 現行規定：此辦法已於2023年4月25日廢止，相關資安要求改由其他規定承接；考試若再出，仍照官方答案選(1)。","⚠ 現行規定：「電子支付機構資訊系統標準及安全控管作業基準辦法」已於2023年4月25日（金管銀票字第11202711471號令）廢止；本題答案(1)判斷不受影響（考試以官方答案為準）。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9167,"w":1,"sw":0.02901,"id":"19科技力-55"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"17-15","stem":"我國金融監督管理委員會為提升非現金支付交易使用率，於2021 年3 月訂定兩項新衡量指標，已知其中一項為「交易金額」，請問另一項指標為何？","opts":["接受使用非現金支付商店數","非現金支付交易筆數","非現金支付消費者之平均年齡","非現金支付之費用率"],"ans":2,"exp":["📝 解析：金管會2021年3月4日成立「提升非現金支付交易推動工作小組」，將衡量指標由舊的「電子化支付比率」改為「非現金支付交易金額」與「非現金支付交易筆數」兩項，目標為2023年筆數較2020年成長50%、金額達新臺幣6兆元（ATM轉帳納入計算），故選(2)。補充：2024年1月再訂新目標為2026年筆數80億筆、金額10兆元。"],"pos":0.25,"w":1,"sw":0.01201,"id":"17科技力-15"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"16-15","stem":"2017 年歐盟支付服務指令II (Payment Services Directive, PSD2)要求進行電子支付時，要進行強化消費者認證。規定交易時必須提供幾類以上的身分證明？","opts":["兩類","三類","四類","五類"],"ans":1,"exp":["📝 解析：歐盟支付服務指令第二版PSD2（2015年通過、2018年1月施行，其強化客戶認證SCA技術標準2019年9月起適用）要求電子支付須做強化客戶認證：從「所知（密碼）、所持（手機、卡片）、所是（生物特徵）」三類中至少提供兩類且彼此獨立的驗證因素，故選(1)兩類。"],"pos":0.25,"w":1,"sw":0.01201,"id":"16科技力-15"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"16-48","stem":"下列何者非屬電子支付發展的主要原因？","opts":["手機及平板電腦等手持式行動裝置的普及","裝置內各種密碼的輸入便利與生物辨識裝置","以連結信用卡方式進行消費付款","以儲值或是連結金融機構帳戶等方式從事資金移轉服務"],"ans":3,"exp":["📝 解析：電子支付興起的主因是手機與平板等行動裝置普及、裝置內密碼輸入與生物辨識便利，以及可透過儲值或連結銀行帳戶進行資金移轉（我國電子支付機構管理條例的核心業務）。連結信用卡消費付款是傳統信用卡支付早已存在的方式，並非電子支付發展的主要原因，選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8,"w":1,"sw":0.01201,"id":"16科技力-48"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"15-16","stem":"有關主機卡模擬(Host Card Emulation, HCE)的支付技術之敘述，下列何者錯誤？","opts":["原本存放於安全元件(Secure Element, SE)的交易金鑰會改存至雲端服務主機","發卡機構會編製虛擬卡號至支付工具，以取代最初的卡號資料(Primary Account Number, PAN)","發卡機構會派送限制用途之交易金鑰(Limited Use Key)至支付工具上的行動支付應用程式(mobile Payment Application)","支援近距離無線通訊(Near Field Communication, NFC)的讀卡機和手機安全元件(Secure Element, SE)會進行資料交換，以確保交易安全"],"ans":4,"exp":["📝 解析：主機卡模擬（HCE）的特點是不需要手機內的安全元件（SE）：交易金鑰改存放在雲端主機，發卡機構以虛擬卡號（Token）取代原始卡號PAN，並派送限制用途金鑰（LUK）到手機支付App，(1)(2)(3)正確。(4)描述的是傳統SIM／eSE式NFC支付由安全元件與讀卡機交換資料的方式，與HCE「免安全元件」的概念不符，故錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2667,"w":1,"sw":0.01201,"id":"15科技力-16"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"15-18","stem":"有關全球P2P 匯兌的敘述，下列何者錯誤？","opts":["相較於金融機構可更快速","相較於金融機構手續費可更便宜","相較於金融機構匯率可更優惠","業務持續萎縮中"],"ans":4,"exp":["📝 解析：全球P2P匯兌（如Wise，原TransferWise）透過媒合不同幣別的匯款需求，避免實際跨境移轉，因此比傳統金融機構更快速、手續費更便宜、匯率更接近中間價，(1)(2)(3)正確。(4)錯誤：此類業務規模持續成長，並非萎縮。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3,"w":1,"sw":0.01201,"id":"15科技力-18"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"15-49","stem":"EMV 支付代碼服務框架是為了解決何種問題？","opts":["為了加速完成支付交易","為了讓店家請款時對帳方便","為了讓消費者不需記憶冗長的卡號資訊","為了讓支付的過程中，不讓店家有可能儲存客戶的卡號資料"],"ans":4,"exp":["📝 解析：EMVCo支付代碼化（Payment Tokenization）框架以代碼（Token）取代真實卡號PAN進行交易，商店端只接觸與儲存代碼，即使商店資料外洩也拿不到真實卡號，核心目的在避免店家儲存客戶卡號資料，選(4)。加速交易、方便對帳、免記卡號都不是此框架的主要目的。"],"pos":0.8167,"w":1,"sw":0.01201,"id":"15科技力-49"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"14-17","stem":"下列何者非屬行動支付興起的原因？","opts":["行動裝置普及","行動裝置內密碼輸入便利","生物辨識裝置普及","行動支付資金移轉不便利"],"ans":4,"exp":["📝 解析：行動支付興起的原因是行動裝置普及、裝置內密碼輸入便利、生物辨識裝置普及，使隨時隨地付款與資金移轉變得「更便利」。(4)「行動支付資金移轉不便利」與事實相反，不是興起原因，選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2833,"w":1,"sw":0.01201,"id":"14科技力-17"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"14-18","stem":"有關HCE 的敘述，下列何者錯誤？","opts":["透過app 取得控制權","免除OTA 介接費用","在雲端進行晶片模擬","需換發SIM 卡"],"ans":4,"exp":["📝 解析：HCE（主機卡模擬）透過手機App取得NFC控制權、在雲端進行晶片模擬，不需依賴電信業者SIM卡中的安全元件，因而免除空中下載（OTA）介接費用，(1)(2)(3)正確。(4)錯誤：免換發SIM卡正是HCE相對於SIM卡式NFC（TSM模式）的主要優點。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3,"w":1,"sw":0.01201,"id":"14科技力-18"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"13-17","stem":"下列何者非屬無現金化社會的發展條件？","opts":["便利的支付方式","實名制的認證方式","必須是已開發國家","法令制度的配合"],"ans":3,"exp":["📝 解析：無現金社會的發展條件包括：便利的支付方式、實名制的身分認證、法令制度配合（如電子支付法規、稅務配套）。不一定要是已開發國家，例如中國、肯亞（M-Pesa）等開發中國家的行動支付普及率反而很高，故(3)非屬條件。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2833,"w":1,"sw":0.01201,"id":"13科技力-17"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"13-18","stem":"我國國家發展委員會成立行動支付跨部會推動會議，下列何者非屬跨部會機制推動三大主軸之一？","opts":["擴大應用場域","減少鑄印發行貨幣","加強行銷體驗","完備行動支付基礎環境"],"ans":2,"exp":["📝 解析：國發會行動支付跨部會推動會議的三大主軸為：擴大應用場域、加強行銷體驗、完備行動支付基礎環境，目標是提高行動支付普及率。「減少鑄印發行貨幣」不是推動主軸（貨幣發行屬央行職權），故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3,"w":1,"sw":0.01201,"id":"13科技力-18"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"13-41","stem":"根據聯合國(UNSGSA)2019 年之報告，若某家銀行將電子錢包及P2P 轉帳應用於商品服務中，係屬於下列何項領域之運用？","opts":["支付","借貸","儲蓄","保險"],"ans":1,"exp":["📝 解析：依聯合國秘書長普惠金融特別倡議（UNSGSA）2019 年報告，數位金融服務分為支付、儲蓄、借貸、保險等領域；電子錢包與 P2P 轉帳都是資金移轉工具，屬於「支付」領域的應用。"],"pos":0.6833,"w":1,"sw":0.01201,"id":"13科技力-41"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"12-18","stem":"有關電子支付機構受高度監理的主要原因，下列何者錯誤？","opts":["電子支付機構規模逐漸龐大","降低金融業的高度競爭態勢","防止出現資金周轉困難或是產生洗錢資恐等問題","確保資金用途及帳戶所有人身分經過認證"],"ans":2,"exp":["📝 解析：電子支付機構受高度監理，是因規模逐漸龐大、經手大量民眾儲值款項，需防止資金周轉不靈與洗錢資恐，並確保資金用途與帳戶所有人身分經過認證（依《電子支付機構管理條例》辦理實名認證與資金保管）。監理的目的不是「降低金融業競爭」，反而是在開放競爭下維護安全，故(2)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3,"w":1,"sw":0.01201,"id":"12科技力-18"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"12-48","stem":"下列何項非屬主管機關對電子支付機構的業務或經營開放方向？","opts":["加強吸引境外機構設立或入股","開放不同電子支付業者平台之間的相互轉帳","進行外幣買賣業務(一定金額以下之小額匯兌)","強化無接觸金融服務之範疇"],"ans":1,"exp":["📝 解析：主管機關對電子支付機構的開放方向（2021 年《電子支付機構管理條例》修正）包括：開放不同電子支付機構間互相轉帳（跨機構互通）、開放小額外幣買賣與匯兌、擴大無接觸金融服務等。「加強吸引境外機構設立或入股」不是開放方向，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8,"w":1,"sw":0.01201,"id":"12科技力-48"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"11-17","stem":"下列何種技術的發展與無現金社會較無關係？","opts":["網際網路","機器人理財","行動載具的開放式作業系統","行動載具上諸多的數位元件"],"ans":2,"exp":["📝 解析：無現金社會仰賴網際網路、行動載具的開放式作業系統（iOS、Android 讓支付 App 普及）、行動載具上的數位元件（NFC、相機掃碼、指紋感測）。機器人理財屬於投資管理服務，與支付工具無現金化較無關係，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2833,"w":1,"sw":0.01201,"id":"11科技力-17"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"11-18","stem":"有關NFC 的敘述，下列何者錯誤？","opts":["是最安全的行動交易形式","傳輸距離長","手機必須具有NFC 功能才能使用","收款店家需有NFC 讀卡機"],"ans":2,"exp":["📝 解析：NFC（近場通訊）的特點正是傳輸距離「短」，一般約 10 公分以內（實務多在 4 公分內），說傳輸距離長錯誤。也因距離短、需刻意靠近感應，被視為安全性高的行動交易方式；使用時手機須具 NFC 功能、店家需有 NFC 讀卡機。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3,"w":1,"sw":0.01201,"id":"11科技力-18"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"11-19","stem":"在支付的模式發展中，下列何者與支付的連結與運用成為傳統支付與新興支付模式的重要分野？","opts":["市話","手錶","網際網路","信用卡"],"ans":3,"exp":["📝 解析：支付與網際網路的連結與運用，是傳統支付與新興支付的分野：電子商務、第三方支付、行動支付、P2P 轉帳都建立在網路之上。市話、手錶只是載具或通訊方式；信用卡本身屬傳統支付工具。"],"pos":0.3167,"w":1,"sw":0.01201,"id":"11科技力-19"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"11-50","stem":"一種新興跨境匯款模式，透過媒合，協助雙方完成外幣兌換，稱為下列何者？","opts":["數位貨幣","P2P 匯兌","群眾募資","Open API"],"ans":2,"exp":["📝 解析：P2P 匯兌是由平台媒合有相反外幣需求的雙方（例如一方要台幣換美元、另一方要美元換台幣），讓資金不必實際跨境移動即完成兌換，降低匯費與匯差，代表業者如 TransferWise（現 Wise）。數位貨幣、群眾募資、Open API 都不是這種媒合式跨境匯款模式。（我國外匯業務須經許可，P2P 匯兌不得自行經營。）"],"pos":0.8333,"w":1,"sw":0.01201,"id":"11科技力-50"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"9-17","stem":"EMV 支付代碼服務框架(EMV® Payment Tokenisation Specification Technical Framework)是為了解決何種問題？","opts":["為了加速完成支付交易","為了讓店家請款時對帳方便","為了讓消費者不需記憶冗長的卡號資訊","為了讓支付的過程中，不讓店家有可能儲存客戶的卡號資料"],"ans":4,"exp":["📝 解析：答案(4)：EMV 支付代碼化（Tokenisation）以一組代碼（Token）取代真實卡號（PAN）進行交易，店家與收單端只看到 Token，無法儲存客戶真實卡號，即使店家資料外洩也不會洩漏卡號，目的是提升支付安全。它不是為了加速交易、方便對帳或讓消費者免記卡號。"],"pos":0.2833,"w":1,"sw":0.01201,"id":"9科技力-17"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"9-19","stem":"有關P2P 匯兌(Peer-to-peer Money Transfers)業者強調之特色的敘述，下列何者錯誤？","opts":["相對於金融機構可更快的匯入跨境帳戶","相對於金融機構有機會可取得較好的兌換匯率","在安全的疑慮下，跨境P2P 匯款方式已逐漸萎縮","在跨境P2P 匯款的競爭下，成本為其決勝關鍵之一"],"ans":3,"exp":["📝 解析：答案(3)錯誤：P2P 匯兌（如 TransferWise／Wise）透過媒合兩地相反方向的匯款需求，跨境到帳更快（1）、匯率較好（2），以低成本作為競爭關鍵（4），業務規模持續成長，並非因安全疑慮而萎縮。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3167,"w":1,"sw":0.01201,"id":"9科技力-19"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"9-51","stem":"有關無現金社會之敘述，下列何者錯誤？","opts":["從1990 年代開始，從家中電腦以網頁方式連上網路銀行服務，進行轉帳或支付的無現金方式","2010 年代蘋果公司生產iPhone，谷歌公司推出安卓手機作業系統，採用各種支付程式在手機上進行付款的可行性","達成無現金社會所遇到的瓶頸，主要是百貨公司或是網路購物等場域，反而不是傳統市場、小型攤商及個人商店","無論實體現金存在與否，只要是使用各種數位化方式進行現金交易，或是使用去中心化的加密貨幣進行交易，都可視為無現金化社會的情況"],"ans":3,"exp":["📝 解析：答案(3)錯誤：百貨公司與網路購物早已普遍接受信用卡、電子支付，推動無現金社會真正的瓶頸在傳統市場、小型攤商及個人商店（收款設備、手續費、習慣等因素）。(1) 1990 年代網路銀行、(2) 2010 年代智慧手機支付的發展歷程正確；(4) 以數位方式或加密貨幣交易皆可視為無現金化。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.85,"w":1,"sw":0.01201,"id":"9科技力-51"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"8-18","stem":"有關行動支付中的TSM(Trusted service manager) 與HCE(host card emulation)的比較，下列何者錯誤？","opts":["HCE 機制中服務供應商可以自主開發或整合APP 加值功能，創造額外的營收","HCE 機制可免除在行動支付的過程中，來自營運商的OTA 平台介接費用，因而降低建置與營運成本","TSM 機制將安全元件(SE)放到手機SIM 卡中，NFC 讀卡機直接和手機中的安全元件(SE)交換資料","TSM 機制中手機SIM 卡會受到開啟手機電源與連網等限制，無法完成離線(offline)的近端支付交易"],"ans":4,"exp":["📝 解析：答案(4)錯誤：TSM 機制把安全元件（SE）放在手機 SIM 卡中，NFC 讀卡機直接與 SE 交換資料（3），因此即使手機未連網，甚至部分機型關機時仍可完成離線近端支付，「無法離線交易」的說法錯誤。HCE 以雲端模擬卡片，服務商可自主開發 App 加值（1）並免除電信業者 OTA 介接費用（2），正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3,"w":1,"sw":0.01201,"id":"8科技力-18"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"8-19","stem":"下列何種措施不會促進無現金化社會的發展？","opts":["擴大行動支付回饋點數使用場域，使其橫跨虛實通路、跨場景行銷、跨業種類別消費情境","電子支付業者必須基於客戶生物特徵、消費模式、使用習慣等進行有效、持續性的身份辨認","禁止非金融業者應用程式介面API 開發，避免客戶個資外洩，妨礙電子支付發展","民眾使用電子支付的消費金額得納入所得稅扣除額"],"ans":3,"exp":["📝 解析：答案(3)：禁止非金融業者使用 API 開發應用，會阻斷電子支付與各種場景的串接，不利無現金化發展；應以資安規範與授權機制保護個資，而非全面禁止。擴大回饋點數場域（1）、以生物特徵與消費模式持續辨識身分強化安全（2）、提供租稅誘因（4）都能促進無現金社會。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3167,"w":1,"sw":0.01201,"id":"8科技力-19"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"7-16","stem":"下列何者不是行動支付成功發展的首要因素？","opts":["重視使用者需求","經濟生態體系(ecosystem)的建立","完善的法律架構","大量的資本支出"],"ans":4,"exp":["📝 解析：答案(4)：行動支付成功的首要因素是重視使用者需求與體驗（1）、建立涵蓋消費者、商家、金融機構的經濟生態體系（2）、完善的法律架構（3）。大量資本支出並不保證成功，關鍵在於使用者與商家願不願意使用，故非首要因素。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2667,"w":1,"sw":0.01201,"id":"7科技力-16"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"7-17","stem":"讓行動裝置只要透過行動網路或Wi-Fi 即可完成信用卡、金融卡等相關交易資料接收的工作，是下列哪一種技術？","opts":["SIM","TSM","OTA","NFC"],"ans":3,"exp":["📝 解析：答案(3)：OTA（Over-The-Air，空中下載）技術讓行動裝置透過行動網路或 Wi-Fi，以無線方式接收、寫入信用卡或金融卡等交易資料到手機安全元件中。SIM 是用戶識別卡，TSM 是信任服務管理平台（負責管理卡片資料的業者角色），NFC 是近距離感應傳輸技術，用在刷卡端而非資料下載。"],"pos":0.2833,"w":1,"sw":0.01201,"id":"7科技力-17"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"7-46","stem":"下列何項非屬成功的行動平台應具備的條件？","opts":["有能力吸引消費者與商店","有能力進行同業與異業合作","有能力整合提供各式支付工具","必須要有高額的行銷預算來支持"],"ans":4,"exp":["📝 解析：答案(4)：成功的行動支付平台須能同時吸引消費者與商店（雙邊市場，1）、與同業及異業合作擴大場景（2）、整合各式支付工具（3）。高額行銷預算只能短期拉抬用戶，並非必要條件，關鍵仍在使用者體驗與生態系建立。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7667,"w":1,"sw":0.01201,"id":"7科技力-46"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"7-47","stem":"穿戴式裝置的行動支付技術，所帶來的新浪潮，主要原因在於：","opts":["可搭配每天的服裝穿著","因隨身使用，比較不會被別人所濫用","由知名手錶業者提供，安全技術比較可靠","因符合行動支付的傳輸標準，可與消費者帳戶連結，便於支付"],"ans":4,"exp":["📝 解析：答案(4)：穿戴式裝置（智慧手錶、手環）能帶動行動支付新浪潮，主因是其符合行動支付傳輸標準（如 NFC、Token 化），可與消費者帳戶或卡片連結，抬手即可感應支付，十分便利。搭配服裝、不易被濫用、由錶廠提供都不是主要原因。"],"pos":0.7833,"w":1,"sw":0.01201,"id":"7科技力-47"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"6-12","stem":"下列NFC 支付模式何者不採用資料標記技術(EMVCo Tokenization)？","opts":["Samsung Pay","Android Pay","Apple Pay","HCE Pay"],"ans":4,"exp":["📝 解析：Apple Pay、Samsung Pay、Android Pay 都採用 EMVCo 的 Tokenization（以代碼 Token 取代真實卡號存放與傳輸），降低卡號外洩風險。依教材分類，HCE Pay（主機卡片模擬，把卡片資料放在雲端、以軟體模擬卡片）不採 EMVCo 資料標記技術，故選(4)。實務上部分 HCE 方案也會結合代碼化，本題依教材作答。"],"pos":0.2,"w":1,"sw":0.01201,"id":"6科技力-12"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"6-13","stem":"最早應用電子郵件(e-mail address)做為使用帳號，並用以辨識用戶間身分，打破傳統金融機構轉帳匯率的不便利，是下列哪一個行動支付平台？","opts":["歐付寶","PayPal","支付連","支付寶"],"ans":2,"exp":["📝 解析：PayPal（1998 年成立）最早以電子郵件地址作為帳號並辨識付款與收款雙方，只要知道對方 e-mail 就能付款，改善傳統銀行轉帳匯款需要帳號、手續繁瑣的不便，故選(2)。支付寶（2004）、歐付寶、支付連等都是較晚出現的第三方支付平台。"],"pos":0.2167,"w":1,"sw":0.01201,"id":"6科技力-13"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"6-14","stem":"有關第三方支付平台所主導的行動支付營運模式，下列何者不包括在內？","opts":["以電子商務平台為基礎","以社群媒體平台為基礎","以產業供應鏈信用支付平台為基礎","以電信平台為基礎"],"ans":4,"exp":["📝 解析：第三方支付平台主導的行動支付模式包括：以電子商務平台為基礎（如支付寶依附淘寶）、以社群媒體平台為基礎（如微信支付）、以產業供應鏈信用支付平台為基礎。以電信平台為基礎（如肯亞 M-PESA 由電信商 Safaricom 經營）屬於「電信業者主導」模式，不是第三方支付主導，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2333,"w":1,"sw":0.01201,"id":"6科技力-14"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"6-15","stem":"下列何者屬於遠端支付類型？","opts":["Apple Pay","NFC 行動支付","台灣高鐵的訂票App","Samsung Pay"],"ans":3,"exp":["📝 解析：遠端支付是消費者不必在實體收銀台，透過網路在 App 或網站上完成付款，例如在台灣高鐵訂票 App 訂票付款，故選(3)。Apple Pay、Samsung Pay 與一般 NFC 行動支付，都是手機靠近實體店家讀卡機感應付款，屬於近端支付。"],"pos":0.25,"w":1,"sw":0.01201,"id":"6科技力-15"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"6-16","stem":"有關生物辨識的敘述，下列何者錯誤？","opts":["指紋辦識(Finger print)技術已相當成熟，目前安全性最高","虹膜辨識(Iris)的優點是錯誤率低、不易造假；缺點是危險性較高、比較不為人們所接受","靜脈辨識(Vein)的優點是受環境影響較小、穩定性高、且具獨特性","聲紋辨識(Voice)也有不錯的辨識率，缺點是容易受到外部環境影響"],"ans":1,"exp":["📝 解析：選項(1)錯：指紋辨識技術雖成熟、普及，但指紋容易遺留並被複製，安全性並非最高；一般認為虹膜等辨識的錯誤率更低、更難偽造。(2)虹膜錯誤率低、不易造假，但使用者擔心對眼睛有影響，接受度較低；(3)靜脈辨識穩定、獨特且受環境影響小；(4)聲紋容易受環境噪音影響，三者皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2667,"w":1,"sw":0.01201,"id":"6科技力-16"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"6-17","stem":"有關台灣行動支付公司與台灣Pay 的敘述，下列何者錯誤？","opts":["是由財金資訊公司、聯合信用卡處理中心、台灣票據交換業務發展基金會、國內32 家金融機構與悠遊卡公司於2014 年共同發起成立","台灣Pay 主要支付方式為信用卡或金融卡","台灣Pay 目前只支援「掃碼付款」，而不支援 NFC「感應付款」","T Wallet+ 行動支付可用以購物、轉帳、繳稅及提款等多項服務"],"ans":3,"exp":["📝 解析：選項(3)錯：台灣Pay 同時支援 QR Code「掃碼付款」與 NFC「感應付款」（如手機金融卡／信用卡感應），不是只有掃碼。台灣行動支付公司於 2014 年由財金資訊公司、聯合信用卡處理中心、票據交換相關機構、悠遊卡公司與 32 家金融機構共同成立；台灣Pay 以信用卡、金融卡為主要支付工具；T Wallet+ 可用於購物、轉帳、繳稅、提款等。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2833,"w":1,"sw":0.01201,"id":"6科技力-17"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"6-46","stem":"有關肯亞行動支付M-PESA 的發展及說明，下列何者錯誤？","opts":["M 即為Mobile，PESA 是當地語言「錢」","M-PESA 意即行動貨幣","M-PESA 僅能用於支付，不能匯款","M-PESA 不受行動電話功能或網路類型限制"],"ans":3,"exp":["📝 解析：選項(3)錯：M-PESA 由肯亞電信商 Safaricom 於 2007 年推出，最核心的功能就是個人對個人匯款轉帳，也可存提現金、付款。M 代表 Mobile、PESA 是斯瓦希里語的「錢」，意即行動貨幣(1)(2)；它透過簡訊／USSD 運作，一般功能型手機也能使用，不受手機功能或網路類型限制(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7667,"w":1,"sw":0.01201,"id":"6科技力-46"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"6-47","stem":"比較NFC 及QR Code 近端支付，下列敘述何者錯誤？","opts":["NFC 支付通常靠三個主要組成元素：手機的NFC 天線(或晶片)、手機內建的防干擾安全元件、商店收銀台的非接觸式NFC 讀卡機","QR Code 因不涉及特殊規格(NFC)手機的普及與否問題，成本也相對不高","NFC 可「嗶」一聲快速完成付款，但QR Code 行動支付的程序比較多","目前Line Pay 只結合 NFC 感應支付，不採用QR Code"],"ans":4,"exp":["📝 解析：選項(4)錯：LINE Pay 主要就是採用 QR Code／條碼掃碼付款，並非只結合 NFC 感應支付。(1)NFC 支付由手機 NFC 天線（晶片）、安全元件、店家非接觸式讀卡機組成；(2)QR Code 不需特殊規格手機，建置成本低；(3)NFC「嗶」一聲即完成，QR Code 需開 App、掃碼等步驟較多，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7833,"w":1,"sw":0.01201,"id":"6科技力-47"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"5-10","stem":"下列何者並非已運用於行動支付服務中的生物辨識技術？","opts":["指紋辨識","基因辨識","聲紋辨識","虹膜辨識"],"ans":2,"exp":["📝 解析：已運用於行動支付身分驗證的生物辨識技術有指紋、聲紋、虹膜、臉部等。基因（DNA）辨識需採樣並經實驗室分析、耗時且成本高，無法即時用在支付驗證，故選(2)。"],"pos":0.1667,"w":1,"sw":0.01201,"id":"5科技力-10"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"5-11","stem":"未來行動支付的生物辨識技術不包括下列何者？","opts":["臉部(Face)","區塊鏈(BlockChain)","指紋(Finger print)","聲紋(Voice)"],"ans":2,"exp":["📝 解析：行動支付的生物辨識技術包括臉部、指紋、聲紋、虹膜、靜脈等，都是以人體生理或行為特徵辨識身分。區塊鏈是分散式帳本技術，不是生物辨識技術，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1833,"w":1,"sw":0.01201,"id":"5科技力-11"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"5-12","stem":"Tokenization 資料標記技術首先由哪家公司或組織提出？","opts":["Apple","EMVCo","M-Pesa","Google"],"ans":2,"exp":["📝 解析：Tokenization（資料標記／代碼化）技術由國際卡組織共同組成的 EMVCo 提出，2014 年發布支付代碼化規格，用 Token 取代真實卡號，即使外洩也無法直接盜刷，故選(2)。Apple、Google 是後來在 Apple Pay、Android Pay 中採用此技術；M-Pesa 是肯亞行動支付服務。"],"pos":0.2,"w":1,"sw":0.01201,"id":"5科技力-12"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"5-13","stem":"下列何者非NFC 支付之三個主要元素之一？","opts":["NFC 天線","NFC TAG","防干擾安全元件","非接觸式NFC 讀卡機"],"ans":2,"exp":["📝 解析：NFC 支付三個主要元素為：手機的 NFC 天線（晶片）、手機內建的防干擾安全元件（Secure Element）、商店收銀台的非接觸式 NFC 讀卡機。NFC TAG（標籤）是可被讀取資料的小貼片，用於資訊傳遞或門禁等，不是 NFC 支付的主要元素，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2167,"w":1,"sw":0.01201,"id":"5科技力-13"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"5-14","stem":"下列何者是NFC 近端支付技術強調的特色？","opts":["傳輸距離","建置成本","傳輸速度","安全性"],"ans":4,"exp":["📝 解析：NFC 近端支付強調安全性：傳輸距離極短（約 10 公分內）不易被側錄，並搭配安全元件與代碼化技術保護卡片資料，故選(4)。NFC 傳輸距離短、速度不算快，且需專用晶片與讀卡機，建置成本較 QR Code 高，所以傳輸距離、建置成本、傳輸速度都不是它的強調特色。"],"pos":0.2333,"w":1,"sw":0.01201,"id":"5科技力-14"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"5-15","stem":"行動支付的成功因素，若從消費者的角度來看，下列敘述何者不是主要關鍵因素？","opts":["商家的覆蓋度越多，越能滿足使用者的服務需求","行動支付的行銷活動，刺激消費者採用行動支付","手機的價格越便宜，越多使用者願意使用行動支付","強化資料安全與信任，提供消費者放心的使用環境"],"ans":3,"exp":["📝 解析：從消費者角度，行動支付成功的關鍵在於：可使用的商家多（覆蓋度）、行銷活動與優惠刺激採用、資料安全與信任。手機價格高低不是消費者是否採用行動支付的主要關鍵（智慧型手機已普及），故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.25,"w":1,"sw":0.01201,"id":"5科技力-15"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"5-31","stem":"利用比銀行還低的兌換利率或匯率，讓有貨幣兌換需求的人透過線上平台找到兌換貨幣。此為何種支付匯款業務？","opts":["第三方支付","P2P 匯兌","虛擬通貨","電子貨幣"],"ans":2,"exp":["📝 解析：透過線上平台讓有換匯需求的人彼此媒合，以比銀行更好的匯率兌換貨幣（如 TransferWise／Wise 的模式），屬於「P2P 匯兌」，故選(2)。第三方支付是代收代付；虛擬通貨是以數位形式存在的通貨（如比特幣）；電子貨幣是預付儲值的電子化貨幣價值（如悠遊卡）。"],"pos":0.5167,"w":1,"sw":0.01201,"id":"5科技力-31"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"5-34","stem":"根據2015 年世界經濟論壇「金融服務的未來」研究報告，下列何項是數位支付匯款業務的特點？ A.全球化的支付匯款 B.行動的支付匯款 C.簡便的支付匯款 D.整合的支付匯款 E.安全的支付","opts":["僅ABCD","僅BCDE","僅ACD","ABCDE"],"ans":4,"exp":["📝 解析：WEF 2015 年「金融服務的未來」報告指出數位支付匯款的特點包括：全球化、行動化、簡便、整合以及安全，五項都屬之，故選(4)ABCDE。"],"pos":0.5667,"w":1,"sw":0.01201,"id":"5科技力-34"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"5-46","stem":"下列何者為QR Code 行動支付之缺點？","opts":["店家入門成本高","支付過程較NFC 繁瑣","對手機硬體要求高","與NFC 相比較不容易普及"],"ans":2,"exp":["📝 解析：QR Code 行動支付需要開啟 App、掃碼或出示條碼、確認金額等步驟，支付過程比 NFC「嗶」一聲感應繁瑣，這是它的缺點，故選(2)。(1)(3)(4)剛好相反：QR Code 店家只需印出條碼或掃描器，入門成本低、對手機硬體要求低，也比 NFC 容易普及。"],"pos":0.7667,"w":1,"sw":0.01201,"id":"5科技力-46"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"5-47","stem":"下列何者是TSM 與HCE 兩種作業模式的差異？","opts":["OTA 平台傳輸","NFC 晶片與讀卡機","手機作業系統","手機安全晶片"],"ans":4,"exp":["📝 解析：TSM（信任服務管理）模式把卡片資料放在手機的安全晶片（SIM 卡或嵌入式安全元件 SE）中，需透過 TSM 平台空中下載寫入；HCE（主機卡片模擬）則以軟體模擬卡片、資料存在雲端，不需要手機安全晶片。兩者差異在於是否使用手機安全晶片，故選(4)；兩者都使用 NFC 與讀卡機感應。"],"pos":0.7833,"w":1,"sw":0.01201,"id":"5科技力-47"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"5-52","stem":"下列何者不是生物辨識的優點？","opts":["使用方便","難以偽造及破解","不需記憶密碼且沒有攜帶鑰匙或感應卡的煩惱","技術層次較為簡單"],"ans":4,"exp":["📝 解析：生物辨識的優點是使用方便、難以偽造與破解、不需記密碼也不用帶鑰匙或感應卡。生物辨識需要專用感測設備與複雜的特徵擷取比對演算法，技術層次較高而不是較簡單，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8667,"w":1,"sw":0.01201,"id":"5科技力-52"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"4-10","stem":"下列何者不是屬於近端支付的技術？","opts":["NFC (Near-Field Communication)","mPOS (Mobile point of Sale)","SMS (Short Message Service)","HCE (Host Card Emulation)"],"ans":3,"exp":["📝 解析：近端支付是消費者在實體店面以手機靠近或連接收款設備完成付款，代表技術有 NFC（近場通訊）、HCE（主機卡模擬，NFC 的雲端版）、mPOS（行動刷卡機）。SMS 簡訊付款透過電信網路遠距傳送指令，屬遠端支付，故(3)不是近端支付技術。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1667,"w":1,"sw":0.01201,"id":"4科技力-10"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"4-11","stem":"下列何者可說是「行動支付」成功運作之核心關鍵，即接受服務供應商之委託，進行相關行動支付、行動商務服務的下載、安裝及個人化的被信賴獨立第三方機構？","opts":["TSM (Trusted Service Manager)","NFC","OTA (Over the Air)","HCE"],"ans":1,"exp":["📝 解析：TSM（信任服務管理者）是受發卡銀行、電信商等服務供應商委託，以獨立、可信賴的第三方身分，負責把支付應用程式安全下載、安裝到手機安全元件並完成個人化，是 SIM 卡型 NFC 行動支付的核心，故選(1)。NFC 是通訊技術、OTA 是空中下載的傳輸方式、HCE 是不依賴實體安全元件的雲端模擬技術，都不是「第三方機構」。"],"pos":0.1833,"w":1,"sw":0.01201,"id":"4科技力-11"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"4-12","stem":"有關第三方支付的敘述，下列何者錯誤？","opts":["具有信用中介的角色","在消費者、商家和銀行間建立支付的功能","以網路為基礎","可完全取代銀行的功能"],"ans":4,"exp":["📝 解析：(4)錯：第三方支付只是在買方、賣方與銀行之間提供代收代付與價金保管，資金仍須透過銀行帳戶清算，不能吸收存款、放款，無法完全取代銀行。(1)它替交易雙方保管價金、建立信任，具信用中介角色；(2)在消費者、商家、銀行間提供支付連結；(3)以網路交易為基礎，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2,"w":1,"sw":0.01201,"id":"4科技力-12"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"4-13","stem":"有關行動支付中信用卡資料的認證機制，下列何者正確？","opts":["NFC 使用虛擬卡號與交易金鑰","HCE 主機卡模擬須輸入密碼或簽名","mPOS 使用存放在晶片中的安全元件","使用 Token 服務以隨機編碼產生的代碼"],"ans":4,"exp":["📝 解析：Token（代碼化）服務以隨機產生的代碼取代真實卡號，交易時只傳遞代碼，即使被截取也無法還原卡號，故(4)正確。(1)NFC 是把卡片資料存放在手機安全元件（SE）中，虛擬卡號／交易金鑰是 Token 與 HCE 的作法；(2)HCE 是把卡片資料放在雲端主機、以限時金鑰驗證，並非要求輸入密碼或簽名；(3)mPOS 是行動刷卡機讀取實體卡，不是靠手機晶片內的安全元件。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.2167,"w":1,"sw":0.01201,"id":"4科技力-13"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"4-14","stem":"下列何項不符合國際清算銀行所定義的行動支付？","opts":["行動銀行轉帳","Apple Pay","掃碼支付(如支付寶、Pi 或街口等App)","分行ATM 支付"],"ans":4,"exp":["📝 解析：國際清算銀行（BIS）將行動支付定義為：以手機等行動裝置發動、授權並確認付款的交易。行動銀行轉帳、Apple Pay、掃碼支付都是用行動裝置發動；在分行 ATM 操作的是實體自動化設備，不是行動裝置，故(4)不符合。"],"pos":0.2333,"w":1,"sw":0.01201,"id":"4科技力-14"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"4-15","stem":"下列何者主要的服務不是第三方支付平台？","opts":["支付寶(阿里巴巴)","支付連(PC Home)","愛金卡(i cash)","PayPal"],"ans":3,"exp":["📝 解析：支付寶、PChome 的支付連、PayPal 都是替網路交易提供代收代付、價金保管的第三方支付平台；愛金卡（icash）主要是儲值後在統一超商等通路扣款的電子票證，故選(3)。補充：愛金卡公司後來也推出 icash Pay 電子支付服務，但本題問的 icash 卡本身仍是電子票證，作答照官方答案。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.25,"w":1,"sw":0.01201,"id":"4科技力-15"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"4-16","stem":"下列何者屬近端支付類型？","opts":["Apple Pay","Apple iTunes Store 購買App 或音樂","Google Play 購買App 或音樂","全國繳費網App"],"ans":1,"exp":["📝 解析：Apple Pay 在實體店以 iPhone 靠近收款機、透過 NFC 完成付款，屬近端支付，故選(1)。(2)(3)在 App 商店購買數位內容、(4)以全國繳費網 App 線上繳費，都是透過網路遠距完成，屬遠端支付。"],"pos":0.2667,"w":1,"sw":0.01201,"id":"4科技力-16"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"4-25","stem":"目前已有多項新科技與新技術運用於行動支付系統，較受關注的有穿戴式裝置與生物識別技術在行動支付的運用。其中最早成熟與運用的生物識別技術是：","opts":["聲紋辨識","靜脈辨識","指紋辨識","虹膜辨識"],"ans":3,"exp":["📝 解析：在各種生物辨識中，指紋辨識的感測器最早小型化、成本最低，很早就內建於手機（如 Touch ID）並用於行動支付驗證，是最早成熟與普及運用的技術，故選(3)。聲紋、靜脈、虹膜辨識成熟與普及都較晚。"],"pos":0.4167,"w":1,"sw":0.01201,"id":"4科技力-25"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"4-46","stem":"在主機卡模擬 (Host Card Emulation, HCE) 近端支付技術下，金融機構或支付服務供應商不受到手機內置安全元件 (SE)的限制，因此具備3 項優點，下列何者錯誤？","opts":["可以直接透過APP 取得控制權，也可免除運營商的OTA 平台介接費用而降低建置與營運成本","服務供應商可以自主開發或整合APP 加值功能，創造額外營收","HCE 能透過主機在雲端進行晶片模擬，手機不再加入安全元件，電信商不需要介入換發SIM 卡，因此能讓行動產業與支付產業間的合作更為簡化","HCE 近端支付技術及作業流程，使得交易店家無從儲存客戶卡號資料，因此杜絕了衍生個資外洩的疑慮"],"ans":4,"exp":["📝 解析：(4)錯：HCE 搭配代碼化（Token）可降低店家取得真實卡號的機會，但並不能「杜絕」個資外洩疑慮；而且 HCE 不使用手機內的實體安全元件，資料在雲端與手機間傳遞，反而被視為安全性較需加強。(1)免受電信 SIM 卡限制、免 OTA 平台介接費；(2)可自主開發 App 加值功能；(3)雲端模擬卡片、電信商不必換 SIM，合作更簡化，皆是其優點。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7667,"w":1,"sw":0.01201,"id":"4科技力-46"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"4-47","stem":"依中央銀行2016 年統計，臺灣金融支付概況，平均每人擁有最多流通數量的卡為下列何者？","opts":["信用卡","金融卡","電子票證卡","會員卡"],"ans":2,"exp":["📝 解析：依中央銀行 2016 年支付統計，國人平均每人持有的金融卡（提款卡）流通張數最多，因為幾乎每個銀行存款帳戶都會配發金融卡，且一人常有多個帳戶，故選(2)。信用卡與電子票證流通張數較少；會員卡不屬支付工具統計範圍。此為當年統計數據，作答照官方答案。"],"pos":0.7833,"w":1,"sw":0.01201,"id":"4科技力-47"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"3-10","stem":"有關行動支付的技術，最安全的行動交易形式是下列哪一種？","opts":["TSM","NFC","SMS","HCE"],"ans":2,"exp":["📝 解析：NFC 行動支付把卡片資料存放在手機內的硬體安全元件（SE），並在數公分內近距離傳輸，資料不易被竊取或遠端攔截，教材認為是最安全的行動交易形式，故選(2)。TSM 是管理服務的第三方機構，不是交易形式；SMS 簡訊以明文傳送，安全性低；HCE 卡片資料存於雲端、不使用實體安全元件，安全性相對 NFC-SE 較弱。"],"pos":0.1667,"w":1,"sw":0.01201,"id":"3科技力-10"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"3-11","stem":"NFC(Near-Field Communication)支付通常依賴三個主要的組成元素，下列何者錯誤？","opts":["手機天線","手機內建防干擾安全元件","RFID 技術","讀卡機"],"ans":3,"exp":["📝 解析：NFC 支付的三個組成元素是：手機天線（發送接收訊號）、手機內建防干擾安全元件（存放卡片資料與金鑰）、讀卡機（商店端感應設備）。RFID 是 NFC 的技術源頭，但不是 NFC 支付依賴的組成元素之一，故(3)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1833,"w":1,"sw":0.01201,"id":"3科技力-11"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"3-12","stem":"PChome Online 韓昆舉總監認為(2015)台灣業者若欲從事行動支付相關業務，需要注意三個重要面向，下列何者錯誤？","opts":["行動支付技術之效率性","使用者需求","經濟生態系統(Ecosystem)","法律框架(Legal Framework)"],"ans":1,"exp":["📝 解析：PChome 韓昆舉總監（2015）認為業者發展行動支付須注意三個面向：使用者需求（解決痛點）、經濟生態系統（Ecosystem，結合商家與場景）、法律框架（Legal Framework）。「技術效率性」不在這三個面向之中，故(1)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2,"w":1,"sw":0.01201,"id":"3科技力-12"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"3-14","stem":"有關第三方支付平台的敘述，下列何者錯誤？","opts":["其提供的行動支付主要是以近端支付服務為主","為行動電信營運商、金融機構及客戶三者提供連接","負責對客戶的銀行帳戶與商店帳戶進行結算","因金融機構被邊緣化，第三方支付安全性受質疑"],"ans":1,"exp":["📝 解析：(1)錯：第三方支付平台（如支付寶、PayPal）主要服務網路購物等遠端支付，不是以實體店面的近端支付為主。(2)為電信商、金融機構與客戶提供連接；(3)負責客戶銀行帳戶與商店帳戶間的結算；(4)金融機構被邊緣化、安全性受質疑是其面臨的問題，皆為教材敘述。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2333,"w":1,"sw":0.01201,"id":"3科技力-14"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"3-15","stem":"應用行動支付服務將傳統銀行「從一處場所變成一種行為」稱為：","opts":["虛實整合","場景金融","便民服務","經濟生態系統"],"ans":2,"exp":["📝 解析：Brett King 在《Bank 3.0》提出「銀行不再是一個去的地方，而是一種行為」（Banking is no longer somewhere you go, but something you do），金融服務嵌入在日常生活各種消費場景之中，稱為場景金融，故選(2)。"],"pos":0.25,"w":1,"sw":0.01201,"id":"3科技力-15"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"3-46","stem":"近端支付技術中的資料標記技術(EMVCo Tokenization)，下列何者為其最大優點？","opts":["解決網路速度過慢問題","解決個資外洩疑慮","協助Apple Pay 進入行動支付市場","強化NFC 通訊功能"],"ans":2,"exp":["📝 解析：EMVCo 代碼化（Tokenization）以代碼取代真實卡號，交易過程與商店端都只接觸代碼，即使資料外洩也無法盜刷原卡，最大優點是解決個資與卡號外洩疑慮，故選(2)。它與網路速度、NFC 通訊功能無關；Apple Pay 雖採用此技術，但那不是其最大優點。"],"pos":0.7667,"w":1,"sw":0.01201,"id":"3科技力-46"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"3-47","stem":"有關PayPal 的運作方式，下列何者錯誤？","opts":["PayPal 以e-mail 來辨識對方，以打破傳統金融機構轉帳匯款的不便利","PayPal 有帳戶餘額，且具備「資金移轉」功能","經由PayPal 賣方可以清楚知道買方銀行帳戶資訊，以利於進行支付服務","PayPal 的功能包含付款閘道(Payment Gateway)及電子錢包(e-wallet)"],"ans":3,"exp":["📝 解析：(3)錯：PayPal 作為中介，買賣雙方只以 e-mail 帳號辨識對方，賣方看不到買方的銀行帳戶或信用卡資訊，這正是其保護個資的優點。(1)以 e-mail 辨識對方、打破轉帳匯款的不便；(2)有帳戶餘額並具資金移轉功能；(4)兼具付款閘道與電子錢包功能，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7833,"w":1,"sw":0.01201,"id":"3科技力-47"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"2-10","stem":"行動支付中的場景金融，重要的是要能夠提升場域生活價值，下列敘述何者不是主要情境因素？","opts":["透過手機觀看股市新聞，作為證券下單參考","透過手機提供超商的電子會員卡與折扣優惠，鼓勵支付消費","結合線上線下交易，例如透過線上訂車、支付，而坐車是線下","透過近端行動支付，分散夜市熱門攤販的支付，簡省排隊時間"],"ans":1,"exp":["📝 解析：場景金融要把支付嵌入生活消費場域、提升該場域的價值，例如超商電子會員卡結合優惠鼓勵支付（(2)）、線上叫車付款＋線下乘車的 O2O（(3)）、夜市以近端支付減少排隊（(4)）。透過手機看股市新聞做下單參考屬資訊服務，沒有支付消費場景，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1667,"w":1,"sw":0.01201,"id":"2科技力-10"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"2-11","stem":"肯亞電信商提供的M-Pesa 是以下列何者完成支付聯繫？","opts":["臨櫃確認","行動電話簡訊","電子郵件","電話通知"],"ans":2,"exp":["📝 解析：肯亞電信商 Safaricom 於 2007 年推出的 M-Pesa，讓沒有銀行帳戶的民眾以一般手機的行動電話簡訊（SMS）完成轉帳、付款與支付確認，即使非智慧型手機也能使用，故選(2)。"],"pos":0.1833,"w":1,"sw":0.01201,"id":"2科技力-11"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"2-12","stem":"下列何者是行動支付成功因素？ A.解決使用者需求／痛點 B.政策環境配套讓更多商戶有動機導入 C.建立經濟生態體系，創造場景金融","opts":["僅A.B","僅B.C","僅A.C","A.B.C"],"ans":4,"exp":["📝 解析：行動支付要成功，須同時具備：A.解決使用者的需求與痛點（使用者願意用）、B.政策環境配套讓商戶有動機導入（店家願意收）、C.建立經濟生態體系、創造場景金融（有足夠使用場景），三者缺一不可，故選(4)。"],"pos":0.2,"w":1,"sw":0.01201,"id":"2科技力-12"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"2-13","stem":"根據中央銀行統計2015 年台灣各類卡式電子支付工具消費金額排名為何？","opts":["信用卡>金融卡>電子票證","信用卡>電子票證>金融卡","金融卡>信用卡>電子票證","金融卡>電子票證>信用卡"],"ans":1,"exp":["📝 解析：依中央銀行統計，2015 年台灣卡式電子支付工具的消費金額以信用卡最高（年消費金額達兆元規模），金融卡（含 Smart Pay、簽帳金融卡）次之，電子票證多用於小額交通與超商消費，金額最低，故選(1)。此為當年統計數據，作答照官方答案。"],"pos":0.2167,"w":1,"sw":0.01201,"id":"2科技力-13"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"2-14","stem":"下列何者屬遠端支付類型？","opts":["NFC","高鐵訂票APP","mPOS","QR Code"],"ans":2,"exp":["📝 解析：遠端支付是透過網路在非實體現場完成付款，例如在高鐵訂票 App 線上訂票並以信用卡付款，故選(2)。NFC 感應、mPOS 行動刷卡機都在實體店面現場付款，屬近端支付；QR Code 支付在本教材中多指實體店掃碼付款的近端應用。"],"pos":0.2333,"w":1,"sw":0.01201,"id":"2科技力-14"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"2-15","stem":"有關QR Code 應用於行動支付，下列敘述何者正確？","opts":["QR Code 行動支付在台灣的交易筆數已超越其他行動支付工具","QR Code 行動支付需消費者轉換 SIM 卡後方得使用","QR Code 行動支付可依流程分為線上支付與線下支付","所謂的QR Code 線下支付，意指由消費者掃描店家所提供之QR Code，以完成交易"],"ans":3,"exp":["📝 解析：QR Code 行動支付依交易流程可分為線上支付（如網購結帳時掃碼付款）與線下支付（實體店面），故(3)正確。(1)錯：題目當時台灣行動支付仍以信用卡、NFC 等為主，QR Code 交易筆數並未超越其他工具；(2)錯：需換 SIM 卡的是 SIM 卡型 NFC（TSM）方案，QR Code 只需 APP 與鏡頭；(4)錯：線下支付包含「消費者掃店家碼（主掃）」與「店家掃消費者碼（被掃）」兩種，不能只定義為消費者掃店家。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.25,"w":1,"sw":0.01201,"id":"2科技力-15"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"2-16","stem":"由第三方支付公司(支付平台)主導的行動支付服務，下列敘述何者錯誤？","opts":["客戶可於手機 APP 上綁定信用卡與銀行帳戶直接扣款","支付平台負責對客戶的銀行帳戶與商店帳戶進行清算","支付平台可發揮支持行動電信營運商、金融機構及客戶提供連結等功能","支付平台獨自完成營運作業，故效率與作業安全性相對於傳統銀行業更差"],"ans":4,"exp":["📝 解析：(4)錯：第三方支付平台主導模式的優點正是平台能整合資源、提升效率，且業者受電子支付機構管理條例等規範須具備資安控管，並非效率與安全性必然比銀行差。(1)綁定信用卡／銀行帳戶扣款、(2)平台負責客戶與商店帳戶間的清算、(3)平台串聯電信業者、金融機構與客戶，都是此模式的特色。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2667,"w":1,"sw":0.01201,"id":"2科技力-16"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"2-17","stem":"在PayPal 發展過程中，下列敘述何者不是其平台架構的主要關鍵特色？","opts":["PayPal 在每個有服務的國家地區，皆有設立分公司處理帳務清算","用戶間透過 email 即可轉帳交易，讓支付和收受更方便","其帳戶餘額功能讓使用者免除頻繁的提領、匯款等交易程序","提供安全的交易環境，讓付款方的個人資料不會被外洩"],"ans":1,"exp":["📝 解析：PayPal 以網路平台跨境營運為核心，並不是在每個服務國家都設分公司處理帳務清算，故(1)不是其關鍵特色。其主要特色為：用 email 即可轉帳收款(2)、帳戶餘額可留在平台免頻繁提領匯款(3)、付款時不必把信用卡／銀行資料交給賣方以保護個資(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2833,"w":1,"sw":0.01201,"id":"2科技力-17"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"2-46","stem":"在行動支付的近端支付技術下，請問TSM 和HCE 兩種方案的差異，下列敘述何者錯誤？","opts":["在HCE 中NFC 讀卡機直接和手機的CPU 交換資料","TSM 機制可以完成近端支付中的離線(offline)交易","TSM 機制需要使用者更換特殊的SIM 卡或插入額外的Micro SD 卡，使用上更為安全","TSM 中NFC 讀卡機會和手機的安全元件進行資料交換，且會經過手機的CPU 或是應用程式"],"ans":4,"exp":["📝 解析：TSM 方案中，NFC 讀卡機是直接與手機內的安全元件(SE，如 NFC SIM 卡或 microSD)交換資料，「不」經過手機 CPU 或應用程式，因此安全性高，故(4)錯誤。(1)HCE 由手機 CPU 以軟體模擬卡片與讀卡機溝通；(2)TSM 資料存於 SE，可離線交易；(3)TSM 需更換特殊 SIM 卡或插 microSD，安全性較高。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7667,"w":1,"sw":0.01201,"id":"2科技力-46"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"2-47","stem":"依銀行公會所提出的「信用卡業務機構辦理手機信用卡業務安全控管作業基準」規定，手機信用卡晶片個人化作業方式，下列敘述何者錯誤？","opts":["使用者向信用卡業務機構申請手機信用卡核准後，信用卡業務機構將信用卡個人化資料、手機號碼及安全儲存媒介編號傳送至TSM 服務平台","TSM 服務平台向行動通信業者確認手機號碼及安全儲存媒介編號之正確性","倘資料正確，TSM 服務平台透過行動通信業者網路執行空中傳輸(OTA)作業","將信用卡應用程式﹙payment application﹚與個人化資料傳送至持卡人手機，並寫入安全儲存媒介及安全區域中，由電信業者啟用"],"ans":4,"exp":["📝 解析：依銀行公會「信用卡業務機構辦理手機信用卡業務安全控管作業基準」（107 年起更名為「行動信用卡」業務安全控管作業基準）的 OTA 個人化流程：發卡機構核准後把個人化資料等傳送至 TSM 服務平台(1)，TSM 向行動通信業者（安全儲存媒介運營業者）確認資料正確性(2)，再透過網路執行空中傳輸 OTA(3)，把個人化資料加密寫入手機的安全儲存媒介及安全區域；之後是由「持卡人」啟用信用卡應用程式即可開啟服務，並非由電信業者啟用，故(4)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7833,"w":1,"sw":0.01201,"id":"2科技力-47"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"2-56","stem":"對於P2P 匯兌(P2P Transfers)的敘述，下列何者錯誤？","opts":["P2P 匯兌需透過兌換平台來執行","配對過程必須以銀行提供之的市場匯率與利率為交換基準","透過P2P 匯兌方式換匯，可節省消費者交易成本","TransferWise、Azimo 及peerTransfer 等公司都是著名的P2P 匯兌公司"],"ans":2,"exp":["📝 解析：P2P 匯兌是透過平台把不同幣別、反方向的換匯需求互相配對，資金不實際跨境移動，因此能節省手續費與匯差；配對基準通常採國際中間市場匯率(mid-market rate)，並非「必須以銀行提供的匯率與利率」為基準，故(2)錯誤。(1)需透過平台、(3)節省成本、(4)TransferWise（2021 年更名 Wise）、Azimo、peerTransfer 為知名業者，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9333,"w":1,"sw":0.01201,"id":"2科技力-56"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"1-11","stem":"有關信用卡行動收單裝置(mPOS)的使用，下列敘述何者錯誤？","opts":["由消費者透過手機耳機插孔或以藍芽通訊方式外掛收單(刷卡)設備","商店需下載行動收單服務專屬APP，並登入後才得使用","消費者需透過該設備進行刷卡，確認付款交易明細與交易金額","消費者需提供行動電話號碼或是Email 等聯繫資訊，以傳送電子帳單"],"ans":1,"exp":["📝 解析：mPOS 是由「商店」把讀卡設備透過耳機孔或藍牙外接在商店自己的手機／平板上，下載專屬 APP 登入後收款，不是由消費者外掛設備，故(1)錯誤。(2)商店需下載專屬 APP 並登入；(3)消費者透過設備刷卡並確認交易明細與金額；(4)消費者可提供手機號碼或 email 接收電子簽單，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1833,"w":1,"sw":0.01201,"id":"1科技力-11"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"1-12","stem":"有關資料標記技術(EMVCo Tokenization)的應用趨勢，下列敘述何者錯誤？","opts":["店家會取得儲存資料，便於客戶服務","整個token 是透過特定的區域支付網路來完成","目前如Apple Pay 等支付機制，即採取資料標記技術","一組卡號可以對應多組代碼，包括帳號資訊等全部被代碼取代"],"ans":1,"exp":["📝 解析：EMVCo 代碼化(Tokenization)以一組代碼(token)取代真實卡號，店家與支付流程中只接觸代碼，不會取得或儲存真實卡號等敏感資料，即使外洩也無法盜用，故(1)錯誤。(2)token 限在特定支付網路與範圍內使用、(3)Apple Pay 等即採此技術、(4)一組卡號可對應多組代碼，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2,"w":1,"sw":0.01201,"id":"1科技力-12"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"1-13","stem":"主機卡模擬(Host Card Emulation，HCE)的特色不包括下列何者？","opts":["將安全元件存放於Micro SD 卡或SIM 卡晶片上","不受手機內置SE(Secure Element)限制","發卡者可自主開發或整合APP 加值服務","Android 4.4 作業系統中內建HCE 主機卡模擬"],"ans":1,"exp":["📝 解析：HCE（主機卡模擬）不需實體安全元件，卡片資料存放於雲端主機，由手機 APP 以軟體模擬卡片與 NFC 讀卡機溝通。把安全元件放在 microSD 或 SIM 卡晶片上是 TSM（SIM 卡／SD 卡型）方案的特色，故選(1)。(2)不受手機內建 SE 限制、(3)發卡者可自主開發 APP 加值、(4)Android 4.4 起內建 HCE，均為 HCE 特色。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2167,"w":1,"sw":0.01201,"id":"1科技力-13"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"1-16","stem":"下列何者為PayPal 所提供的服務？ A.以Email 取代難以記憶的銀行帳號，就可轉帳及收款 B.提供mPOS 機制 (PayPal Here)供個人或微型企業可接受信用卡付款 C. One Touch 行動支付機制，是PayPal 為了簡化行動支付體驗所推出之服務機制","opts":["僅A.B","僅B.C","僅A.C","A.B.C"],"ans":4,"exp":["📝 解析：三項都是 PayPal 的服務：A 以 email 取代銀行帳號即可轉帳收款；B PayPal Here 是 mPOS 讀卡機，讓個人或微型商家接受信用卡付款；C One Touch 讓已登入用戶免重複輸入帳密，一鍵完成付款。故選(4) A.B.C。"],"pos":0.2667,"w":1,"sw":0.01201,"id":"1科技力-16"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"1-31","stem":"下列何者不是數位支付匯款業務的創新特點？","opts":["與傳統的金融機構互補，達到普惠金融的目標","做到互動與資料導向，讓金融機構與企業更瞭解消費者偏好","降低成本提高效率，例如：減少顧客攜帶現金的不便性、服務等待時間等","強調封閉式的服務，較不鼓勵與異業合作"],"ans":4,"exp":["📝 解析：數位支付匯款業務的創新特點是：與傳統金融機構互補達成普惠金融、互動與資料導向更了解消費者偏好、降低成本提高效率，並強調開放平台與異業合作串聯消費場景。(4)「封閉式服務、不鼓勵異業合作」正好相反，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.5167,"w":1,"sw":0.01201,"id":"1科技力-31"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"1-46","stem":"從金融生態圈的角度來看，成功的行動支付平台業者需要具備整合能力，下列敘述何者不是主要關鍵因素？","opts":["要有能力吸引消費者與商店","有能力進行同業與異業的合作","有能力整合提供各式支付工具","有能力提供置換新型智慧手機的補貼"],"ans":4,"exp":["📝 解析：成功的行動支付平台需具備生態圈整合能力：吸引消費者與商店雙邊加入、進行同業與異業合作、整合各式支付工具。補貼消費者換購新型智慧手機不是平台的關鍵能力，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7667,"w":1,"sw":0.01201,"id":"1科技力-46"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"1-47","stem":"行動支付中的遠端支付業務已經行之有年，作業模式成熟，下列敘述何者不是主要營運發展模式？","opts":["手機線上訂票APP 服務","透過手機感應式支付服務","透過手機進行遊戲加值等支付服務","金融機構行動銀行提供之各項繳費、轉帳等服務"],"ans":2,"exp":["📝 解析：遠端支付是透過網路完成付款、不需在現場感應，如手機訂票、遊戲加值、行動銀行繳費轉帳；「手機感應式支付」(NFC) 需在實體端末近距離感應，屬於近端支付，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.7833,"w":1,"sw":0.01201,"id":"1科技力-47"},{"s":"all","ch":"科技力 2｜數位支付與行動支付","star":0,"n":1,"refs":"1-58","stem":"根據2015 年6 月世界經濟論壇(WEF)「金融服務的未來」報告，下列何者不是數位支付匯款業務對於金融機構之影響？","opts":["增加金融機構之手續費收入","金融機構風險管理的規則與作業需大幅變更","金融機構扮演交易之公正第三方角色重要性降低","金融機構更了解消費者並提供更便利及合適的服務"],"ans":1,"exp":["📝 解析：WEF 2015 報告指出數位支付匯款對金融機構的影響：手續費收入「減少」（新業者以低成本搶占匯款與支付市場）、風險管理規則與作業需大幅變更、扮演交易公正第三方的重要性降低，但也能更了解消費者並提供更合適的服務。(1)「增加手續費收入」與報告相反，故選(1)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9667,"w":1,"sw":0.01201,"id":"1科技力-58"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"21-37","stem":"比特幣區塊鏈上的每個區塊，可分為兩個部分：區塊頭(Block Header)與區塊主體(Block Body)，下列哪個資料不儲存於區塊頭中？","opts":["前一個區塊的雜湊值(Previous Block Hash)","交易紀錄(Transaction)","時間戳(Time Stamp)","難度值(Difficulty Target)"],"ans":2,"exp":["📝 解析：比特幣區塊頭（80位元組）包含：版本號、前一區塊雜湊值、Merkle 根、時間戳、難度目標、Nonce。實際的交易紀錄存放在區塊主體，區塊頭只存所有交易的 Merkle 根摘要，故選(2)。"],"pos":0.6167,"w":1,"sw":0.00276,"id":"21科技力-37"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"21-45","stem":"關於NFT 之敘述，下列何者錯誤？","opts":["NFT 連結的數位資產都存放在區塊鏈上予以保護","NFT 的主體是佈署於區塊鏈的智能合約","每個NFT 都有特定的位址","不同的NFT 彼此不具替代性"],"ans":1,"exp":["📝 解析：NFT 本體是部署在區塊鏈上的智能合約，每枚 NFT 有特定的合約位址與 Token ID，彼此不可替代。但其連結的圖片、影音等數位資產檔案通常存放在鏈外（IPFS 或一般伺服器），鏈上只記錄所有權與中繼資料連結，並非都存在區塊鏈上，故(1)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.75,"w":1,"sw":0.00276,"id":"21科技力-45"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"21-60","stem":"有關金融監督管理委員會管理虛擬資產平台及交易業務事業(VASP)指導原則之敘述，下列何者錯誤？","opts":["VASP 事業應訂定虛擬資產交易規則並公告之，及列入內部控制制度","虛擬資產相關成交資訊，應即時揭露並提供予客戶，且應留存紀錄","VASP 事業就所保管之客戶資產應至少每半年委任會計師出具報告並公告","VASP 事業應建立確保市場交易公平機制，至少包括價格異常警示等措施，暨防止市場濫用及避免利益衝突規範"],"ans":3,"exp":["📝 解析：金管會2023年9月發布的 VASP 指導原則規定，業者就所保管之客戶資產應「至少每年」委任會計師出具報告並公告（報告可為查核、確信或協議程序報告），不是每半年，故(3)錯。現行「提供虛擬資產服務之事業或人員洗錢防制登記辦法」第27條對保管商也同樣要求至少每年。其他選項（公告交易規則並列入內控、即時揭露成交資訊並留存紀錄、建立公平交易與價格異常警示機制）均為指導原則內容。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":1.0,"w":1,"sw":0.00276,"id":"21科技力-60"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"20-9","stem":"有關比特幣的資料，下列何項是不能公開的？","opts":["比特幣錢包的收款帳號","比特幣錢包的密碼","比特幣節點的位址","比特幣節點的公鑰"],"ans":2,"exp":["📝 解析：比特幣錢包的收款帳號（位址）、節點位址、公鑰都可以公開，別人才能轉帳給你或驗證交易。錢包密碼（及私鑰、助記詞）一旦外洩，他人即可動用資產，絕不能公開。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.15,"w":1,"sw":0.00307,"id":"20科技力-09"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"20-10","stem":"下列何項非屬區塊鏈的種類？","opts":["私有鏈","供應鏈","聯盟鏈","公有鏈"],"ans":2,"exp":["📝 解析：區塊鏈依參與權限分為公有鏈（任何人可參與，如比特幣）、私有鏈（單一組織控管）、聯盟鏈（多個機構共同管理）。「供應鏈」是區塊鏈的應用領域，不是區塊鏈的種類。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.1667,"w":1,"sw":0.00307,"id":"20科技力-10"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"20-45","stem":"有關區塊鏈上的智能合約，下列敘述何者錯誤？","opts":["可被觸發後自動執行，降低業務成本，減少人為錯誤","合約程式儲存於區塊鏈，無法竄改","合約程式由區塊鏈平台上礦工節點執行","合約程式由區塊鏈自動產生，並部署於用戶之錢包軟體然後等待執行"],"ans":4,"exp":["📝 解析：智能合約是由開發者撰寫程式後部署到區塊鏈上（如以太坊），由網路節點執行，並非「由區塊鏈自動產生、部署於用戶錢包」，故(4)錯誤。(1)條件觸發後自動執行可減少人為錯誤、(2)上鏈後難以竄改、(3)由區塊鏈節點（礦工／驗證者）執行，均為正確敘述。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.75,"w":1,"sw":0.00307,"id":"20科技力-45"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"20-55","stem":"為了防範虛擬資產被作為洗錢或資恐的工具，金管會要求銀行針對虛擬資產相關帳戶，必須依洗錢防制法規定。而下列敘述何者錯誤？","opts":["必須落實認識客戶身分(KYC)","必須採實名制","必須綁定銀行同名存款帳戶","一定金額以下的交易可放寬規定"],"ans":4,"exp":["📝 解析：金管會要求銀行對虛擬資產（虛擬通貨）相關帳戶依洗錢防制法落實認識客戶（KYC）、採實名制，並綁定同名銀行存款帳戶出入金，以利金流追蹤。洗錢防制對此類高風險業務不因交易金額小而豁免，(4)「一定金額以下可放寬」錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9167,"w":1,"sw":0.00307,"id":"20科技力-55"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"19-9","stem":"2009 年1 月3 日中本聰建立了第一個比特幣區塊，俗稱創世區塊。而這個創世區塊的序號是下列何者？","opts":["root","0","1","創世區塊沒有序號"],"ans":2,"exp":["📝 解析：比特幣創世區塊（Genesis Block）於2009年1月3日由中本聰產生，區塊高度（序號）為0，之後區塊依序為1、2……，故選(2)。"],"pos":0.15,"w":1,"sw":0.02901,"id":"19科技力-09"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"19-10","stem":"目前ICO 最著名的成功案例為下列何者？","opts":["比特幣","以太坊","R3","Ripple"],"ans":2,"exp":["📝 解析：以太坊於2014年透過首次代幣發行（ICO）募得約1,800萬美元等值比特幣，之後發展為最大的智能合約平台，是ICO最著名的成功案例，故選(2)。比特幣是挖礦產生、未經ICO；R3是企業區塊鏈聯盟；Ripple（XRP）由公司預先發行，非典型ICO。"],"pos":0.1667,"w":1,"sw":0.02901,"id":"19科技力-10"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"19-14","stem":"依據 CoinMarketCap 網站資料，目前市值前兩大的加密貨幣為下列何者？","opts":["比特幣、泰達幣","比特幣、以太幣","比特幣、幣安幣","以太幣、泰達幣"],"ans":2,"exp":["📝 解析：依CoinMarketCap出題時資料，市值前兩大加密貨幣為比特幣（BTC）與以太幣（ETH），故選(2)。泰達幣（USDT）是穩定幣，市值通常排第三；幣安幣（BNB）排名更後。市值排名會變動，以出題時資料為準。"],"pos":0.2333,"w":1,"sw":0.02901,"id":"19科技力-14"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"19-45","stem":"比特幣區塊鏈所使用的的「單向函數」是使用下列何種技術？","opts":["大質數(大整數)","RSA 演算法","橢圓曲線密碼學","Merkle Tree"],"ans":3,"exp":["📝 解析：比特幣以橢圓曲線密碼學（ECDSA，曲線secp256k1）由私鑰推導公鑰，此運算單向、無法由公鑰反推私鑰，作為「單向函數」的基礎，故選(3)。RSA基於大質數分解，比特幣未採用；Merkle Tree是彙整交易雜湊值的資料結構。"],"pos":0.75,"w":1,"sw":0.02901,"id":"19科技力-45"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"19-46","stem":"有關區塊鏈技術之敘述，下列何者正確？","opts":["區塊鏈技術只能用在加密貨幣的應用上","區塊鏈技術與智能合約的結合，是為了改善匿名性的問題","挖礦或稱工作量證明是各類區塊鏈技術中共識機制的共同核心技術","區塊鏈技術係以Hash Function 計算每一個區塊的雜湊值，並在每一個區塊中索引參照到前一個區塊的雜湊值的方式，串接起來，形成一條區塊鏈"],"ans":4,"exp":["📝 解析：區塊鏈以雜湊函數計算每個區塊的雜湊值，並在下一區塊存入前一區塊的雜湊值，環環相扣形成鏈，竄改任一區塊都會使後續雜湊不符，故(4)正確。(1)區塊鏈也可用於供應鏈溯源、智能合約等；(2)智能合約是為自動執行約定，非改善匿名性；(3)工作量證明只是共識機制之一，另有權益證明（PoS）等。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.7667,"w":1,"sw":0.02901,"id":"19科技力-46"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"18-9","stem":"比特幣區塊的區塊頭不包括下列何項資訊？","opts":["前一區塊的雜湊值","時間戳","軟體版本","交易"],"ans":4,"exp":["📝 解析：比特幣區塊頭（80位元組）包含：版本號、前一區塊雜湊值、Merkle根、時間戳、難度目標（Bits）、Nonce。交易資料存放在區塊主體，區塊頭只存其Merkle根，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.15,"w":1,"sw":0.02901,"id":"18科技力-09"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"18-15","stem":"加密貨幣不是一個良好的價值保存工具，最主要的原因為何？","opts":["不易兌換為一般貨幣","貨幣保存不易","幣值容易大幅波動","貨幣無法跨境使用"],"ans":3,"exp":["📝 解析：價值保存工具需要價值穩定，但比特幣等加密貨幣價格波動劇烈，短期漲跌數成很常見，因此不是良好的價值保存工具，故選(3)。(1)可透過交易所兌換；(2)數位資產可長期保存；(4)加密貨幣本身可跨境轉移。"],"pos":0.25,"w":1,"sw":0.02901,"id":"18科技力-15"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"18-33","stem":"有關於區塊鏈技術運用，下列哪一種應用情境較不適用？","opts":["發行加密貨幣","智能合約應用","即時性的交易","產品資訊溯源"],"ans":3,"exp":["📝 解析：區塊鏈每筆交易須經網路共識確認（比特幣約10分鐘出一個區塊，通常要等數個區塊），交易處理速度與吞吐量有限，較不適合高頻、即時性的交易，故選(3)。發行加密貨幣、智能合約、產品溯源皆是典型應用。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.55,"w":1,"sw":0.02901,"id":"18科技力-33"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"18-34","stem":"有關航班延誤險，產險公司以「智能合約」執行保險運作快速理賠，主要是採用下列何種金融科技的技術？","opts":["支付","區塊鏈","人工智慧","雲端運算"],"ans":2,"exp":["📝 解析：航班延誤險以區塊鏈「智能合約」寫入理賠條件，串接航班資料，一旦延誤達約定時間即自動觸發理賠付款，免除申請與審核流程（如AXA的Fizzy），主要採用區塊鏈技術，故選(2)。"],"pos":0.5667,"w":1,"sw":0.02901,"id":"18科技力-34"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"18-45","stem":"關於NFT，下列敘述何者正確？","opts":["是一種用於跨境支付的代幣","是一種用於表彰數位資產價值的代幣","是一種與比特幣性質相同的代幣","是一種與央行數位貨幣(CBDC)性質相同的代幣"],"ans":2,"exp":["📝 解析：NFT（非同質化代幣）每一枚都獨一無二、不可分割互換，用來表彰數位藝術、遊戲道具等數位資產的所有權與價值，故選(2)。(1)跨境支付多用穩定幣或同質化代幣；(3)比特幣是同質化代幣，每枚可互換；(4)CBDC是央行發行的法定數位貨幣，與NFT性質不同。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.75,"w":1,"sw":0.02901,"id":"18科技力-45"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"17-13","stem":"加密貨幣很早就有研究，而第一個分散式加密貨幣是何年創建的？","opts":["1983 eCash","1995 Digicash","1998 B-money","2009 SHA-256"],"ans":4,"exp":["📝 解析：第一個真正去中心化（分散式）的加密貨幣是2009年1月上線的比特幣，其工作量證明與區塊雜湊採用SHA-256演算法，故選(4)。1983年eCash（David Chaum提出）與1995年DigiCash仍屬中心化發行的電子現金；1998年B-money（戴維）只是構想論文，未實際運作。"],"pos":0.2167,"w":1,"sw":0.01201,"id":"17科技力-13"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"17-37","stem":"比特幣與下列哪一項技術最為直接相關？","opts":["大數據","物聯網","區塊鏈","人工智慧"],"ans":3,"exp":["📝 解析：比特幣是區塊鏈技術的第一個應用：交易記錄以區塊串接成不可竄改的分散式帳本，由全網節點以工作量證明達成共識，因此與區塊鏈最直接相關，選(3)。大數據、物聯網、人工智慧都不是比特幣運作的核心技術。"],"pos":0.6167,"w":1,"sw":0.01201,"id":"17科技力-37"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"16-12","stem":"在數種區塊鏈技術中，廣泛被使用用來產生錢包地址的技術係指下列何者？","opts":["MD5 演算法","Elliptic Curve Cryptography(橢圓曲線加密演算法)","RSA(非對稱公開金鑰加密演算法)","對稱金鑰加密演算法"],"ans":2,"exp":["📝 解析：比特幣等區塊鏈以橢圓曲線加密演算法（ECC，比特幣用secp256k1曲線的ECDSA）由私鑰產生公鑰，再將公鑰經雜湊（SHA-256與RIPEMD-160）與編碼後得到錢包地址，故選(2)。MD5是已不安全的雜湊函數；RSA雖是非對稱加密但金鑰長、未被主流區塊鏈採用；對稱金鑰無法形成公私鑰對。"],"pos":0.2,"w":1,"sw":0.01201,"id":"16科技力-12"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"16-45","stem":"下列何項為原始比特幣的共識機制？","opts":["工作量證明","權益證明","挖礦","拜占庭將軍演算法"],"ans":1,"exp":["📝 解析：比特幣原始的共識機制是工作量證明（Proof of Work, PoW），礦工透過大量雜湊運算爭取記帳權，選(1)。權益證明（PoS）依持幣量決定記帳權，為以太坊2022年後採用；「挖礦」是執行PoW的過程而非機制名稱；拜占庭將軍問題是共識演算法要解決的問題（對應PBFT等演算法）。"],"pos":0.75,"w":1,"sw":0.01201,"id":"16科技力-45"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"15-11","stem":"下列何者是區塊鏈前後區塊相連接所依賴的值？","opts":["區塊主體資料值","區塊頭資訊值","區塊主體交易記錄之默克樹的樹根值","區塊頭的雜湊值"],"ans":4,"exp":["📝 解析：每個區塊的區塊頭都記錄「前一個區塊頭的雜湊值」，前後區塊因此串成鏈；只要竄改任一區塊內容，其雜湊值就會改變而與下一區塊不符，選(4)。默克樹根值是用來摘要本區塊內所有交易，確保交易未被竄改，但不是前後區塊相連的依據。"],"pos":0.1833,"w":1,"sw":0.01201,"id":"15科技力-11"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"15-36","stem":"下列何種技術或工具的使用較容易造成洗錢的弊病？","opts":["分散式阻斷服務(DDoS)","進階持續性攻擊(APT)","虛擬／加密貨幣","監理沙盒"],"ans":3,"exp":["📝 解析：虛擬／加密貨幣具匿名或假名性、可跨境快速移轉、去中心化不經銀行，容易被用來隱匿資金來源，是洗錢與資恐的高風險工具；我國洗錢防制法因此將虛擬資產服務提供者納入防制洗錢規範並要求登記，選(3)。DDoS、APT屬網路攻擊手法；監理沙盒是監理制度。"],"pos":0.6,"w":1,"sw":0.01201,"id":"15科技力-36"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"15-45","stem":"初次公開發行(IPO)是發行股票換取鈔票，首次代幣發行(ICO)是發行下列何種貨幣來換取其他具市場價值的虛擬貨幣？","opts":["法償貨幣","電子貨幣","虛擬貨幣","塑膠貨幣"],"ans":3,"exp":["📝 解析：首次代幣發行（ICO）類比IPO：專案方發行自創的虛擬貨幣（代幣，Token），讓投資人以比特幣、以太幣等具市場價值的虛擬貨幣（或法幣）購買，用以募集資金，選(3)。法償貨幣由央行發行；電子貨幣是法幣的電子化儲值；塑膠貨幣指信用卡等卡片。"],"pos":0.75,"w":1,"sw":0.01201,"id":"15科技力-45"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"15-46","stem":"比特幣區塊鏈全套帳本，置放在何處？","opts":["礦池","任何一個全節點","只放在參與挖礦的礦工節點","交易池"],"ans":2,"exp":["📝 解析：比特幣網路中，全節點（Full Node）會下載並驗證、儲存自創世區塊以來完整的區塊鏈帳本，任何一個全節點都存有全套帳本，選(2)。礦工不一定是全節點（可加入礦池）；礦池是礦工聯合挖礦的組織；交易池（Mempool）只暫存尚未被打包的交易。"],"pos":0.7667,"w":1,"sw":0.01201,"id":"15科技力-46"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"14-11","stem":"在比特幣區塊鏈中，理論上何種攻擊可以讓節點更改紀錄或逆轉先前的交易？","opts":["49%攻擊","50%攻擊","51%攻擊","52%攻擊"],"ans":3,"exp":["📝 解析：51%攻擊是指某人或集團掌握全網過半（超過50%）的算力，即可比其他節點更快產生區塊，形成最長鏈以改寫紀錄、逆轉自己先前的交易（雙重支付），選(3)。只要未過半，攻擊者理論上無法持續領先誠實節點。"],"pos":0.1833,"w":1,"sw":0.01201,"id":"14科技力-11"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"14-45","stem":"比特幣地址是以公鑰密碼術產生的公鑰再取雜湊值得到，它可以被當作下列何者來使用？","opts":["付款帳號","收款帳號","付款密碼","收款密碼"],"ans":2,"exp":["📝 解析：比特幣地址由公鑰經雜湊（SHA-256 再 RIPEMD-160）產生，可公開給他人，作用就像「收款帳號」，別人把幣轉到這個地址。真正能動用（付款）的是對應的私鑰簽章，私鑰必須保密；地址本身既不是密碼，也不是付款帳號。"],"pos":0.75,"w":1,"sw":0.01201,"id":"14科技力-45"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"13-45","stem":"有關比特幣和區塊鏈之間的關係敘述，下列何者錯誤？","opts":["比特幣是區塊鏈的應用","區塊鏈是比特幣的底層技術","比特幣最重要的創新是區塊鏈","區塊鏈等於比特幣"],"ans":4,"exp":["📝 解析：區塊鏈是比特幣的底層技術，比特幣是區塊鏈的第一個應用，其最重要的創新正是區塊鏈，故(1)(2)(3)正確。但區塊鏈不等於比特幣：區塊鏈還可用於以太坊智能合約、供應鏈、貿易融資、保險等，比特幣只是其中一種應用，故(4)錯。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.75,"w":1,"sw":0.01201,"id":"13科技力-45"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"13-46","stem":"有關區塊鏈中的「鏈」敘述，下列何者正確？","opts":["透過實體繫綁方式來達成鏈結","前一個區塊的資訊透過雜湊演算嵌入至當前區塊以達成鏈結目的","透過共享相同交易細節來達成鏈結","透過將當下區塊資料嵌入至創世區塊中來構成鏈結"],"ans":2,"exp":["📝 解析：區塊鏈的「鏈」是把前一個區塊的雜湊值（區塊頭的 hash）寫入當前區塊，逐一串接；任何舊區塊被竄改，後續區塊的雜湊都會對不上，因此難以偽造，故(2)正確。鏈結不是實體綁定、不是共享相同交易細節，也不是把當前區塊嵌回創世區塊。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.7667,"w":1,"sw":0.01201,"id":"13科技力-46"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"12-11","stem":"有關比特幣區塊鏈的敘述，下列何者正確？","opts":["比特幣區塊鏈屬於公有鏈，也屬於認許制區塊鏈","比特幣區塊鏈屬於公有鏈，也屬於非認許制區塊鏈","比特幣區塊鏈屬於私有鏈，也屬於認許制區塊鏈","比特幣區塊鏈屬於私有鏈，也屬於非認許制區塊鏈"],"ans":2,"exp":["📝 解析：比特幣區塊鏈任何人都能讀取與參與，屬於公有鏈；任何人不需經過許可即可加入節點、挖礦或交易，屬於非認許制（Permissionless）區塊鏈，故(2)正確。認許制（Permissioned）需經授權才能參與，常見於私有鏈與聯盟鏈。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.1833,"w":1,"sw":0.01201,"id":"12科技力-11"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"12-12","stem":"下列何項是以運算工作量為主要依據來實現區塊鏈的共識運算？","opts":["PoP","PoW","PoS","DPoS"],"ans":2,"exp":["📝 解析：工作量證明（PoW，Proof of Work）要求節點投入算力解雜湊難題，先算出者取得記帳權，比特幣即採此機制。PoS（權益證明）依持幣量與時間決定記帳權、DPoS（委託權益證明）由持幣者投票選出代表節點、PoP 非以運算量為依據。"],"pos":0.2,"w":1,"sw":0.01201,"id":"12科技力-12"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"12-16","stem":"根據Techopedita 網站的定義，數位貨幣是一種無形且以電子型態存在的支付方式，且可以在機構與個人中透過電子裝置移轉所有權，依據上述定義，下列何者非數位貨幣？","opts":["電子克朗(e-krona)","航空公司的飛行哩程回饋","遊戲公司發行的遊戲幣","乙太幣(Ethereum)"],"ans":3,"exp":["📝 解析：依題目定義，數位貨幣必須能在機構與個人之間以電子方式移轉所有權。遊戲公司發行的遊戲幣屬於封閉型虛擬貨幣（歐洲央行 2012 年分類的第一類），只能在該遊戲內使用、無法對外轉讓或兌換，不符合定義。電子克朗（瑞典央行 CBDC 試驗）與以太幣可自由移轉；航空哩程可兌換或轉讓給他人及合作機構，教材歸為數位貨幣的一種。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.2667,"w":1,"sw":0.01201,"id":"12科技力-16"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"12-46","stem":"區塊鏈技術中所指的DLT 係指下列何者？","opts":["Digital Ledger Technology","Digital Layer Technology","Distributed Ledger Technology","Distributed Layer Technology"],"ans":3,"exp":["📝 解析：DLT 是 Distributed Ledger Technology（分散式帳本技術）：帳本由多個節點共同保存與更新，透過共識機制保持一致，區塊鏈是 DLT 的一種。選項中的 Digital Ledger、Layer 等皆非正確全名。"],"pos":0.7667,"w":1,"sw":0.01201,"id":"12科技力-46"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"11-12","stem":"區塊鏈是透過下列何者來實現分散式計帳？","opts":["邊緣化機制","量子機制","共識機制","拆分機制"],"ans":3,"exp":["📝 解析：區塊鏈沒有中央記帳者，由各節點透過共識機制（如 PoW、PoS、PBFT）決定誰有記帳權、哪一筆紀錄有效，使分散的帳本保持一致，實現分散式記帳。邊緣化、量子、拆分機制都不是區塊鏈的記帳機制。"],"pos":0.2,"w":1,"sw":0.01201,"id":"11科技力-12"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"11-13","stem":"比特幣(主網路)屬於何種形式的區塊鏈？","opts":["聯盟鏈","公有鏈","私有鏈","混合鏈"],"ans":2,"exp":["📝 解析：比特幣主網任何人都能自由加入節點、挖礦、讀取與發送交易，不需經過許可，屬於「公有鏈」。聯盟鏈由多個特定機構共同管理、私有鏈由單一機構控制，參與者都需經授權。"],"pos":0.2167,"w":1,"sw":0.01201,"id":"11科技力-13"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"11-47","stem":"區塊鏈的下列何種技術，其主要目的是為了提高交易偽造的困難性？","opts":["數位簽署","挖礦機制","智能合約","雜湊演算法"],"ans":4,"exp":["📝 解析：雜湊演算法把區塊內容轉成固定長度的雜湊值，並把前一區塊雜湊寫入下一區塊；只要內容被改一點，雜湊就完全不同、後續鏈結失效，大幅提高偽造交易紀錄的困難度，故官方選(4)。數位簽署主要用於證明交易由私鑰持有者發出（身分與不可否認）、挖礦機制用於決定記帳權、智能合約用於自動執行約定。"],"pos":0.7833,"w":1,"sw":0.01201,"id":"11科技力-47"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"11-48","stem":"比特幣這類加密貨幣，其底層技術不包括下列何者？","opts":["P2P 網絡","工作量證明(POW)的共識機制","Hash function(雜湊函數)","分級憑證中心(CA)"],"ans":4,"exp":["📝 解析：比特幣的底層技術包括 P2P 網路（節點直接互聯）、工作量證明（PoW）共識機制、雜湊函數（SHA-256）以及公私鑰密碼學。分級憑證中心（CA）是由可信第三方簽發數位憑證的中心化公開金鑰基礎建設，與比特幣去中心化設計相反，故不包括。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8,"w":1,"sw":0.01201,"id":"11科技力-48"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"10-12","stem":"區塊鏈系統，大多會採用數位簽章技術，關於數位簽章技術的敘述，下列何者正確？","opts":["使用私鑰對訊息內容進行運算後的摘要值做簽署，提供給對方公鑰進行簽署的驗證","使用私鑰對訊息內容進行運算後的摘要值做簽署，再使用同一把私鑰進行簽署的驗證","使用公鑰對訊息內容進行運算後的摘要值做簽署，提供給對方私鑰進行簽署的驗證","使用公鑰對訊息內容進行運算後的摘要值做簽署，再使用同一把公鑰進行簽署的驗證"],"ans":1,"exp":["📝 解析：數位簽章的作法是：先對訊息做雜湊得到摘要值，用發送者的「私鑰」對摘要簽署，接收者以發送者公開的「公鑰」驗證，故(1)正確。私鑰必須保密不能交給對方，也不會用同一把私鑰驗證；用公鑰簽署則任何人都能偽造，失去簽章意義。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.2,"w":1,"sw":0.01201,"id":"10科技力-12"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"10-48","stem":"有關如何構思區塊鏈之應用，下列敘述何者正確？","opts":["可直接將企業既存的資料庫應用，直接予以區塊鏈化","若資料本身已儲存在MS-SQL、DB2 或Oracle 等國際IT 大廠的資料庫中，就可以將之區塊鏈化","應優先考慮企業內部業務流程最成熟的部分將之區塊鏈化","應優先考慮從既有業務流程中，具有多方共享且需要信任的資訊，予以區塊鏈化"],"ans":4,"exp":["📝 解析：答案(4)：區塊鏈的價值在於多方共享、互不完全信任時提供不可竄改的共同帳本，因此應優先挑選「需多方共享且需要信任」的流程導入。(1)(2) 單純把既有資料庫搬上鏈沒有意義，資料存在哪家資料庫也不是判斷依據；(3) 流程成熟不代表需要多方信任機制。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.8,"w":1,"sw":0.01201,"id":"10科技力-48"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"9-12","stem":"比較電子貨幣與虛擬貨幣，下列敘述何者正確？","opts":["兩者均以法償貨幣作為計價單位","兩者均不以法償貨幣作為計價單位","前者以法償貨幣作為計價單位，後者則非","後者以法償貨幣作為計價單位，前者則非"],"ans":3,"exp":["📝 解析：答案(3)：電子貨幣（如儲值卡、電子支付帳戶餘額）是法償貨幣的電子化儲值，以新臺幣等法償貨幣計價，可依面額兌回；虛擬通貨（如比特幣）有自己的計價單位，不以法償貨幣計價，也沒有發行機構保證兌回，故(3)正確，其餘組合錯誤。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.2,"w":1,"sw":0.01201,"id":"9科技力-12"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"9-13","stem":"區塊鏈技術已發展出智能合約的功能，請問智能合約置放於下列何處，無法被竄改？","opts":["錢包軟體上","礦工節點上","錢包地址上","區塊鏈上"],"ans":4,"exp":["📝 解析：答案(4)：智能合約是寫成程式碼並部署在「區塊鏈上」的合約，經全網節點共識寫入區塊後便不可竄改，條件成立時自動執行。錢包軟體只是管理私鑰的工具，錢包地址是收發資產的帳號，礦工節點只是參與記帳的電腦之一，放在單一位置都可能被改動。"],"pos":0.2167,"w":1,"sw":0.01201,"id":"9科技力-13"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"9-18","stem":"有關數位貨幣之敘述，下列何者錯誤？","opts":["在許多國家大多數將加密貨幣視為商品進行交易","加密貨幣具有貨幣之名，實際價值波動相當劇烈，因此不是一個良好的價值保存工具","比特幣現金是比特幣的一個分叉產品","當今市場上第一個分散式加密貨幣是萊特幣"],"ans":4,"exp":["📝 解析：答案(4)錯誤：第一個分散式加密貨幣是 2009 年上線的比特幣（中本聰 2008 年發表白皮書）；萊特幣是 2011 年由 Charlie Lee 以比特幣為基礎修改推出。許多國家將加密貨幣視為商品或資產（1）、價格波動大不是好的價值儲存工具（2）、比特幣現金是 2017 年比特幣硬分叉產物（3），皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.3,"w":1,"sw":0.01201,"id":"9科技力-18"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"9-47","stem":"有關比特幣區塊鏈，其交易具有匿名性係指下列何者？","opts":["交易者姓名被加密保護","每筆交易被加密保護","每筆交易僅以錢包地址作為發送及接收的基礎","交易採用數位簽章，以確保匿名性"],"ans":3,"exp":["📝 解析：答案(3)：比特幣的「匿名性」是指交易只以錢包地址（公鑰雜湊）作為發送與接收依據，不記錄真實姓名，屬「假名性」；交易內容本身其實公開在區塊鏈上任何人都可查詢。(1) 區塊鏈不記錄姓名；(2) 交易不是加密隱藏而是公開；(4) 數位簽章用於證明所有權與不可否認，而非確保匿名。"],"pos":0.7833,"w":1,"sw":0.01201,"id":"9科技力-47"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"8-12","stem":"比特幣區塊鏈中所謂的「挖礦」係指下列何者？","opts":["與其他節點競爭交易權","與其他節點競爭軟體的下載權","與其他節點競爭轉帳權","與其他節點競爭記帳權"],"ans":4,"exp":["📝 解析：答案(4)：比特幣以工作量證明（PoW）機制運作，「挖礦」是礦工節點競相計算符合難度的雜湊值，最先算出者取得將新區塊寫入帳本的「記帳權」，並獲得區塊獎勵與交易手續費。交易、轉帳由任何使用者都可發起，不需競爭。"],"pos":0.2,"w":1,"sw":0.01201,"id":"8科技力-12"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"8-13","stem":"比特幣網路各節點所共有的比特幣交易總帳本，針對此總帳本，下列敘述何者正確？","opts":["各節點的帳本是總帳本的一部分且不會重複","各節點的帳本是總帳本的一部分但有部分重複","各節點的帳本可以是總帳本也可以是總帳本的一部分","各節點的帳本都是相同的總帳本"],"ans":4,"exp":["📝 解析：答案(4)：比特幣是分散式帳本，每個（全）節點都保存一份完整且相同的總帳本，並透過共識機制同步新區塊，因此單一節點損毀或竄改也不影響整體帳本。(1)(2)(3) 把節點帳本說成總帳本的一部分，不符分散式帳本「人人一本完整帳」的設計概念（實務上輕節點只存區塊頭，但教材以全節點為準）。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.2167,"w":1,"sw":0.01201,"id":"8科技力-13"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"8-47","stem":"下列何項並非區塊鏈所擁有的特點？","opts":["以集體共識維護帳本","不可篡改性","必定存在智能合約","不可否認性"],"ans":3,"exp":["📝 解析：答案(3)：區塊鏈的基本特點是以集體共識維護帳本（1）、資料寫入後不可篡改（2）、以數位簽章達成交易不可否認（4）。智能合約是以太坊等部分區塊鏈才支援的附加功能，比特幣區塊鏈就沒有完整的智能合約，故「必定存在智能合約」不正確。"],"pos":0.7833,"w":1,"sw":0.01201,"id":"8科技力-47"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"7-27","stem":"區塊鏈將合約中的交易條款或商業規則內嵌在區塊鏈系統，使其在交易的環節中適時地執行，以確保合約的各項條款都有被遵守，這種運作模式被稱為：","opts":["信用狀","智慧合約","法院認證","身份認證"],"ans":2,"exp":["📝 解析：答案(2)：智慧合約（Smart Contract）是把合約交易條款或商業規則寫成程式碼內嵌在區塊鏈上，條件成立時自動執行，確保各方遵守條款且不可竄改。信用狀是國際貿易付款工具，法院認證與身分認證都不是自動執行合約的機制。"],"pos":0.45,"w":1,"sw":0.01201,"id":"7科技力-27"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"7-32","stem":"由特定社群開發與控制，在獨立的虛擬環境中單獨操作，限定於虛擬社群成員使用，是下列何者數位通貨？","opts":["開放式虛擬通貨","以網路形式的電子貨幣","封閉式虛擬通貨","以法定貨幣為計價單位的電子貨幣"],"ans":3,"exp":["📝 解析：答案(3)：依歐洲央行（ECB 2012）分類，封閉式虛擬通貨（Closed virtual currency）由特定社群開發控制，只能在獨立的虛擬環境（如線上遊戲）中使用，與真實經濟無連結，限社群成員使用。開放式（雙向流通）虛擬通貨可與法幣互換，電子貨幣則以法償貨幣計價。"],"pos":0.5333,"w":1,"sw":0.01201,"id":"7科技力-32"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"6-25","stem":"根據不同的應用場景和參與者需求，區塊鏈技術可以劃分為何種類型？","opts":["大企業鏈、中小企業鏈和小企業鏈","公有鏈、私有鏈和聯盟鏈","國內鏈和國外鏈","有線網路鏈和無線網路鏈"],"ans":2,"exp":["📝 解析：區塊鏈依開放程度與參與者可分為三類：公有鏈（任何人可參與，如比特幣、以太坊）、私有鏈（單一機構控制寫入權限）、聯盟鏈（由多個特定機構共同維護，如銀行間聯盟），故選(2)。其他選項的分類方式不存在。"],"pos":0.4167,"w":1,"sw":0.01201,"id":"6科技力-25"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"6-26","stem":"在區塊鏈中要做到不可否認的身分驗證，收款方用自己的私鑰加密於亂碼化(Hashing)後的交易內容產生數位簽章，付款方收到資料後，以下列哪一種方式就可驗證交易的正確性？","opts":["付款方私鑰","付款方公鑰","收款方公鑰","收款方私鑰"],"ans":3,"exp":["📝 解析：數位簽章的原理是「私鑰簽、公鑰驗」：簽章者（本題為收款方）用自己的私鑰對雜湊後的交易內容加密產生簽章，接收者（付款方）用簽章者的公鑰解開比對雜湊值，即可驗證內容未被竄改且確實由收款方簽署（不可否認性），故選(3)收款方公鑰。私鑰只有本人持有，不會交給對方。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.4333,"w":1,"sw":0.01201,"id":"6科技力-26"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"6-31","stem":"下列哪一項虛擬通貨，具有中介發行機構？","opts":["比特幣","萊特幣","瑞波幣","亞馬遜幣"],"ans":4,"exp":["📝 解析：亞馬遜幣（Amazon Coins）由亞馬遜公司發行與管理，用於其平台購買 App 與數位內容，屬於有中介發行機構的虛擬通貨，故選(4)。比特幣、萊特幣、瑞波幣在教材中歸類為以區塊鏈／分散式帳本運作、沒有中介發行機構的去中心化虛擬通貨（瑞波幣雖由 Ripple 公司預先產生，教材仍如此分類）。"],"pos":0.5167,"w":1,"sw":0.01201,"id":"6科技力-31"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"6-33","stem":"有關區塊鏈去中心化作業匯款系統的特點，下列何者正確？","opts":["透過中介機構保障安全","交易成本較高","可追蹤性較差","能夠幾乎即時結算"],"ans":4,"exp":["📝 解析：區塊鏈去中心化匯款不需經過層層代理銀行，帳本由網路節點共同驗證更新，可幾乎即時結算，故(4)正確。(1)錯：去中心化即不依賴中介機構，安全靠密碼學與共識機制；(2)錯：少了中介環節，交易成本較低；(3)錯：交易紀錄公開且不可竄改，可追蹤性較佳。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.55,"w":1,"sw":0.01201,"id":"6科技力-33"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"5-29","stem":"下列何者不是區塊鏈的核心處理要素？","opts":["隱私安全","智慧合約","集中式共享帳簿","共識演算法"],"ans":3,"exp":["📝 解析：區塊鏈的核心處理要素為：分散式共享帳本、智慧合約、隱私安全（加密與權限）、共識演算法。區塊鏈的特色是帳本由多個節點共同保存的「分散式」，而不是「集中式」共享帳簿，故選(3)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.01201,"id":"5科技力-29"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"5-33","stem":"根據中央銀行2016 年第1 季理監事會後參考資料，下列數位通貨何者屬於「電子貨幣」？ A.悠遊卡 B.比特幣 C.亞馬遜幣 D.第三方支付儲值帳戶","opts":["僅AD","僅BC","僅AC","僅BD"],"ans":1,"exp":["📝 解析：央行 2016 年第 1 季理監事會後參考資料把數位通貨分為「電子貨幣」與「虛擬通貨」。電子貨幣是以法定貨幣預先儲值、可兌回現金的數位價值，例如悠遊卡等電子票證(A)與第三方支付儲值帳戶(D)，故選(1)僅AD。比特幣(B)、亞馬遜幣(C)不以法定貨幣計價，屬虛擬通貨。"],"pos":0.55,"w":1,"sw":0.01201,"id":"5科技力-33"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"5-54","stem":"根據中央銀行2016 年第1 季理監事會後參考資料，不可兌換任何實體物品或金錢的線上遊戲貨幣，是屬於下列哪種數位通貨？","opts":["電子票證","電子支付","封閉式虛擬貨幣","開放式虛擬貨幣"],"ans":3,"exp":["📝 解析：央行 2016 年第 1 季資料參考歐洲央行分類，把虛擬通貨分為封閉式、單向流通、雙向流通（開放式）。只能在遊戲內使用、不能兌換任何實體物品或法定貨幣的線上遊戲幣，屬於「封閉式虛擬貨幣」，故選(3)。可與法幣雙向兌換的（如比特幣）才是開放式虛擬貨幣。"],"pos":0.9,"w":1,"sw":0.01201,"id":"5科技力-54"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"4-32","stem":"根據中央銀行(2016 年)分類，「悠遊卡」屬於何種數位通貨分類？","opts":["卡片形式的電子貨幣","網路形式的電子貨幣","具中介發行機構的虛擬通貨","去中心化的虛擬通貨"],"ans":1,"exp":["📝 解析：中央銀行 2016 年把數位通貨分為「電子貨幣」與「虛擬通貨」：電子貨幣以法定貨幣計價、先儲值後使用，再分卡片形式（如悠遊卡、一卡通）與網路形式（如電子支付帳戶）；虛擬通貨不以法幣計價，分具中介發行機構（如遊戲點數）與去中心化（如比特幣）。悠遊卡是實體儲值卡，屬卡片形式電子貨幣，故選(1)。"],"pos":0.5333,"w":1,"sw":0.01201,"id":"4科技力-32"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"4-51","stem":"有關區塊鏈之敘述，下列何者錯誤？","opts":["區塊鏈技術是藉由先進「密碼學」(Cryptography)與網路通訊科技「共享帳簿」(Shared Ledger)資料處理的電腦技術","區塊鏈是一種分佈式多節點「共識」實現技術","區塊鏈的形成按照時間先後順序進行連接","區塊鏈技術是一種集中式資料庫存取，它通過網路中單一節點參與資料運算和紀錄，並互相驗證其區塊(Block) 內交易資料的有效性"],"ans":4,"exp":["📝 解析：(4)錯：區塊鏈是「分散式（去中心化）」帳本，由網路中「多個節點」共同參與運算、記錄並相互驗證區塊內交易的有效性，不是集中式資料庫、也不是單一節點處理。(1)結合密碼學與共享帳簿；(2)是分散式多節點共識技術；(3)區塊依時間先後順序以雜湊值串接成鏈，皆正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.85,"w":1,"sw":0.01201,"id":"4科技力-51"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"4-53","stem":"區塊鏈的交易資訊具有隱私安全性主要是利用密碼學的何種技術？","opts":["非對稱式公鑰和私鑰","對稱金鑰","轉置密碼","替換式密碼"],"ans":1,"exp":["📝 解析：區塊鏈採用非對稱式加密：每個使用者有一對公鑰與私鑰，以私鑰對交易做數位簽章、他人用公鑰驗證，地址由公鑰推導而不直接顯示真實身分，藉此兼顧交易安全與隱私，故選(1)。對稱金鑰需雙方共用同一把鑰匙，不適合公開網路；轉置與替換式密碼是古典加密法。"],"pos":0.8833,"w":1,"sw":0.01201,"id":"4科技力-53"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"4-54","stem":"下列敘述何者與金融支付或資料之區塊鏈(blockchain)技術不符合？","opts":["區塊鏈可採用去中心化作業，涉及加密與資料傳輸技術","係電腦系統依照程式規劃自動化交易過程與資料","具資訊透明度以及可追蹤性，但也可能因為匿名技術產生弊端","技術的開發耗費龐大，交易成本高，並且為了安全、結算時間比傳統作業略長"],"ans":4,"exp":["📝 解析：(4)與區塊鏈特性不符：區塊鏈的優點正是省去中介機構與對帳流程，可降低交易成本、縮短清算結算時間（甚至接近即時），而非成本高、結算更慢。(1)可去中心化、涉及加密與資料傳輸；(2)可透過程式（智慧合約）自動化交易；(3)帳本透明可追蹤，但匿名特性也可能被用於洗錢等弊端，皆正確。"],"pos":0.9,"w":1,"sw":0.01201,"id":"4科技力-54"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"4-58","stem":"在2017 年初，國內曾發生大規模證券業駭客勒索事件，該事件中駭客要求支付的比特幣，係主要使用下列何種技術？","opts":["人工智慧","互聯網","第三方支付","區塊鏈"],"ans":4,"exp":["📝 解析：2017 年初國內多家證券商遭駭客以 DDoS 攻擊並勒索比特幣，比特幣是建立在區塊鏈技術上的去中心化虛擬通貨，交易地址匿名、難以追查，因此常被駭客用作勒索贖金，故選(4)。"],"pos":0.9667,"w":1,"sw":0.01201,"id":"4科技力-58"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"3-29","stem":"區塊鏈技術所架構出共享的分類帳和資料庫可以提供政府和金融服務業許多顯著好處，下列何項不是其核心處理要素？","opts":["分散式共享帳簿交易鏈","智慧合約","共識演算法","隱私共享"],"ans":4,"exp":["📝 解析：區塊鏈共享帳本的核心處理要素包括：分散式共享帳簿交易鏈（帳本）、智慧合約（自動執行的程式）、共識演算法（節點如何達成一致），以及保障交易者身分安全的「隱私保護」機制。「隱私共享」與區塊鏈保護隱私的設計相矛盾，不是其核心要素，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.01201,"id":"3科技力-29"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"3-30","stem":"有關區塊鏈的相關敘述，下列何者正確？","opts":["區塊鏈技術是一種非分散式的資料庫存取","區塊鏈技術是藉由先進的密碼學與網路通訊科技私有帳簿資料處理電腦技術，保護交易帳簿的安全與隱私","區塊鏈一定是屬於私有性，只有獲得認可的組織和人員才可以加入的特許區塊鏈","區塊鏈是一種分佈式多節點共識實現技術，通過區塊鏈可以完整、不可篡改地記錄價值轉移的全部過程"],"ans":4,"exp":["📝 解析：區塊鏈是分佈式多節點共識技術，可完整、不可篡改地記錄價值轉移的全部過程，故(4)正確。(1)錯：是「分散式」資料庫；(2)錯：是「共享」帳簿，不是私有帳簿；(3)錯：區塊鏈分為公有鏈、私有鏈、聯盟鏈，公有鏈（如比特幣）任何人都可加入，不一定是私有的特許鏈。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.5,"w":1,"sw":0.01201,"id":"3科技力-30"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"3-52","stem":"比特幣使用區塊鏈的技術，下列何者不是其特性？","opts":["一致性","來源不可追溯","不可更改","決定性"],"ans":2,"exp":["📝 解析：比特幣區塊鏈的所有交易都公開記錄在帳本上，每筆幣的來源都可回溯追蹤（雖然地址是匿名的），因此「來源不可追溯」不是其特性，故選(2)。一致性（各節點帳本相同）、不可更改（寫入後難以竄改）、決定性（交易經確認後結果確定）皆是其特性。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.8667,"w":1,"sw":0.01201,"id":"3科技力-52"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"3-53","stem":"導入區塊鏈技術是將現在單中心與集中式的層級處理架構改變成下列何者？","opts":["單中心的共享清算網路","單中心的分散式清算網路","雙中心的集中式清算網路","多中心的清算網路"],"ans":4,"exp":["📝 解析：區塊鏈以分散式帳本讓多個參與機構各自持有帳本並共同驗證，把現行以單一清算中心為核心的集中式層級架構，轉變為多中心（去中心化）的清算網路，故選(4)。(1)(2)仍是單中心，(3)仍是集中式，都不符區塊鏈精神。"],"pos":0.8833,"w":1,"sw":0.01201,"id":"3科技力-53"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"3-54","stem":"下列何者不是去中心化支付匯款的交易流程？","opts":["付款者進行支付匯款，款項從付款者帳戶中扣除","透過具有公信力的組織進行結算","網路上多個節點同時驗證匯款交易的真實性","多套匯款帳冊分佈在網路上多個節點"],"ans":2,"exp":["📝 解析：去中心化支付匯款不需要具公信力的中央機構結算，而是由網路上多個節點同時驗證交易真實性、帳冊分散在多個節點、款項直接從付款者帳戶扣除。透過具公信力的組織進行結算是傳統中心化清算的流程，故選(2)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9,"w":1,"sw":0.01201,"id":"3科技力-54"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"3-55","stem":"支付匯款系統透過一套共同的協定，經由加密，再透過個別的節點進行消費者的資金轉移，交易記錄同時記錄在多個節點，是為下列何者？","opts":["分散式總帳系統(distributed ledger system)","虛擬貨幣","P2P 匯兌","網路信貸"],"ans":1,"exp":["📝 解析：以共同協定與加密技術，透過個別節點轉移資金，交易紀錄同時記載在多個節點上，這是分散式總帳（分散式帳本）系統的定義，故選(1)。虛擬貨幣是可在其上運作的價值單位；P2P 匯兌、網路信貸是業務型態，不是這套記帳系統本身。"],"pos":0.9167,"w":1,"sw":0.01201,"id":"3科技力-55"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"2-29","stem":"根據IBM 區塊鏈在商業上的應用2016.03 的報告，區塊鏈的四個核心處理要素不包含下列哪一項？","opts":["隱私安全","共識演算法","智慧合約","集中式共享帳簿交易鏈"],"ans":4,"exp":["📝 解析：IBM 2016 年報告列出區塊鏈四個核心要素：分散式共享帳簿(Shared Ledger)、智慧合約、隱私安全、共識機制。區塊鏈的帳簿是由多節點共同持有的「分散式」帳簿，而非「集中式」，故選(4)。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.01201,"id":"2科技力-29"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"2-54","stem":"下列何者不是區塊鏈特性？","opts":["資料不可篡改","利用複雜的公鑰與私鑰機制，可以驗證資料有效性","比特幣的核心","只能運用於銀行與支付業務之金流交易"],"ans":4,"exp":["📝 解析：區塊鏈具有資料不可篡改、以公私鑰（非對稱加密與數位簽章）驗證資料有效性等特性，也是比特幣的核心技術。但應用不限於銀行與支付金流，還可用於供應鏈、身分認證、保險理賠、證券結算、醫療紀錄等，故(4)錯誤。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.9,"w":1,"sw":0.01201,"id":"2科技力-54"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"1-28","stem":"對區塊鏈的敘述，下列何者正確？","opts":["區塊鏈的參與者一定是匿名的","區塊鏈只能用於虛擬貨幣(如比特幣)","區塊鏈一定要開放讓所有人都能自由加入","區塊鏈可以完整、不可篡改地記錄價值轉移(交易)的全部過程"],"ans":4,"exp":["📝 解析：區塊鏈以時間序串接區塊，並經雜湊與共識機制驗證，能完整、不可篡改地記錄價值轉移（交易）的全部過程，故(4)正確。(1)錯：聯盟鏈／私有鏈參與者可以實名；(2)錯：還可用於供應鏈、貿易融資、證券結算等；(3)錯：私有鏈與聯盟鏈須經許可才能加入。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.4667,"w":1,"sw":0.01201,"id":"1科技力-28"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"1-29","stem":"利用區塊鏈(Block Chain)技術，可以建立共享帳簿(Shared Ledger)，下列敘述何者錯誤？","opts":["共享帳簿可以分散的儲存於多個網路節點之中","帳簿內登錄的資產都是虛擬資產，不可以是實體資產","帳簿的內容應儘快同步，使得分散於各節點的帳簿內容能保持一致性","帳簿的內容只能由被授權者來更新"],"ans":2,"exp":["📝 解析：共享帳簿登錄的資產可以是數位資產，也可以是實體資產（如房地產、貨物、黃金）的權利憑證或代幣化表彰，故(2)「不可以是實體資產」錯誤。(1)帳簿分散儲存於多節點、(3)各節點內容應儘快同步維持一致、(4)在許可制區塊鏈中只有被授權者能更新帳簿，均正確。","💡 本題問「錯的／不屬於」：另外三個選項都是正確說法，一起記起來"],"pos":0.4833,"w":1,"sw":0.01201,"id":"1科技力-29"},{"s":"all","ch":"科技力 3｜區塊鏈、加密資產與央行數位貨幣","star":0,"n":1,"refs":"1-53","stem":"下列何者是區塊鏈「智慧合約」的正確描述？","opts":["交易驗證與確認的過程","保障區塊鏈資料庫數據準確和保密的主要核心","將合約中的交易條款或商業規則內嵌在區塊鏈系統，在交易的環節中適時地執行","網路上共享的資產帳簿，所有參與者都能有與自己完全相同副本的帳簿"],"ans":3,"exp":["📝 解析：智慧合約(Smart Contract)是把合約條款或商業規則寫成程式內嵌在區塊鏈上，條件成立時自動執行，故選(3)。(1)是共識機制（交易驗證與確認）；(2)是加密／隱私安全機制；(4)是分散式共享帳簿。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.8833,"w":1,"sw":0.01201,"id":"1科技力-53"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"21-4","stem":"大數據分析中，敘述統計的主要目的為何？","opts":["從樣本資料推測母體特性","彙整與描述資料的集中與離散特性","驗證假設的顯著性","建立迴歸模型預測未來"],"ans":2,"exp":["📝 解析：敘述統計是把資料彙整成平均數、中位數（集中趨勢）與標準差、全距（離散程度），並用圖表描述資料特性。從樣本推論母體、假設檢定屬推論統計；建立迴歸模型預測未來則屬預測分析。"],"pos":0.0667,"w":1,"sw":0.00276,"id":"21科技力-04"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"21-6","stem":"下列何者技術主要用於「理解人類語言」？","opts":["RPA","NLP","CNN","RFID"],"ans":2,"exp":["📝 解析：NLP（自然語言處理）讓機器理解與生成人類語言，用於聊天機器人、語意分析。RPA 是流程自動化；CNN（卷積神經網路）主要用於影像辨識；RFID 是無線射頻識別標籤。"],"pos":0.1,"w":1,"sw":0.00276,"id":"21科技力-06"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"21-7","stem":"「反詐欺」系統常使用下列哪一種AI 技術？","opts":["深度學習與認知計算","僅使用規則庫","人工審核所有交易","隨機抽樣檢查"],"ans":1,"exp":["📝 解析：反詐欺系統需從大量交易中即時找出異常模式，常用深度學習與認知計算，能學習新的詐騙手法。僅用規則庫難以因應新型態詐欺，人工審核所有交易與隨機抽樣都無法即時且全面偵測。"],"pos":0.1167,"w":1,"sw":0.00276,"id":"21科技力-07"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"21-8","stem":"下列何者是「強化學習」的特點？","opts":["需預先標註所有資料","透過正負反饋學習","僅用於圖像辨識","不需與環境互動"],"ans":2,"exp":["📝 解析：強化學習讓代理人與環境互動，依行動後得到的獎勵（正反饋）或懲罰（負反饋）調整策略，例如 AlphaGo。(1)預先標註資料是監督式學習；(3)應用廣泛，不限圖像辨識；(4)與環境互動正是其核心。"],"pos":0.1333,"w":1,"sw":0.00276,"id":"21科技力-08"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"21-31","stem":"下列針對RPA(機器人流程自動化)的敘述何者正確？","opts":["運用實體機器人協助工作流程以利順暢","僅能自動化方式處理結構化資料","僅能在同系統中運行","運用於例行性、重複性高之作業，可以加速作業時間"],"ans":4,"exp":["📝 解析：RPA（機器人流程自動化）是軟體機器人模擬人在電腦上的操作，適合規則明確、例行性、重複性高的作業，可縮短作業時間並減少錯誤，故(4)正確。(1)不是實體機器人；(2)結合 OCR、AI 也能處理半結構化資料；(3)可跨多個系統操作。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.5167,"w":1,"sw":0.00276,"id":"21科技力-31"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"21-36","stem":"有關深度學習(Deep Learning)的敘述，下列何者正確？","opts":["只能分析數值及文字型資料","目前只能應用於少數領域","深度學習與傳統機器學習完全無關","通常指使用含有多層神經網路(多隱藏層)的學習方法"],"ans":4,"exp":["📝 解析：深度學習是機器學習的分支，通常指使用多層（多隱藏層）類神經網路自動學習資料特徵的方法，故(4)正確。(1)可處理影像、語音等非結構化資料；(2)已廣泛應用於醫療、金融、自駕車等；(3)它本身就屬機器學習。","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡"],"pos":0.6,"w":1,"sw":0.00276,"id":"21科技力-36"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"21-39","stem":"某研究團隊開發一款 AI 模型，用於自動篩選求職者履歷。團隊未向求職者說明模型運作方式、也無法讓求職者查詢或要求說明其為何被選或被拒。下列哪一項準則最可能被違反？","opts":["共榮共利","自主權與控制權","安全性","可解釋性"],"ans":4,"exp":["📝 解析：可解釋性（透明性）要求 AI 系統的決策邏輯能被說明，受影響者可查詢或要求解釋為何被選或被拒。題中團隊未說明運作方式、也無法回應求職者的質疑，最直接違反可解釋性。自主權與控制權重在人類能否介入控制，安全性重在系統不造成傷害。"],"pos":0.65,"w":1,"sw":0.00276,"id":"21科技力-39"},{"s":"all","ch":"科技力 4｜人工智慧、機器學習與大數據","star":0,"n":1,"refs":"21-40","stem":"有關OECD 在2024 年5
